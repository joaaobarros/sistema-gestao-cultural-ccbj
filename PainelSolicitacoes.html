<!-- PainelSolicitacoes.html -->

<script>
var _solicitacoesCache = [];
var _filtroSolicitacoes = 'PENDENTE';

function carregarSolicitacoes() {
  const container = document.getElementById('listaSolicitacoes');
  if (!container) return;

  container.innerHTML = `
    <div class="p-10 text-center">
      <div class="inline-flex gap-1.5 items-center">
        <div class="w-2 h-2 bg-purple-400 rounded-full animate-bounce" style="animation-delay:0ms"></div>
        <div class="w-2 h-2 bg-purple-400 rounded-full animate-bounce" style="animation-delay:150ms"></div>
        <div class="w-2 h-2 bg-purple-400 rounded-full animate-bounce" style="animation-delay:300ms"></div>
      </div>
      <p class="text-slate-400 text-[10px] mt-3 font-black uppercase tracking-widest">Carregando solicitações...</p>
    </div>`;

  const fn = (AppState && AppState.usuario &&
    (AppState.usuario.isAdmin || AppState.usuario.isSuperadmin || AppState.usuario.isHabilitador))
    ? 'listarTodasSolicitacoes'
    : 'listarSolicitacoesPendentes';

  google.script.run
    .withSuccessHandler(function(lista) {
      _solicitacoesCache = lista || [];
      _renderizarSolicitacoes();
      _atualizarBadgeSolicitacoes();
      _atualizarStatsSolicitacoes();
    })
    .withFailureHandler(function(err) {
      if (container) container.innerHTML =
        `<div class="p-10 text-center"><div class="w-12 h-12 bg-red-50 rounded-full flex items-center justify-center mx-auto mb-3"><i class="fas fa-triangle-exclamation text-red-400"></i></div><p class="text-red-400 text-sm font-bold">${escaparHTML(err.message)}</p></div>`;
    })
    [fn](AppState && AppState.usuario ? AppState.usuario.email : '');
}

function _atualizarStatsSolicitacoes() {
  const pendentes  = _solicitacoesCache.filter(s => s.status === 'PENDENTE').length;
  const aprovadas  = _solicitacoesCache.filter(s => s.status === 'APROVADO').length;
  const recusadas  = _solicitacoesCache.filter(s => s.status === 'RECUSADO').length;
  const total      = _solicitacoesCache.length;

  const stats = document.getElementById('statsBarSolicitacoes');
  if (!stats) return;

  stats.innerHTML = `
    <div class="flex flex-wrap items-center gap-3">
      <div class="flex items-center gap-2 bg-slate-50 border border-slate-200 rounded-xl px-3 py-2">
        <div class="w-2 h-2 rounded-full bg-slate-400"></div>
        <span class="text-[10px] font-black text-slate-500 uppercase">Total</span>
        <span class="text-sm font-black text-slate-700">${total}</span>
      </div>
      <div class="flex items-center gap-2 bg-amber-50 border border-amber-200 rounded-xl px-3 py-2 cursor-pointer hover:bg-amber-100 transition-all" onclick="filtrarSolicitacoes('PENDENTE')">
        <div class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></div>
        <span class="text-[10px] font-black text-amber-600 uppercase">Pendentes</span>
        <span class="text-sm font-black text-amber-700">${pendentes}</span>
      </div>
      <div class="flex items-center gap-2 bg-green-50 border border-green-200 rounded-xl px-3 py-2 cursor-pointer hover:bg-green-100 transition-all" onclick="filtrarSolicitacoes('APROVADO')">
        <div class="w-2 h-2 rounded-full bg-green-400"></div>
        <span class="text-[10px] font-black text-green-600 uppercase">Aprovadas</span>
        <span class="text-sm font-black text-green-700">${aprovadas}</span>
      </div>
      <div class="flex items-center gap-2 bg-red-50 border border-red-200 rounded-xl px-3 py-2 cursor-pointer hover:bg-red-100 transition-all" onclick="filtrarSolicitacoes('RECUSADO')">
        <div class="w-2 h-2 rounded-full bg-red-400"></div>
        <span class="text-[10px] font-black text-red-600 uppercase">Recusadas</span>
        <span class="text-sm font-black text-red-700">${recusadas}</span>
      </div>
    </div>`;
}

function _atualizarBadgeSolicitacoes() {
  const pendentes = _solicitacoesCache.filter(s => s.status === 'PENDENTE').length;
  const badge = document.getElementById('badgeSolicitacoes');
  if (!badge) return;
  if (pendentes > 0) {
    badge.textContent = pendentes;
    badge.classList.remove('hidden');
  } else {
    badge.classList.add('hidden');
  }
}

function _renderizarSolicitacoes() {
  const container = document.getElementById('listaSolicitacoes');
  if (!container) return;

  const lista = _solicitacoesCache.filter(s =>
    _filtroSolicitacoes === 'TODOS' || s.status === _filtroSolicitacoes
  );

  _atualizarContadorSolicitacoes(lista.length);

  if (!lista.length) {
    const configs = {
      'PENDENTE': { icon: 'fa-check-double', msg: 'Nenhuma solicitação pendente.', cor: 'text-green-400', bg: 'bg-green-50' },
      'APROVADO': { icon: 'fa-thumbs-up',    msg: 'Nenhuma solicitação aprovada.', cor: 'text-blue-400', bg: 'bg-blue-50' },
      'RECUSADO': { icon: 'fa-ban',          msg: 'Nenhuma solicitação recusada.', cor: 'text-red-400', bg: 'bg-red-50' },
      'TODOS':    { icon: 'fa-inbox',         msg: 'Nenhuma solicitação encontrada.', cor: 'text-slate-400', bg: 'bg-slate-50' }
    };
    const cfg = configs[_filtroSolicitacoes] || configs['TODOS'];
    container.innerHTML = `
      <div class="p-16 text-center">
        <div class="w-16 h-16 ${cfg.bg} rounded-full flex items-center justify-center mx-auto mb-4">
          <i class="fas ${cfg.icon} ${cfg.cor} text-2xl"></i>
        </div>
        <p class="text-slate-400 font-bold text-sm">${cfg.msg}</p>
      </div>`;
    return;
  }

  const isAdmin = AppState && AppState.usuario &&
    (AppState.usuario.isAdmin || AppState.usuario.isSuperadmin);

  // Monta set de salas onde o usuário logado é dono
  const _emailLogado = String(AppState?.usuario?.email || '').toLowerCase().trim();
  const _salasComoDono = new Set();
  (AppState.colecoes?.salas || []).forEach(function(s) {
    const raw = String(s[4] || '').trim();
    if (!raw) return;
    let emails = [];
    try {
      const arr = JSON.parse(raw);
      emails = (Array.isArray(arr) ? arr : [arr]).map(function(d){ return String(d.email||d||'').toLowerCase().trim(); });
    } catch(e) { emails = [raw.toLowerCase().trim()]; }
    if (emails.includes(_emailLogado)) _salasComoDono.add(String(s[0]).trim());
  });

  const tipoConfig = {
    'RESERVA':      { label: 'Reserva',      cor: 'bg-blue-100 text-blue-700',    icon: 'fa-calendar-plus'  },
    'ALTERACAO':    { label: 'Alteração',     cor: 'bg-indigo-100 text-indigo-700', icon: 'fa-pen-to-square'  },
    'CANCELAMENTO': { label: 'Cancelamento',  cor: 'bg-red-100 text-red-600',       icon: 'fa-calendar-xmark' }
  };

  const statusConfig = {
    'PENDENTE': { label: 'Pendente',  cor: 'bg-amber-100 text-amber-700',  dot: 'bg-amber-400 animate-pulse', borda: 'border-l-amber-400' },
    'APROVADO': { label: 'Aprovado',  cor: 'bg-green-100 text-green-700',  dot: 'bg-green-400',               borda: 'border-l-green-400'  },
    'RECUSADO': { label: 'Recusado',  cor: 'bg-red-100 text-red-600',      dot: 'bg-red-400',                 borda: 'border-l-red-400'    }
  };

  container.innerHTML = lista.map(function(s) {
    const tipo   = tipoConfig[s.tipo]   || { label: s.tipo,   cor: 'bg-slate-100 text-slate-600', icon: 'fa-circle-info' };
    const status = statusConfig[s.status] || { label: s.status, cor: 'bg-slate-100 text-slate-600', dot: 'bg-slate-400', borda: 'border-l-slate-300' };

    const sala = s.sala
      ? `<span class="inline-flex items-center gap-1 text-[10px] text-purple-600 font-black">
           <i class="fas fa-map-marker-alt text-[8px]"></i>${escaparHTML(AppState.mapaSalas && AppState.mapaSalas[s.sala] ? AppState.mapaSalas[s.sala] : s.sala)}
         </span>`
      : '';

    const aprovadorInfo = s.aprovador ? `
      <div class="flex items-center gap-1.5 mt-1 pt-1 border-t border-slate-100">
        <i class="fas fa-user-check text-[9px] text-slate-300"></i>
        <span class="text-[10px] text-slate-400">${s.status === 'APROVADO' ? 'Aprovado' : 'Recusado'} por <b class="text-slate-600">${escaparHTML(s.aprovador)}</b></span>
        ${s.dataAcao ? `<span class="text-[9px] text-slate-300 ml-1">${escaparHTML(s.dataAcao)}</span>` : ''}
      </div>` : '';

    const _podeAprovar = s.status === 'PENDENTE' &&
      (isAdmin || _salasComoDono.has(String(s.sala).trim()));

    const btnAprovar = _podeAprovar ? `
      <button data-acao-sol="aprovar" data-sol-id="${escaparHTML(s.id)}"
        class="flex-1 py-2.5 bg-green-600 hover:bg-green-700 active:scale-95 text-white text-[10px] font-black rounded-xl transition-all flex items-center justify-center gap-1.5 shadow-sm shadow-green-200">
        <i class="fas fa-check text-[9px]"></i>Aprovar
      </button>` : '';

    const btnRecusar = _podeAprovar ? `
      <button data-acao-sol="recusar" data-sol-id="${escaparHTML(s.id)}"
        class="flex-1 py-2.5 bg-white hover:bg-red-600 border border-red-200 hover:border-red-600 text-red-500 hover:text-white text-[10px] font-black rounded-xl transition-all flex items-center justify-center gap-1.5">
        <i class="fas fa-times text-[9px]"></i>Recusar
      </button>` : '';

    return `
      <div class="bg-white border border-slate-200 border-l-4 ${status.borda} rounded-2xl overflow-hidden hover:shadow-md transition-all group">

        <!-- Cabeçalho do card -->
        <div class="flex items-start justify-between gap-3 px-5 pt-5 pb-3">
          <div class="flex flex-wrap items-center gap-2">
            <span class="inline-flex items-center gap-1 px-2 py-1 rounded-lg text-[9px] font-black uppercase ${tipo.cor}">
              <i class="fas ${tipo.icon} text-[8px]"></i>${escaparHTML(tipo.label)}
            </span>
            <span class="inline-flex items-center gap-1 px-2 py-1 rounded-lg text-[9px] font-black uppercase ${status.cor}">
              <span class="w-1.5 h-1.5 rounded-full ${status.dot}"></span>${escaparHTML(status.label)}
            </span>
            ${sala}
          </div>
          <span class="text-[9px] text-slate-400 shrink-0 mt-0.5">${escaparHTML(s.dataSolicitacao || '')}</span>
        </div>

        <!-- Subtipo e usuário -->
        <div class="px-5 pb-3 space-y-2">
          ${s.subtipo ? `<p class="text-[11px] font-black text-slate-700 uppercase tracking-tight">${escaparHTML(s.subtipo.replace(/_/g,' '))}</p>` : ''}
          <div class="flex flex-wrap items-center gap-3">
            <div class="flex items-center gap-2">
              <div class="w-6 h-6 bg-purple-100 text-purple-600 rounded-full flex items-center justify-center text-[9px] font-black shrink-0">
                ${escaparHTML((s.usuario || '?').charAt(0).toUpperCase())}
              </div>
              <div class="flex flex-col">
                <span class="text-[9px] font-black text-slate-400 uppercase tracking-wider">Solicitante</span>
                <span class="text-[11px] text-slate-600 font-bold truncate">${escaparHTML(s.usuario || '')}</span>
              </div>
            </div>
            ${(function() {
              const salaObj = (AppState.colecoes.salas || []).find(x => String(x[0]).trim() === String(s.sala).trim());
              if (!salaObj) return '';
              const rawDono = String(salaObj[4] || '').trim();
              if (!rawDono) return '';

              // Detecta dia da semana da solicitação (0=Dom,1=Seg,...,6=Sab)
              let diaSolicitacao = null;
              try {
                const partes = String(s.dataSolicitacao || '').split('/');
                if (partes.length === 3) {
                  diaSolicitacao = new Date(partes[2], partes[1]-1, partes[0]).getDay();
                } else {
                  // tenta formato ISO ou de planilha
                  const d = new Date(s.dataSolicitacao);
                  if (!isNaN(d)) diaSolicitacao = d.getDay();
                }
              } catch(e) {}

              // Tenta parsear como JSON de múltiplos donos
              let donos = [];
              try {
                const parsed = JSON.parse(rawDono);
                const arr = Array.isArray(parsed) ? parsed : [parsed];
                // Filtra pelo dia da semana se disponível
                if (diaSolicitacao !== null) {
                  const filtrados = arr.filter(d => Array.isArray(d.dias) && d.dias.includes(diaSolicitacao));
                  donos = filtrados.length > 0 ? filtrados : arr;
                } else {
                  donos = arr;
                }
              } catch(e) {
                // String simples — email único
                donos = [{ email: rawDono }];
              }

              if (!donos.length) return '';

              return donos.map(d => {
                const emailDono = escaparHTML(d.email || '');
                const setorDono = d.setor ? ` · ${escaparHTML(d.setor)}` : '';
                const diasLabel = Array.isArray(d.dias) && d.dias.length
                  ? ` <span class="text-amber-400 text-[8px]">(${d.dias.map(n=>['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'][n]||n).join(',')})</span>`
                  : '';
                return `<div class="flex items-center gap-2">
                  <div class="w-6 h-6 bg-amber-100 text-amber-600 rounded-full flex items-center justify-center text-[9px] font-black shrink-0">
                    ${emailDono.charAt(0).toUpperCase()}
                  </div>
                  <div class="flex flex-col">
                    <span class="text-[9px] font-black text-amber-500 uppercase tracking-wider">Responsável pelo espaço${diasLabel}</span>
                    <span class="text-[11px] text-amber-700 font-bold">${emailDono}${setorDono}</span>
                  </div>
                </div>`;
              }).join('');
            })()}
          </div>
        </div>

        <!-- Justificativa -->
        <div class="mx-5 mb-3 p-3 bg-slate-50 rounded-xl border-l-2 border-slate-200">
          <p class="text-[9px] font-black text-slate-400 uppercase tracking-widest mb-1">Justificativa</p>
          <p class="text-[11px] text-slate-600 leading-relaxed">${escaparHTML(s.justificativa || '—')}</p>
        </div>

        <!-- Aprovador / data da ação -->
        ${aprovadorInfo ? `<div class="px-5 mb-3">${aprovadorInfo}</div>` : ''}

        <!-- Ações -->
        ${(btnAprovar || btnRecusar) ? `
          <div class="flex gap-2 px-5 pb-5 pt-1">
            ${btnAprovar}
            ${btnRecusar}
          </div>` : ''}
      </div>`;
  }).join('');
}

function _atualizarContadorSolicitacoes(total) {
  const el = document.getElementById('contadorSolicitacoes');
  if (el) el.textContent = `${total} registro(s)`;
}

function filtrarSolicitacoes(status) {
  _filtroSolicitacoes = status;

  document.querySelectorAll('.btn-filtro-sol').forEach(function(b) {
    b.classList.remove('bg-slate-900', 'text-white');
    b.classList.add('bg-slate-200', 'text-slate-600');
  });

  const mapa = { 'PENDENTE':'pendente', 'APROVADO':'aprovado', 'RECUSADO':'recusado', 'TODOS':'todos' };
  const ativo = document.getElementById('filtro-sol-' + (mapa[status] || status.toLowerCase()));
  if (ativo) {
    ativo.classList.add('bg-slate-900', 'text-white');
    ativo.classList.remove('bg-slate-200', 'text-slate-600');
  }

  _renderizarSolicitacoes();
}

document.addEventListener('click', function(e) {
  const btn = e.target.closest('[data-acao-sol]');
  if (!btn) return;
  const acao = btn.dataset.acaoSol;
  const id   = btn.dataset.solId;
  if (acao === 'aprovar') _aprovarUI(id);
  if (acao === 'recusar') _recusarUI(id);
});

function _aprovarUI(id) {
  Swal.fire({
    title: 'Aprovar solicitação?',
    text: 'A ação vinculada será executada imediatamente.',
    icon: 'question',
    showCancelButton: true,
    confirmButtonColor: '#16a34a',
    confirmButtonText: '<i class="fas fa-check mr-1"></i>Aprovar',
    cancelButtonText: 'Cancelar'
  }).then(function(result) {
    if (!result.isConfirmed) return;

    const btn = document.querySelector(`[data-sol-id="${id}"][data-acao-sol="aprovar"]`);
    if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner animate-spin"></i>'; }
    if (typeof showLoader === 'function') showLoader(true);

    google.script.run
      .withSuccessHandler(function() {
        if (typeof showLoader === 'function') showLoader(false);
        Swal.fire({ icon: 'success', title: 'Aprovado!', timer: 2000, showConfirmButton: false });
        carregarSolicitacoes();
        if (typeof atualizarAgendaAposMudanca === 'function') atualizarAgendaAposMudanca();
      })
      .withFailureHandler(function(err) {
        if (typeof showLoader === 'function') showLoader(false);
        if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fas fa-check text-[9px]"></i>Aprovar'; }
        Swal.fire('Erro', err.message, 'error');
      })
      .aprovarSolicitacao(id, AppState.usuario.email);
  });
}

function _recusarUI(id) {
  Swal.fire({
    title: 'Recusar solicitação',
    input: 'textarea',
    inputPlaceholder: 'Informe o motivo da recusa...',
    icon: 'warning',
    showCancelButton: true,
    confirmButtonColor: '#dc2626',
    confirmButtonText: '<i class="fas fa-times mr-1"></i>Recusar',
    cancelButtonText: 'Cancelar',
    preConfirm: function(val) {
      if (!val || val.trim().length < 5) {
        Swal.showValidationMessage('Mínimo 5 caracteres.');
        return false;
      }
      return val.trim();
    }
  }).then(function(result) {
    if (!result.isConfirmed) return;

    if (typeof showLoader === 'function') showLoader(true);

    google.script.run
      .withSuccessHandler(function() {
        if (typeof showLoader === 'function') showLoader(false);
        Swal.fire({ icon: 'success', title: 'Recusado.', timer: 2000, showConfirmButton: false });
        carregarSolicitacoes();
      })
      .withFailureHandler(function(err) {
        if (typeof showLoader === 'function') showLoader(false);
        Swal.fire('Erro', err.message, 'error');
      })
      .recusarSolicitacao(id, result.value, AppState.usuario.email);
  });
}
</script>
