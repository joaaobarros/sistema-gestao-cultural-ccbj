<!-- ═══════════════════════════════════════════════════════
     GestaoContratos.html
     UI de Contratos/Metas/Rubricas/Indicadores + Auditoria
════════════════════════════════════════════════════════ -->

<style>
/* ── Contratos Design System ───────────────────────────── */
.ctr-card {
  background:#fff;
  border:1.5px solid #e2e8f0;
  border-radius:20px;
  overflow:hidden;
  margin-bottom:12px;
  box-shadow:0 1px 3px rgba(0,0,0,.04);
  transition:box-shadow .2s;
}
.ctr-card:hover { box-shadow:0 4px 16px rgba(99,102,241,.08); }

.ctr-card-header {
  padding:18px 20px;
  background:#fff;
  display:flex;
  align-items:flex-start;
  gap:12px;
  cursor:pointer;
  user-select:none;
}
.ctr-card-header:hover { background:#fafafa; }

.ctr-status-pill {
  display:inline-flex;
  align-items:center;
  gap:5px;
  font-size:9px;
  font-weight:900;
  letter-spacing:.07em;
  text-transform:uppercase;
  padding:3px 10px;
  border-radius:99px;
  white-space:nowrap;
}
.ctr-pill-ativo    { background:#d1fae5; color:#065f46; }
.ctr-pill-encerrado{ background:#fee2e2; color:#991b1b; }
.ctr-pill-suspenso { background:#fef3c7; color:#92400e; }
.ctr-pill-vencendo { background:#fed7aa; color:#9a3412; }

.ctr-progress-wrap {
  height:5px;
  background:#f1f5f9;
  border-radius:99px;
  overflow:hidden;
  margin-top:8px;
}
.ctr-progress-fill {
  height:100%;
  border-radius:99px;
  transition:width .5s ease;
}

.ctr-meta-block {
  margin:0 12px 12px;
  border:1.5px solid #e0e7ff;
  border-radius:14px;
  overflow:hidden;
  background:#fff;
}
.ctr-meta-header {
  padding:12px 16px;
  background:linear-gradient(135deg,#eef2ff 0%,#f5f3ff 100%);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}
.ctr-rubrica-row {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  padding:9px 14px;
  border-bottom:1px solid #f8fafc;
  transition:background .15s;
}
.ctr-rubrica-row:last-child { border-bottom:none; }
.ctr-rubrica-row:hover { background:#fafbff; }

.ctr-valor-tag {
  font-size:11px;
  font-weight:900;
  color:#059669;
  white-space:nowrap;
}
.ctr-btn {
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:5px 11px;
  font-size:9px;
  font-weight:900;
  letter-spacing:.06em;
  text-transform:uppercase;
  border:none;
  border-radius:9px;
  cursor:pointer;
  transition:all .15s;
}
.ctr-btn-indigo { background:#e0e7ff; color:#4338ca; }
.ctr-btn-indigo:hover { background:#4338ca; color:#fff; }
.ctr-btn-green  { background:#d1fae5; color:#065f46; }
.ctr-btn-green:hover  { background:#059669; color:#fff; }
.ctr-btn-slate  { background:#f1f5f9; color:#475569; }
.ctr-btn-slate:hover  { background:#64748b; color:#fff; }
.ctr-btn-red    { background:#fee2e2; color:#dc2626; }
.ctr-btn-red:hover    { background:#dc2626; color:#fff; }
.ctr-btn-amber  { background:#fef3c7; color:#b45309; }
.ctr-btn-amber:hover  { background:#d97706; color:#fff; }

.ctr-icon-btn {
  width:28px; height:28px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  border:none;
  border-radius:8px;
  cursor:pointer;
  font-size:11px;
  transition:all .15s;
}

.ctr-search-box {
  width:100%;
  padding:10px 14px 10px 36px;
  border:1.5px solid #e2e8f0;
  border-radius:12px;
  font-size:13px;
  outline:none;
  transition:border-color .15s;
}
.ctr-search-box:focus { border-color:#6366f1; }

/* ── Memória de Cálculo ───────────────────────────────── */
.mem-row {
  display:flex;
  flex-direction:column;
  gap:6px;
  margin-bottom:10px;
  padding:10px;
  background:#fff;
  border:1.5px solid #e2e8f0;
  border-radius:10px;
}
.mem-linha-ctrl {
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  align-items:center;
}
.mem-input {
  padding:7px 10px;
  border:1.5px solid #e2e8f0;
  border-radius:9px;
  font-size:12px;
  font-weight:600;
  outline:none;
  transition:border-color .15s;
  box-sizing:border-box;
  font-family:inherit;
  min-width:0;
  width:100%;
}
.mem-linha-ctrl .mem-input { width:auto; flex:1; min-width:80px; }
.mem-input:focus { border-color:#6366f1; }

/* ── Scroll da Memória de Cálculo ─────────────────────── */
#memScroll {
  max-height: 320px;       /* mostra ~3 memórias */
  overflow-y: auto;
  padding-right: 4px;      /* evita cortar conteúdo com scrollbar */
}

/* Scroll bonito (Chrome, Edge, etc.) */
#memScroll::-webkit-scrollbar {
  width: 6px;
}

#memScroll::-webkit-scrollbar-thumb {
  background: #c7d2fe;
  border-radius: 6px;
}

#memScroll::-webkit-scrollbar-track {
  background: transparent;
}

/* ── Observação textarea grande ───────────────────────── */
.ctr-obs-textarea {
  width:100%;
  box-sizing:border-box;
  resize:vertical;
  min-height:90px;
  padding:10px 13px;
  border:1.5px solid #e2e8f0;
  border-radius:12px;
  font-size:13px;
  font-weight:600;
  font-family:inherit;
  outline:none;
  transition:border-color .15s;
}
.ctr-obs-textarea:focus { border-color:#6366f1; box-shadow:0 0 0 3px rgba(99,102,241,.12); }

/* ── Auditoria ────────────────────────────────────────── */
.audit-chip {
  display:inline-flex;
  align-items:center;
  gap:4px;
  padding:2px 8px;
  border-radius:6px;
  font-size:9px;
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:.06em;
}

/* ── Swal personalizado ───────────────────────────────── */
.swal2-popup.ctr-modal {
  border-radius:24px !important;
  padding:0 !important;
  overflow:hidden !important;
  max-width:1000px !important;
  width:95vw !important;
}
.swal2-popup.ctr-modal .swal2-header {
  padding:0 !important;
}
.swal2-popup.ctr-modal .swal2-content {
  padding:0 !important;
}
.ctr-modal-body {
  max-height:80vh;
  overflow-y:auto;
  scrollbar-width:thin;
}

/* ── Input base ───────────────────────────────────────── */
.ctr-input {
  width:100%; padding:9px 13px; font-size:13px; font-weight:600;
  border:1.5px solid #e2e8f0; border-radius:12px; outline:none;
  transition:border-color .15s,box-shadow .15s; background:#fff;
  font-family:inherit; box-sizing:border-box;
}
.ctr-input:focus { border-color:#6366f1; box-shadow:0 0 0 3px rgba(99,102,241,.12); }
.ctr-label {
  display:block; font-size:10px; font-weight:900; letter-spacing:.07em;
  text-transform:uppercase; color:#94a3b8; margin-bottom:6px;
}
</style>

<script>
// ══════════════════════════════════════════════════════
// CONTRATOS — ESTADO GLOBAL
// ══════════════════════════════════════════════════════

var _ctrCache    = { contratos:[], metas:[], indicadores:[], rubricas:[] };
var _ctrExpanded = {};   // { idContrato: true/false }
var _ctrFiltro   = '';

// ── Helpers ──────────────────────────────────────────
function _fmtMoeda(v) {
  const n = Number(v) || 0;
  const partes = n.toFixed(2).split('.');
  partes[0] = partes[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  return 'R$ ' + partes[0] + ',' + partes[1];
}
function _parseMoeda(valor) {
  if (valor === null || valor === undefined || valor === '') return 0;
  if (typeof valor === 'number') return isNaN(valor) ? 0 : valor;

  var str = String(valor)
    .replace(/R\$\s*/gi, '')
    .replace(/\s/g, '')
    .trim();

  // Formato pt-BR: tem vírgula como decimal
  if (str.includes(',')) {
    str = str.replace(/\./g, '').replace(',', '.');
  }

  var n = parseFloat(str);
  return isNaN(n) ? 0 : n;
}
function _fmtMoedaInput(v) {
  const n = Number(v) || 0;
  const partes = n.toFixed(2).split('.');
  partes[0] = partes[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  return partes[0] + ',' + partes[1];
}

function _mascaraMoeda(el) {
  if (el._maskApplied) return;
  el._maskApplied = true;

  el.addEventListener('input', function() {

    var digitos = this.value.replace(/\D/g, '');

    if (!digitos) {
      this.value = '';
      _memSyncEAtualizar();
      return;
    }

    digitos = digitos.replace(/^0+/, '');
    if (!digitos) digitos = '0';

    while (digitos.length < 3) digitos = '0' + digitos;

    var centavos = digitos.slice(-2);
    var inteiros = digitos.slice(0, -2);

    inteiros = inteiros.replace(/^0+/, '') || '0';
    inteiros = inteiros.replace(/\B(?=(\d{3})+(?!\d))/g, '.');

    this.value = inteiros + ',' + centavos;

    _memSyncEAtualizar();
  });

  el.addEventListener('focus', function() {
    this.select();
  });
}
function _fmtDataBR(v) {
  if (!v) return '';
  try {
    var d = (v instanceof Date) ? v : new Date(v);
    if (isNaN(d.getTime())) return String(v);
    return String(d.getDate()).padStart(2,'0')+'/'+
           String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear();
  } catch(e){ return String(v||''); }
}
function _parseDateBR(s) {
  if (!s) return null;
  var p = String(s).split('/');
  if (p.length===3) return new Date(+p[2],+p[1]-1,+p[0]);
  return new Date(s);
}

// ── Status automático por vigência ───────────────────
function _statusAutoCtr(ctr) {
  if (ctr.status === 'Suspenso') return 'Suspenso';
  var hoje = new Date(); hoje.setHours(0,0,0,0);
  if (ctr.vigFim) {
    var fim = _parseDateBR(String(ctr.vigFim).includes('/')
      ? ctr.vigFim : _fmtDataBR(ctr.vigFim));
    if (fim && !isNaN(fim.getTime())) {
      if (fim < hoje) return 'Encerrado';
      var diff = (fim.getTime()-hoje.getTime())/(1000*60*60*24);
      if (diff <= 60) return 'Vencendo';
    }
  }
  return 'Ativo';
}
function _pilhaCtr(status) {
  var m = {
    'Ativo':    ['ctr-pill-ativo',    '●','Ativo'],
    'Encerrado':['ctr-pill-encerrado','●','Encerrado'],
    'Suspenso': ['ctr-pill-suspenso', '◐','Suspenso'],
    'Vencendo': ['ctr-pill-vencendo', '▲','Vencendo'],
  };
  var d = m[status] || m['Ativo'];
  return '<span class="ctr-status-pill '+d[0]+'">'+d[1]+' '+d[2]+'</span>';
}

// ── Totais ───────────────────────────────────────────
function _totalRubricasMetaCtr(idMeta) {
  return (_ctrCache.rubricas||[])
    .filter(function(r){ return r.idMeta===idMeta; })
    .reduce(function(s,r){ return s+Number(r.valor||0); },0);
}
function _totalMetasCtr(idContrato) {
  return (_ctrCache.metas||[])
    .filter(function(m){ return m.idContrato===idContrato; })
    .reduce(function(s,m){ return s+_totalRubricasMetaCtr(m.id); },0);
}

// ══════════════════════════════════════════════════════
// CARREGAR / RENDERIZAR
// ══════════════════════════════════════════════════════



function renderizarContratos() {
  var container = document.getElementById('listaContratos');
  if (!container) return;

  var busca = _ctrFiltro.toLowerCase().trim();
  var lista = (_ctrCache.contratos||[]).filter(function(c){
    if (!busca) return true;
    return String(c.nome||'').toLowerCase().includes(busca) ||
           String(c.numero||'').toLowerCase().includes(busca) ||
           String(c.fonteRecurso||'').toLowerCase().includes(busca);
  });

  if (!lista.length) {
    container.innerHTML = '<div class="p-12 text-center"><i class="fas fa-file-contract text-slate-200 text-4xl mb-3"></i><p class="text-slate-400 font-bold text-sm">Nenhum contrato encontrado.</p></div>';
    return;
  }

  container.innerHTML = lista.map(function(ctr){ return _renderCtrCard(ctr); }).join('');
}

function _renderCtrCard(ctr) {
  var status     = _statusAutoCtr(ctr);
  var total      = Number(ctr.valorTotal)||0;
  var alocado    = _totalMetasCtr(ctr.id);
  var saldo      = total - alocado;
  var pct        = total>0 ? Math.min(100,Math.round(alocado/total*100)) : 0;
  var barCor     = pct>=90?'#ef4444':pct>=70?'#f59e0b':'#6366f1';
  var expandido  = _ctrExpanded[ctr.id]!==false; // default aberto
  var metas      = (_ctrCache.metas||[]).filter(function(m){ return m.idContrato===ctr.id; });

  var vigStr = '';
  if (ctr.vigIni||ctr.vigFim)
    vigStr = '<span class="text-[10px] text-slate-400 flex items-center gap-1"><i class="fas fa-calendar-alt text-indigo-300"></i>'
      +(_fmtDataBR(ctr.vigIni)||'—')+' — '+(_fmtDataBR(ctr.vigFim)||'—')+'</span>';

  var metasHtml = metas.length
    ? metas.map(function(m){ return _renderMetaBlock(m, ctr.id); }).join('')
    : '<div class="mx-3 mb-3 p-4 bg-slate-50 border border-dashed border-slate-200 rounded-2xl text-center text-[11px] text-slate-400 italic">Nenhuma meta cadastrada. Clique em <b>+ Meta</b> para adicionar.</div>';

  return '<div class="ctr-card" id="ctr-card-'+escaparHTML(ctr.id)+'">'
    // ── HEADER ──
    +'<div class="ctr-card-header" onclick="_ctrToggle(\''+escaparHTML(ctr.id)+'\')">'
    +'<div class="flex-1 min-w-0">'
    +'<div class="flex flex-wrap items-center gap-2 mb-1">'
    +'<p class="font-black text-slate-800 text-sm leading-tight">'+escaparHTML(ctr.nome||'')+'</p>'
    +_pilhaCtr(status)
    +(ctr.modalidade?'<span class="text-[9px] font-bold text-slate-400 bg-slate-100 px-2 py-0.5 rounded-full">'+escaparHTML(ctr.modalidade)+'</span>':'')
    +'</div>'
    +(ctr.descricao?'<p class="text-[11px] text-slate-500 mb-1 truncate">'+escaparHTML(ctr.descricao)+'</p>':'')
    +'<div class="flex flex-wrap gap-x-4 gap-y-0.5 mt-0.5">'
    +vigStr
    +(ctr.numero?'<span class="text-[10px] text-slate-400"><i class="fas fa-hashtag mr-1 text-slate-300"></i>'+escaparHTML(ctr.numero)+'</span>':'')
    +(ctr.fonteRecurso?'<span class="text-[10px] text-slate-400"><i class="fas fa-landmark mr-1 text-slate-300"></i>'+escaparHTML(ctr.fonteRecurso)+'</span>':'')
    +'</div>'
    +(total>0
      ? '<div class="mt-2">'
        +'<div class="flex justify-between mb-1">'
        +'<span class="text-[10px] font-black text-slate-500">Total: <b class="text-slate-700">'+_fmtMoeda(total)+'</b></span>'
        +'<span class="text-[10px] font-black '+(pct>=90?'text-red-500':pct>=70?'text-amber-500':'text-emerald-600')+'">'+pct+'% alocado</span>'
        +'</div>'
        +'<div class="ctr-progress-wrap"><div class="ctr-progress-fill" style="width:'+pct+'%;background:'+barCor+'"></div></div>'
        +(alocado>0?'<p class="text-[9px] text-slate-400 mt-1">Rubricas: <b class="text-emerald-600">'+_fmtMoeda(alocado)+'</b> · Saldo: <b class="'+(saldo<0?'text-red-500':'text-slate-600')+'">'+_fmtMoeda(saldo)+'</b></p>':'')
        +'</div>'
      : (alocado>0?'<div class="mt-1 inline-flex items-center gap-1.5 bg-indigo-50 text-indigo-700 text-[10px] font-black px-3 py-1 rounded-full"><i class="fas fa-coins text-[9px]"></i>'+_fmtMoeda(alocado)+' alocado</div>':''))
    +'</div>'
    // ── AÇÕES ──
    +'<div class="flex flex-col items-end gap-2 shrink-0">'
    +'<div class="flex gap-1.5 flex-wrap justify-end">'
    +'<button onclick="event.stopPropagation();abrirModalMeta(\''+escaparHTML(ctr.id)+'\')" class="ctr-btn ctr-btn-indigo"><i class="fas fa-plus text-[8px]"></i>Meta</button>'
    +'<button onclick="event.stopPropagation();editarContrato(\''+escaparHTML(ctr.id)+'\')" class="ctr-icon-btn bg-slate-100 text-slate-500 hover:bg-indigo-600 hover:text-white"><i class="fas fa-edit text-[10px]"></i></button>'
    +'<button onclick="event.stopPropagation();excluirContratoUI(\''+escaparHTML(ctr.id)+'\')" class="ctr-icon-btn bg-slate-100 text-slate-400 hover:bg-red-600 hover:text-white"><i class="fas fa-trash text-[10px]"></i></button>'
    +'</div>'
    +'<button onclick="event.stopPropagation();_ctrToggle(\''+escaparHTML(ctr.id)+'\')" id="ctr-chevron-'+escaparHTML(ctr.id)+'" class="text-[9px] font-black text-slate-400 hover:text-indigo-600 flex items-center gap-1 transition-colors">'
    +(expandido?'<i class="fas fa-chevron-up text-[8px]"></i>Recolher':'<i class="fas fa-chevron-down text-[8px]"></i>Expandir')
    +'</button>'
    +'</div>'
    +'</div>'
    // ── CORPO ──
    +'<div id="ctr-body-'+escaparHTML(ctr.id)+'" class="pb-1 border-t border-slate-50 bg-slate-50/30"'+(expandido?'':' style="display:none"')+'>'
    +metasHtml
    +'</div>'
    +'</div>';
}

function _renderMetaBlock(meta, idContrato) {
  var totalMeta  = _totalRubricasMetaCtr(meta.id);
  var inds       = (_ctrCache.indicadores||[]).filter(function(i){ return i.idMeta===meta.id; });
  var rubs       = (_ctrCache.rubricas||[]).filter(function(r){ return r.idMeta===meta.id; });
  var metaBodyId = 'ctr-meta-body-'+escaparHTML(meta.id);
  var metaExpandido = _ctrExpanded['meta-'+meta.id] !== false;

  var rubsHtml = rubs.length
    ? '<div class="px-3 pt-2 pb-1"><p class="text-[9px] font-black text-slate-400 uppercase tracking-widest mb-2">Rubricas</p>'
      + rubs.map(function(r){
          return '<div class="ctr-rubrica-row">'
            +'<div class="flex items-center gap-2 min-w-0"><span class="w-1.5 h-1.5 rounded-full bg-indigo-400 shrink-0"></span>'
            +'<span class="text-[11px] font-bold text-slate-700 truncate">'+escaparHTML(r.nome||'')+'</span>'
            +(r.obs?'<span class="text-[9px] text-slate-400 italic truncate hidden sm:block">'+escaparHTML(r.obs.substring(0,40))+'</span>':'')
            +'</div>'
            +'<div class="flex items-center gap-1.5 shrink-0">'
            +'<span class="ctr-valor-tag">'+_fmtMoeda(r.valor)+'</span>'
            +'<button onclick="editarRubrica(\''+escaparHTML(r.id)+'\')" class="ctr-icon-btn bg-slate-100 text-slate-400 hover:bg-indigo-600 hover:text-white"><i class="fas fa-edit text-[9px]"></i></button>'
            +'<button onclick="excluirRubricaUI(\''+escaparHTML(r.id)+'\')" class="ctr-icon-btn bg-slate-100 text-slate-400 hover:bg-red-600 hover:text-white"><i class="fas fa-trash text-[9px]"></i></button>'
            +'</div></div>';
        }).join('')
      +'</div>'
    : '<div class="px-3 pt-2 pb-1"><p class="text-[9px] text-slate-300 italic">Sem rubricas.</p></div>';

  var indsHtml = inds.length
    ? '<div class="px-3 pb-3 pt-1 border-t border-slate-100">'
      +'<p class="text-[9px] font-black text-slate-400 uppercase tracking-widest mt-2 mb-2">Indicadores</p>'
      + inds.map(function(ind){
          var tot = (ind.meses||[]).reduce(function(a,b){return a+Number(b);},0);
          return '<div class="flex items-center justify-between gap-2 py-1.5">'
            +'<div class="flex items-center gap-2 min-w-0">'
            +'<span class="text-[8px] font-black text-indigo-400 bg-indigo-50 px-1.5 py-0.5 rounded shrink-0">#'+(ind.numero||'—')+'</span>'
            +'<span class="text-[11px] font-bold text-slate-700 truncate">'+escaparHTML(ind.nome||ind.texto||'')+'</span>'
            +'<span class="text-[9px] font-black text-purple-600 shrink-0 hidden sm:inline">Meta anual: '+tot+'</span>'
            +'</div>'
            +'<div class="flex gap-1 shrink-0">'
            +'<button onclick="editarIndicador(\''+escaparHTML(ind.id)+'\')" class="ctr-icon-btn bg-slate-100 text-slate-400 hover:bg-indigo-600 hover:text-white"><i class="fas fa-edit text-[9px]"></i></button>'
            +'<button onclick="excluirIndicadorUI(\''+escaparHTML(ind.id)+'\')" class="ctr-icon-btn bg-slate-100 text-slate-400 hover:bg-red-600 hover:text-white"><i class="fas fa-trash text-[9px]"></i></button>'
            +'</div></div>';
        }).join('')
      +'</div>'
    : '';

  return '<div class="ctr-meta-block mt-3 first:mt-3">'
    // meta header — clicável para colapsar
    +'<div class="ctr-meta-header" style="cursor:pointer" onclick="_ctrToggleMeta(\''+escaparHTML(meta.id)+'\')">'
    +'<div class="flex-1 min-w-0">'
    +'<p class="text-[10px] font-black text-indigo-600 uppercase tracking-widest leading-none">Meta '+(meta.numero||'')+'</p>'
    +'<p class="font-bold text-slate-800 text-sm mt-0.5 leading-tight">'+escaparHTML(meta.titulo||'')+'</p>'

// ── Toggle collapse contrato ──────────────────────────
function _ctrToggle(idContrato) {
  var body    = document.getElementById('ctr-body-'+idContrato);
  var chevron = document.getElementById('ctr-chevron-'+idContrato);
  if (!body) return;
  var aberto = body.style.display !== 'none';
  body.style.display = aberto ? 'none' : '';
  _ctrExpanded[idContrato] = !aberto;
  if (chevron) {
    chevron.innerHTML = aberto
      ? '<i class="fas fa-chevron-down text-[8px]"></i>Expandir'
      : '<i class="fas fa-chevron-up text-[8px]"></i>Recolher';
  }
}

// ── Toggle collapse meta ──────────────────────────────
function _ctrToggleMeta(idMeta) {
  var body    = document.getElementById('ctr-meta-body-'+idMeta);
  var chevron = document.getElementById('ctr-meta-chevron-'+idMeta);
  if (!body) return;
  var aberto = body.style.display !== 'none';
  body.style.display = aberto ? 'none' : '';
  _ctrExpanded['meta-'+idMeta] = !aberto;
  if (chevron) {
    chevron.className = 'fas fa-chevron-'+(aberto?'down':'up')+' text-slate-400 text-[9px] ml-1';
  }
}

var _memoriaCalculo = [];

// Lê valores diretamente dos inputs do DOM (após a máscara já ter rodado)
function _memCalcularItem(i){
  const qtd = Number(i.qtd) || 0;

  const valor = typeof i.valor === 'string'
    ? Number(i.valor.replace(/\./g,'').replace(',','.'))
    : Number(i.valor) || 0;

  return qtd * valor;
}

function _memAtualizarTotal() {
  _memSyncEAtualizar();
}

function _memRenderizar() {
  var container = document.getElementById('memLinhas');
  if (!container) return;

  container.innerHTML = _memoriaCalculo.map(function(item, i) {
    // Formata valor existente no padrão X.XXX,XX
    var valorFmt = _fmtMoedaInput(item.valor || 0);

    return '<div class="mem-row" data-idx="' + i + '">'

      + '<input class="mem-input" placeholder="Descrição"'
      + ' value="' + escaparHTML(item.descricao || '') + '"'
      + ' oninput="_memoriaCalculo[' + i + '].descricao=this.value">'

      + '<input class="mem-input" placeholder="Observação (opcional)"'
      + ' value="' + escaparHTML(item.obs || '') + '"'
      + ' oninput="_memoriaCalculo[' + i + '].obs=this.value">'

      + '<div class="mem-linha-ctrl">'

        + '<select class="mem-input" style="max-width:120px"'
        + ' onchange="_memoriaCalculo[' + i + '].tipo=this.value">'
        + '<option value="mensal"'   + ((!item.tipo || item.tipo === 'mensal')   ? ' selected' : '') + '>Mensal</option>'
        + '<option value="diaria"'   + (item.tipo === 'diaria'   ? ' selected' : '') + '>Diária</option>'
        + '<option value="hora"'     + (item.tipo === 'hora'     ? ' selected' : '') + '>Hora técnica</option>'
        + '<option value="unitario"' + (item.tipo === 'unitario' ? ' selected' : '') + '>Unitário</option>'
        + '<option value="parcela"'  + (item.tipo === 'parcela'  ? ' selected' : '') + '>Parcela</option>'
        + '</select>'

        // Qtd — oninput direto pois é type=number sem máscara
        + '<input type="number" class="mem-input mem-qtd"'
        + ' min="0" step="any" style="max-width:72px;text-align:center"'
        + ' value="' + (item.qtd || 1) + '"'
        + ' oninput="_memoriaCalculo[' + i + '].qtd=parseFloat(this.value)||0;_memSyncEAtualizar()">'

        // Valor — SEM oninput inline; a máscara cuida do recálculo
        + '<input class="mem-input mem-val"'
        + ' data-idx="' + i + '"'
        + ' placeholder="0,00"'
        + ' style="max-width:110px;text-align:right;color:#059669;font-weight:800"'
        + ' value="' + valorFmt + '">'

        + '<div class="mem-input mem-subtotal"'
        + ' title="Subtotal da linha (Quantidade × Valor)"'
        + ' style="min-width:130px;text-align:right;'
        + 'color:#059669;font-weight:900;font-size:14px;'
        + 'display:flex;align-items:center;justify-content:flex-end;'
        + 'background:#f0fdf4;border:1px solid #bbf7d0;cursor:default">'
        + _fmtMoeda((item.qtd || 0) * (item.valor || 0))
        + '</div>'

        + '<button type="button" onclick="_memRemoverLinha(' + i + ')"'
        + ' style="width:30px;height:30px;flex-shrink:0;display:flex;align-items:center;'
        + 'justify-content:center;background:#fee2e2;border:none;border-radius:7px;'
        + 'cursor:pointer;color:#dc2626;font-size:11px">✕</button>'

      + '</div>'
    + '</div>';
  }).join('');

  // Aplica máscara após render — ela é responsável por chamar _memSyncEAtualizar
  setTimeout(function() {
    document.querySelectorAll('.mem-val').forEach(function(el) {
      _mascaraMoeda(el);
    });
    _memSyncEAtualizar();
  }, 0);
}

function _memSyncEAtualizar() {

  document.querySelectorAll('.mem-row').forEach(function(row) {
    var idx   = parseInt(row.getAttribute('data-idx'), 10);
    var qtdEl = row.querySelector('.mem-qtd');
    var valEl = row.querySelector('.mem-val');

    if (isNaN(idx) || !_memoriaCalculo[idx]) return;

    if (qtdEl) {
      _memoriaCalculo[idx].qtd = parseFloat(qtdEl.value) || 0;
    }

    if (valEl) {
      _memoriaCalculo[idx].valor = _parseMoeda(valEl.value);
    }

    var subtotalEl = row.querySelector('.mem-subtotal');
    if (subtotalEl) {
      var qtd = Number(_memoriaCalculo[idx].qtd) || 0;
      var val = Number(_memoriaCalculo[idx].valor) || 0;
      subtotalEl.textContent = _fmtMoeda(qtd * val);
    }

  });

  var total = _memoriaCalculo.reduce(function(s, item) {
    return s + (Number(item.qtd) || 0) * (Number(item.valor) || 0);
  }, 0);

  window._memTotal = total;

  var el = document.getElementById('memTotal');
  if (el) el.textContent = _fmtMoeda(total);
}

function _memAdicionarLinha() {
  _memoriaCalculo.push({ descricao: '', tipo: 'mensal', qtd: 1, valor: 0, obs: '' });
  _memRenderizar();
}

function _memRemoverLinha(i) {
  _memoriaCalculo.splice(i, 1);
  if (!_memoriaCalculo.length) {
    _memoriaCalculo = [{ descricao: '', tipo: 'mensal', qtd: 1, valor: 0, obs: '' }];
  }
  _memRenderizar();
}

function _abrirHistoricoRubrica(idRubrica){

  Swal.fire({

    width: 700,
    html: '<div id="histContainer" style="max-height:400px;overflow:auto;text-align:left">'
        + '<div style="padding:20px;text-align:center">'

        + '</div></div>',

    showCloseButton: true
  });

  google.script.run
    .withSuccessHandler(function(lista){

      if (!lista || !lista.length) {
        document.getElementById('histContainer').innerHTML =
          '<div style="padding:20px;text-align:center;color:#94a3b8">Sem histórico</div>';
        return;
      }

      window._historicoCache = lista;

      const html = lista.map(function(item, idx){

        const data = new Date(item.data).toLocaleString();

        return '<div style="border-bottom:1px solid #e5e7eb;padding:10px 0">'
          + '<div style="font-size:11px;color:#6b7280">'
          + data + ' — ' + (item.usuario || '')
          + '</div>'

          + '<div style="font-weight:700;margin-top:4px">'
          + item.nome + ' — ' + _fmtMoeda(item.total)
          + '</div>'

          + '<div style="margin-top:6px;font-size:11px">'
          + '<button onclick="_aplicarVersaoHistorico(' + idx + ')"'
          + ' style="color:#059669;font-weight:700;border:none;background:none;cursor:pointer">'
          + 'Aplicar versão</button>'
          + '</div>'

          + '</div>';

      }).join('');

      document.getElementById('histContainer').innerHTML = html;

    })
    .withFailureHandler(function(e){
      document.getElementById('histContainer').innerHTML =
        '<div style="padding:20px;color:red">Erro: ' + e.message + '</div>';
    })
    .obterHistoricoRubrica(idRubrica);
}

function _aplicarVersaoHistorico(index){

  const item = window._historicoCache[index];
  if (!item) return;

  if (!item.itens || !item.itens.length) {
    Swal.fire('Erro', 'Versão inválida.', 'error');
    return;
  }

  _memoriaCalculo = item.itens.map(function(i){
    return {
      descricao: i.descricao,
      tipo: i.tipo,
      qtd: Number(i.qtd),
      valor: Number(i.valor),
      obs: i.obs || ''
    };
  });

  _memRenderizar();
  _memSyncEAtualizar();

  Swal.fire({
    icon: 'success',
    title: 'Versão aplicada',
    timer: 1200,
    showConfirmButton: false
  });
}

function abrirModalIndicador(idMeta, idContrato, dadosIn) {
  var dados    = dadosIn || {};
  var ctr      = (_ctrCache.contratos || []).find(function(c) { return c.id === idContrato; }) || {};
  var metaObj  = (_ctrCache.metas     || []).find(function(m) { return m.id === idMeta;     }) || {};
  var _NM      = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];

  // ── Vigência do contrato ───────────────────────────────────────────────
  var vigIniDate = ctr.vigIni ? _parseDateBR(_fmtDataBR(ctr.vigIni)) : null;
  var vigFimDate = ctr.vigFim ? _parseDateBR(_fmtDataBR(ctr.vigFim)) : null;

  var anoInicio = vigIniDate ? vigIniDate.getFullYear() : new Date().getFullYear();
  var anoFim    = vigFimDate ? vigFimDate.getFullYear() : anoInicio;

  // ── Leitura de valor salvo por ano/mês ────────────────────────────────
  // Suporta 3 formatos que o backend pode devolver:
  //   1. objeto multi-ano: { "2025": [0,10,...], "2026": [...] }
  //   2. array simples (legado, ano único):  [0,10,...]
  //   3. ausente: 0
  function getVal(ano, mes) {
    if (!dados.meses) return 0;

    // Formato 1 — objeto multi-ano (formato atual do backend)
    if (!Array.isArray(dados.meses) && typeof dados.meses === 'object') {
      var arrAno = dados.meses[ano] || dados.meses[String(ano)];
      return arrAno ? (Number(arrAno[mes]) || 0) : 0;
    }

    // Formato 2 — array simples, só válido para o ano de origem
    if (Array.isArray(dados.meses)) {
      var anoOrigem = Number(dados.ano) || anoInicio;
      if (Number(ano) === anoOrigem) {
        return Number(dados.meses[mes]) || 0;
      }
      return 0;
    }

    return 0;
  }

  // ── Gerar grid de meses por ano ───────────────────────────────────────
  var faixasHtml = '';

  for (var ano = anoInicio; ano <= anoFim; ano++) {
    var _a = ano;

    var mesesHtml = _NM.map(function(nm, i) {
      var iniciaMes = new Date(_a, i, 1);
      var terminaMes = new Date(_a, i + 1, 0);

      var foraVigencia = (vigIniDate && terminaMes < vigIniDate) ||
                         (vigFimDate && iniciaMes  > vigFimDate);

      var val = getVal(_a, i);

      var estiloInput = [
        'width:100%',
        'text-align:center',
        'font-size:11px',
        'font-weight:700',
        'border:1.5px solid ' + (foraVigencia ? '#f1f5f9' : '#e2e8f0'),
        'border-radius:8px',
        'padding:5px 2px',
        'outline:none',
        'background:'       + (foraVigencia ? '#f8fafc' : '#fff'),
        'opacity:'          + (foraVigencia ? '0.3'     : '1'),
        'pointer-events:'   + (foraVigencia ? 'none'    : 'auto'),
        'box-sizing:border-box',
      ].join(';');

      return '<div style="display:flex;flex-direction:column;align-items:center;gap:3px">'
        + '<span style="font-size:9px;font-weight:700;color:' + (foraVigencia ? '#cbd5e1' : '#64748b') + '">' + nm + '</span>'
        + '<input type="number" id="indM_' + _a + '_' + i + '" value="' + val + '" min="0"'
        + (foraVigencia ? ' disabled' : '')
        + ' style="' + estiloInput + '">'
        + '</div>';
    }).join('');

    faixasHtml += '<div style="margin-bottom:16px">'
      + '<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">'
      + '<span style="font-size:10px;font-weight:900;color:#fff;background:#6366f1;padding:2px 10px;border-radius:99px;text-transform:uppercase;letter-spacing:.07em">' + _a + '</span>'
      + '<div style="flex:1;border-top:1.5px solid #e2e8f0"></div>'
      + '</div>'
      + '<div style="display:grid;grid-template-columns:repeat(12,1fr);gap:5px">' + mesesHtml + '</div>'
      + '</div>';
  }

  if (!faixasHtml) {
    faixasHtml = '<p style="font-size:11px;color:#94a3b8;font-style:italic;text-align:center;padding:16px">'
      + 'Configure a vigência do contrato para habilitar os campos mensais.</p>';
  }

  // ── HTML do modal ─────────────────────────────────────────────────────
  var htmlModal = ''
    // Breadcrumb meta vinculada
    + (metaObj.titulo
        ? '<div style="display:flex;align-items:center;gap:8px;padding:7px 12px;background:#eef2ff;border:1px solid #c7d2fe;border-radius:10px;margin-bottom:14px">'
          + '<i class="fas fa-bullseye" style="color:#818cf8;font-size:11px;flex-shrink:0"></i>'
          + '<span style="font-size:10px;font-weight:900;color:#4338ca;text-transform:uppercase;letter-spacing:.06em;flex-shrink:0">Meta:</span>'
          + '<span style="font-size:11px;color:#4338ca;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'
          + 'Meta ' + escaparHTML(metaObj.numero || '') + ' — ' + escaparHTML(metaObj.titulo) + '</span>'
          + '</div>'
        : '')

    // Número + Nome
    + '<div style="display:grid;grid-template-columns:80px 1fr;gap:10px;margin-bottom:12px">'
    +   '<div>'
    +     '<label class="ctr-label">Nº</label>'
    +     '<input id="indNum" class="ctr-input" style="text-align:center" value="'
    +     escaparHTML(dados.numero || '') + '" placeholder="01">'
    +   '</div>'
    +   '<div>'
    +     '<label class="ctr-label">Nome do Indicador *</label>'
    +     '<input id="indNome" class="ctr-input" value="'
    +     escaparHTML(dados.nome || dados.texto || '')
    +     '" placeholder="Ex.: Nº de pessoas atendidas presencialmente">'
    +   '</div>'
    + '</div>'

    // Metodologia
    + '<div style="margin-bottom:14px">'
    +   '<label class="ctr-label">Metodologia <span style="font-weight:400;text-transform:none;color:#cbd5e1">(opcional)</span></label>'
    +   '<textarea id="indDesc" class="ctr-obs-textarea" placeholder="Como este indicador é medido...">'
    +   escaparHTML(dados.descricao || '') + '</textarea>'
    + '</div>'

    // Grid meses
    + '<div>'
    +   '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">'
    +     '<label class="ctr-label" style="margin-bottom:0">Metas mensais por ano</label>'
    +     '<span style="font-size:10px;color:#cbd5e1">'
    +     '<i class="fas fa-calendar-alt" style="margin-right:4px"></i>'
    +     (_fmtDataBR(ctr.vigIni) || '—') + ' a ' + (_fmtDataBR(ctr.vigFim) || '—')
    +     '</span>'
    +   '</div>'
    +   '<div style="background:#f8fafc;border:1.5px solid #e2e8f0;border-radius:12px;padding:14px;max-height:300px;overflow-y:auto;scrollbar-width:thin">'
    +   faixasHtml
    +   '</div>'
    + '</div>';

  // ── Swal ──────────────────────────────────────────────────────────────
  Swal.fire({
    title: dados.id ? 'Editar Indicador' : 'Novo Indicador',
    width: Math.min(720, window.innerWidth - 32),
    showCancelButton:    true,
    confirmButtonText:   '<i class="fas fa-save mr-1"></i>Salvar',
    cancelButtonText:    'Cancelar',
    confirmButtonColor:  '#6366f1',
    customClass: {
      popup:           'rounded-3xl',
      confirmButton:   'rounded-xl font-black text-sm',
      cancelButton:    'rounded-xl font-bold text-sm',
    },
    html: '<div class="text-left" style="padding:0 20px 16px">' + htmlModal + '</div>',

    preConfirm: function() {

      // ── SYNC DOM → ESTADO (crítico: captura campos sem blur) ──
      document.querySelectorAll('.mem-row').forEach(function(row, idx) {
        if (!_memoriaCalculo[idx]) return;

        var qtdEl = row.querySelector('.mem-qtd');
        var valEl = row.querySelector('.mem-val');

        if (qtdEl) {
          _memoriaCalculo[idx].qtd = parseFloat(qtdEl.value) || 0;
        }
        if (valEl) {
          // _parseMoeda converte "1.000,00" → 1000 antes de enviar
          _memoriaCalculo[idx].valor = _parseMoeda(valEl.value);
        }
      });

      var nome = document.getElementById('rubNome')?.value.trim();
      if (!nome) {
        Swal.showValidationMessage('Nome obrigatório.');
        return false;
      }

      // Recalcula após sync
      var total = _memoriaCalculo.reduce(function(s, item) {
        return s + (Number(item.qtd) || 0) * (Number(item.valor) || 0);
      }, 0);

      if (total <= 0) {
        Swal.showValidationMessage(
          'O total calculado é zero. Verifique quantidades e valores.'
        );
        return false;
      }

      return {
        id:     dados.id || null,
        idMeta: idMeta,
        nome:   nome,
        valor:  total,
        memoriaCalculo: _memoriaCalculo.map(function(item) {
          var qtd   = Number(item.qtd)   || 0;
          var valor = Number(item.valor) || 0;  // já convertido pelo sync acima
          return {
            descricao: String(item.descricao || '').trim(),
            tipo:      String(item.tipo      || 'unitario').trim(),
            qtd:       qtd,    // number puro
            valor:     valor,  // number puro — ex: 1000, não "1.000,00"
            subtotal:  qtd * valor,
            obs:       String(item.obs || '').trim(),
          };
        }),
        obs: document.getElementById('rubObs')?.value.trim() || '',
      };
    },

  }).then(function(r) {
    if (!r.isConfirmed) return;

    showLoader(true);

    google.script.run
      .withSuccessHandler(function() {
        showLoader(false);
        carregarDadosContratos(function() {
          if (typeof renderizarContratos    === 'function') renderizarContratos();
          if (typeof codipPopularContratos  === 'function') codipPopularContratos();
        });
      })
      .withFailureHandler(function(e) {
        showLoader(false);
        Swal.fire('Erro', e.message, 'error');
      })
      .salvarIndicador(r.value, AppState.usuario.email);
  });
}

function mostrarSubAbaAuditoria(aba){
  var ids=['logs','acessos','comparativo'];
  ids.forEach(function(id){
    var el=document.getElementById('subaba-'+id);
    if(el) el.classList.toggle('hidden', id!==aba);
    var btn=document.getElementById('tab-audit-'+id);
    if(btn){
      if(id===aba){
        btn.className='px-4 py-2 bg-slate-900 text-white text-xs font-black rounded-xl uppercase';
      } else {
        btn.className='px-4 py-2 bg-slate-200 text-slate-600 text-xs font-black rounded-xl uppercase hover:bg-slate-300 transition-all';
      }
    }
  });
  if(aba==='acessos') carregarLogAcessos();
  if(aba==='comparativo'){
    var selCtr=document.getElementById('filtroContratoComparativo');
    if(selCtr&&_ctrCache.contratos&&_ctrCache.contratos.length){
      popularContratosComparativo();
    }
  }
}

function popularContratosComparativo(){
  var sel=document.getElementById('filtroContratoComparativo');
  if(!sel) return;
  sel.innerHTML='<option value="">Selecione um contrato</option>'
    +(_ctrCache.contratos||[]).map(function(c){
      return '<option value="'+escaparHTML(c.id)+'">'+escaparHTML(c.nome)+'</option>';
    }).join('');
}

function renderizarLogs(logs){
  var corpo=document.getElementById('tabelaLogs');
  if(!corpo) return;
  if(!logs||!logs.length){
    corpo.innerHTML='<tr><td colspan="8" class="p-20 text-center"><i class="fas fa-shield-halved text-slate-100 text-5xl mb-4"></i><p class="text-slate-300 font-bold text-xs uppercase tracking-widest">Nenhum registro encontrado.</p></td></tr>';
    return;
  }
  var coresAcao={
    'CRIAÇÃO':'bg-green-100 text-green-700',
    'EDIÇÃO':'bg-blue-100 text-blue-700',
    'EXCLUSÃO':'bg-red-100 text-red-600',
    'EXCLUSÃO DEFINITIVA':'bg-red-200 text-red-800',
    'CANCELAMENTO':'bg-amber-100 text-amber-700',
    'ROLLBACK':'bg-purple-100 text-purple-700',
    'APROVAÇÃO':'bg-emerald-100 text-emerald-700',
    'RECUSA':'bg-rose-100 text-rose-700',
  };
  var reversíveis=['CRIAÇÃO','EDIÇÃO','EXCLUSÃO','EXCLUSÃO DEFINITIVA','AGENDAMENTO'];

  corpo.innerHTML=logs.map(function(log){
    var acaoUpper=String(log[2]||'').toUpperCase();
    var corAcao=coresAcao[acaoUpper]||'bg-slate-100 text-slate-600';
    var antes=log[6]?'<span class="text-red-400 line-through text-[9px] max-w-[120px] truncate block" title="'+escaparHTML(log[6])+'">'+escaparHTML(String(log[6]).substring(0,40))+'</span>':'<span class="text-slate-300 text-[9px]">—</span>';
    var depois=log[7]?'<span class="text-green-600 text-[9px] max-w-[120px] truncate block" title="'+escaparHTML(log[7])+'">'+escaparHTML(String(log[7]).substring(0,40))+'</span>':'<span class="text-slate-300 text-[9px]">—</span>';
    var ehReversivel=AppState.usuario.isSuperadmin&&reversíveis.some(function(r){return acaoUpper.includes(r);});
    var tsLog=escaparHTML(String(log[0]||''));
    return '<tr class="text-[11px] hover:bg-slate-50 transition-colors">'
      +'<td class="p-3 text-slate-500 font-medium whitespace-nowrap text-[10px]">'+tsLog+'</td>'
      +'<td class="p-3 font-bold text-slate-700 max-w-[100px] truncate">'+escaparHTML(log[1]?String(log[1]).split('@')[0]:'—')+'</td>'
      +'<td class="p-3 text-center"><span class="audit-chip '+corAcao+'">'+escaparHTML(log[2]||'')+'</span></td>'
      +'<td class="p-3 text-slate-600 font-medium">'+escaparHTML(String(AppState.mapaSalas&&AppState.mapaSalas[log[4]]?AppState.mapaSalas[log[4]]:log[4]||''))+'</td>'
      +'<td class="p-3 text-slate-500 max-w-[140px] truncate" title="'+escaparHTML(log[5]||'')+'">'+escaparHTML(String(log[5]||'').substring(0,50))+'</td>'
      +'<td class="p-3 max-w-[140px]">'+antes+'</td>'
      +'<td class="p-3 max-w-[140px]">'+depois+'</td>'
      +'<td class="p-3 text-center">'
      +(ehReversivel?'<button data-acao="rollback-seletivo" data-timestamp="'+tsLog+'" class="px-2 py-1 bg-amber-100 hover:bg-amber-500 text-amber-700 hover:text-white text-[9px] font-black rounded-lg transition-all uppercase"><i class="fas fa-undo mr-1"></i>Desfazer</button>':'')
      +'</td></tr>';
  }).join('');
}
