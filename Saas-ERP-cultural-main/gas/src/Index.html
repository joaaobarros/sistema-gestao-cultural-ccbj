<!--
@file Index.html
@type layout
@description Template raiz do webapp. Compõe o HTML final via include() do GAS,
             define estilos globais e declara a ordem de carregamento dos módulos JS.
@responsibility Estrutura da página, includes de fragmentos HTML, ordem de scripts.

ORDEM DE CARREGAMENTO DOS SCRIPTS:
  ── CORE ──────────────────────────────────────────────────────
  1. core/event_bus_js        — EventBus pub/sub singleton. DEVE ser o primeiro script.
  2. core/app_state_js        — AppState singleton.
  3. services/server_bridge_js — GAS bridge tipado. Namespaces: reservas, espacos,
                                  usuarios, contratos, equipes, tarefas, processos,
                                  almoxarifado, balcao, eficiencia, contratacoes,
                                  permissoes (v2), modulos, chaves, escuta, auth.
  3. core/auth_identity_js    — Auth helper não-bloqueante; seta window.__EMAIL_INICIAL__
                                  e window.__APP_URL__ via template GAS.

  ── MODULES (puro JS, sem DOM) ────────────────────────────────
  4. modules/disponibilidade_module_js — conflito frontend, horários, normalização de datas
  5. modules/itens_module_js           — lookup itens fixos e nomes de sala

  ── UI HELPERS ────────────────────────────────────────────────
  6. mod_ui_componentes_js     — escaparHTML, showLoader, helpers de cor
  7. ui/navegacao_ui_js        — toggleSidebar, mostrarAba; dispatch _onShow_aba_xxx
  8. ui/permissoes_ui_js       — configurarInterfacePorPermissao, carregarStatusModulos

  ── DOMÍNIO / FEATURES ────────────────────────────────────────
  9.  mod_ui_estado_js          — validação horários, carrinho, salvarAgendamento, inicializarApp
  10. mod_reservas_js           — calendário, render de reservas, lote, diagrama
  11. mod_admin_js              — painéis admin, RECE, dashboard
  12. mod_contratos_js          — CRUD de contratos, metas, rubricas, indicadores
  13. mod_favoritos_js          — drag-and-drop de favoritos na sidebar
  14. mod_protocolo_chaves_js   — protocolo de chaves (lazy via _onShow_aba_protocolo_chaves)
  15. mod_permissoes_v2_js      — temPermissao(), carregarPermissoes(), aplicarPermissoesUI()
  16. integracao_reserva_comunicacao_js — integração reserva ↔ comunicação
  17. mod_gestao_modulos_js     — toggle módulos (lazy via _onShow_aba_gestao-modulos)
  18. auth_login_js             — overlay de login, GSI, sessão localStorage
  19. bootstrap_js              — DOMContentLoaded, event listeners (SEMPRE POR ÚLTIMO)

MÓDULOS HTML (incluídos no <main>, auto-registram _onShow_aba_xxx para lazy load):
  - mod_tarefas, mod_processos, mod_almoxarifado, mod_balcao, mod_rh
  - mod_eficiencia, mod_contratacoes, mod_relatorios_financeiros, mod_escuta
  - mod_permissoes_v2, mod_gestao_modulos (painéis admin)

MÓDULOS INLINE (carregados após bootstrap):
  - html/modulos/mod_painel_solicitacoes — painel de solicitações externas
  - html/modulos/mod_gestao_contratos    — gestão completa de contratos com JS próprio
  - html/modais/modal_manual        — modal de ajuda
-->
