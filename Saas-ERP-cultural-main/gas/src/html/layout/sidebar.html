<script>
(function() {
  var STORE_KEY = 'sidebar_modules_v3';
  var GRUPOS = ['mod-espacos','mod-programacao','mod-operacional','mod-infraestrutura','mod-comunicacao','mod-estrategia',
                'mod-trabalho','mod-atendimento','mod-pessoas','mod-financeiro','mod-institucional'];
  var FAV_BLOQUEADOS = ['aba-tarefas','aba-processos','aba-almoxarifado','aba-balcao',
    'aba-rh','aba-eficiencia','aba-contratos-fin','aba-contratacoes',
    'aba-codip','aba-rel-financeiros','aba-escuta','aba-permissoes-v2','aba-gestao-modulos'];

  function _setGrupo(id, aberto) {
    var el = document.getElementById(id);
    var icon = document.getElementById('icon-' + id);
    if (!el) return;
    if (aberto) {
      el.classList.remove('hidden');
      if (icon) icon.className = 'fas fa-chevron-up text-[8px] text-slate-600';
    } else {
      el.classList.add('hidden');
      if (icon) icon.className = 'fas fa-chevron-down text-[8px] text-slate-600';
    }
  }

  function _salvarEstado() {
    var estado = {};
    GRUPOS.concat(['mod-sistema']).forEach(function(id) {
      var el = document.getElementById(id);
      if (el) estado[id] = !el.classList.contains('hidden');
    });
    try { localStorage.setItem(STORE_KEY, JSON.stringify(estado)); } catch(e) {}
  }

  // Limpa estado legado (v2) para forçar defaults da v3
  try { localStorage.removeItem('sidebar_modules_v2'); } catch(e) {}

  function _contarFavoritosValidos() {
    try {
      var favs = JSON.parse(localStorage.getItem('_fav_cache') || '[]');
      return (favs || []).filter(function(f) {
        return f && f.aba && FAV_BLOQUEADOS.indexOf(f.aba) === -1;
      }).length;
    } catch(e) { return 0; }
  }

  function _restaurarEstado() {
    try {
      var estado = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
      if (estado) {
        // Respeitar escolha salva pelo usuário
        Object.keys(estado).forEach(function(id) {
          if (id === 'mod-sistema') return; // controlado por permissoes_ui_js
          _setGrupo(id, !!estado[id]);
        });
        return;
      }
      // Sem estado salvo: colapsar tudo se houver 2+ favoritos, senão expandir tudo
      var colapsar = _contarFavoritosValidos() >= 2;
      GRUPOS.forEach(function(id) { _setGrupo(id, !colapsar); });
    } catch(e) {}
  }

  var _origToggle = window.toggleModulo;
  window.toggleModulo = function(id) {
    if (typeof _origToggle === 'function') _origToggle(id);
    _salvarEstado();
  };

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', _restaurarEstado);
  } else {
    _restaurarEstado();
  }
})();
</script>
