            ['Taxa de habilitação',_taxaHab+'%','#059669','fa-circle-check'],
            ['Aprovações no período',(m.solAprovadas||0),'#16a34a','fa-thumbs-up'],
            ['Tempo médio/espaço',(m.mediaOcupacaoPorSala||[]).length?_fmtDur(Math.round(m.mediaOcupacaoPorSala.reduce((a,[,v])=>a+v,0)/m.mediaOcupacaoPorSala.length)):'—','#7c3aed','fa-hourglass-half']
          ].map(([l,v,c,ic])=>_kpi(v,l,ic,c)).join('')}
        </div>
        <div style="padding-top:16px;border-top:1px solid #f1f5f9">
          <div style="font-size:10px;font-weight:900;color:#94a3b8;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:12px">Tendência mensal de reservas</div>
          ${(m.mesesAno||[]).length ? (() => {
            const mx=_maxV(m.mesesAno);
            return '<div style="display:flex;align-items:flex-end;gap:4px;height:80px">'
              +m.mesesAno.map(([mes,v])=>`<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px">
                <span style="font-size:8px;font-weight:900;color:#7c3aed">${v>0?v:''}</span>
                <div style="width:100%;background:${v===mx?'#7c3aed':'#c4b5fd'};border-radius:4px 4px 0 0;height:${Math.max(Math.round(v/mx*60),v>0?4:1)}px"></div>
                <span style="font-size:7px;color:#94a3b8;font-weight:700;text-align:center;line-height:1.2">${mes.split('/')[0].substring(0,3)}</span>
              </div>`).join('')
            +'</div>';
          })() : '<p style="font-size:11px;color:#cbd5e1;font-style:italic">Sem dados no período.</p>'}
        </div>`;

      // ─── S7: CODIP ─────────────────────────────────────────────────
      const _kpiC = (val,lbl,cor,icon) => `
        <div style="background:#fff;border:1px solid #e0e7ff;border-radius:14px;padding:16px;display:flex;align-items:center;gap:12px">
          <div style="width:40px;height:40px;border-radius:10px;background:${cor}18;display:flex;align-items:center;justify-content:center;flex-shrink:0">
            <i class="fas ${icon}" style="color:${cor};font-size:15px"></i>
          </div>
          <div>
            <div style="font-size:22px;font-weight:900;color:#1e293b;line-height:1">${val}</div>
            <div style="font-size:9px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:0.06em;margin-top:2px">${lbl}</div>
          </div>
        </div>`;

      const _barC = (label,val,max,cor) => {
        const pct = max>0?Math.round(val/max*100):0;
        return `<div style="margin-bottom:9px">
          <div style="display:flex;justify-content:space-between;margin-bottom:3px">
            <span style="font-size:10px;font-weight:700;color:#334155;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escaparHTML(String(label))}</span>
            <span style="font-size:10px;font-weight:900;color:${cor};margin-left:8px">${val}</span>
          </div>
          <div style="background:#f1f5f9;border-radius:99px;height:5px">
            <div style="width:${pct}%;background:${cor};height:5px;border-radius:99px"></div>
          </div></div>`;
      };

      const _painelBarra = (dados, titulo, cor) => {
        if (!dados || !dados.length) return `<p style="font-size:11px;color:#cbd5e1;font-style:italic">Sem dados.</p>`;
        const mx = dados[0]?.[1] || 1;
        return `<div style="font-size:10px;font-weight:900;color:#94a3b8;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:12px">${titulo}</div>`
          + dados.map(([l,v]) => _barC(l,v,mx,cor)).join('');
      };

      const _s7kpis = `
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px">
          ${_kpiC(codip.totalRegistros||0,            'Registros CODIP',    '#6366f1','fa-file-lines')}
          ${_kpiC((codip.totalPubPresencial||0).toLocaleString('pt-BR'), 'Público Presencial','#7c3aed','fa-users')}
          ${_kpiC((codip.totalPubVirtual||0).toLocaleString('pt-BR'),   'Audiência Virtual',  '#0891b2','fa-wifi')}
          ${_kpiC((codip.totalAcesso||0).toLocaleString('pt-BR'),       'Total de Acessos',   '#059669','fa-eye')}
          ${_kpiC(codip.totalPCD||0,        'PCDs Atendidos',    '#dc2626','fa-universal-access')}
          ${_kpiC(codip.totalIdosos||0,     'Idosos Atendidos',  '#d97706','fa-person-cane')}
          ${_kpiC(codip.totalVoluntarios||0,'Voluntários',       '#16a34a','fa-handshake')}
          ${_kpiC(Math.round(codip.totalHorasMes||0)+'h','Horas no Mês','#7c3aed','fa-clock')}
        </div>`;

      const _s7barras = `
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:24px">
          <div>${_painelBarra(codip.topTiposAcao,  'Tipos de Ação',    '#6366f1')}</div>
          <div>${_painelBarra(codip.topLinguagens, 'Linguagens',        '#7c3aed')}</div>
          <div>${_painelBarra(codip.topEixos,      'Eixos da Política', '#0891b2')}</div>
          <div>
            ${(codip.porMes && codip.porMes.length) ? (() => {
              const mx = Math.max(...codip.porMes.map(([,v])=>v),1);
              return `<div style="font-size:10px;font-weight:900;color:#94a3b8;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:12px">Ações por Mês Ref.</div>
                <div style="display:flex;align-items:flex-end;gap:4px;height:72px">
                  ${codip.porMes.map(([mes,v])=>`
                    <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px" title="${mes}: ${v}">
                      <span style="font-size:8px;font-weight:900;color:#6366f1">${v>0?v:''}</span>
                      <div style="width:100%;background:${v===mx?'#6366f1':'#c7d2fe'};border-radius:3px 3px 0 0;height:${Math.max(Math.round(v/mx*56),v>0?4:1)}px"></div>
                      <span style="font-size:7px;color:#94a3b8;font-weight:700">${String(mes).slice(0,3)}</span>
                    </div>`).join('')}
                </div>`;
            })() : '<p style="font-size:11px;color:#cbd5e1;font-style:italic">Sem dados.</p>'}
          </div>
        </div>`;

      const _s7 = _s7kpis + _s7barras;

      // ─── S0: PAINEL OPERACIONAL HOJE ──────────────────────────
      const _hoje = (() => {
        const todayISO = new Date().toISOString().slice(0,10); // yyyy-mm-dd
        const todayParts = todayISO.split('-');
        const todayBR = todayParts[2]+'/'+todayParts[1]+'/'+todayParts[0]; // dd/mm/yyyy
        const reservas = (typeof AppState !== 'undefined' && AppState.colecoes && AppState.colecoes.reservas) ? AppState.colecoes.reservas : [];
        const reservasHoje = reservas.filter(r => {
          // r[1] = data da reserva (pode ser Date, yyyy-mm-dd ou dd/mm/yyyy)
          const raw = r[1];
          if (!raw) return false;
          if (raw instanceof Date) return raw.toISOString().slice(0,10) === todayISO;
          const d = String(raw).trim();
          return d === todayISO || d === todayBR || d.startsWith(todayISO);
        });
        // r[13] = status da reserva
        const confirmadasHoje  = reservasHoje.filter(r => r[13]==='CONFIRMADO' || r[13]==='HABILITADO').length;
        const canceladasHoje   = reservasHoje.filter(r => r[13]==='CANCELADO').length;
        const solPend = m.solPendentes || 0;
        const pendCad = (typeof _cadastrosCache !== 'undefined' ? (_cadastrosCache||[]) : []).filter(c=>c.status==='PENDENTE').length;
        const pendChavAprov = (typeof _chavesAprovCache !== 'undefined' ? (_chavesAprovCache||[]) : []).length;
        const pendChavPend  = (typeof _chvState !== 'undefined' && _chvState.dados ? (_chvState.dados.protocolos||[]).filter(p=>p.status==='ATRASADA').length : 0);
        const totalPend = solPend + pendCad + pendChavAprov;
        const _card = (icon,cor,bg,val,label,acao,hint) => `
          <div style="background:${bg};border:1px solid ${cor}30;border-radius:16px;padding:16px 18px;cursor:${acao?'pointer':'default'};transition:box-shadow 0.2s"
               ${acao ? `onclick="${acao}" title="${hint||''}"` : ''}>
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
              <div style="width:36px;height:36px;border-radius:10px;background:${cor}20;display:flex;align-items:center;justify-content:center">
                <i class="fas ${icon}" style="color:${cor};font-size:14px"></i>
              </div>
              ${acao ? `<i class="fas fa-arrow-right" style="color:${cor};font-size:10px;opacity:0.6"></i>` : ''}
            </div>
            <div style="font-size:28px;font-weight:900;color:#1e293b;line-height:1">${val}</div>
            <div style="font-size:10px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:0.05em;margin-top:4px">${label}</div>
          </div>`;
        const alertas = [];
        if (pendChavPend > 0) alertas.push(`<div style="display:flex;align-items:center;gap:8px;background:#fef3c7;border:1px solid #fbbf24;border-radius:10px;padding:10px 14px"><i class="fas fa-triangle-exclamation" style="color:#d97706"></i><span style="font-size:11px;font-weight:700;color:#92400e">${pendChavPend} chave(s) em atraso — verifique o módulo de Protocolo de Chaves</span></div>`);
        if (totalPend > 0) alertas.push(`<div style="display:flex;align-items:center;gap:8px;background:#fef2f2;border:1px solid #fca5a5;border-radius:10px;padding:10px 14px;cursor:pointer" onclick="mostrarAba('aba-aprovacoes')"><i class="fas fa-clock" style="color:#dc2626"></i><span style="font-size:11px;font-weight:700;color:#991b1b">${totalPend} pendência(s) aguardam aprovação — clique para abrir Aprovações</span></div>`);
        return `
          <div style="background:#fff;border:1px solid #e2e8f0;border-radius:20px;overflow:hidden;margin-bottom:8px">
            <div style="padding:14px 20px;border-bottom:1px solid #f1f5f9;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(135deg,#f8fafc,#f1f5f9)">
              <div style="display:flex;align-items:center;gap:10px">
                <div style="width:32px;height:32px;border-radius:10px;background:#7c3aed20;display:flex;align-items:center;justify-content:center;flex-shrink:0">
                  <i class="fas fa-sun" style="color:#7c3aed;font-size:13px"></i>
                </div>
                <div>
                  <span style="font-size:12px;font-weight:900;color:#334155;text-transform:uppercase;letter-spacing:0.06em">Operacional — Hoje</span>
                  <div style="font-size:10px;color:#94a3b8;font-weight:600">${new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long'})}</div>
                </div>
              </div>
              ${totalPend > 0 ? `<span style="background:#dc2626;color:#fff;font-size:10px;font-weight:900;border-radius:99px;padding:2px 10px">${totalPend} pendente${totalPend>1?'s':''}</span>` : '<span style="background:#dcfce7;color:#16a34a;font-size:10px;font-weight:900;border-radius:99px;padding:2px 10px">Em dia</span>'}
            </div>
            <div style="padding:16px 20px">
              ${alertas.length ? `<div style="display:flex;flex-direction:column;gap:6px;margin-bottom:14px">${alertas.join('')}</div>` : ''}
              <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px">
                ${_card('fa-calendar-check','#7c3aed','#faf5ff', reservasHoje.length,'Reservas hoje',`mostrarAba('aba-lista-reservas')`,'Ver Agenda Geral')}
                ${_card('fa-check-circle','#16a34a','#f0fdf4', confirmadasHoje,'Confirmadas hoje','','')}
                ${_card('fa-hourglass-half','#f59e0b','#fffbeb', solPend,'Aguardam aprovação',`mostrarAba('aba-aprovacoes')`, 'Abrir Aprovações')}
                ${_card('fa-user-plus','#0891b2','#f0f9ff', pendCad,'Novos usuários',`mostrarAba('aba-aprovacoes');setTimeout(()=>_aprovSwitch('usuarios'),200)`,'Ver cadastros pendentes')}
                ${_card('fa-key','#6366f1','#eef2ff', pendChavAprov,'Transações chave',`mostrarAba('aba-aprovacoes');setTimeout(()=>_aprovSwitch('chaves'),200)`,'Ver chaves pendentes')}
                ${pendChavPend > 0 ? _card('fa-triangle-exclamation','#dc2626','#fff1f2', pendChavPend,'Chaves atrasadas',`mostrarAba('aba-protocolo-chaves')`,'Abrir Protocolo de Chaves') : _card('fa-shield-check','#059669','#f0fdf4',0,'Chaves em dia','','')}
              </div>
            </div>
          </div>`;
      })();

      cont.innerHTML = `
        <div style="display:flex;align-items:center;gap:8px;padding:8px 14px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;width:fit-content;margin-bottom:16px">
          <i class="fas fa-calendar-alt" style="color:#7c3aed;font-size:11px"></i>
          <span style="font-size:11px;font-weight:900;color:#7c3aed;text-transform:uppercase;letter-spacing:0.06em">${escaparHTML(labelPeriodo)}</span>
        </div>
        ${_hoje}
        ${_secao('Visão Geral',              'fa-chart-bar',       '#7c3aed', _s1)}
        ${_secao('Espaços',                  'fa-map-marker-alt',  '#7c3aed', _s2)}
        ${_secao('Setores & Pessoas',        'fa-users',           '#6366f1', _s3)}
        ${_secao('Temporalidade',            'fa-clock',           '#0891b2', _s4)}
        ${_secao('Recursos & Almoxarifado',  'fa-boxes-stacked',   '#6366f1', _s5)}
        ${_secao('Qualidade & Operação',     'fa-shield-alt',      '#059669', _s6)}
        ${_secao('CODIP — Indicadores Culturais', 'fa-chart-pie',  '#6366f1', _s7)}
      `;
  }, function(err) {
      cont.innerHTML = `<div class="p-10 text-center text-red-400 text-sm">${escaparHTML(err.message)}</div>`;
    });
}

/**
 * BLOCO: Sessão de usuário — logout e perfil
 * @context confirmarLogout: exibe Swal e redireciona para logout GAS via google.script.run.fazerLogout.
 *          carregarPerfilUsuario: busca dados do perfil no servidor e exibe no painel lateral.
 * @inputs Nenhum (lê AppState.usuario para exibição; logout não tem argumentos).
 * @outputs Swal de confirmação / DOM: preenche painel de perfil com nome, email e nível de acesso.
 * @sideEffects google.script.run.fazerLogout / obterPerfilUsuario — leitura de sessão no servidor.
 */
function confirmarLogout() {
  Swal.fire({
    title: 'Sair?',
    icon: 'question',
    showCancelButton: true,
    confirmButtonText: 'Sair'
  }).then(r => {
    if (!r.isConfirmed) return;

    sessionStorage.clear();

    try { google.accounts.id.disableAutoSelect(); } catch (_) {}

    window.top.location.href =
      'https://accounts.google.com/Logout?continue=https://accounts.google.com/AccountChooser';
  });
}

function carregarPerfilUsuario() {
  GAS.admin.obterPerfil(function(perfil) {
      const avatarEl = document.getElementById('userAvatar');
      const nomeEl   = document.getElementById('userNome');
      const emailEl  = document.getElementById('statusUser');

      // Nome
      if (nomeEl) {
        nomeEl.textContent = perfil.nome;
        nomeEl.classList.remove('animate-pulse');
      }

      // Email
      if (emailEl) emailEl.textContent = perfil.email;

      // Avatar: foto ou iniciais
      if (avatarEl) {
        if (perfil.foto) {
          avatarEl.innerHTML = `<img src="${escaparHTML(perfil.foto)}" alt="foto" class="w-full h-full object-cover">`;
        } else {
          const iniciais = perfil.nome
            .split(' ')
            .filter(Boolean)
            .slice(0, 2)
            .map(p => p[0].toUpperCase())
            .join('');
          avatarEl.textContent = iniciais;
        }
      }

      // Atualiza AppState
      AppState.usuario.email = perfil.email;
      AppState.usuario.nome  = perfil.nome;

      // Atualiza badge de nível
      const nivelLabel = AppState.usuario.isSuperadmin ? 'SUPERADMIN'
                       : AppState.usuario.isAdmin ? 'ADMIN'
                       : 'USUÁRIO';
      if (emailEl) {
        emailEl.innerHTML = `
          <span class="truncate">${escaparHTML(perfil.email)}</span>
          <span class="text-[8px] font-black text-purple-400 block">${nivelLabel}</span>
        `;
      }
  }, function() {
      const nomeEl = document.getElementById('userNome');
      if (nomeEl) nomeEl.classList.remove('animate-pulse');
    });
}

/**
 * BLOCO: Manual de uso interativo
 * @context abrirManual: abre #modalManual e renderiza o conteúdo pela primeira vez.
 *          fecharManual: fecha o modal e persiste preferência de "não mostrar novamente".
 *          mudarAbaManual: alterna entre abas intro/admin/operador/externo.
 *          salvarPreferenciaManuai / verificarExibirManualAutomatico: controla exibição automática no primeiro acesso.
 *          renderizarManualCompleto: renderiza todas as seções em Markdown usando renderizarMarkdown.
 * @inputs abaInicial: string com o id da aba inicial; DOM: #modalManual e filhos.
 * @outputs DOM: exibe o conteúdo do manual renderizado; persiste preferência via google.script.run.
 * @sideEffects google.script.run.salvarPreferenciaUsuario — armazena flag de exibição automática.
 */
function abrirManual(abaInicial) {
  const modal = document.getElementById('modalManual');
  if (modal) modal.classList.remove('hidden');

  renderizarManualCompleto();

  mudarAbaManual(abaInicial || 'intro');

  const check = document.getElementById('checkNaoMostrarManual');
  if (check) check.checked = localStorage.getItem('ccbj_manual_ocultar') === 'true';
}

function fecharManual() {
  const modal = document.getElementById('modalManual');
  if (modal) modal.classList.add('hidden');
}

function mudarAbaManual(aba) {
  document.querySelectorAll('.conteudo-manual').forEach(el => el.classList.add('hidden'));
  document.querySelectorAll('.tab-manual').forEach(btn => {
    btn.classList.remove('text-purple-600', 'border-purple-600');
    btn.classList.add('text-slate-400', 'border-transparent');
  });

  const conteudo = document.getElementById('conteudo-manual-' + aba);
  if (conteudo) conteudo.classList.remove('hidden');

  const tabBtn = document.getElementById('tab-manual-' + aba);
  if (tabBtn) {
    tabBtn.classList.add('text-purple-600', 'border-purple-600');
    tabBtn.classList.remove('text-slate-400', 'border-transparent');
  }
}

function salvarPreferenciaManuai(ocultar) {
  localStorage.setItem('ccbj_manual_ocultar', ocultar ? 'true' : 'false');
}

function verificarExibirManualAutomatico() {
  const ocultar = localStorage.getItem('ccbj_manual_ocultar') === 'true';
  if (!ocultar) abrirManual('intro');
}

function renderizarManualCompleto() {

  // ── Primitivos de renderização ────────────────────────────────

  function _step(i, titulo, desc, cor) {
    const bg  = cor === 'amber' ? 'bg-amber-500'  : cor === 'green' ? 'bg-emerald-600' : 'bg-purple-600';
    return `<div class="flex gap-3 p-3 bg-slate-50 rounded-xl">
      <span class="w-6 h-6 ${bg} text-white rounded-full flex items-center justify-center text-[10px] font-black shrink-0">${i}</span>
      <div><p class="font-black text-slate-800 text-xs">${titulo}</p><p class="text-[11px] text-slate-500 mt-0.5">${desc}</p></div>
    </div>`;
  }

  function _card(icon, cor, titulo, desc) {
    return `<div class="flex items-start gap-3 p-3 bg-slate-50 rounded-xl">
      <div class="w-8 h-8 ${corBg(cor)} ${corTexto(cor)} rounded-lg flex items-center justify-center shrink-0"><i class="fas ${icon} text-xs"></i></div>
      <div><p class="font-black text-slate-800 text-xs">${titulo}</p><p class="text-[11px] text-slate-500 mt-0.5">${desc}</p></div>
    </div>`;
  }

  function _tip(icon, cor, msg) {
    const map = {
      amber: 'bg-amber-50 border-amber-200 text-amber-700',
      blue:  'bg-blue-50 border-blue-200 text-blue-700',
      red:   'bg-red-50 border-red-200 text-red-600',
      green: 'bg-emerald-50 border-emerald-200 text-emerald-700',
      purple:'bg-purple-50 border-purple-200 text-purple-700'
    };
    return `<div class="p-3 border rounded-xl text-[11px] font-medium ${map[cor]||map.amber}"><i class="fas ${icon} mr-1.5"></i>${msg}</div>`;
  }

  function _heading(txt) {
    return `<p class="text-[10px] font-black text-slate-400 uppercase tracking-widest pt-2 pb-1 border-b border-slate-100">${txt}</p>`;
  }

  // ── INTRODUÇÃO ────────────────────────────────────────────────

  const elIntro = document.getElementById('manual-intro-cards');
  if (elIntro) elIntro.innerHTML = [
    _card('fa-user',        'blue',  'Visitante Controlado (padrão externo)',
          'Acessa Agenda Geral, Novo Agendamento e Dashboard. Pode criar e editar apenas as próprias reservas.'),
    _card('fa-user-shield', 'purple','Administrador',
          'Gerencia espaços, itens, setores e usuários. Pode editar/cancelar qualquer reserva, aprovar solicitações e acessar Configurações e Permissões.'),
    _card('fa-crown',       'amber', 'Superadmin',
          'Tudo do Admin mais acesso à Auditoria completa, rollback de ações e gerenciamento de outros administradores.'),
    _heading('Módulos disponíveis no sistema'),
    _card('fa-calendar-alt','blue',  'Espaços & Agendamento',
          'Agenda Geral, Novo Agendamento e Agenda RECE. Núcleo operacional do sistema.'),
    _card('fa-check-double','purple','Aprovações',
          'Valida solicitações de reserva e cadastros de novos usuários externos.'),
    _card('fa-tools',       'blue',  'Infraestrutura',
          'Protocolo de Chaves: controle de retirada, devolução e transferência de chaves físicas. Visível para o setor responsável configurado e para admins.'),
    _card('fa-chart-bar',   'green', 'Estratégia',
          'Dashboard com indicadores de uso, ocupação e análise de IA integrada.'),
    _card('fa-server',      'amber', 'Sistema (admin)',
          'Configurações, Permissões e Auditoria. Visível apenas para administradores.')
  ].join('');

// Renderiza markdown simples em HTML seguro
function renderizarMarkdown(texto) {
  if (!texto) return '';
  return texto
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    .replace(/^#{1,3} (.+)$/gm, '<p class="font-black text-slate-800 mt-3 mb-1">$1</p>')
    .replace(/^- (.+)$/gm, '<li class="ml-4 list-disc text-slate-700">$1</li>')
    .replace(/^\d+\. (.+)$/gm, '<li class="ml-4 list-decimal text-slate-700">$1</li>')
    .replace(/\n\n/g, '</p><p class="mb-2">')
    .replace(/\n/g, '<br>');
}

let historicoIA = [];
let historicoChat = []; // histórico enviado ao servidor
let ultimaSugestaoIA = null;

function enviarMensagemIA() {
  const input = document.getElementById('inputChatIA');
  const chat  = document.getElementById('chatIA');

  const texto = input.value.trim();
  if (!texto) return;

  // Adiciona ao histórico antes de enviar
  historicoChat.push({ role: 'user', content: texto });

  chat.innerHTML += `
    <div class="flex justify-end">
      <div class="bg-purple-600 text-white rounded-2xl rounded-tr-none px-4 py-3 max-w-[85%] text-sm">${escaparHTML(texto)}</div>
    </div>`;
  input.value = '';
  chat.scrollTop = chat.scrollHeight;

  const loadingId = 'loadingIA_' + Date.now();
  chat.innerHTML += `
    <div class="flex gap-2" id="${loadingId}">
      <div class="w-7 h-7 bg-purple-100 text-purple-600 rounded-full flex items-center justify-center shrink-0">
        <i class="fas fa-brain text-[10px]"></i>
      </div>
      <div class="bg-white border border-slate-200 rounded-2xl rounded-tl-none px-4 py-3 shadow-sm">
        <div class="flex gap-1.5 items-center">
          <div class="w-1.5 h-1.5 bg-purple-400 rounded-full animate-bounce" style="animation-delay:0ms"></div>
          <div class="w-1.5 h-1.5 bg-purple-400 rounded-full animate-bounce" style="animation-delay:150ms"></div>
          <div class="w-1.5 h-1.5 bg-purple-400 rounded-full animate-bounce" style="animation-delay:300ms"></div>
        </div>
      </div>
    </div>`;
  chat.scrollTop = chat.scrollHeight;

  // Envia histórico completo como JSON
  const payloadHistorico = JSON.stringify(historicoChat);

  GAS.admin.perguntarIA(payloadHistorico, res => {
      document.getElementById(loadingId)?.remove();

      const resposta = res.texto || '';

      // Adiciona resposta ao histórico
      historicoChat.push({ role: 'assistant', content: resposta });

      // Limita histórico a 20 mensagens para não explodir o contexto
      if (historicoChat.length > 20) historicoChat = historicoChat.slice(-20);

      let json = null;
      try {
        json = parsearJsonIA(resposta);
      } catch(e) {
        console.warn('parsearJsonIA falhou:', e.message);
      }
      if (json && json.sugestao) {
        if (!json.datasLote) json.datasLote = [];
        if (typeof json.modoLote === 'undefined') json.modoLote = false;
        if (typeof json.modoRece === 'undefined') json.modoRece = false;
        if (json.datasLote.length > 0 && !json.sugestao.data) {
          json.sugestao.data = json.datasLote[0];
        }

        // Resolve sala por ID ou nome
        const salas = AppState?.colecoes?.salas || [];
        const salaEncontrada = salas.find(s =>
          String(s[0]).trim() === String(json.sugestao.salaId || '').trim() ||
          String(s[1]).trim().toUpperCase() === String(json.sugestao.salaId || '').trim().toUpperCase()
        );
        if (salaEncontrada) {
          json.sugestao.salaId   = String(salaEncontrada[0]);
          json.sugestao.salaNome = salaEncontrada[1];
        }

        // Verifica conflito no índice local ANTES de exibir sugestão
        let temConflitoIA = false;
        if (json.sugestao.salaId && json.sugestao.data && json.sugestao.horaInicio && json.sugestao.horaTermino) {
          const datasCheck = (json.datasLote && json.datasLote.length > 0) ? json.datasLote : [json.sugestao.data];
          const conflitoIA = verificarConflitoFrontend(
            { sala: json.sugestao.salaId, horaInicio: json.sugestao.horaInicio, horaTermino: json.sugestao.horaTermino },
            datasCheck, null
          );
          if (conflitoIA.conflito) {
            temConflitoIA = true;
            json.sugestao._conflito = true;
            chat.innerHTML += `<div class="flex gap-2">
              <div class="w-7 h-7 bg-red-100 text-red-600 rounded-full flex items-center justify-center shrink-0 mt-0.5">
                <i class="fas fa-triangle-exclamation text-[10px]"></i>
              </div>
              <div class="bg-red-50 border border-red-200 rounded-2xl px-4 py-3 max-w-[85%] text-sm text-red-700">
                ⛔ A sugestão da IA tem conflito em <b>${escaparHTML(conflitoIA.data)}</b>:
                <b>${escaparHTML(json.sugestao.salaNome || json.sugestao.salaId)}</b> já está ocupada neste horário.
                Peça uma alternativa ou escolha outra data/sala.
              </div>
            </div>`;
            chat.scrollTop = chat.scrollHeight;
          }
        }

        // Só salva como ultimaSugestaoIA se não houver conflito
        if (!temConflitoIA) {
          ultimaSugestaoIA = json;
        }
      }

      // Remove JSON e markdown do texto exibido
      const textoLimpo = resposta
        .replace(/```json[\s\S]*?```/g, '')
        .replace(/```[\s\S]*?```/g, '')
        .replace(/\*\*JSON:\*\*/gi, '')
        .replace(/\{[\s\S]*$/, '')   // remove tudo a partir do primeiro {
        .trim();

      if (textoLimpo) {
        chat.innerHTML += `
          <div class="flex gap-2">
            <div class="w-7 h-7 bg-purple-100 text-purple-600 rounded-full flex items-center justify-center shrink-0 mt-0.5">
              <i class="fas fa-brain text-[10px]"></i>
            </div>
            <div class="bg-white border border-slate-200 rounded-2xl rounded-tl-none px-4 py-3 max-w-[85%] shadow-sm text-sm text-slate-700 leading-relaxed">${formatarTextoIA(textoLimpo)}</div>
          </div>`;
      }

      if (json) {
        // Mesmo que o JSON esteja incompleto, salva o que tiver
        if (!json.sugestao) json.sugestao = {};
        const salas = window.AppState?.colecoes?.salas || [];
        const sala = salas.find(s => String(s[0]) === String(json.sugestao?.salaId));
        if (sala) json.sugestao.salaNome = sala[1];

        // Se datasLote existir mas sugestao.data não, usa primeira data do lote
        if (json.datasLote && json.datasLote.length > 0 && !json.sugestao.data) {
          json.sugestao.data = json.datasLote[0];
        }

        ultimaSugestaoIA = json;

function preencherUltimaSugestaoIA() {
  if (!ultimaSugestaoIA) {
    Swal.fire('Atenção', 'Nenhuma sugestão disponível ainda. Peça uma indicação para a IA primeiro.', 'warning');
    return;
  }
  const dadosCompletos = ultimaSugestaoIA;
  const s = dadosCompletos.sugestao || ultimaSugestaoIA;

  // Verifica conflito atual antes de preencher
  if (s.salaId && s.data && s.horaInicio && s.horaTermino) {
    const datasCheck = (dadosCompletos.datasLote && dadosCompletos.datasLote.length > 0)
      ? dadosCompletos.datasLote : [s.data];
    const c = verificarConflitoFrontend(
      { sala: s.salaId, horaInicio: s.horaInicio, horaTermino: s.horaTermino },
      datasCheck, null
    );
    if (c.conflito) {
      Swal.fire('Conflito', `A sugestão da IA conflita com uma reserva existente em ${c.data}. Peça uma nova sugestão.`, 'error');
      ultimaSugestaoIA = null;
      return;
    }
  }

  preencherFormularioComSugestaoIA(s, 'painelIA_chat', dadosCompletos.modoLote, dadosCompletos.modoRece, dadosCompletos.datasLote);
}

function parsearJsonIA(texto) {
  if (!texto) return null;

  // Remove markdown
  let limpo = texto
    .replace(/```json\s*/gi, '')
    .replace(/```\s*/gi, '')
    .trim();

  // Encontra o início do JSON
  const inicio = limpo.indexOf('{');
  if (inicio === -1) return null;

  // Tenta encontrar o JSON completo tentando fechar chaves manualmente
  let jsonStr = limpo.slice(inicio);

  // Sanitiza quebras de linha brutas dentro do JSON
  jsonStr = jsonStr
    .replace(/\r?\n/g, ' ')
    .replace(/\t/g, ' ');

  // Tenta parsear direto
  try { return JSON.parse(jsonStr); } catch(e) {}

  // Tenta encontrar o maior bloco JSON válido (fecha chaves manualmente)
  let depth = 0, end = -1;
  for (let i = 0; i < jsonStr.length; i++) {
    if (jsonStr[i] === '{') depth++;
    else if (jsonStr[i] === '}') { depth--; if (depth === 0) { end = i; break; } }
  }
  if (end !== -1) {
    try { return JSON.parse(jsonStr.slice(0, end + 1)); } catch(e) {}
  }

  // Última tentativa: remove escapes inválidos
  const sanitizado = jsonStr
    .replace(/([^\\])\\([^"\\\/bfnrtu])/g, '$1 $2')
    .replace(/,\s*([}\]])/g, '$1'); // remove trailing commas
  try { return JSON.parse(sanitizado); } catch(e) {}

  return null;
}

  const loadId = mostrarLoadingIA('A IA está buscando a melhor opção...');

  GAS.admin.sugerirReservaIA(descricao, function(res) {

            class="flex-1 py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-black text-sm rounded-2xl transition-all flex items-center justify-center gap-2">
            <i class="fas fa-check text-xs"></i> Preencher
          </button>
        </div>

        <p class="text-[10px] text-slate-400 text-center">
          Você ainda poderá revisar todos os campos antes de salvar
        </p>
      </div>
    </div>`;
    
  document.body.appendChild(overlay);
}


function preencherFormularioComSugestaoIA(sugestao, modalId, ativarLote = false, ativarRece = false, datasLote = []) {
  if (modalId) document.getElementById(modalId)?.remove();
  resetarFormulario();
  mostrarAba('aba-nova-reserva');

  setTimeout(function() {
    try {
      const nomeEl = document.getElementById('inputNomeAcao');
      if (nomeEl && sugestao.nomeAcao) nomeEl.value = sugestao.nomeAcao;

      const salaEl = document.getElementById('selectSala');
      if (salaEl && sugestao.salaId) {
        salaEl.value = sugestao.salaId;
        salaEl.dispatchEvent(new Event('change'));
      }

      const horaIniEl = document.getElementById('horaInicio');
      const horaTerEl = document.getElementById('horaTermino');
      if (horaIniEl && sugestao.horaInicio) horaIniEl.value = sugestao.horaInicio;
      if (horaTerEl && sugestao.horaTermino) horaTerEl.value = sugestao.horaTermino;
      if (horaIniEl || horaTerEl) validarHorarios();

      const turnoEl = document.getElementById('inputTurnoCalculado');
      if (turnoEl && sugestao.turno) turnoEl.value = sugestao.turno;

      const setorEl = document.getElementById('selectSetor');
      if (setorEl && sugestao.setor) {
        const setorUpper = String(sugestao.setor).trim().toUpperCase();
        const optSetor = Array.from(setorEl.options).find(o => o.value.trim().toUpperCase() === setorUpper);
        if (optSetor) setorEl.value = optSetor.value;
      }

      const releaseEl = document.getElementById('inputRelease');
      if (releaseEl && sugestao.release) releaseEl.value = sugestao.release;
      else if (releaseEl && sugestao.observacoes) releaseEl.value = sugestao.observacoes;

      // Ativa modo lote
      if (ativarLote || (datasLote && datasLote.length > 1)) {
        const checkLote = document.getElementById('checkLote');
        if (checkLote) { checkLote.checked = true; alternarModoLote(true); }
        setTimeout(() => {
          const datas = (datasLote && datasLote.length > 0 ? datasLote : [sugestao.data]).filter(Boolean);
          aplicarDatasNoCalendario(datas);
        }, 200);
      } else if (calendarInstance && sugestao.data) {
        const partes = sugestao.data.split('/');
        if (partes.length === 3) {
          calendarInstance.setDate(new Date(partes[2], partes[1]-1, partes[0]), true);
        }
      }

      // Itens
      if (sugestao.itens && sugestao.itens.length > 0) {
        itensSelecionados = sugestao.itens.map(nome => ({ nome: String(nome), qtd: 1 }));
        renderizarCarrinhoItens();
      }

      // Ativa RECE e preenche campos
      if (ativarRece || sugestao.receDados) {
        const checkRece = document.getElementById('checkRece');
        if (checkRece) { checkRece.checked = true; alternarModoRece(true); }
        const rd = sugestao.receDados || {};
        const mapeamentoRece = {
          receCategorias:      rd.categorias    || sugestao.categorias    || '',
          receParceiros:       rd.parceiros     || sugestao.parceiros     || '',
          receAcessibilidades: rd.acessibilidades || sugestao.acessibilidades || '',
          recePublicoAlvo:     rd.publicoAlvo   || sugestao.publicoAlvo   || '',
          receArtista:         rd.artista       || sugestao.artista       || '',
          receiveLinkInscricao:rd.linkInscricao || sugestao.linkInscricao || '',
          receDescricao:       rd.descricao     || sugestao.descricao     || '',
          receObservacoes:     rd.observacoes   || ''
        };
        Object.entries(mapeamentoRece).forEach(([id, val]) => {
          const el = document.getElementById(id);
          if (el && val) el.value = val;
        });
        const receClass = document.getElementById('receClassificacao');
        if (receClass && (rd.classificacao || sugestao.classificacao)) {
          receClass.value = rd.classificacao || sugestao.classificacao || '';
        }
        const receAcesso = document.getElementById('receAcesso');
        if (receAcesso && (rd.acesso || sugestao.acesso)) {
          receAcesso.value = rd.acesso || sugestao.acesso || '';
        }
        // Data término RECE
        if (datasLote && datasLote.length > 0) {
          const receDataTer = document.getElementById('receDataTermino');
          if (receDataTer) receDataTer.value = datasLote[datasLote.length - 1];
        }
      }

      Swal.mixin({
        toast: true, position: 'top-end',
        showConfirmButton: false, timer: 3500, timerProgressBar: true
      }).fire({
        icon: 'success',
        title: 'Formulário preenchido pela IA',
        text: 'Revise os campos e clique em Confirmar Agendamento'
      });

      const form = document.getElementById('formReserva');
      if (form) {
        form.style.transition = 'box-shadow 0.3s';
        form.style.boxShadow  = '0 0 0 3px rgba(16,185,129,0.4)';
        setTimeout(() => { form.style.boxShadow = ''; }, 2000);
      }

    } catch(e) {
      console.error('Erro ao preencher formulário:', e);
      Swal.fire('Aviso', 'Não foi possível preencher todos os campos automaticamente.', 'warning');
    }
  }, 400);
}

// Modal: Analisar dashboard
function analisarDashboardIAModal() {
  const loadId = mostrarLoadingIA('Calculando métricas...');
  GAS.admin.obterMetricas('', '', null, null, function(metricas) {
      if (!metricas) {
        removerLoadingIA(loadId);
        exibirResultadoIA('Erro', 'Não foi possível obter as métricas.', 'fa-triangle-exclamation', 'red');
        return;
      }
      const ms = AppState.mapaSalas || {};
      const mapS = id => ms[id] || id;
      if (metricas.top5Salas) metricas.top5Salas = metricas.top5Salas.map(([id, v]) => [mapS(id), v]);
      if (metricas.cancelamentosPorSala) metricas.cancelamentosPorSala = metricas.cancelamentosPorSala.map(([id, v]) => [mapS(id), v]);
      if (metricas.mediaOcupacaoPorSala) metricas.mediaOcupacaoPorSala = metricas.mediaOcupacaoPorSala.map(([id, ...r]) => [mapS(id), ...r]);

      GAS.admin.analisarDashboardIA(metricas, function(res) {
          removerLoadingIA(loadId);
          if (res && res.ok) {
            exibirResultadoIA('Análise do Dashboard', res.texto, 'fa-magnifying-glass-chart', 'amber');
          } else {
            exibirResultadoIA('Erro', (res && res.texto) || 'Falha ao gerar análise.', 'fa-triangle-exclavante', 'red');
          }
        }, function(err) {
          removerLoadingIA(loadId);
          exibirResultadoIA('Erro', err.message, 'fa-triangle-exclamation', 'red');
        });
    }, function(err) {
      removerLoadingIA(loadId);
      exibirResultadoIA('Erro', err.message, 'fa-triangle-exclamation', 'red');
    });
}

/**
 * BLOCO: Navegação e log de acessos na aba de auditoria
 * @context mostrarSubAbaAuditoria: alterna entre sub-abas logs/acessos/comparativo na #aba-auditoria.
 *          carregarLogAcessos: busca o log de acessos/login no servidor e renderiza em tabela.
 *          filtrarLogAcessos: filtra as linhas da tabela de acessos por texto.
 * @inputs aba: 'logs'|'acessos'|'comparativo'; valor de filtro para filtrarLogAcessos.
 * @outputs DOM: alterna visibilidade das divs #subaba-*; preenche tabela de acessos.
 * @sideEffects google.script.run.obterLogAcessos — leitura da planilha de log.
 */
let SUBABA_AUDITORIA_ATIVA = null;

function mostrarSubAbaAuditoria(aba) {

  SUBABA_AUDITORIA_ATIVA = aba;

  // 🔹 VISIBILIDADE
  document.getElementById('subaba-logs')
    .classList.toggle('hidden', aba !== 'logs');

  document.getElementById('subaba-acessos')
    .classList.toggle('hidden', aba !== 'acessos');

  document.getElementById('subaba-comparativo')
    .classList.toggle('hidden', aba !== 'comparativo');


  // 🔹 ESTILO
  document.getElementById('tab-audit-logs').className = aba === 'logs'
    ? 'px-4 py-2 bg-slate-900 text-white text-xs font-black rounded-xl uppercase'
    : 'px-4 py-2 bg-slate-200 text-slate-600 text-xs font-black rounded-xl uppercase';

  document.getElementById('tab-audit-acessos').className = aba === 'acessos'
    ? 'px-4 py-2 bg-slate-900 text-white text-xs font-black rounded-xl uppercase'
    : 'px-4 py-2 bg-slate-200 text-slate-600 text-xs font-black rounded-xl uppercase';

  document.getElementById('tab-audit-comparativo').className = aba === 'comparativo'
    ? 'px-4 py-2 bg-slate-900 text-white text-xs font-black rounded-xl uppercase'
    : 'px-4 py-2 bg-slate-200 text-slate-600 text-xs font-black rounded-xl uppercase';


  // 🔹 AÇÕES SEGURAS

  if (aba === 'acessos') {
    carregarLogAcessos();
  }

  if (aba === 'comparativo') {

    setTimeout(() => {

      // PROTEÇÃO CONTRA VAZAMENTO
      if (SUBABA_AUDITORIA_ATIVA !== 'comparativo') return;

      if (typeof popularContratosComparativo === 'function') {
        popularContratosComparativo();
        const container = document.getElementById('comparativoContrato');
        if (!container) return;
      }

    }, 200);
  }
}

function carregarLogAcessos() {
  const corpo = document.getElementById('tabelaLogAcessos');
  if (!corpo) return;
  corpo.innerHTML = `<tr><td colspan="4" class="p-10 text-center"><i class="fas fa-spinner animate-spin text-purple-400"></i></td></tr>`;
  GAS.admin.obterLogAcessos(AppState.usuario.email, function(json) {
      const logs = JSON.parse(json);
      if (!logs.length) { corpo.innerHTML = '<tr><td colspan="4" class="p-10 text-center text-slate-300">Nenhum acesso registrado.</td></tr>'; return; }
      corpo.innerHTML = logs.map(l => `
        <tr class="hover:bg-slate-50 text-[11px]">
          <td class="p-3 text-slate-500">${escaparHTML(l[0])}</td>
          <td class="p-3 font-bold text-slate-700">${escaparHTML(l[1])}</td>
          <td class="p-3 text-slate-600">${escaparHTML(l[2])}</td>
          <td class="p-3"><span class="px-2 py-0.5 rounded-full text-[9px] font-black bg-purple-100 text-purple-700 uppercase">${escaparHTML(l[3])}</span></td>
        </tr>`).join('');
    }, err => Swal.fire('Erro', err.message, 'error'));
}

function filtrarLogAcessos(valor) {
  const busca = valor.toLowerCase();
  document.querySelectorAll('#tabelaLogAcessos tr').forEach(tr => {
    tr.style.display = tr.innerText.toLowerCase().includes(busca) ? '' : 'none';
  });
}

function redefinirFiltrosDashboard() {
  document.getElementById('dashFiltroAtalho').value = 'todos';
  document.getElementById('dashDataInicio').value   = '';
  document.getElementById('dashDataFim').value      = '';
  document.getElementById('dashFiltroSala').value   = '';
  document.getElementById('dashFiltroSetor').value  = '';
  carregarDashboard();
}
