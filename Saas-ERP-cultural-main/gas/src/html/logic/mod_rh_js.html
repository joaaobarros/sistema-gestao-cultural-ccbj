function _escNomeColaborador(id) {
  if (!id) return '—';
  var f = _rhCache.find(function(x) { return x.id === id; });
  return f ? f.nome : id;
}

function _escFormatarData(iso) {
  if (!iso) return '—';
  try { return new Date(iso + 'T12:00:00').toLocaleDateString('pt-BR'); } catch(_) { return iso; }
}

function _escFecharModal(id) {
  var el = document.getElementById(id); if (el) el.classList.add('hidden');
}

// ── Navegação sub-abas de Escalas ─────────────────────────────────────────────

function _escSubAba(nome) {
  _escSubAbaAtual = nome;
  document.querySelectorAll('.esc-nav').forEach(function(b) {
    b.className = 'esc-nav text-[10px] font-black px-3 py-1.5 rounded-lg text-slate-500 hover:bg-slate-200 uppercase';
  });
  var nb = document.getElementById('esc-nav-' + nome);
  if (nb) nb.className = 'esc-nav text-[10px] font-black px-3 py-1.5 rounded-lg bg-teal-600 text-white uppercase';
  ['minhas','gerenciar','trocas','importar'].forEach(function(p) {
    var el = document.getElementById('esc-painel-' + p); if (el) el.classList.add('hidden');
  });
  var painel = document.getElementById('esc-painel-' + nome); if (painel) painel.classList.remove('hidden');
  if      (nome === 'minhas')    _escCarregarMinhas();
  else if (nome === 'gerenciar') _escCarregarGerenciar();
  else if (nome === 'trocas')    _escCarregarTrocas();
  else if (nome === 'importar')  _escCarregarSelectExportar();
}

function _escCarregar() {
  var mesAtual = new Date().toISOString().slice(0,7);
  ['escMinhaMes','escGerMes'].forEach(function(id) { var el = document.getElementById(id); if (el && !el.value) el.value = mesAtual; });
  _escPopularFiltroSetores();
  _escSubAba(_escSubAbaAtual);
}

function _escPopularFiltroSetores() {
  var sel = document.getElementById('escFiltroSetor'); if (!sel || !_rhCache.length) return;
  var setores = []; _rhCache.forEach(function(f) { if (f.setor && setores.indexOf(f.setor) === -1) setores.push(f.setor); });
  sel.innerHTML = '<option value="">Todos os setores</option>';
  setores.sort().forEach(function(s) { sel.innerHTML += '<option value="'+escaparHTML(s)+'">'+escaparHTML(s)+'</option>'; });
}

// ── Minhas Escalas ────────────────────────────────────────────────────────────

function _escCarregarMinhas() {
  var mes = (document.getElementById('escMinhaMes')||{}).value || '';
  var c = document.getElementById('escMinhasContainer');
  if (c) c.innerHTML = '<div class="p-8 text-center"><i class="fas fa-spinner animate-spin text-teal-300 text-xl"></i></div>';
  GAS.escalas.minha(mes||null, function(dados) { _escRenderMinhas(dados||[]); },
    function() { if (c) c.innerHTML = '<p class="p-6 text-center text-sm text-slate-400">Erro ao carregar escalas.</p>'; });
}

function _escRenderMinhas(turnos) {
  var c = document.getElementById('escMinhasContainer'); if (!c) return;
  if (!turnos || !turnos.length) {
    c.innerHTML = '<div class="p-12 text-center text-slate-400"><i class="fas fa-calendar-times text-3xl mb-2 block opacity-30"></i><p class="text-sm">Nenhuma escala encontrada para este período.</p></div>';
    return;
  }
  var porEscala = {};
  turnos.forEach(function(t) {
    var k = t._escalaId || 'x';
    if (!porEscala[k]) porEscala[k] = { nome:t._escalaNome||'Escala', setor:t._escalaSetor||'', status:t._escalaStatus||'publicada', turnos:[] };
    porEscala[k].turnos.push(t);
  });
  c.innerHTML = Object.keys(porEscala).map(function(k) {
    var g = porEscala[k]; var cor = _escCorSetor(g.setor);
    var turnosHtml = g.turnos.slice().sort(function(a,b){ return (a.dataInicio||'')<(b.dataInicio||'')?-1:1; })
      .map(function(t) {
        return '<div class="flex items-center gap-3 py-2 border-b border-slate-50 last:border-0">'
          +'<div class="shrink-0 w-2 h-2 rounded-full" style="background:'+cor+'"></div>'
          +'<div class="flex-1"><p class="text-xs font-semibold text-slate-700">'+escaparHTML(_escFormatarData(t.dataInicio))+'</p>'
          +'<p class="text-[10px] text-slate-400">'+escaparHTML(t.horaInicio||'')+'–'+escaparHTML(t.horaFim||'')+'</p></div>'
          +_escStatusTurnoBadge(t.status)+'</div>';
      }).join('');
    return '<div class="bg-white border border-slate-200 rounded-2xl p-4 mb-3 hover:shadow-md transition-shadow">'
      +'<div class="flex items-center gap-3 mb-3"><div class="w-3 h-3 rounded-full shrink-0" style="background:'+cor+'"></div>'
      +'<div class="flex-1"><p class="text-xs font-black text-slate-700">'+escaparHTML(g.nome)+'</p>'
      +'<p class="text-[10px] text-slate-400">'+escaparHTML(g.setor)+'</p></div>'+_escStatusBadge(g.status)+'</div>'
      +turnosHtml+'</div>';
  }).join('');
}

// ── Gerenciar Escalas ─────────────────────────────────────────────────────────

function _escCarregarGerenciar() {
  var f = {}; var setor=(document.getElementById('escFiltroSetor')||{}).value; var mes=(document.getElementById('escGerMes')||{}).value; var st=(document.getElementById('escFiltroStatus')||{}).value;
  if (setor) f.setor=setor; if (mes) f.mes=mes; if (st) f.status=st;
  var c = document.getElementById('escGerenciarContainer');
  if (c) c.innerHTML = '<div class="p-8 text-center"><i class="fas fa-spinner animate-spin text-teal-300 text-xl"></i></div>';
  GAS.escalas.listar(f, function(lista) { _escCache=lista||[]; _escRenderGerenciar(); _escPopularSelectExportar(lista); },
    function() { if (c) c.innerHTML = '<p class="p-6 text-center text-sm text-slate-400">Erro ao carregar.</p>'; });
}

function _escSetView(modo) {
  _escViewMode = modo;
  var act = 'text-[10px] px-2 py-1 rounded-md bg-white shadow-sm font-black text-slate-700';
  var inact = 'text-[10px] px-2 py-1 rounded-md text-slate-400 font-black';
  var el1=document.getElementById('esc-view-lista'); var el2=document.getElementById('esc-view-calendar');
  if (el1) el1.className = modo==='lista' ? act : inact;
  if (el2) el2.className = modo==='calendar' ? act : inact;
  _escRenderGerenciar();
}

function _escRenderGerenciar() {
  if (_escViewMode === 'calendar') _escRenderCalendario(_escCache); else _escRenderLista(_escCache);
}

function _escRenderLista(lista) {
  var c = document.getElementById('escGerenciarContainer'); if (!c) return;
  if (!lista||!lista.length) {
    c.innerHTML = '<div class="p-12 text-center text-slate-400"><i class="fas fa-calendar-times text-3xl mb-2 block opacity-30"></i><p class="text-sm">Nenhuma escala encontrada.</p></div>'; return;
  }
  c.innerHTML = lista.map(function(e) {
    var cor = _escCorSetor(e.setor);
    var colabs = [];
    (e.turnos||[]).forEach(function(t){ if (t.idColaborador && colabs.indexOf(t.idColaborador)===-1) colabs.push(t.idColaborador); });
    var avatares = colabs.slice(0,5).map(function(id) {
      var nm = _escNomeColaborador(id);
      return '<div title="'+escaparHTML(nm)+'" style="width:22px;height:22px;border-radius:50%;background:'+_rhCores(id)+';display:inline-flex;align-items:center;justify-content:center;font-size:7px;font-weight:900;color:#fff;border:2px solid #fff;margin-left:-4px">'+_rhIniciais(nm)+'</div>';
    }).join('');
    var canEdit = _rhPodeGestor();
    return '<div class="bg-white border border-slate-200 rounded-2xl p-4 mb-3 hover:shadow-md transition-shadow">'
      +'<div class="flex flex-wrap justify-between items-start gap-3">'
      +'<div class="flex items-center gap-3 flex-1 min-w-0">'
      +'<div class="w-10 h-10 rounded-xl shrink-0 flex items-center justify-center" style="background:'+cor+'20"><i class="fas fa-calendar-week" style="color:'+cor+'"></i></div>'
      +'<div class="min-w-0"><p class="text-sm font-black text-slate-800 truncate">'+escaparHTML(e.nome||'Sem nome')+'</p>'
      +'<p class="text-[10px] text-slate-400">'+escaparHTML(e.tipo||'')+( e.setor?' · '+escaparHTML(e.setor):'')+' · '+(e.turnos||[]).length+' turno(s)</p></div></div>'
      +'<div class="flex items-center gap-2 flex-wrap">'
      +(avatares?'<div style="display:flex;align-items:center;padding-left:4px">'+avatares+'</div>':'')
      +_escStatusBadge(e.status)
      +(canEdit?'<div class="flex gap-1">'
        +'<button onclick="_escAbrirModalNovaEscala(\''+e.id+'\')" class="text-[10px] text-teal-600 font-black px-2 hover:underline" title="Editar"><i class="fas fa-edit"></i></button>'
        +'<button onclick="_escAbrirModalTurno(\''+e.id+'\')" class="text-[10px] text-slate-500 font-black px-2 hover:underline" title="Adicionar turno"><i class="fas fa-user-plus"></i></button>'
        +(e.status==='rascunho'?'<button onclick="_escPublicar(\''+e.id+'\')" class="text-[10px] text-emerald-600 font-black px-2 hover:underline" title="Publicar"><i class="fas fa-paper-plane"></i></button>':'')
        +(e.status==='publicada'?'<button onclick="_escCancelarEscala(\''+e.id+'\')" class="text-[10px] text-red-500 font-black px-2 hover:underline" title="Cancelar"><i class="fas fa-ban"></i></button>':'')
        +'</div>':'')
      +'</div></div></div>';
  }).join('');
}

function _escRenderCalendario(lista) {
  var c = document.getElementById('escGerenciarContainer'); if (!c) return;
  var mes = (document.getElementById('escGerMes')||{}).value || new Date().toISOString().slice(0,7);
  var parts = mes.split('-'); var ano=parseInt(parts[0]); var m=parseInt(parts[1])-1;
  var diasMes = new Date(ano,m+1,0).getDate();
  var diasSem = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
  var turnosPorDia = {};
  lista.forEach(function(e) {
    (e.turnos||[]).forEach(function(t) {
      var d=(t.dataInicio||'').slice(0,10); if (!d.startsWith(mes)) return;
      if (!turnosPorDia[d]) turnosPorDia[d]=[];
      turnosPorDia[d].push({turno:t,escala:e});
    });
  });
  var html='<div class="overflow-x-auto"><table class="w-full border-collapse"><thead><tr>'
    +diasSem.map(function(d){ return '<th class="p-2 text-[10px] font-black text-slate-400 text-center border border-slate-100">'+d+'</th>'; }).join('')
    +'</tr></thead><tbody>';
  var diaSem=new Date(ano,m,1).getDay(); var dia=1; var row='';
  for (var d=0;d<diaSem;d++) row+='<td class="border border-slate-100 bg-slate-50/50 p-1 h-20 align-top"></td>';
  while (dia<=diasMes) {
    if (diaSem>0&&diaSem%7===0) { html+='<tr>'+row+'</tr>'; row=''; }
    var ds=mes+'-'+String(dia).padStart(2,'0');
    var hoje=ds===new Date().toISOString().slice(0,10);
    var ts=turnosPorDia[ds]||[];
    row+='<td class="border border-slate-100 p-1 h-20 align-top'+(hoje?' bg-teal-50':'')+'"><div class="text-[10px] font-black '+(hoje?'text-teal-600':'text-slate-400')+' mb-1">'+dia+'</div>'
      +ts.slice(0,3).map(function(it){ var cor=_escCorSetor(it.escala.setor); return '<div title="'+escaparHTML(_escNomeColaborador(it.turno.idColaborador))+'" style="background:'+cor+'20;border-left:2px solid '+cor+';border-radius:4px;padding:1px 4px;font-size:8px;font-weight:700;color:'+cor+';margin-bottom:1px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis">'+_rhIniciais(_escNomeColaborador(it.turno.idColaborador))+' '+escaparHTML(it.turno.horaInicio||'')+'</div>'; }).join('')
      +(ts.length>3?'<div class="text-[8px] text-slate-400 text-center">+'+(ts.length-3)+'</div>':'')
      +'</td>';
    diaSem++; dia++;
  }
  while (diaSem%7!==0) { row+='<td class="border border-slate-100 bg-slate-50/50 p-1 h-20 align-top"></td>'; diaSem++; }
  html+='<tr>'+row+'</tr></tbody></table></div>';
  c.innerHTML=html;
}

// ── Trocas ────────────────────────────────────────────────────────────────────

function _escCarregarTrocas() {
  var status=(document.getElementById('escTrocaFiltroStatus')||{}).value||'';
  var c=document.getElementById('escTrocasContainer');
  if (c) c.innerHTML='<div class="p-8 text-center"><i class="fas fa-spinner animate-spin text-amber-300 text-xl"></i></div>';
  GAS.escalas.listarTrocas(status?{status:status}:{}, function(lista){ _escTrocasCache=lista||[]; _escRenderTrocas(); },
    function(){ if (c) c.innerHTML='<p class="p-6 text-center text-sm text-slate-400">Erro ao carregar trocas.</p>'; });
}

function _escRenderTrocas() {
  var c=document.getElementById('escTrocasContainer'); if (!c) return;
  if (!_escTrocasCache.length) {
    c.innerHTML='<div class="p-12 text-center text-slate-400"><i class="fas fa-exchange-alt text-3xl mb-2 block opacity-30"></i><p class="text-sm">Nenhuma solicitação de troca.</p></div>'; return;
  }
  var isGestor=_rhPodeGestor();
  c.innerHTML=_escTrocasCache.map(function(t) {
    var sol=_escNomeColaborador(t.idSolicitante); var sub=_escNomeColaborador(t.idSubstituto); var acoes='';
    if (t.status==='solicitada'&&t.idSubstituto===_rhMeuIdColaborador) acoes='<button onclick="_escAbrirResponder(\''+t.id+'\',\'colega\')" class="text-[10px] bg-teal-100 text-teal-700 hover:bg-teal-200 font-black px-3 py-1 rounded-lg uppercase">Responder</button>';
    if (t.status==='aceita_colega'&&isGestor) acoes='<button onclick="_escAbrirResponder(\''+t.id+'\',\'gestor\')" class="text-[10px] bg-emerald-100 text-emerald-700 hover:bg-emerald-200 font-black px-3 py-1 rounded-lg uppercase">Aprovar/Rejeitar</button>';
    if (t.status==='solicitada'&&t.idSolicitante===_rhMeuIdColaborador) acoes+=' <button onclick="_escCancelarTroca(\''+t.id+'\')" class="text-[10px] bg-red-100 text-red-600 hover:bg-red-200 font-black px-3 py-1 rounded-lg uppercase ml-1">Cancelar</button>';
    return '<div class="bg-white border border-slate-200 rounded-2xl p-4 mb-3 flex flex-wrap justify-between items-start gap-3">'
      +'<div><div class="flex items-center gap-2 mb-1">'+_escStatusTrocaBadge(t.status)+'</div>'
      +'<p class="text-xs font-semibold text-slate-700">'+escaparHTML(sol)+' <span class="text-slate-400 font-normal">→</span> '+escaparHTML(sub)+'</p>'
      +(t.motivo?'<p class="text-[10px] text-slate-400 mt-0.5">'+escaparHTML(t.motivo)+'</p>':'')
      +'<p class="text-[10px] text-slate-300 mt-1">'+_escFormatarData(t.criadoEm)+'</p></div>'
      +(acoes?'<div class="flex gap-1">'+acoes+'</div>':'')
      +'</div>';
  }).join('');
}

// ── Modais Nova/Editar Escala ─────────────────────────────────────────────────

function _escAbrirModalNovaEscala(id) {
  _escEscalaEditandoId=id||null;
  var t=document.getElementById('modal-escala-titulo'); if (t) t.textContent=id?'Editar Escala':'Nova Escala';
  ['escFormNome','escFormSetor','escFormDataInicio','escFormDataFim','escFormObs'].forEach(function(fid){ var el=document.getElementById(fid); if (el) el.value=''; });
  var chk=document.getElementById('escFormSyncCal'); if (chk) chk.checked=false;
  if (id) {
    var e=_escCache.find(function(x){ return x.id===id; });
    if (e) {
      var s=function(fid,v){ var el=document.getElementById(fid); if (el) el.value=v||''; };
      s('escFormNome',e.nome); s('escFormSetor',e.setor); s('escFormTipo',e.tipo);
      s('escFormDataInicio',e.dataInicio); s('escFormDataFim',e.dataFim); s('escFormObs',e.obs);
      var chk2=document.getElementById('escFormSyncCal'); if (chk2) chk2.checked=!!e.syncCalendar;
    }
  }
  document.getElementById('modal-escala-form').classList.remove('hidden');
}

function _escSalvarEscala() {
  var nome=(document.getElementById('escFormNome')||{}).value||'';
  if (!nome.trim()) { Swal.fire({title:'Campo obrigatório',text:'Informe o nome da escala.',icon:'warning',customClass:{popup:'rounded-3xl'}}); return; }
  var dados={ nome:nome.trim(), tipo:(document.getElementById('escFormTipo')||{}).value||'semanal',
    setor:(document.getElementById('escFormSetor')||{}).value||'', dataInicio:(document.getElementById('escFormDataInicio')||{}).value||'',
    dataFim:(document.getElementById('escFormDataFim')||{}).value||'', obs:(document.getElementById('escFormObs')||{}).value||'',
    syncCalendar:!!( (document.getElementById('escFormSyncCal')||{}).checked) };
  showLoader(true);
  var cb=function(){ showLoader(false); _escFecharModal('modal-escala-form'); _escCarregarGerenciar(); };
  var err=function(e){ showLoader(false); Swal.fire('Erro',e||'Erro ao salvar.','error'); };
  if (_escEscalaEditandoId) GAS.escalas.atualizar(_escEscalaEditandoId,dados,cb,err);
  else GAS.escalas.criar(dados,cb,err);
}

function _escPublicar(id) {
  Swal.fire({title:'Publicar escala?',text:'Os colaboradores serão notificados por e-mail.',icon:'question',
    showCancelButton:true,confirmButtonText:'Publicar',confirmButtonColor:'#14b8a6',customClass:{popup:'rounded-3xl'}
  }).then(function(r){ if (!r.isConfirmed) return; showLoader(true);
    GAS.escalas.publicar(id,function(){ showLoader(false); _escCarregarGerenciar(); },function(e){ showLoader(false); Swal.fire('Erro',e||'Erro.','error'); }); });
}

function _escCancelarEscala(id) {
  Swal.fire({title:'Cancelar escala?',input:'textarea',inputPlaceholder:'Motivo do cancelamento...',
    showCancelButton:true,confirmButtonColor:'#ef4444',confirmButtonText:'Cancelar Escala',customClass:{popup:'rounded-3xl'}
  }).then(function(r){ if (!r.isConfirmed) return; showLoader(true);
    GAS.escalas.cancelar(id,r.value||'',function(){ showLoader(false); _escCarregarGerenciar(); },function(e){ showLoader(false); Swal.fire('Erro',e||'Erro.','error'); }); });
}

// ── Modal Turno ───────────────────────────────────────────────────────────────

function _escAbrirModalTurno(idEscala, idTurno) {
  var e1=document.getElementById('escTurnoIdEscala'); if (e1) e1.value=idEscala||'';
  var e2=document.getElementById('escTurnoId');       if (e2) e2.value=idTurno||'';
  var t=document.getElementById('modal-turno-titulo'); if (t) t.textContent=idTurno?'Editar Turno':'Adicionar Turno';
  var sel=document.getElementById('escTurnoColaborador');
  if (sel) {
    sel.innerHTML='<option value="">Selecione...</option>';
    (_rhCache||[]).filter(function(f){ return f.status==='Ativo'; }).forEach(function(f){
      sel.innerHTML+='<option value="'+escaparHTML(f.id)+'">'+escaparHTML(f.nome)+'</option>'; });
  }
  ['escTurnoColaborador','escTurnoData','escTurnoEntrada','escTurnoSaida','escTurnoSituacao','escTurnoObs'].forEach(function(fid){ var el=document.getElementById(fid); if (el) el.value=''; });
  if (idTurno&&idEscala) {
    var esc=_escCache.find(function(x){ return x.id===idEscala; });
    if (esc) { var tu=(esc.turnos||[]).find(function(x){ return x.id===idTurno; });
      if (tu) { var s=function(fid,v){ var el=document.getElementById(fid); if (el) el.value=v||''; };
        s('escTurnoColaborador',tu.idColaborador); s('escTurnoData',tu.dataInicio);
        s('escTurnoEntrada',tu.horaInicio); s('escTurnoSaida',tu.horaFim);
        s('escTurnoSituacao',tu.status); s('escTurnoObs',tu.obs); } }
  } else {
    var td=document.getElementById('escTurnoData'); if (td) td.value=new Date().toISOString().slice(0,10);
    var sit=document.getElementById('escTurnoSituacao'); if (sit) sit.value='confirmado';
  }
  document.getElementById('modal-turno-form').classList.remove('hidden');
}

function _escSalvarTurno() {
  var idEscala=(document.getElementById('escTurnoIdEscala')||{}).value;
  var idTurno =(document.getElementById('escTurnoId')||{}).value;
  var colab   =(document.getElementById('escTurnoColaborador')||{}).value;
  var data    =(document.getElementById('escTurnoData')||{}).value;
  var entrada =(document.getElementById('escTurnoEntrada')||{}).value;
  var saida   =(document.getElementById('escTurnoSaida')||{}).value;
  if (!idEscala||!colab||!data||!entrada||!saida) {
    Swal.fire({title:'Campos obrigatórios',text:'Colaborador, data, entrada e saída são obrigatórios.',icon:'warning',customClass:{popup:'rounded-3xl'}}); return;
  }
  var turno={ idColaborador:colab, dataInicio:data, horaInicio:entrada, horaFim:saida,
    status:(document.getElementById('escTurnoSituacao')||{}).value||'confirmado',
    obs:(document.getElementById('escTurnoObs')||{}).value||'' };
  showLoader(true);
  var cb=function(){ showLoader(false); _escFecharModal('modal-turno-form'); _escCarregarGerenciar(); };
  var err=function(e){ showLoader(false); Swal.fire('Erro',e||'Erro ao salvar turno.','error'); };
  if (idTurno) { turno.id=idTurno; GAS.escalas.atualizarTurno(idEscala,idTurno,turno,cb,err); }
  else         GAS.escalas.adicionarTurno(idEscala,turno,cb,err);
}

// ── Solicitar Troca ───────────────────────────────────────────────────────────

function _escSolicitarTroca() {
  var sel=document.getElementById('escTrocaIdEscala');
  if (sel) { sel.innerHTML='<option value="">Selecione...</option>';
    _escCache.filter(function(e){ return e.status==='publicada'; }).forEach(function(e){ sel.innerHTML+='<option value="'+escaparHTML(e.id)+'">'+escaparHTML(e.nome)+'</option>'; }); }
  var selS=document.getElementById('escTrocaSubstituto');
  if (selS) { selS.innerHTML='<option value="">Selecione...</option>';
    (_rhCache||[]).filter(function(f){ return f.status==='Ativo'&&f.id!==_rhMeuIdColaborador; }).forEach(function(f){ selS.innerHTML+='<option value="'+escaparHTML(f.id)+'">'+escaparHTML(f.nome)+'</option>'; }); }
  ['escTrocaIdTurno','escTrocaMotivo'].forEach(function(fid){ var el=document.getElementById(fid); if (el) el.value=''; });
  document.getElementById('modal-solicitar-troca').classList.remove('hidden');
}

function _escCarregarTurnosDaEscala() {
  var idEscala=(document.getElementById('escTrocaIdEscala')||{}).value;
  var sel=document.getElementById('escTrocaIdTurno'); if (!sel) return;
  if (!idEscala) { sel.innerHTML='<option value="">Selecione a escala primeiro</option>'; return; }
  var esc=_escCache.find(function(e){ return e.id===idEscala; });
  sel.innerHTML='<option value="">Selecione seu turno...</option>';

  var ativos = _rhCache.filter(function(p){ return p.status==='Ativo' && p.salarioBase > 0; });
  if (!ativos.length) { Swal.fire('Atenção','Nenhum colaborador ativo com salário configurado.','info'); return; }

  showLoader(true);
  var pendentes = ativos.length;
  ativos.forEach(function(colab) {
    var dados = { idColaborador: colab.id, mes: mes, vinculo: colab.vinculo||'CLT',
                  salarioBase: colab.salarioBase||0, beneficios: colab.beneficios||0, adicional: 0 };
    GAS.rh.simular(dados, function(res) {
      var folha = Object.assign({}, dados, res, { status: 'Calculado' });
      GAS.rh.salvarFolha(folha, function() {
        pendentes--;
        if (pendentes <= 0) { showLoader(false); _rhCarregarFolha(); }
      }, function() { pendentes--; if (pendentes <= 0) { showLoader(false); _rhCarregarFolha(); } });
    }, function() { pendentes--; if (pendentes <= 0) { showLoader(false); _rhCarregarFolha(); } });
  });
}

// ── Simulador de folha (client-side) ──────────────────────────────────────────
function _rhSimular() {
  var salario   = parseFloat(document.getElementById('simSalario')?.value)||0;
  var vinculo   = document.getElementById('simVinculo')?.value || 'CLT';
  var beneficios= parseFloat(document.getElementById('simBeneficios')?.value)||0;
  var adicional = parseFloat(document.getElementById('simAdicional')?.value)||0;
  var c = document.getElementById('simResultado');
  if (!c) return;

  var inss=0, irrf=0, fgts=0, encargos=0, prov13=0, provFer=0, liquido=0, custo=0;

  if (vinculo === 'CLT') {
    var bruto = salario + adicional;
    // INSS progressivo — tabela dinâmica (cache do backend via _fiscalParams)
    var _pf = window._fiscalParamsCache || {
      inss: { tabelaProgressiva: [
        {ate:1412.00,aliq:0.075},{ate:2666.68,aliq:0.09},
        {ate:4000.03,aliq:0.12},{ate:7786.02,aliq:0.14}
      ], teto: 908.86 },
      irrf: { tabela: [
        {de:0,ate:2259.20,aliq:0,deducao:0},
        {de:2259.21,ate:2826.65,aliq:0.075,deducao:169.44},
        {de:2826.66,ate:3751.05,aliq:0.15,deducao:381.44},
        {de:3751.06,ate:4664.68,aliq:0.225,deducao:662.77},
        {de:4664.69,ate:999999,aliq:0.275,deducao:896.00}
      ], isento: 2259.20 },
      fgts: { aliquota: 0.08 },
      encargos: { patronalComFGTS: 0.3568 }
    };
    var _pInss = 0, _pPrev = 0;
    for (var _fi = 0; _fi < _pf.inss.tabelaProgressiva.length; _fi++) {
      var _ff = _pf.inss.tabelaProgressiva[_fi];
      if (bruto <= _pPrev) break;
      _pInss += (Math.min(bruto, _ff.ate) - _pPrev) * _ff.aliq;
      _pPrev = _ff.ate;
      if (bruto <= _ff.ate) break;
    }
    inss = Math.min(Math.round(_pInss*100)/100, _pf.inss.teto);
    var baseI = bruto - inss;
    irrf = 0;
    if (baseI > _pf.irrf.isento) {
      for (var _ri = 0; _ri < _pf.irrf.tabela.length; _ri++) {
        var _rf = _pf.irrf.tabela[_ri];
        if (baseI >= _rf.de && baseI <= _rf.ate) {
          irrf = Math.max(0, baseI * _rf.aliq - _rf.deducao);
          break;
        }
      }
    }
    irrf = Math.max(0, Math.round(irrf*100)/100);
    fgts    = Math.round(bruto*_pf.fgts.aliquota*100)/100;
    encargos= Math.round(bruto*_pf.encargos.patronalComFGTS*100)/100;
    prov13  = Math.round((bruto/12)*100)/100;
    provFer = Math.round((bruto*4/3/12)*100)/100;
    liquido = Math.round((bruto-inss-irrf+beneficios)*100)/100;
    custo   = Math.round((bruto+encargos+prov13+provFer+beneficios)*100)/100;
  } else if (vinculo === 'PJ') {
    liquido = custo = Math.round((salario+adicional+beneficios)*100)/100;
  } else {
    liquido = custo = Math.round((salario+beneficios)*100)/100;
  }

  var linha = function(label, val, cls) {
    return '<div style="display:flex;justify-content:space-between;font-size:11px'+(cls?';'+cls:'')+'"><span>'+label+'</span><span style="font-weight:700">'+_rhFmt(val)+'</span></div>';
  };
  var html = linha('Salário Base', salario);
  if (adicional)   html += linha('Adicional', adicional);
  if (beneficios)  html += linha('Benefícios', beneficios);
  if (vinculo==='CLT') {
    html += '<div style="border-top:1px solid #e9d5ff;margin:4px 0"></div>';
    html += linha('INSS (desc.)', inss, 'color:#dc2626');
    html += linha('IRRF (desc.)', irrf, 'color:#dc2626');
    html += '<div style="border-top:1px solid #e9d5ff;margin:4px 0"></div>';
    html += linha('Líquido Colaborador', liquido, 'color:#16a34a;font-weight:900');
    html += '<div style="border-top:1px solid #e9d5ff;margin:4px 0"></div>';
    html += linha('FGTS (emp.)', fgts, 'color:#9333ea');
    html += linha('Encargos patronais', encargos, 'color:#9333ea');
    html += linha('Provisão 13°', prov13, 'color:#9333ea');
    html += linha('Provisão férias', provFer, 'color:#9333ea');
  } else {
    html += '<div style="border-top:1px solid #e9d5ff;margin:4px 0"></div>';
    html += linha('Líquido / Repasse', liquido, 'color:#16a34a;font-weight:900');
  }
  html += '<div style="border-top:2px solid #e9d5ff;margin:6px 0"></div>';
  html += linha('Custo total empresa', custo, 'color:#7c3aed;font-weight:900;font-size:13px');
  c.innerHTML = html;
}

function _rhRenderKPI(d) {
  var kpi = document.getElementById('rhKPIContainer');
  if (!kpi) return;
  var card = function(icon, label, val, cor) {
    return '<div style="background:#fff;border:1.5px solid #e2e8f0;border-radius:20px;padding:20px">'
      + '<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">'
      + '<div style="width:36px;height:36px;border-radius:12px;background:'+cor+'20;display:flex;align-items:center;justify-content:center">'
      + '<i class="fas '+icon+'" style="color:'+cor+';font-size:14px"></i></div>'
      + '<span style="font-size:10px;font-weight:700;color:#94a3b8;text-transform:uppercase">' + label + '</span></div>'
      + '<p style="font-size:22px;font-weight:900;color:#1e293b">' + val + '</p>'
      + '</div>';
  };
  kpi.innerHTML = card('fa-users','Total',d.total,'#14b8a6')
    + card('fa-check-circle','Ativos',d.ativos,'#10b981')
    + card('fa-exchange-alt','Turnover',d.turnover+'%','#f59e0b')
    + card('fa-file-invoice-dollar','Folha/Mês',_rhFmt(d.custoFolhaMes||0),'#8b5cf6');

  _rhRenderBarChart('rhChartSetor', d.porSetor, '#6366f1');
  _rhRenderBarChart('rhChartVinculo', d.porVinculo, '#14b8a6');
}

function _rhRenderBarChart(containerId, mapa, cor) {
  var c = document.getElementById(containerId);
  if (!c) return;
  var total = Object.values(mapa||{}).reduce(function(a,b){ return a+b; }, 0) || 1;
  var itens = Object.keys(mapa||{}).sort(function(a,b){ return (mapa[b]||0)-(mapa[a]||0); });
  if (!itens.length) { c.innerHTML = '<p class="text-slate-400 text-xs">Sem dados.</p>'; return; }
  c.innerHTML = '<div class="space-y-2">' + itens.map(function(k) {
    var v = mapa[k]||0;
    var pct = Math.round(v/total*100);
    return '<div>'
      + '<div style="display:flex;justify-content:space-between;margin-bottom:3px">'
      + '<span style="font-size:11px;color:#475569;font-weight:600">' + escaparHTML(k) + '</span>'
      + '<span style="font-size:10px;color:#94a3b8;font-weight:700">' + v + ' (' + pct + '%)</span></div>'
      + '<div style="background:#f1f5f9;border-radius:99px;height:7px">'
      + '<div style="width:'+pct+'%;background:'+cor+';height:7px;border-radius:99px;transition:width 0.5s"></div>'
      + '</div></div>';
  }).join('') + '</div>';
}

function _rhRenderDiversidade(d) {
  var c = document.getElementById('rhDiversidadeContainer');
  if (!c) return;
  if (!d || d.total === 0) {
    c.innerHTML = '<div class="col-span-3 p-8 text-center text-slate-400 text-sm">Nenhum dado de perfil social cadastrado ainda.</div>';
    return;
  }
  var pcdInfo = d.pcd + ' colaborador(es) PCD (' + d.pctPcd + '%)';
  c.innerHTML = '<div>'
      + '<h5 style="font-size:10px;font-weight:900;color:#64748b;text-transform:uppercase;margin-bottom:8px">Raça/Cor</h5>'
      + _rhMiniChart(d.racaCor, '#6366f1') + '</div>'
    + '<div>'
      + '<h5 style="font-size:10px;font-weight:900;color:#64748b;text-transform:uppercase;margin-bottom:8px">Gênero</h5>'
      + _rhMiniChart(d.genero, '#ec4899') + '</div>'
    + '<div>'
      + '<h5 style="font-size:10px;font-weight:900;color:#64748b;text-transform:uppercase;margin-bottom:8px">Escolaridade</h5>'
      + _rhMiniChart(d.escolaridade, '#10b981')
      + '<div style="margin-top:8px;padding:8px;background:#f0fdf4;border-radius:10px;font-size:10px;color:#16a34a;font-weight:700">'
      + '<i class="fas fa-wheelchair mr-1"></i>' + escaparHTML(pcdInfo) + '</div></div>';
}

function _rhMiniChart(mapa, cor) {
  var total = Object.values(mapa||{}).reduce(function(a,b){ return a+b; }, 0) || 1;
  return '<div class="space-y-1.5">' + Object.keys(mapa||{}).map(function(k) {
    var v = mapa[k]||0;
    var pct = Math.round(v/total*100);
    return '<div><div style="display:flex;justify-content:space-between;font-size:10px;margin-bottom:2px">'
      + '<span style="color:#475569">' + escaparHTML(k) + '</span><span style="color:#94a3b8">' + pct + '%</span></div>'
      + '<div style="background:#f1f5f9;border-radius:99px;height:5px">'
      + '<div style="width:'+pct+'%;background:'+cor+';height:5px;border-radius:99px"></div></div></div>';
  }).join('') + '</div>';
}

// ── PCCS auto-fill no modal de colaborador ────────────────────────────────────
function _rhCargoSelecionado() {
  var sel = document.getElementById('rhMCargo');
  var info = document.getElementById('rhMCargoInfo');
  var classeEl = document.getElementById('rhMCargoClasse');
  var grupoEl  = document.getElementById('rhMCargoGrupo');
  var stepSel  = document.getElementById('rhMStep');
  if (!sel) return;
  var opt = sel.options[sel.selectedIndex];
  var classe = opt && opt.dataset && opt.dataset.classe;
  var tipo   = opt && opt.dataset && opt.dataset.tipo;
  var grupo  = opt && opt.dataset && opt.dataset.grupo;
  if (classe && tipo) {
    if (info) info.classList.remove('hidden');
    if (classeEl) classeEl.textContent = tipo === 'ORIENTADOR' ? 'ORIENTADOR-' + classe : 'Classe ' + classe;
    if (grupoEl) grupoEl.textContent = grupo || '';
    if (stepSel) {
      var currentStep = stepSel.value;
      stepSel.innerHTML = '<option value="">— selecione o step —</option>'
        + [1,2,3,4,5].map(function(n) {
            var sal = _pccsDados ? _pccsGetSalario(tipo, classe, n) : 0;
            return '<option value="'+n+'"'+(currentStep==n?' selected':'')+'>'
              + 'Step ' + n + (sal ? ' — ' + _rhFmt(sal) : '') + '</option>';
          }).join('');
    }
  } else {
    if (info) info.classList.add('hidden');
    if (stepSel) stepSel.innerHTML = '<option value="">— selecione o cargo primeiro —</option>'
      + [1,2,3,4,5].map(function(n){ return '<option value="'+n+'">Step '+n+'</option>'; }).join('');
  }
}

function _rhStepSelecionado() {
  var sel    = document.getElementById('rhMCargo');
  var stepSel = document.getElementById('rhMStep');
  var salEl  = document.getElementById('rhMSalario');
  if (!sel || !stepSel || !salEl) return;
  var opt    = sel.options[sel.selectedIndex];
  var classe = opt && opt.dataset && opt.dataset.classe;
  var tipo   = opt && opt.dataset && opt.dataset.tipo;
  var step   = parseInt(stepSel.value);
  if (!classe || !tipo || !step || !_pccsDados) return;
  var sal = _pccsGetSalario(tipo, classe, step);
  if (sal) salEl.value = sal;
}

function _rhAtualizarTotalBeneficios() {

             'rhMValeTransp','rhMAuxCombust','rhMAuxHO','rhMOutrosBenef'];

var _rhFeriasCache = [];
var _rhFeriasAllCache = [];

var _FERIAS_STATUS_LABEL = {
  solicitada:      { label: 'Solicitada',       cls: 'background:#dbeafe;color:#1e40af' },
  pendente_ajuste: { label: 'Aguard. Ajuste',   cls: 'background:#fef3c7;color:#92400e' },
  aprovada:        { label: 'Aprovada',         cls: 'background:#d1fae5;color:#065f46' },
  reprovada:       { label: 'Reprovada',        cls: 'background:#fee2e2;color:#991b1b' },
  em_gozo:         { label: 'Em Gozo',          cls: 'background:#e0e7ff;color:#3730a3' },
  concluida:       { label: 'Concluída',        cls: 'background:#f1f5f9;color:#475569' },
  cancelada:       { label: 'Cancelada',        cls: 'background:#fce7f3;color:#9d174d' }
};

var _FERIAS_TIPO_LABEL = {
  oficial: { label: 'Oficial', cls: 'background:#ecfdf5;color:#065f46' },
  passivo: { label: 'Acordo/Passivo', cls: 'background:#fff7ed;color:#c2410c' }
};

function _rhCarregarFerias() {
  var idColaborador = document.getElementById('rhFeriasColaborador')?.value || '';
  var c = document.getElementById('rhFeriasContainer');
  if (c) c.innerHTML = '<div class="p-8 text-center"><i class="fas fa-spinner animate-spin text-sky-300 text-xl"></i></div>';

  GAS.rh.listarFerias(idColaborador, function(lista) {
    _rhFeriasAllCache = lista || [];
    _rhFiltrarFeriasLista();
    if (idColaborador) _rhCarregarSaldoFerias(idColaborador);
    else _rhEsconderSaldoFerias();
    _rhCarregarAlertasFerias();
  }, function() {
    if (c) c.innerHTML = '<div class="p-8 text-center text-red-400 text-sm">Erro ao carregar férias.</div>';
  });
}

function _rhFiltrarFeriasLista() {
  var filtroStatus = document.getElementById('rhFeriasStatus')?.value || '';
  var lista = filtroStatus
    ? _rhFeriasAllCache.filter(function(f) { return f.status === filtroStatus; })
    : _rhFeriasAllCache;
  _rhRenderFerias(lista);
}

function _rhRenderFerias(lista) {
  var c = document.getElementById('rhFeriasContainer');
  if (!c) return;
  if (!lista.length) {
    c.innerHTML = '<div class="p-12 text-center"><i class="fas fa-umbrella-beach text-slate-200 text-4xl mb-3"></i>'
      + '<p class="text-slate-400 font-bold text-sm">Nenhuma solicitação de férias encontrada.</p>'
      + (temPermissao('rh','editar') ? '<button onclick="_rhAbrirModalSolicitarFerias()" class="mt-4 bg-sky-600 text-white text-xs font-black px-4 py-2 rounded-xl">+ Solicitar Férias</button>' : '')
      + '</div>';
    return;
  }
  c.innerHTML = '<div class="overflow-x-auto"><table class="w-full text-xs border-collapse">'
    + '<thead><tr style="background:#f8fafc">'
    + '<th class="p-3 text-left font-black text-slate-500 text-[9px] uppercase">Colaborador</th>'
    + '<th class="p-3 text-left font-black text-slate-500 text-[9px] uppercase">Período Proposto</th>'
    + '<th class="p-3 text-left font-black text-slate-500 text-[9px] uppercase">Dias</th>'
    + '<th class="p-3 text-left font-black text-slate-500 text-[9px] uppercase">Tipo</th>'
    + '<th class="p-3 text-left font-black text-slate-500 text-[9px] uppercase">Status</th>'
    + '<th class="p-3 text-left font-black text-slate-500 text-[9px] uppercase">Solicitado por</th>'
    + '<th class="p-3 text-right font-black text-slate-500 text-[9px] uppercase">Ações</th>'
    + '</tr></thead><tbody class="divide-y divide-slate-50">'
    + lista.map(function(f) {
        var nomeColab = _rhNomeColaborador(f.idColaborador);
        var stInfo = _FERIAS_STATUS_LABEL[f.status] || { label: f.status, cls: 'background:#f1f5f9;color:#475569' };
        var tpInfo = _FERIAS_TIPO_LABEL[f.tipo]   || { label: f.tipo,   cls: 'background:#f1f5f9;color:#475569' };
        var periodo = f.periodoProposto
          ? _fmtDataBR(f.periodoProposto.inicio) + ' → ' + _fmtDataBR(f.periodoProposto.fim)
          : '—';
        var diasStr = (f.diasSolicitados || '—') + ' dias';
        var acoes = _rhFeriasAcoes(f);
        return '<tr class="hover:bg-slate-50">'
          + '<td class="p-3 font-semibold text-slate-800">' + escaparHTML(nomeColab) + '</td>'
          + '<td class="p-3 text-slate-600">' + escaparHTML(periodo) + '</td>'
          + '<td class="p-3 font-bold text-slate-700">' + diasStr + '</td>'
          + '<td class="p-3"><span style="font-size:8px;font-weight:900;padding:2px 8px;border-radius:99px;' + tpInfo.cls + '">' + tpInfo.label + '</span></td>'
          + '<td class="p-3"><span style="font-size:8px;font-weight:900;padding:2px 8px;border-radius:99px;' + stInfo.cls + '">' + stInfo.label + '</span></td>'
          + '<td class="p-3 text-slate-500">' + escaparHTML(f.solicitadoPor || '—') + '</td>'
          + '<td class="p-3 text-right">' + acoes + '</td>'
          + '</tr>';
      }).join('')
    + '</tbody></table></div>';
}

function _rhNomeColaborador(id) {
  var f = _rhCache.find(function(p) { return p.id === id; });
  return f ? f.nome : (id || '—');
}

function _fmtDataBR(iso) {
  if (!iso) return '—';
  var p = iso.split('-');
  if (p.length < 3) return iso;
  return p[2] + '/' + p[1] + '/' + p[0];
}

function _rhFeriasAcoes(f) {
  if (!temPermissao('rh','editar')) return '';
  var btns = '';
  var s = f.status;
  if (s === 'solicitada') {
    btns += '<button onclick="_rhAprovarFerias(\'' + f.id + '\')" style="font-size:9px;color:#065f46;background:#d1fae5;border:none;border-radius:6px;padding:3px 7px;cursor:pointer;margin-right:2px"><i class="fas fa-check mr-1"></i>Aprovar</button>';
    btns += '<button onclick="_rhAjusteFerias(\'' + f.id + '\')" style="font-size:9px;color:#92400e;background:#fef3c7;border:none;border-radius:6px;padding:3px 7px;cursor:pointer;margin-right:2px"><i class="fas fa-edit mr-1"></i>Ajuste</button>';
    btns += '<button onclick="_rhReprovarFerias(\'' + f.id + '\')" style="font-size:9px;color:#991b1b;background:#fee2e2;border:none;border-radius:6px;padding:3px 7px;cursor:pointer"><i class="fas fa-times"></i></button>';
  } else if (s === 'aprovada') {
    btns += '<button onclick="_rhConcluirFerias(\'' + f.id + '\')" style="font-size:9px;color:#3730a3;background:#e0e7ff;border:none;border-radius:6px;padding:3px 7px;cursor:pointer;margin-right:2px"><i class="fas fa-flag-checkered mr-1"></i>Concluir</button>';
    btns += '<button onclick="_rhCancelarFerias(\'' + f.id + '\')" style="font-size:9px;color:#9d174d;background:#fce7f3;border:none;border-radius:6px;padding:3px 7px;cursor:pointer"><i class="fas fa-ban"></i></button>';
  }
  btns += '<button onclick="_rhVerHistoricoFerias(\'' + f.id + '\')" style="font-size:9px;color:#475569;background:#f1f5f9;border:none;border-radius:6px;padding:3px 7px;cursor:pointer;margin-left:2px" title="Ver histórico"><i class="fas fa-history"></i></button>';
  return btns;
}

function _rhCarregarSaldoFerias(idColaborador) {
  var panel = document.getElementById('rhFeriasSaldoPanel');
  var cont  = document.getElementById('rhFeriasSaldoConteudo');
  if (!panel || !cont) return;
  panel.classList.remove('hidden');
  cont.innerHTML = '<div class="p-4 text-center"><i class="fas fa-spinner animate-spin text-sky-300"></i></div>';
  GAS.rh.saldoFerias(idColaborador, function(saldo) {
    if (!saldo || saldo.error) {
      cont.innerHTML = '<p class="text-slate-400 text-xs">' + (saldo && saldo.error ? saldo.error : 'Sem dados') + '</p>';
      return;
    }
    var html = '<div class="grid grid-cols-1 md:grid-cols-2 gap-4">';
    (saldo.periodos || []).forEach(function(p) {
      var cor = p.vencido ? '#fee2e2' : p.emRisco ? '#fef3c7' : '#f0fdf4';
      var txtCor = p.vencido ? '#991b1b' : p.emRisco ? '#92400e' : '#065f46';
      html += '<div style="background:' + cor + ';border-radius:16px;padding:16px;border:1px solid ' + (p.vencido?'#fca5a5':p.emRisco?'#fcd34d':'#bbf7d0') + '">'
        + '<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px">'
        + '<div><p style="font-size:9px;font-weight:900;text-transform:uppercase;color:#94a3b8">Período ' + p.periodoAquisitivo.periodo + '</p>'
        + '<p style="font-size:10px;color:#64748b">' + _fmtDataBR(p.periodoAquisitivo.inicio) + ' → ' + _fmtDataBR(p.periodoAquisitivo.fim) + '</p></div>'
        + (p.vencido ? '<span style="font-size:8px;font-weight:900;padding:2px 8px;border-radius:99px;background:#fee2e2;color:#991b1b">VENCIDO</span>'
          : p.emRisco ? '<span style="font-size:8px;font-weight:900;padding:2px 8px;border-radius:99px;background:#fef3c7;color:#92400e">RISCO</span>' : '')
        + '</div>'
        + '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;text-align:center">'
        + '<div><p style="font-size:20px;font-weight:900;color:' + txtCor + '">' + p.diasDireito + '</p><p style="font-size:9px;color:#94a3b8">Direito</p></div>'
        + '<div><p style="font-size:20px;font-weight:900;color:#3730a3">' + p.diasGozados + '</p><p style="font-size:9px;color:#94a3b8">Gozados</p></div>'
        + '<div><p style="font-size:20px;font-weight:900;color:' + txtCor + '">' + p.saldo + '</p><p style="font-size:9px;color:#94a3b8">Saldo</p></div>'
        + '</div>'
        + '<p style="font-size:9px;color:#64748b;margin-top:8px"><i class="fas fa-calendar-alt mr-1"></i>Concessivo: '
        + _fmtDataBR(p.periodoConcessivo.inicio) + ' → ' + _fmtDataBR(p.periodoConcessivo.fim)
        + (p.vencido ? '' : ' (' + Math.abs(p.diasParaVencimento) + ' dias' + (p.emRisco ? ' — em risco' : '') + ')') + '</p>'
        + '</div>';
    });
    html += '</div>';
    if (saldo.acordosPendentes && saldo.acordosPendentes.length) {
      html += '<div class="mt-4 p-3 bg-orange-50 border border-orange-200 rounded-xl">'
        + '<p class="text-[10px] font-black text-orange-700 uppercase mb-2"><i class="fas fa-exclamation-triangle mr-1"></i>Acordos/Passivos Pendentes</p>'
        + saldo.acordosPendentes.map(function(a) {
            return '<div class="text-xs text-orange-600 flex justify-between"><span>Férias ID: ' + a.id + '</span><span>' + (a.saldoDias || 0) + ' dias pendentes</span></div>';
          }).join('')
        + '</div>';
    }
    cont.innerHTML = html;
  });
}

function _rhEsconderSaldoFerias() {
  var panel = document.getElementById('rhFeriasSaldoPanel');
  if (panel) panel.classList.add('hidden');
}

function _rhCarregarAlertasFerias() {
  GAS.rh.alertasFerias(function(alertas) {
    var div = document.getElementById('rhFeriasAlertas');
    var lista = document.getElementById('rhFeriasAlertasLista');
    if (!div || !lista) return;
    var relevantes = (alertas || []).filter(function(a) { return !a.resolvido; });
    if (!relevantes.length) { div.classList.add('hidden'); return; }
    div.classList.remove('hidden');
    lista.innerHTML = relevantes.slice(0, 5).map(function(a) {
      return '<div class="flex justify-between items-center text-xs text-amber-700 py-0.5">'
        + '<span><strong>' + escaparHTML(a.nomeColaborador || a.idColaborador) + '</strong> — '
        + (a.tipo === 'PERIODO_VENCIDO' ? 'Período VENCIDO' : a.tipo === 'PERIODO_EM_RISCO' ? 'Concessivo vence em ' + a.diasParaVencimento + ' dias' : 'Acordo passivo: ' + a.saldoDias + ' dias pendentes')
        + '</span></div>';
    }).join('');
  }, function() {});
}

}

      + '<option value="">Selecione o tipo...</option>'
      + Object.keys(_HISTORICO_SCHEMAS).map(function(k) {
          return '<option value="' + k + '">' + _HISTORICO_SCHEMAS[k].label + '</option>';
        }).join('')
      + '</select></div>'
      + '<div id="evtCamposAdaptativos"></div>'
      + '</div>',
    didOpen: function() {
      var el = document.getElementById('evtData');
      if (el) el.value = new Date().toISOString().slice(0, 10);
    },
    preConfirm: function() {
      var idColaborador = document.getElementById('evtColab')?.value;
      var tipo          = document.getElementById('evtTipo')?.value;
      var dataEvento    = document.getElementById('evtData')?.value;
      if (!idColaborador || !tipo || !dataEvento) {

        return false;
      }
      var dados = { idColaborador: idColaborador, tipo: tipo, dataEvento: dataEvento };
      var schema = _HISTORICO_SCHEMAS[tipo];
      if (schema) {
        schema.campos.forEach(function(c) {

          if (el) dados[c.id.replace(/^h/, '')] = el.tagName === 'SELECT' ? el.value : el.value.trim();
        });
      }
      // Para desligamento: embute cálculo de rescisão se estiver disponível
      if (tipo === 'desligamento') {
        var rscEl = document.getElementById('evtRscJson');
        if (rscEl && rscEl.value) {
          try { dados.rescisaoCalculada = JSON.parse(rscEl.value); } catch(_) {}
        }
      }
      return dados;
    }
  }).then(function(r) {
    if (!r.isConfirmed) return;

}

  if (!cont) return;
  if (!tipo || !_HISTORICO_SCHEMAS[tipo]) { cont.innerHTML = ''; return; }
  var schema = _HISTORICO_SCHEMAS[tipo];
  cont.innerHTML = schema.campos.map(function(c) {
    var input = '';
    if (c.tipo === 'textarea') {
      input = '<textarea id="' + c.id + '" rows="2" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-xs outline-none resize-none" placeholder="' + c.label + '"></textarea>';

      if (colId) {
        var col = _rhCache.find(function(p) { return p.id === colId; }) || {};
        var sr = document.getElementById('evtRscSalario');
        var br = document.getElementById('evtRscBeneficios');
        if (sr && col.salarioBase) sr.value = col.salarioBase;
        if (br && col.beneficios)  br.value = col.beneficios;
      }
    }, 50);
  }
}

function _rhEvtCalcRescisao() {
  var tipo    = document.getElementById('evtRscTipo')?.value;
  if (!tipo) return;
  var colId   = document.getElementById('evtColab')?.value;
  var col     = (colId && _rhCache.find(function(p) { return p.id === colId; })) || {};
  var admissao= col.dataAdmissao || '';
  if (!admissao) { alert('Colaborador sem data de admissão cadastrada.'); return; }
  var adiant13     = parseFloat(document.getElementById('evtRscAdiant13')?.value) || 0;
  var adiant13Data = document.getElementById('evtRscAdiant13Data')?.value || null;
  var params = {
    dataAdmissao:                admissao,
    dataDesligamento:            document.getElementById('evtRscDesligamento')?.value || new Date().toISOString().slice(0,10),
    tipoRescisao:                tipo,
    salarioBase:                 parseFloat(document.getElementById('evtRscSalario')?.value) || col.salarioBase || 0,
    beneficios:                  parseFloat(document.getElementById('evtRscBeneficios')?.value) || col.beneficios || 0,
    adiantamento13Pago:          adiant13,
    adiantamento13DataPagamento: adiant13Data || null,
    idColaborador:               colId || null
  };
  if (!params.salarioBase) { alert('Informe o salário base.'); return; }
  var btn = document.querySelector('[onclick="_rhEvtCalcRescisao()"]');
  if (btn) btn.textContent = '⏳ Calculando...';
  GAS.rh.calcularRescisao(params, function(res) {
    if (btn) { btn.innerHTML = '<i class="fas fa-calculator" style="margin-right:4px"></i>Estimar Rescisão'; }
    var c = document.getElementById('evtRscResultado');
    if (!c) return;
    var v = res.verbas || {};
    var vac = res.vacanciaEstimada || {};
    c.innerHTML = '<div style="background:#fff;border:1px solid #fca5a5;border-radius:10px;padding:10px;font-size:11px">'
      + '<p style="font-weight:900;color:#9f1239;margin-bottom:4px">' + (res.tipoLabel||'') + '</p>'
      + '<div style="display:flex;justify-content:space-between"><span>Total estimado:</span><strong style="color:#be123c">' + _rscFmt(res.totalRescisao) + '</strong></div>'
      + '<div style="display:flex;justify-content:space-between"><span>Custo mensal cargo:</span><strong>' + _rscFmt(res.custoMensal) + '</strong></div>'
      + '<div style="display:flex;justify-content:space-between"><span>Vacância estimada:</span><strong style="color:#15803d">' + (vac.mesesFloat||0) + ' meses</strong></div>'
      + '<input type="hidden" id="evtRscJson" value=\'' + JSON.stringify(res).replace(/'/g,"&#39;") + '\'>'
      + '</div>';
  }, function() {
    if (btn) btn.innerHTML = '<i class="fas fa-calculator" style="margin-right:4px"></i>Estimar Rescisão';
  });
}

// ── Simulador detalhado (benefícios subdivididos) ─────────────────────────────

function _rhSimular() {
  var dados = {
    salarioBase:        parseFloat(document.getElementById('simSalario')?.value)    || 0,
    vinculo:            document.getElementById('simVinculo')?.value || 'CLT',
    adicional:          parseFloat(document.getElementById('simAdicional')?.value)  || 0,
    planoSaude:         parseFloat(document.getElementById('simPlanoSaude')?.value) || 0,
    planoOdontologico:  parseFloat(document.getElementById('simPlanoOdonto')?.value)|| 0,
    valeAlimentacao:    parseFloat(document.getElementById('simValeAlim')?.value)   || 0,
    valeRefeicao:       parseFloat(document.getElementById('simValeRef')?.value)    || 0,
    valeTransporte:     parseFloat(document.getElementById('simValeTransp')?.value) || 0,
    auxilioCombustivel: parseFloat(document.getElementById('simAuxCombust')?.value) || 0,
    auxilioHomeOffice:  parseFloat(document.getElementById('simAuxHO')?.value)      || 0,
    outrosBeneficios:   parseFloat(document.getElementById('simOutrosBenef')?.value)|| 0
  };

  var c = document.getElementById('simResultado');
  if (!c) return;

  GAS.rh.simularDetalhado(dados, function(res) {
    if (!res) { c.innerHTML = ''; return; }
    var linha = function(label, val, cls) {
      return '<div style="display:flex;justify-content:space-between;font-size:11px'+(cls?';'+cls:'')+'"><span>'+label+'</span><span style="font-weight:700">'+_rhFmt(val)+'</span></div>';
    };
    var html = linha('Salário Base', res.salarioBase);
    if (res.adicional) html += linha('Adicional', res.adicional);

    // Detalhe dos benefícios
    var benefs = res.beneficios || {};
    if (res.totalBeneficios > 0) {
      html += '<div style="border-top:1px dashed #e9d5ff;margin:4px 0;padding-top:4px">';
      if (benefs.planoSaude)        html += linha('Plano de Saúde', benefs.planoSaude, 'color:#0891b2');
      if (benefs.planoOdontologico) html += linha('Plano Odontológico', benefs.planoOdontologico, 'color:#0891b2');
      if (benefs.valeAlimentacao)   html += linha('Vale Alimentação', benefs.valeAlimentacao, 'color:#0891b2');
      if (benefs.valeRefeicao)      html += linha('Vale Refeição', benefs.valeRefeicao, 'color:#0891b2');
      if (benefs.valeTransporte)    html += linha('Vale Transporte', benefs.valeTransporte, 'color:#0891b2');
      if (benefs.auxilioCombustivel)html += linha('Aux. Combustível', benefs.auxilioCombustivel, 'color:#0891b2');
      if (benefs.auxilioHomeOffice) html += linha('Aux. Home Office', benefs.auxilioHomeOffice, 'color:#0891b2');
      if (benefs.outrosBeneficios)  html += linha('Outros Benefícios', benefs.outrosBeneficios, 'color:#0891b2');
      html += linha('Total Benefícios', res.totalBeneficios, 'color:#0891b2;font-weight:700');
      html += '</div>';
    }

    if (dados.vinculo === 'CLT') {
      html += '<div style="border-top:1px solid #e9d5ff;margin:4px 0"></div>';
      html += linha('INSS (desc.)', res.inss, 'color:#dc2626');
      html += linha('IRRF (desc.)', res.irrf, 'color:#dc2626');
      html += '<div style="border-top:1px solid #e9d5ff;margin:4px 0"></div>';
      html += linha('Líquido Colaborador', res.liquidoColaborador, 'color:#16a34a;font-weight:900');
      html += '<div style="border-top:1px solid #e9d5ff;margin:4px 0"></div>';
      html += linha('FGTS (emp.)', res.fgts, 'color:#9333ea');
      html += linha('Encargos patronais', res.encargosPatronais, 'color:#9333ea');
      html += linha('Provisão 13°', res.provisao13, 'color:#9333ea');
      html += linha('Provisão férias', res.provisaoFerias, 'color:#9333ea');
    } else {
      html += '<div style="border-top:1px solid #e9d5ff;margin:4px 0"></div>';
      html += linha('Líquido / Repasse', res.liquidoColaborador, 'color:#16a34a;font-weight:900');
    }
    html += '<div style="border-top:2px solid #e9d5ff;margin:6px 0"></div>';
    html += linha('Custo total empresa', res.custoTotal, 'color:#7c3aed;font-weight:900;font-size:13px');
    c.innerHTML = html;
  }, function() {
    // Fallback: cálculo local rápido
    var bruto = dados.salarioBase + dados.adicional;
    var totalB = dados.planoSaude + dados.planoOdontologico + dados.valeAlimentacao
               + dados.valeRefeicao + dados.valeTransporte + dados.auxilioCombustivel
               + dados.auxilioHomeOffice + dados.outrosBeneficios;
    c.innerHTML = '<div style="font-size:11px;color:#475569">Salário: ' + _rhFmt(bruto) + '<br>Benefícios: ' + _rhFmt(totalB) + '</div>';
  });
}

// ── RESCISÃO ──────────────────────────────────────────────────────────────────
var _rscResultadoCache = null;
var _rscColaboradorCache = {};

function _rscIniciar() {
  var sel = document.getElementById('rscColaborador');
  if (sel && sel.options.length <= 1) {
    sel.innerHTML = '<option value="">Selecione...</option>';
    _rhCache.forEach(function(p) {
      var o = document.createElement('option');
      o.value = p.id; o.textContent = p.nome; sel.appendChild(o);
    });
  }
  var selH = document.getElementById('rscFiltroColaborador');
  if (selH && selH.options.length <= 1) {
    selH.innerHTML = '<option value="">Todos os colaboradores</option>';
    _rhCache.forEach(function(p) {
      var o = document.createElement('option');
      o.value = p.id; o.textContent = p.nome; selH.appendChild(o);
    });
  }
  _rscCarregarHistorico();
}

function _rscOnColaborador() {
  var id = document.getElementById('rscColaborador')?.value;
  if (!id) return;
  var col = _rhCache.find(function(p) { return p.id === id; }) || {};
  _rscColaboradorCache = col;
  if (col.dataAdmissao) document.getElementById('rscAdmissao').value = col.dataAdmissao;
  if (col.salarioBase)  document.getElementById('rscSalario').value  = col.salarioBase;
  if (col.beneficios)   document.getElementById('rscBeneficios').value = col.beneficios;
  // Data de desligamento: hoje
  document.getElementById('rscDesligamento').value = new Date().toISOString().slice(0, 10);
  // Adiantamento 13º: pré-preenche se houver registro no colaborador (mesmo ano)
  var anoAtual = new Date().getFullYear();
  var adiant13 = col.adiantamento13 || {};
  if (adiant13.ano && adiant13.ano == anoAtual && adiant13.valor) {
    var fa = document.getElementById('rscAdiant13');
    var fd = document.getElementById('rscAdiant13Data');
    if (fa) fa.value = adiant13.valor;
    if (fd && adiant13.dataPagamento) fd.value = adiant13.dataPagamento;
  }
}

function _rscCalcular() {
  var colId   = document.getElementById('rscColaborador')?.value;
  var admissao= document.getElementById('rscAdmissao')?.value;
  var deslig  = document.getElementById('rscDesligamento')?.value;
  var tipo    = document.getElementById('rscTipo')?.value;
  var salario = parseFloat(document.getElementById('rscSalario')?.value)||0;

  if (!admissao || !deslig) { Swal.fire('Atenção','Informe as datas de admissão e desligamento.','warning'); return; }
  if (!salario)             { Swal.fire('Atenção','Informe o salário base.','warning'); return; }

  var params = {
    dataAdmissao:                admissao,
    dataDesligamento:            deslig,
    tipoRescisao:                tipo,
    salarioBase:                 salario,
    beneficios:                  parseFloat(document.getElementById('rscBeneficios')?.value)||0,
    outrasVerbas:                parseFloat(document.getElementById('rscOutrasVerbas')?.value)||0,
    descontos:                   parseFloat(document.getElementById('rscDescontos')?.value)||0,
    adiantamento13Pago:          parseFloat(document.getElementById('rscAdiant13')?.value)||0,
    adiantamento13DataPagamento: document.getElementById('rscAdiant13Data')?.value || null,
    observacoes:                 document.getElementById('rscObs')?.value.trim()||'',
    idColaborador:               colId || null
  };

  showLoader(true);
  GAS.rh.calcularRescisao(params, function(res) {
    showLoader(false);
    _rscResultadoCache = Object.assign({}, res, { idColaborador: colId });
    _rscRenderResultado(res);
    var btn = document.getElementById('rscBtnSalvar');
    if (btn && colId) {
      btn.disabled = false;
      btn.className = 'flex-1 bg-teal-600 hover:bg-teal-700 text-white text-xs font-black px-4 py-2.5 rounded-xl transition-all uppercase cursor-pointer';
      btn.removeAttribute('title');
    }
  }, function(e) {
    showLoader(false);
    Swal.fire('Erro', (e && e.message) || 'Erro ao calcular.', 'error');
  });
}

function _rscFmt(v) {
  return 'R$ ' + (parseFloat(v)||0).toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
}

function _rscLinha(label, val, destaque) {
  var style = 'display:flex;justify-content:space-between;padding:5px 0;font-size:11px;border-bottom:1px solid #f1f5f9';
  if (destaque === 'total') style += ';font-weight:900;font-size:13px;color:#be123c;border-top:2px solid #fecdd3;border-bottom:none;padding-top:8px;margin-top:4px';
  else if (destaque === 'sub') style += ';color:#6366f1;font-weight:700';
  else if (destaque === 'neg') style += ';color:#ef4444';
  else if (destaque === 'info') style += ';color:#0891b2;font-style:italic';
  return '<div style="' + style + '"><span>' + label + '</span><span>' + (typeof val === 'string' ? val : _rscFmt(val)) + '</span></div>';
}

function _rscRenderResultado(r) {
  var c = document.getElementById('rscResultado');
  if (!c) return;
  var v = r.verbas || {};
  var html = '<div class="space-y-4">';

  // Header
  html += '<div style="background:#fff1f2;border:1px solid #fecdd3;border-radius:16px;padding:16px">';
  html += '<p style="font-size:10px;font-weight:900;color:#9f1239;text-transform:uppercase;margin-bottom:8px">'
        + '<i class="fas fa-file-contract" style="margin-right:4px"></i>' + (r.tipoLabel || r.tipoRescisao) + '</p>';
  html += '<p style="font-size:11px;color:#475569">Admissão: <strong>' + (r.dataAdmissao||'') + '</strong> &nbsp;|&nbsp; Desligamento: <strong>' + (r.dataDesligamento||'') + '</strong></p>';
  html += '<p style="font-size:11px;color:#475569">Tempo de serviço: <strong>' + (r.anosServico||0) + ' ano(s) e ' + ((r.mesesServico||0) % 12) + ' mês(es)</strong></p>';
  html += '</div>';

  // Verbas rescisórias
  html += '<div style="background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:16px">';
  html += '<p style="font-size:10px;font-weight:900;color:#475569;text-transform:uppercase;margin-bottom:8px">Verbas Rescisórias</p>';
  html += _rscLinha('Saldo Salarial', v.saldoSalarial);
  if (v.feriasVencidas > 0)     html += _rscLinha('Férias Vencidas + 1/3', v.feriasVencidas, 'sub');
  if (v.feriasProporcional > 0) html += _rscLinha('Férias Proporcionais + 1/3', v.feriasProporcional, 'sub');
  if (v.decimoTerceiro > 0)     html += _rscLinha('13º Proporcional', v.decimoTerceiro, 'sub');
  if (v.avisoPrevioValor > 0)   html += _rscLinha('Aviso Prévio (' + (v.avisoPrevioDias||0) + ' dias)', v.avisoPrevioValor, 'sub');
  if (v.multaFGTS > 0)          html += _rscLinha('Multa FGTS', v.multaFGTS, 'sub');
  if (v.outrasVerbas > 0)       html += _rscLinha('Outras Verbas', v.outrasVerbas);
  if (v.descontos > 0)          html += _rscLinha('(-) Descontos', v.descontos, 'neg');
  html += _rscLinha('TOTAL RESCISÃO ESTIMADA', r.totalRescisao, 'total');
  html += '</div>';

  // Custo mensal e vacância
  html += '<div style="background:#f0fdf4;border:1px solid #bbf7d0;border-radius:16px;padding:16px">';
  html += '<p style="font-size:10px;font-weight:900;color:#14532d;text-transform:uppercase;margin-bottom:8px"><i class="fas fa-chair" style="margin-right:4px"></i>Previsão de Vacância</p>';
  html += _rscLinha('Salário Base', r.salarioBase, 'info');
  html += _rscLinha('Benefícios/mês', r.beneficios || 0, 'info');
  html += _rscLinha('Encargos Patronais (est.)', r.encargosPatronais || 0, 'info');
  html += _rscLinha('Custo Mensal Total', r.custoMensal);
  var vac = r.vacanciaEstimada || {};
  html += '<div style="margin-top:12px;padding:10px;background:#dcfce7;border-radius:10px;text-align:center">';
  html += '<p style="font-size:20px;font-weight:900;color:#15803d">' + (vac.mesesFloat||0) + ' meses</p>';
  html += '<p style="font-size:10px;color:#166534">de vacância para compensar o custo da rescisão</p>';
  if (vac.meses > 0 || vac.dias > 0)
    html += '<p style="font-size:9px;color:#166534;margin-top:2px">(' + (vac.meses||0) + ' mês(es) e ' + (vac.dias||0) + ' dia(s))</p>';
  html += '</div></div>';

  // Observações
  if (r.observacoes)
    html += '<div style="background:#fef9c3;border:1px solid #fef08a;border-radius:12px;padding:10px;font-size:11px;color:#713f12">'
          + '<i class="fas fa-sticky-note" style="margin-right:4px"></i>' + escaparHTML(r.observacoes) + '</div>';

  html += '</div>';
  c.innerHTML = html;
}

function _rscSalvar() {
  if (!_rscResultadoCache) return;
  var colId = _rscResultadoCache.idColaborador || document.getElementById('rscColaborador')?.value;
  if (!colId) { Swal.fire('Atenção','Selecione um colaborador antes de salvar.','warning'); return; }

  showLoader(true);
  GAS.rh.salvarSimulacaoRescisao(_rscResultadoCache, colId, function() {
    showLoader(false);
    Swal.fire({ title:'Simulação salva!',
      text:'Projeção gerencial registrada. Para rescisão oficial, use o Histórico → Desligamento.',
      icon:'success', timer:3000, showConfirmButton:false, customClass:{popup:'rounded-3xl'} });
    _rscResultadoCache = null;
    var btn = document.getElementById('rscBtnSalvar');
    if (btn) {
      btn.disabled = true;
      btn.className = 'flex-1 bg-slate-200 text-slate-400 text-xs font-black px-4 py-2.5 rounded-xl transition-all uppercase cursor-not-allowed';
      btn.title = 'Calcule primeiro para habilitar';
    }
    _rscCarregarHistorico();
  }, function(e) {
    showLoader(false);
    Swal.fire('Erro', (e && e.message)||'Erro ao salvar.', 'error');
  });
}

function _rscCarregarHistorico() {
  var colId = document.getElementById('rscFiltroColaborador')?.value || null;
  var c = document.getElementById('rscHistoricoContainer');
  if (!c) return;
  c.innerHTML = '<div class="p-8 text-center"><i class="fas fa-spinner animate-spin text-rose-300 text-xl"></i></div>';
  GAS.rh.listarRescisoes(colId, function(lista) {
    if (!lista || !lista.length) {
      c.innerHTML = '<div class="p-8 text-center text-slate-300 text-sm">Nenhuma rescisão registrada.</div>';
      return;
    }
    var html = '<div class="space-y-3">';
    lista.forEach(function(r) {
      var vac = r.vacanciaEstimada || {};
      var nomCol = '';
      var col = _rhCache.find(function(p) { return p.id === r.idColaborador; });
      if (col) nomCol = col.nome;
      html += '<div style="border:1px solid #fecdd3;border-radius:16px;padding:14px 16px;background:#fff">'
            + '<div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px">'
            + '<div>'
            + (nomCol ? '<p style="font-weight:900;font-size:12px;color:#1e293b">' + escaparHTML(nomCol) + '</p>' : '')
            + '<p style="font-size:10px;color:#64748b">' + (r.tipoLabel || r.tipoRescisao||'') + ' &nbsp;·&nbsp; ' + (r.dataDesligamento||'') + '</p>'
            + '</div>'
            + '<div style="text-align:right">'
            + '<p style="font-size:14px;font-weight:900;color:#be123c">' + _rscFmt(r.totalRescisao) + '</p>'
            + '<p style="font-size:9px;color:#15803d">Vacância: ' + (vac.mesesFloat||0) + ' meses</p>'
            + '</div>'
            + '</div>'
            + '<button onclick="_rscVerDetalhes(\'' + escaparHTML(r.id) + '\')" style="margin-top:8px;font-size:10px;color:#6366f1;background:#eef2ff;border:none;border-radius:8px;padding:4px 12px;cursor:pointer">'
            + '<i class="fas fa-eye" style="margin-right:4px"></i>Ver detalhes</button>'
            + '</div>';
    });
    html += '</div>';
    c.innerHTML = html;
  }, function() {
    c.innerHTML = '<div class="p-8 text-center text-slate-400 text-sm">Erro ao carregar histórico.</div>';
  });
}

function _rscVerDetalhes(id) {
  GAS.rh.obterRescisao(id, function(r) {
    if (!r) { Swal.fire('Erro','Rescisão não encontrada.','error'); return; }
    var div = document.createElement('div');
    _rscRenderResultado(r);
    // Mostra em modal SweetAlert via resultado clonado
    var clone = document.getElementById('rscResultado')?.innerHTML || '';
    Swal.fire({
      title: 'Detalhes da Rescisão',
      html: '<div style="text-align:left;max-height:70vh;overflow-y:auto">' + clone + '</div>',
      width: 580,
      confirmButtonText: 'Fechar',
      customClass: { popup: 'rounded-3xl' }
    });
  });
}

// ── onShow ────────────────────────────────────────────────────────────────────
window._onShow_aba_rh = function() {
  // 1. Resolve nível e ID do colaborador do usuário logado — ativa todos os controles de segurança UI
  GAS.rh.meuNivel(function(res) {
    _rhMeuNivel         = res.nivel        || 'usuario';
    _rhMeuIdColaborador = res.idColaborador || null;
    _rhAjustarNavVisibilidade();

    // 2. Carrega dados somente após saber o nível
    var selSetor = document.getElementById('rhFiltroSetor');
    if (selSetor && selSetor.options.length <= 1) {
      (AppState.colecoes?.setores || []).filter(Boolean).forEach(function(s) {
        var o = document.createElement('option');
        o.value = s; o.textContent = s; selSetor.appendChild(o);
      });
    }
    if (!_pccsDados && _rhPodeRH()) {
      GAS.rh.obterPCCS(function(dados) { _pccsDados = dados; });
    }
    _rhCarregarUsuariosAutocomplete();
    if (_rhCache.length) {
      _rhPopularSelectsColaboradores();
      _rscIniciar();
    } else {
      carregarRH();
    }
  }, function(err) {
    // Fallback seguro: assume usuário sem privilégios
    _rhMeuNivel = 'usuario';
    _rhMeuIdColaborador = null;
    _rhAjustarNavVisibilidade();
    carregarRH();
  });
};
</script>
