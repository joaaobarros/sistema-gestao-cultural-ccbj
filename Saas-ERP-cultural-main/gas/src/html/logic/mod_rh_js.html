<!--
@file logic/mod_rh_js.html
@type logic
@description Lógica de frontend do módulo de RH — equipe, cargos, histórico,
             avaliações, escalas, documentos, férias, folha, rescisão e indicadores.
@responsibility Estado, renderização e chamadas GAS.rh / GAS.equipes para #aba-rh.
@dependencies GAS.rh, GAS.equipes, showLoader, escaparHTML, temPermissao, AppState
-->
<script>
// ── Estado ───────────────────────────────────────────────────────────────────
var _rhCache = [];

// Nível do usuário atual — carregado do backend em _onShow_aba_rh
// 'superadmin' | 'admin' | 'rh' | 'gestor' | 'usuario'
var _rhMeuNivel = 'usuario';
var _rhMeuIdColaborador = null;  // ID do colaborador vinculado ao e-mail logado

function _rhPodeRH() {
  return _rhMeuNivel === 'superadmin' || _rhMeuNivel === 'admin' || _rhMeuNivel === 'rh';
}
function _rhPodeGestor() {
  return _rhPodeRH() || _rhMeuNivel === 'gestor';
}

// Aplica visibilidade das sub-abas conforme nível do usuário
function _rhAjustarNavVisibilidade() {
  var restricoes = {
    'cargos':      _rhPodeRH(),
    'folha':       _rhPodeRH(),
    'rescisao':    _rhPodeRH(),
    'indicadores': _rhPodeGestor(),
    'equipe':      _rhPodeGestor()
  };
  Object.keys(restricoes).forEach(function(aba) {
    var btn = document.getElementById('rh-nav-' + aba);
    if (btn) btn.style.display = restricoes[aba] ? '' : 'none';
  });
  // Para colaborador: limita select de histórico/avaliações ao próprio ID
  if (_rhMeuNivel === 'usuario' && _rhMeuIdColaborador) {
    ['rhHistColaborador','rhAvColaborador','rhDocColaborador'].forEach(function(selId) {
      var sel = document.getElementById(selId);
      if (!sel) return;
      sel.value = _rhMeuIdColaborador;
      sel.disabled = true;
    });
  }
}

function _rhPopularSelectsColaboradores() {
  ['rhHistColaborador','rhAvColaborador','rhDocColaborador','rhFeriasColaborador'].forEach(function(selId) {
    var sel = document.getElementById(selId);
    if (!sel) return;
    sel.innerHTML = '<option value="">Selecione...</option>';
    _rhCache.forEach(function(p) {
      var o = document.createElement('option');
      o.value = p.id; o.textContent = p.nome; sel.appendChild(o);
    });
  });
}
var _rhCargosCache = [];
var _rhHistCache = [];
var _rhAvCache = [];
var _rhDocsCache = [];
var _rhFolhaCache = [];
var _rhEditandoId = null;
var _rhPerfilSocial = {};

// ── Navegação entre sub-abas ─────────────────────────────────────────────────
function _rhSubAba(nome) {
  // Verificação de permissão mínima (defesa em profundidade — a real está no backend)
  var apenasRH     = ['cargos', 'folha', 'rescisao'];
  var apenasGestor = ['indicadores', 'equipe'];
  if (apenasRH.indexOf(nome) !== -1 && !_rhPodeRH()) {
    Swal.fire({ title: 'Acesso restrito', text: 'Esta área é exclusiva para o departamento de RH.',
      icon: 'warning', customClass: { popup: 'rounded-3xl' } });
    return;
  }
  if (apenasGestor.indexOf(nome) !== -1 && !_rhPodeGestor()) {
    Swal.fire({ title: 'Acesso restrito', text: 'Esta área requer perfil de gestor ou RH.',
      icon: 'warning', customClass: { popup: 'rounded-3xl' } });
    return;
  }

  document.querySelectorAll('.rh-nav-btn').forEach(function(b) {
    b.className = 'rh-nav-btn px-4 py-2 text-xs font-black rounded-xl uppercase transition-all bg-slate-100 text-slate-600 hover:bg-slate-200';
  });
  var nb = document.getElementById('rh-nav-' + nome);
  if (nb) nb.className = 'rh-nav-btn px-4 py-2 text-xs font-black rounded-xl uppercase transition-all bg-teal-600 text-white';
  document.querySelectorAll('[id^="rh-painel-"]').forEach(function(p) { p.classList.add('hidden'); });
  var painel = document.getElementById('rh-painel-' + nome);
  if (painel) painel.classList.remove('hidden');

  if (nome === 'equipe'       && !_rhCache.length)     carregarRH();
  else if (nome === 'cargos')      _pccsCarregar();
  else if (nome === 'historico')   _rhCarregarHistorico();
  else if (nome === 'avaliacoes')  _rhCarregarAvaliacoes();
  else if (nome === 'escalas')     _escCarregar();
  else if (nome === 'documentos')  _rhCarregarDocs();
  else if (nome === 'ferias')      _rhCarregarFerias();
  else if (nome === 'folha')       _rhIniciarFolha();
  else if (nome === 'rescisao')    _rscIniciar();
  else if (nome === 'indicadores') _rhCarregarIndicadores();
}

// ── Equipe ────────────────────────────────────────────────────────────────────
function _rhStatusCls(s) {
  return { 'Ativo':'background:#d1fae5;color:#065f46', 'Férias':'background:#eff6ff;color:#1d4ed8',
           'Afastado':'background:#fef3c7;color:#92400e', 'Inativo':'background:#fee2e2;color:#991b1b' }[s]
    || 'background:#f1f5f9;color:#475569';
}
function _rhIniciais(nome) {
  return (nome||'?').split(' ').slice(0,2).map(function(n){ return n[0]||''; }).join('').toUpperCase();
}
function _rhCores(id) {
  var cores = ['#6366f1','#14b8a6','#f59e0b','#ec4899','#8b5cf6','#06b6d4','#ef4444','#10b981'];
  var n = 0;
  for (var i = 0; i < (id||'').length; i++) n += (id.charCodeAt(i)||0);
  return cores[n % cores.length];
}
function _rhFmt(n) {
  return 'R$ ' + Number(n||0).toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
}

function carregarRH() {
  var c = document.getElementById('rhContainer');
  if (c) c.innerHTML = '<div class="p-8 text-center"><i class="fas fa-spinner animate-spin text-teal-300 text-xl"></i></div>';
  GAS.equipes.listar(function(lista) {
    _rhCache = lista || [];
    _rhPopularSelectsColaboradores();
    _rscIniciar();
    _rhFiltrar();
  }, function() {
    if (c) c.innerHTML = '<div class="p-8 text-center text-red-400 text-sm"><i class="fas fa-exclamation-triangle mr-2"></i>Erro ao carregar.</div>';
  });
}

function _rhFiltrar() {
  var busca   = (document.getElementById('rhBusca')?.value||'').toLowerCase();
  var setor   = document.getElementById('rhFiltroSetor')?.value || '';
  var vinculo = document.getElementById('rhFiltroVinculo')?.value || '';
  var status  = document.getElementById('rhFiltroStatus')?.value || '';
  var c       = document.getElementById('rhContainer');
  if (!c) return;

  var lista = _rhCache.filter(function(p) {
    if (busca && !String(p.nome||'').toLowerCase().includes(busca) && !String(p.cargo||'').toLowerCase().includes(busca)) return false;
    if (setor   && p.setor   !== setor)   return false;
    if (vinculo && p.vinculo !== vinculo) return false;
    if (status  && p.status  !== status)  return false;
    return true;
  });

  if (!lista.length) {
    c.innerHTML = '<div class="p-12 text-center"><i class="fas fa-users text-slate-200 text-4xl mb-3"></i>'
      + '<p class="text-slate-400 font-bold text-sm">' + (_rhCache.length ? 'Nenhum resultado.' : 'Nenhum colaborador cadastrado.') + '</p>'
      + (temPermissao('rh','editar') ? '<button onclick="_rhAbrirModalColaborador()" class="mt-4 bg-teal-600 text-white text-xs font-black px-4 py-2 rounded-xl">+ Novo</button>' : '')
      + '</div>';
    return;
  }

  c.innerHTML = '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px">'
    + lista.map(function(p) {
        var st  = p.status || 'Ativo';
        var cor = _rhCores(p.id);
        var vin = p.vinculo ? '<span style="font-size:8px;background:#f0fdf4;color:#16a34a;border:1px solid #bbf7d0;padding:1px 6px;border-radius:99px;font-weight:900">' + escaparHTML(p.vinculo) + '</span>' : '';
        var sal = p.salarioBase ? '<span style="font-size:9px;color:#8b5cf6">' + _rhFmt(p.salarioBase) + '</span>' : '';
        return '<div style="background:#fff;border:1.5px solid #e2e8f0;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px">'
          + '<div style="display:flex;align-items:center;gap:10px">'
          + '<div style="width:44px;height:44px;border-radius:50%;background:' + cor + ';display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;font-weight:900;flex-shrink:0">'
          + escaparHTML(_rhIniciais(p.nome)) + '</div>'
          + '<div style="flex:1;min-width:0">'
          + '<p style="font-weight:800;font-size:12px;color:#1e293b;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + escaparHTML(p.nome||'') + '</p>'
          + '<p style="font-size:10px;color:#64748b;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + escaparHTML(p.cargo||'—') + '</p>'
          + '</div></div>'
          + '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:4px">'
          + '<span style="font-size:9px;color:#94a3b8">' + escaparHTML(p.setor||'—') + '</span>'
          + '<div style="display:flex;gap:4px;align-items:center">' + vin
          + '<span style="font-size:8px;font-weight:900;padding:2px 8px;border-radius:99px;' + _rhStatusCls(st) + '">' + st + '</span>'
          + '</div></div>'
          + (sal ? '<div>' + sal + '</div>' : '')
          + (temPermissao('rh','editar') ? '<div style="display:flex;gap:6px;justify-content:flex-end">'
            + '<button onclick="_rhAbrirModalColaborador(\'' + escaparHTML(p.id) + '\')" style="font-size:10px;color:#6366f1;background:#eef2ff;border:none;border-radius:8px;padding:4px 10px;cursor:pointer"><i class="fas fa-edit" style="margin-right:4px"></i>Editar</button>'
            + (temPermissao('rh','excluir') ? '<button onclick="_rhExcluirColaborador(\'' + escaparHTML(p.id) + '\')" style="font-size:10px;color:#ef4444;background:#fee2e2;border:none;border-radius:8px;padding:4px 10px;cursor:pointer"><i class="fas fa-trash"></i></button>' : '')
            + '</div>' : '')
          + '</div>';
      }).join('') + '</div>';
}

function _rhPodeVerFinanceiro() {
  return typeof temPermissao === 'function'
    ? temPermissao('rh', 'editar')
    : (AppState && AppState.usuario && (AppState.usuario.isSuperadmin || AppState.usuario.isAdmin));
}

function _rhAplicarPermissaoFinanceiro() {
  var ok  = _rhPodeVerFinanceiro();
  var tab = document.getElementById('rh-mtab-financeiro');
  var cnt = document.getElementById('rh-mconteudo-financeiro');
  if (tab) tab.style.display = ok ? '' : 'none';
  if (cnt) cnt.style.display = ok ? '' : 'none';
}

document.addEventListener('permissoes:ready', _rhAplicarPermissaoFinanceiro);

// ── Modal colaborador ─────────────────────────────────────────────────────────
function _rhAbrirModalColaborador(id) {
  _rhEditandoId = id || null;
  _rhPerfilSocial = {};
  var dado = id ? (_rhCache.find(function(p){ return p.id===id; }) || {}) : {};

  document.getElementById('rhModalTitulo').textContent = id ? 'Editar Colaborador' : 'Novo Colaborador';
  document.getElementById('rhMNome').value      = dado.nome || '';
  document.getElementById('rhMCargo').value     = dado.cargo || '';
  document.getElementById('rhMEmailInstitucional').value = dado.emailInstitucional || '';
  document.getElementById('rhMEmailPessoal').value       = dado.emailPessoal || '';
  document.getElementById('rhMTel').value       = dado.telefone || '';
  document.getElementById('rhMAdmissao').value  = dado.dataAdmissao || '';
  document.getElementById('rhMVinculo').value   = dado.vinculo || 'CLT';
  document.getElementById('rhMSalario').value   = dado.salarioBase || '';
  var _bd = dado.beneficiosDetalhe || {};
  document.getElementById('rhMPlanoSaude').value  = _bd.planoSaude        || dado.planoSaude        || 0;
  document.getElementById('rhMPlanoOdonto').value = _bd.planoOdontologico || dado.planoOdontologico || 0;
  document.getElementById('rhMValeAlim').value    = _bd.valeAlimentacao   || dado.valeAlimentacao   || 0;
  document.getElementById('rhMValeRef').value     = _bd.valeRefeicao      || dado.valeRefeicao      || 0;
  document.getElementById('rhMValeTransp').value  = _bd.valeTransporte    || dado.valeTransporte    || 0;
  document.getElementById('rhMAuxCombust').value  = _bd.auxilioCombustivel|| dado.auxilioCombustivel|| 0;
  document.getElementById('rhMAuxHO').value       = _bd.auxilioHomeOffice || dado.auxilioHomeOffice || 0;
  document.getElementById('rhMOutrosBenef').value = _bd.outrosBeneficios  || dado.outrosBeneficios  || 0;
  _rhAtualizarTotalBeneficios();

  var selSetor = document.getElementById('rhMSetor');
  selSetor.innerHTML = '<option value="">Selecione...</option>';
  (AppState.colecoes?.setores || []).filter(Boolean).forEach(function(s) {
    var o = document.createElement('option');
    o.value = s; o.textContent = s;
    if (dado.setor === s) o.selected = true;
    selSetor.appendChild(o);
  });

  var selGestor = document.getElementById('rhMGestor');
  selGestor.innerHTML = '<option value="">Nenhum</option>';
  _rhCache.filter(function(p) { return p.id !== id; }).forEach(function(p) {
    var o = document.createElement('option');
    o.value = p.id; o.textContent = p.nome;
    if (dado.gestorDireto === p.id) o.selected = true;
    selGestor.appendChild(o);
  });

  document.getElementById('rhMStatus').value = dado.status || 'Ativo';
  var stepEl = document.getElementById('rhMStep');
  if (stepEl) stepEl.value = dado.pccsStep || '';

  // Carregar cargos do PCCS no dropdown
  var selCargo = document.getElementById('rhMCargo');
  selCargo.innerHTML = '<option value="">Selecione...</option>';
  var cargoInicial = dado.cargo || '';
  GAS.rh.obterCargosPCCS(function(lista) {
    var porArea = {};
    (lista || []).forEach(function(c) {
      if (!porArea[c.area]) porArea[c.area] = [];
      porArea[c.area].push(c);
    });
    Object.keys(porArea).sort().forEach(function(area) {
      var grp = document.createElement('optgroup');
      grp.label = area;
      porArea[area].forEach(function(c) {
        var o = document.createElement('option');
        o.value = c.nome;
        o.textContent = c.nome;
        o.dataset.classe = c.classe;
        o.dataset.tipo = c.tipoClasse;
        o.dataset.grupo = c.grupo;
        if (cargoInicial === c.nome) o.selected = true;
        grp.appendChild(o);
      });
      selCargo.appendChild(grp);
    });
    _rhCargoSelecionado();
    if (dado.pccsStep && dado.salarioBase) {
      var stepEl2 = document.getElementById('rhMStep');
      if (stepEl2) stepEl2.value = dado.pccsStep;
    }
  });

  if (id) {
    GAS.rh.obterPerfilSocial(id, function(perfil) {
      _rhPerfilSocial = perfil || {};
      _rhPreencherSocial(_rhPerfilSocial);
      document.getElementById('rhMPronome').value = (_rhPerfilSocial && _rhPerfilSocial.pronome) || '';
    });
  }

  _rhTabModal('basico');
  document.getElementById('rhModalColaborador').classList.remove('hidden');
}

function _rhPreencherSocial(p) {
  document.getElementById('rhMGenero').value       = p.genero || '';
  document.getElementById('rhMRaca').value         = p.racaCor || '';
  document.getElementById('rhMNascimento').value   = p.dataNascimento || '';
  document.getElementById('rhMEscolaridade').value = p.escolaridade || '';
  document.getElementById('rhMBairro').value       = p.bairro || '';
  document.getElementById('rhMCidade').value       = p.cidade || '';
  document.getElementById('rhMEstado').value       = p.estado || '';
  document.getElementById('rhMPcd').value          = p.pcd || 'Não';
  document.getElementById('rhMIdentidade').value   = p.identidadeGenero || '';
  document.getElementById('rhMAfirmativas').value  = p.politicasAfirmativas || '';

  var fam = p.familia || {};
  document.getElementById('rhMEPai').checked               = !!fam.ePai;
  document.getElementById('rhMEMae').checked               = !!fam.eMae;
  document.getElementById('rhMCuidador').checked           = !!fam.cuidador;
  document.getElementById('rhMResponsavelCuidados').checked= !!fam.responsavelCuidados;
  document.getElementById('rhMQtdFilhos').value            = fam.qtdFilhos || 0;
  document.getElementById('rhMFaixaFilhos').value          = fam.faixaFilhos || '';

  var acess = p.acessibilidade || {};
  document.getElementById('rhMLibras').checked             = !!acess.libras;
  document.getElementById('rhMNecessidadesAcess').value    = acess.necessidades || '';
  document.getElementById('rhMTecAssistivas').value        = acess.tecAssistivas || '';

  var endo = p.endomarketing || {};
  document.getElementById('rhMAniversario').value          = endo.aniversario || '';
  document.getElementById('rhMIdiomas').value              = endo.idiomas || '';
  document.getElementById('rhMInteressesCulturais').value  = endo.interessesCulturais || '';
  document.getElementById('rhMHabilidades').value          = endo.habilidades || '';
  document.getElementById('rhMDispAcoes').checked          = !!endo.dispAcoesInternas;
  document.getElementById('rhMInteresseFormacoes').checked = !!endo.interesseFormacoes;

  var bem = p.bemEstar || {};
  document.getElementById('rhMIntSaude').checked           = !!bem.interesseSaude;
  document.getElementById('rhMIntCulturais').checked       = !!bem.interesseCulturais;
  document.getElementById('rhMModalidadeTrabalho').value   = bem.modalidadeTrabalho || '';
  document.getElementById('rhMTempoDeslocamento').value    = bem.tempoDeslocamento || '';
}

function _rhTabModal(tab) {
  ['basico','financeiro','social'].forEach(function(t) {
    var btn = document.getElementById('rh-mtab-' + t);
    var con = document.getElementById('rh-mconteudo-' + t);
    if (t === tab) {
      btn.className = 'py-3 px-4 text-xs font-black uppercase border-b-2 border-teal-500 text-teal-600 transition-all';
      con.classList.remove('hidden');
    } else {
      btn.className = 'py-3 px-4 text-xs font-black uppercase border-b-2 border-transparent text-slate-400 hover:text-slate-600 transition-all';
      con.classList.add('hidden');
    }
  });
}

function _rhFecharModal() {
  document.getElementById('rhModalColaborador').classList.add('hidden');
  _rhEditandoId = null;
}

function _rhSalvarColaborador() {
  var nome = (document.getElementById('rhMNome')?.value||'').trim();
  if (!nome) { Swal.fire('Atenção','Nome é obrigatório.','warning'); return; }
  var setor = document.getElementById('rhMSetor')?.value;
  if (!setor) { Swal.fire('Atenção','Selecione um setor.','warning'); return; }

  var cargoOpt = (function() {
    var sel = document.getElementById('rhMCargo');
    var opt = sel && sel.options[sel.selectedIndex];
    return opt || {};
  }());
  var dados = {
    id: _rhEditandoId || null,
    nome: nome,
    cargo:        document.getElementById('rhMCargo')?.value.trim(),
    setor:        setor,
    email:        document.getElementById('rhMEmail')?.value.trim() || document.getElementById('rhMEmailInstitucional')?.value.trim(),
    emailInstitucional: document.getElementById('rhMEmailInstitucional')?.value.trim(),
    emailPessoal: document.getElementById('rhMEmailPessoal')?.value.trim(),
    telefone:     document.getElementById('rhMTel')?.value.trim(),
    dataAdmissao: document.getElementById('rhMAdmissao')?.value,
    status:       document.getElementById('rhMStatus')?.value,
    vinculo:      document.getElementById('rhMVinculo')?.value,
    salarioBase:  parseFloat(document.getElementById('rhMSalario')?.value)||0,
    beneficiosDetalhe: (function() {
      var bd = {
        planoSaude:        parseFloat(document.getElementById('rhMPlanoSaude')?.value)||0,
        planoOdontologico: parseFloat(document.getElementById('rhMPlanoOdonto')?.value)||0,
        valeAlimentacao:   parseFloat(document.getElementById('rhMValeAlim')?.value)||0,
        valeRefeicao:      parseFloat(document.getElementById('rhMValeRef')?.value)||0,
        valeTransporte:    parseFloat(document.getElementById('rhMValeTransp')?.value)||0,
        auxilioCombustivel:parseFloat(document.getElementById('rhMAuxCombust')?.value)||0,
        auxilioHomeOffice: parseFloat(document.getElementById('rhMAuxHO')?.value)||0,
        outrosBeneficios:  parseFloat(document.getElementById('rhMOutrosBenef')?.value)||0
      };
      return bd;
    }()),
    beneficios: (function() {
      return ['rhMPlanoSaude','rhMPlanoOdonto','rhMValeAlim','rhMValeRef',
              'rhMValeTransp','rhMAuxCombust','rhMAuxHO','rhMOutrosBenef']
        .reduce(function(a,id){ return a+(parseFloat(document.getElementById(id)?.value)||0); },0);
    }()),
    pccsStep:     parseInt(document.getElementById('rhMStep')?.value)||null,
    pccsClasse:   cargoOpt.dataset && cargoOpt.dataset.classe || null,
    pccsTipo:     cargoOpt.dataset && cargoOpt.dataset.tipo   || null,
    pccsGrupo:    cargoOpt.dataset && cargoOpt.dataset.grupo  || null,
    gestorDireto: document.getElementById('rhMGestor')?.value
  };

  var perfil = {
    idColaborador:        dados.id,
    pronome:              document.getElementById('rhMPronome')?.value || '',
    genero:               document.getElementById('rhMGenero')?.value || '',
    racaCor:              document.getElementById('rhMRaca')?.value || '',
    dataNascimento:       document.getElementById('rhMNascimento')?.value || '',
    escolaridade:         document.getElementById('rhMEscolaridade')?.value || '',
    bairro:               (document.getElementById('rhMBairro')?.value||'').trim(),
    cidade:               (document.getElementById('rhMCidade')?.value||'').trim(),
    estado:               (document.getElementById('rhMEstado')?.value||'').trim().toUpperCase(),
    pcd:                  document.getElementById('rhMPcd')?.value || 'Não',
    identidadeGenero:     (document.getElementById('rhMIdentidade')?.value||'').trim(),
    politicasAfirmativas: (document.getElementById('rhMAfirmativas')?.value||'').trim(),
    familia: {
      ePai:               document.getElementById('rhMEPai')?.checked || false,
      eMae:               document.getElementById('rhMEMae')?.checked || false,
      cuidador:           document.getElementById('rhMCuidador')?.checked || false,
      responsavelCuidados:document.getElementById('rhMResponsavelCuidados')?.checked || false,
      qtdFilhos:          parseInt(document.getElementById('rhMQtdFilhos')?.value)||0,
      faixaFilhos:        document.getElementById('rhMFaixaFilhos')?.value || ''
    },
    acessibilidade: {
      libras:             document.getElementById('rhMLibras')?.checked || false,
      necessidades:       (document.getElementById('rhMNecessidadesAcess')?.value||'').trim(),
      tecAssistivas:      (document.getElementById('rhMTecAssistivas')?.value||'').trim()
    },
    endomarketing: {
      aniversario:        (document.getElementById('rhMAniversario')?.value||'').trim(),
      idiomas:            (document.getElementById('rhMIdiomas')?.value||'').trim(),
      interessesCulturais:(document.getElementById('rhMInteressesCulturais')?.value||'').trim(),
      habilidades:        (document.getElementById('rhMHabilidades')?.value||'').trim(),
      dispAcoesInternas:  document.getElementById('rhMDispAcoes')?.checked || false,
      interesseFormacoes: document.getElementById('rhMInteresseFormacoes')?.checked || false
    },
    bemEstar: {
      interesseSaude:     document.getElementById('rhMIntSaude')?.checked || false,
      interesseCulturais: document.getElementById('rhMIntCulturais')?.checked || false,
      modalidadeTrabalho: document.getElementById('rhMModalidadeTrabalho')?.value || '',
      tempoDeslocamento:  document.getElementById('rhMTempoDeslocamento')?.value || ''
    }
  };

  _rhFecharModal();
  showLoader(true);

  GAS.equipes.salvar(dados, function(res) {
    var idFinal = (res && res.id) ? res.id : dados.id;
    perfil.idColaborador = idFinal;
    GAS.rh.salvarPerfilSocial(perfil, function() {
      showLoader(false);
      carregarRH();
    }, function() { showLoader(false); carregarRH(); });
  }, function(e) {
    showLoader(false);
    Swal.fire('Erro', e && e.message ? e.message : 'Erro ao salvar.', 'error');
  });
}

function _rhExcluirColaborador(id) {
  Swal.fire({ title:'Remover colaborador?', icon:'warning', showCancelButton:true,
    confirmButtonColor:'#ef4444', confirmButtonText:'Remover', cancelButtonText:'Cancelar',
    customClass:{popup:'rounded-3xl'}
  }).then(function(r) {
    if (!r.isConfirmed) return;
    showLoader(true);
    GAS.equipes.excluir(id, function() {

}

// ── PCCS ──────────────────────────────────────────────────────────────────────
var _pccsDados = null;
var _pccsTipoAtivo = 'FIXA';

function _pccsCarregar() {
  GAS.rh.obterPCCS(function(dados) {
    _pccsDados = dados;
    _pccsPopularFiltroArea();
    _pccsSubAba('cargos');
  });
}

function _pccsPopularFiltroArea() {
  var sel = document.getElementById('pccsFiltroArea');
  if (!sel || !_pccsDados) return;
  var areas = [];
  (_pccsDados.cargos || []).forEach(function(c) {
    if (c.area && areas.indexOf(c.area) < 0) areas.push(c.area);
  });
  areas.sort();
  sel.innerHTML = '<option value="">Todas as áreas</option>'
    + areas.map(function(a) { return '<option>' + a + '</option>'; }).join('');
}

function _pccsSubAba(aba) {
  document.querySelectorAll('.pccs-nav-btn').forEach(function(b) {
    b.className = 'pccs-nav-btn px-4 py-2 text-[10px] font-black rounded-xl uppercase bg-slate-100 text-slate-600 hover:bg-slate-200 transition-all';
  });
  var nb = document.getElementById('pccs-nav-' + aba);
  if (nb) nb.className = 'pccs-nav-btn px-4 py-2 text-[10px] font-black rounded-xl uppercase bg-indigo-600 text-white transition-all';
  ['cargos','tabela','parametros','fiscal'].forEach(function(p) {
    var el = document.getElementById('pccs-panel-' + p);
    if (el) el.classList.add('hidden');
  });
  var panel = document.getElementById('pccs-panel-' + aba);
  if (panel) panel.classList.remove('hidden');
  if (aba === 'cargos')     _pccsRenderCargos();
  if (aba === 'tabela')     _pccsRenderTabela();
  if (aba === 'parametros') _pccsRenderParametros();
  if (aba === 'fiscal')     _fiscalCarregar();
}

function _pccsGrupoStyle(grupo) {
  return {
    'Gestão Estratégica': 'background:#ede9fe;color:#5b21b6',
    'Assessoramento':     'background:#fce7f3;color:#9d174d',
    'Gestão Tática':      'background:#dbeafe;color:#1e40af',
    'Administrativo':     'background:#d1fae5;color:#065f46',
    'Operacional':        'background:#fef3c7;color:#92400e'
  }[grupo] || 'background:#f1f5f9;color:#475569';
}

function _pccsTipoStyle(tipo) {
  return tipo === 'ORIENTADOR'
    ? 'background:#ede9fe;color:#7c3aed'
    : 'background:#ecfdf5;color:#065f46';
}

function _pccsRenderCargos() {
  var c = document.getElementById('pccsCargosContainer');
  if (!c || !_pccsDados) return;
  var busca  = (document.getElementById('pccsBusca')?.value||'').toLowerCase();
  var area   = document.getElementById('pccsFiltroArea')?.value || '';
  var grupo  = document.getElementById('pccsFiltroGrupo')?.value || '';
  var lista  = (_pccsDados.cargos || []).filter(function(cargo) {
    if (cargo.ativo === false) return false;
    if (busca && !cargo.nome.toLowerCase().includes(busca)) return false;
    if (area  && cargo.area  !== area)  return false;
    if (grupo && cargo.grupo !== grupo) return false;
    return true;
  });
  if (!lista.length) {
    c.innerHTML = '<div class="p-12 text-center text-slate-400 text-sm">Nenhum cargo encontrado.</div>';
    return;
  }
  // Group by area
  var byArea = {};
  lista.forEach(function(cargo) {
    if (!byArea[cargo.area]) byArea[cargo.area] = [];
    byArea[cargo.area].push(cargo);
  });
  var html = '';
  Object.keys(byArea).sort().forEach(function(areaKey) {
    html += '<div class="mb-4">'
      + '<div class="px-4 py-2 bg-slate-50 border-b border-slate-100">'
      + '<span class="text-[9px] font-black text-slate-500 uppercase tracking-widest">' + escaparHTML(areaKey) + '</span>'
      + '<span class="ml-2 text-[9px] text-slate-400">(' + byArea[areaKey].length + ' cargos)</span></div>'
      + '<table class="w-full text-left text-xs border-collapse"><tbody class="divide-y divide-slate-50">'
      + byArea[areaKey].map(function(cargo) {
          var gStyle = _pccsGrupoStyle(cargo.grupo);
          var tStyle = _pccsTipoStyle(cargo.tipoClasse);
          var salario = _pccsGetSalario(cargo.tipoClasse, cargo.classe, 1);
          var salarioFmt = salario ? _rhFmt(salario) + ' – ' + _rhFmt(_pccsGetSalario(cargo.tipoClasse, cargo.classe, 5)) : '—';
          return '<tr class="hover:bg-slate-50">'
            + '<td class="p-3 font-semibold text-slate-800 text-xs">' + escaparHTML(cargo.nome) + '</td>'
            + '<td class="p-3"><span style="font-size:8px;font-weight:900;padding:2px 8px;border-radius:99px;' + tStyle + '">'
            + escaparHTML(cargo.tipoClasse === 'ORIENTADOR' ? 'ORIENTADOR-' + cargo.classe : 'Classe ' + cargo.classe) + '</span></td>'
            + '<td class="p-3"><span style="font-size:8px;font-weight:900;padding:2px 8px;border-radius:99px;' + gStyle + '">' + escaparHTML(cargo.grupo) + '</span></td>'
            + '<td class="p-3 text-[10px] text-slate-500">' + salarioFmt + '</td>'
            + '<td class="p-3 text-right">'
            + (temPermissao('rh','editar') ? '<button onclick="_pccsAbrirModalCargo(\'' + cargo.id + '\')" style="font-size:10px;color:#6366f1;background:#eef2ff;border:none;border-radius:6px;padding:3px 8px;cursor:pointer;margin-right:4px"><i class="fas fa-edit"></i></button>' : '')
            + (temPermissao('rh','excluir') ? '<button onclick="_pccsExcluirCargo(\'' + cargo.id + '\')" style="font-size:10px;color:#ef4444;background:#fee2e2;border:none;border-radius:6px;padding:3px 8px;cursor:pointer"><i class="fas fa-trash"></i></button>' : '')
            + '</td></tr>';
        }).join('')
      + '</tbody></table></div>';
  });
  c.innerHTML = '<div class="divide-y divide-slate-100">' + html + '</div>';
}

function _pccsGetSalario(tipo, classe, step) {
  if (!_pccsDados || !_pccsDados.tabelaSalarial) return 0;
  var row = null;
  for (var i = 0; i < _pccsDados.tabelaSalarial.length; i++) {
    var r = _pccsDados.tabelaSalarial[i];
    if (r.tipo === tipo && r.classe === classe) { row = r; break; }
  }
  if (!row || !row.steps) return 0;
  return row.steps[(step || 1) - 1] || 0;
}

function _pccsAbrirModalCargo(id) {
  var dado = id ? ((_pccsDados.cargos||[]).find(function(c){ return c.id===id; })||{}) : {};
  var areas = [];
  (_pccsDados && _pccsDados.cargos || []).forEach(function(c) {
    if (c.area && areas.indexOf(c.area) < 0) areas.push(c.area);
  });
  areas.sort();
  var classesFixa = ['PISO','A','B','C','D','E','F','G','H','I','J','K','L','M','N','O','P','Q'];
  var classesOrientador = ['F','G','H','I','J','K','L','M','N','O','P','Q'];
  Swal.fire({
    title: id ? 'Editar Cargo PCCS' : 'Novo Cargo PCCS',
    width: 540,
    showCancelButton: true,
    confirmButtonText: 'Salvar',
    cancelButtonText: 'Cancelar',
    confirmButtonColor: '#6366f1',
    customClass: { popup: 'rounded-3xl' },
    html: '<div class="text-left space-y-3 px-2">'
      + '<div><label class="text-[10px] font-black text-slate-400 uppercase block mb-1">Nome do Cargo *</label>'
      + '<input id="pccsNome" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm outline-none" value="' + escaparHTML(dado.nome||'') + '"></div>'
      + '<div class="grid grid-cols-2 gap-3">'
      + '<div><label class="text-[10px] font-black text-slate-400 uppercase block mb-1">Área *</label>'
      + '<input id="pccsArea" list="pccsAreaList" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm outline-none" value="' + escaparHTML(dado.area||'') + '">'
      + '<datalist id="pccsAreaList">' + areas.map(function(a){ return '<option value="'+a+'">'; }).join('') + '</datalist></div>'
      + '<div><label class="text-[10px] font-black text-slate-400 uppercase block mb-1">Grupo *</label>'
      + '<select id="pccsGrupo" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm outline-none">'
      + ['Gestão Estratégica','Assessoramento','Gestão Tática','Administrativo','Operacional'].map(function(g){
          return '<option'+(dado.grupo===g?' selected':'')+'>'+g+'</option>';
        }).join('') + '</select></div></div>'
      + '<div class="grid grid-cols-2 gap-3">'
      + '<div><label class="text-[10px] font-black text-slate-400 uppercase block mb-1">Tipo de Classe *</label>'
      + '<select id="pccsTipoClasse" onchange="_pccsAtualizarClassesModal()" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm outline-none">'
      + '<option value="FIXA"'+(dado.tipoClasse==='FIXA'?' selected':'')+'>Faixa Fixa</option>'
      + '<option value="ORIENTADOR"'+(dado.tipoClasse==='ORIENTADOR'?' selected':'')+'>Orientador</option>'
      + '</select></div>'
      + '<div><label class="text-[10px] font-black text-slate-400 uppercase block mb-1">Classe *</label>'
      + '<select id="pccsClasse" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm outline-none">'
      + (dado.tipoClasse==='ORIENTADOR'?classesOrientador:classesFixa).map(function(cl){
          return '<option'+(dado.classe===cl?' selected':'')+'>'+cl+'</option>';
        }).join('') + '</select></div></div>'
      + '</div>',
    didOpen: function() { _pccsAtualizarClassesModal(); },
    preConfirm: function() {
      var nome = (document.getElementById('pccsNome')?.value||'').trim();
      var area = (document.getElementById('pccsArea')?.value||'').trim();
      if (!nome || !area) { Swal.showValidationMessage('Nome e Área são obrigatórios'); return false; }
      return {
        id: dado.id || null,
        nome: nome,
        area: area,
        grupo: document.getElementById('pccsGrupo')?.value,
        tipoClasse: document.getElementById('pccsTipoClasse')?.value,
        classe: document.getElementById('pccsClasse')?.value,
        ativo: true
      };
    }
  }).then(function(r) {
    if (!r.isConfirmed) return;
    showLoader(true);
    GAS.rh.salvarCargoPCCS(r.value, function(res) {
      showLoader(false);
      GAS.rh.obterPCCS(function(dados) { _pccsDados = dados; _pccsRenderCargos(); });
    }, function() { showLoader(false); Swal.fire('Erro','Erro ao salvar cargo.','error'); });
  });
}

function _pccsAtualizarClassesModal() {
  var tipo = document.getElementById('pccsTipoClasse')?.value;
  var sel  = document.getElementById('pccsClasse');
  if (!sel) return;
  var classes = tipo === 'ORIENTADOR'
    ? ['F','G','H','I','J','K','L','M','N','O','P','Q']
    : ['PISO','A','B','C','D','E','F','G','H','I','J','K','L','M','N','O','P','Q'];
  sel.innerHTML = classes.map(function(c){ return '<option>'+c+'</option>'; }).join('');
}

function _pccsExcluirCargo(id) {
  Swal.fire({ title:'Excluir cargo PCCS?', icon:'warning', showCancelButton:true,
    confirmButtonColor:'#ef4444', confirmButtonText:'Excluir', cancelButtonText:'Cancelar',
    customClass:{popup:'rounded-3xl'}
  }).then(function(r) {
    if (!r.isConfirmed) return;
    showLoader(true);
    GAS.rh.excluirCargoPCCS(id, function() {
      showLoader(false);
      GAS.rh.obterPCCS(function(dados) { _pccsDados = dados; _pccsRenderCargos(); });
    });
  });
}

function _pccsTipoTabela(tipo) {
  _pccsTipoAtivo = tipo;
  document.querySelectorAll('.pccs-tipo-btn').forEach(function(b) {
    b.className = 'pccs-tipo-btn px-3 py-1.5 text-[10px] font-black rounded-lg uppercase bg-slate-100 text-slate-600 hover:bg-slate-200';
  });
  var nb = document.getElementById('pccs-tab-' + tipo.toLowerCase());
  if (nb) nb.className = 'pccs-tipo-btn px-3 py-1.5 text-[10px] font-black rounded-lg uppercase bg-emerald-600 text-white';
  _pccsRenderTabela();
}

function _pccsRenderTabela() {
  var c = document.getElementById('pccsTabelaContainer');
  if (!c || !_pccsDados) return;
  var rows = (_pccsDados.tabelaSalarial || []).filter(function(r) { return r.tipo === _pccsTipoAtivo; });
  if (!rows.length) {
    c.innerHTML = '<div class="p-8 text-center text-slate-400 text-sm">Nenhum dado disponível.</div>';
    return;
  }
  var cor = _pccsTipoAtivo === 'ORIENTADOR' ? '#7c3aed' : '#059669';
  var html = '<table class="w-full text-left text-xs border-collapse" style="min-width:700px">'
    + '<thead><tr style="background:' + (_pccsTipoAtivo==='ORIENTADOR'?'#f5f3ff':'#ecfdf5') + '">'
    + '<th class="p-3 font-black uppercase text-[9px]" style="color:'+cor+'">Classe</th>'
    + '<th class="p-3 font-black uppercase text-[9px]" style="color:'+cor+'">Pontos</th>'
    + '<th class="p-3 font-black uppercase text-[9px]" style="color:'+cor+'">Step 1</th>'
    + '<th class="p-3 font-black uppercase text-[9px]" style="color:'+cor+'">Step 2</th>'
    + '<th class="p-3 font-black uppercase text-[9px]" style="color:'+cor+'">Step 3</th>'
    + '<th class="p-3 font-black uppercase text-[9px]" style="color:'+cor+'">Step 4</th>'
    + '<th class="p-3 font-black uppercase text-[9px]" style="color:'+cor+'">Step 5</th>'
    + '<th class="p-3 font-black uppercase text-[9px]" style="color:'+cor+'">Base Reajuste</th>'
    + (temPermissao('rh','editar') ? '<th class="p-3 font-black uppercase text-[9px] text-right" style="color:'+cor+'">Editar</th>' : '')
    + '</tr></thead><tbody class="divide-y divide-slate-100">'
    + rows.map(function(row) {
        var pontos = row.classe === 'PISO' ? '—'
          : (row.pontosMin && row.pontosMax ? row.pontosMin + ' – ' + row.pontosMax : '—');
        return '<tr class="hover:bg-slate-50">'
          + '<td class="p-3 font-black text-slate-700">' + (_pccsTipoAtivo==='ORIENTADOR' ? 'ORIENTADOR-' : '') + escaparHTML(row.classe) + '</td>'
          + '<td class="p-3 text-slate-500 text-[10px]">' + pontos + '</td>'
          + row.steps.map(function(s) {
              return '<td class="p-3 text-slate-700 font-semibold text-[10px]">' + _rhFmt(s) + '</td>';
            }).join('')
          + '<td class="p-3 text-slate-400 text-[10px]">' + (row.valorBase ? _rhFmt(row.valorBase) : '—') + '</td>'
          + (temPermissao('rh','editar') ? '<td class="p-3 text-right"><button onclick="_pccsEditarLinhTabela(\'' + row.tipo + '\',\'' + row.classe + '\')" style="font-size:10px;color:#6366f1;background:#eef2ff;border:none;border-radius:6px;padding:3px 8px;cursor:pointer"><i class="fas fa-edit"></i></button></td>' : '')
          + '</tr>';
      }).join('')
    + '</tbody></table>';
  c.innerHTML = html;
}

function _pccsEditarLinhTabela(tipo, classe) {
  var row = null;
  for (var i = 0; i < (_pccsDados.tabelaSalarial||[]).length; i++) {
    if (_pccsDados.tabelaSalarial[i].tipo === tipo && _pccsDados.tabelaSalarial[i].classe === classe) {
      row = _pccsDados.tabelaSalarial[i]; break;
    }
  }
  if (!row) return;
  var label = tipo === 'ORIENTADOR' ? 'ORIENTADOR-' + classe : 'Classe ' + classe;
  Swal.fire({
    title: 'Editar ' + label,
    width: 560,
    showCancelButton: true,
    confirmButtonText: 'Salvar',
    cancelButtonText: 'Cancelar',
    confirmButtonColor: '#059669',
    customClass: { popup: 'rounded-3xl' },
    html: '<div class="text-left space-y-3 px-2">'
      + '<div class="grid grid-cols-5 gap-2">'
      + row.steps.map(function(v, i) {
          return '<div><label class="text-[10px] font-black text-slate-400 uppercase block mb-1">Step ' + (i+1) + '</label>'
            + '<input id="pccsStep' + (i+1) + '" type="number" step="0.01" class="w-full px-2 py-2 border border-slate-200 rounded-lg text-xs outline-none" value="' + v + '"></div>';
        }).join('')
      + '</div>'
      + '<div class="grid grid-cols-3 gap-2">'
      + '<div><label class="text-[10px] font-black text-slate-400 uppercase block mb-1">Base Reajuste</label>'
      + '<input id="pccsValorBase" type="number" step="0.01" class="w-full px-2 py-2 border border-slate-200 rounded-lg text-xs outline-none" value="' + (row.valorBase||'') + '"></div>'
      + '<div><label class="text-[10px] font-black text-slate-400 uppercase block mb-1">Pontos Mín</label>'
      + '<input id="pccsPtosMin" type="number" class="w-full px-2 py-2 border border-slate-200 rounded-lg text-xs outline-none" value="' + (row.pontosMin||'') + '"></div>'
      + '<div><label class="text-[10px] font-black text-slate-400 uppercase block mb-1">Pontos Máx</label>'
      + '<input id="pccsPtosMax" type="number" class="w-full px-2 py-2 border border-slate-200 rounded-lg text-xs outline-none" value="' + (row.pontosMax||'') + '"></div></div>'
      + '</div>',
    preConfirm: function() {
      var steps = [1,2,3,4,5].map(function(n) { return parseFloat(document.getElementById('pccsStep'+n)?.value)||0; });
      return {
        tipo: row.tipo, classe: row.classe, grupo: row.grupo,
        pontosMin: parseInt(document.getElementById('pccsPtosMin')?.value)||null,
        pontosMax: parseInt(document.getElementById('pccsPtosMax')?.value)||null,
        valorBase: parseFloat(document.getElementById('pccsValorBase')?.value)||null,
        steps: steps
      };
    }
  }).then(function(r) {
    if (!r.isConfirmed) return;
    showLoader(true);
    GAS.rh.salvarTabelaRowPCCS(r.value, function() {
      showLoader(false);
      GAS.rh.obterPCCS(function(dados) { _pccsDados = dados; _pccsRenderTabela(); });
    }, function() { showLoader(false); Swal.fire('Erro','Erro ao salvar.','error'); });
  });
}

function _pccsRenderParametros() {
  if (!_pccsDados) return;
  var p = _pccsDados.parametros || {};
  var c = document.getElementById('pccsParametrosForm');
  if (!c) return;
  c.innerHTML = [
    ['crescimentoStep', 'Crescimento entre Steps (%)', (p.crescimentoStep||0)*100, 'Percentual de crescimento salarial entre steps consecutivos'],
    ['amplitudeFaixa', 'Amplitude de Faixa (%)', (p.amplitudeFaixa||0)*100, 'Variação percentual total dentro de uma classe (do step 1 ao 5)'],
    ['crescimentoMedioClasse', 'Crescimento Médio entre Classes (%)', (p.crescimentoMedioClasse||0)*100, 'Percentual médio de crescimento de uma classe para a próxima'],
    ['pisoFaixaFixa', 'Piso Faixa Fixa (R$)', p.pisoFaixaFixa||0, 'Salário mínimo para cargos da tabela de faixa fixa'],
    ['pisoOrientador', 'Piso Orientador (R$)', p.pisoOrientador||0, 'Salário mínimo para cargos da tabela orientador'],
    ['anoReferencia', 'Ano de Referência', p.anoReferencia||2025, 'Ano base desta tabela salarial']
  ].map(function(row) {
    return '<div>'
      + '<label class="text-[10px] font-black text-slate-500 uppercase block mb-1">' + row[1] + '</label>'
      + '<input id="pccsParam_' + row[0] + '" type="number" step="0.01" value="' + row[2] + '"'
      + ' class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm outline-none focus:border-indigo-400">'
      + (row[3] ? '<p class="text-[9px] text-slate-400 mt-1">' + row[3] + '</p>' : '')
      + '</div>';
  }).join('');
  if (p.atualizadoEm) {
    c.innerHTML += '<div class="col-span-2 text-[9px] text-slate-400 mt-2"><i class="fas fa-clock mr-1"></i>Atualizado em: ' + p.atualizadoEm.slice(0,10) + '</div>';
  }
}

function _pccsSalvarParametros() {
  var fields = ['crescimentoStep','amplitudeFaixa','crescimentoMedioClasse','pisoFaixaFixa','pisoOrientador','anoReferencia'];
  var params = {};
  fields.forEach(function(f) {
    var el = document.getElementById('pccsParam_' + f);
    if (!el) return;
    var v = parseFloat(el.value);
    if (isNaN(v)) return;
    // Convert % fields back to decimal
    if (['crescimentoStep','amplitudeFaixa','crescimentoMedioClasse'].indexOf(f) >= 0) v = v / 100;
    params[f] = v;
  });
  showLoader(true);
  GAS.rh.salvarParametrosPCCS(params, function() {
    showLoader(false);
    GAS.rh.obterPCCS(function(dados) { _pccsDados = dados; });
    Swal.fire({ title:'Parâmetros salvos!', icon:'success', timer:1800, showConfirmButton:false, customClass:{popup:'rounded-3xl'} });
  }, function() { showLoader(false); Swal.fire('Erro','Erro ao salvar parâmetros.','error'); });
}

function _pccsAplicarReajuste() {
  var pct = parseFloat(document.getElementById('pccsReajustePct')?.value);
  if (!pct || pct <= 0) { Swal.fire('Atenção','Informe um percentual válido maior que zero.','warning'); return; }
  Swal.fire({
    title: 'Aplicar reajuste de ' + pct + '%?',
    text: 'Esta ação atualiza todos os steps e valores base da tabela salarial. Não é reversível.',
    icon: 'warning',
    showCancelButton: true,
    confirmButtonColor: '#f59e0b',
    confirmButtonText: 'Aplicar',
    cancelButtonText: 'Cancelar',
    customClass: { popup: 'rounded-3xl' }
  }).then(function(r) {
    if (!r.isConfirmed) return;
    showLoader(true);
    GAS.rh.aplicarReajustePCCS(pct, function() {
      showLoader(false);
      GAS.rh.obterPCCS(function(dados) {
        _pccsDados = dados;
        _pccsRenderTabela();
        Swal.fire({ title: 'Reajuste de ' + pct + '% aplicado!', icon: 'success', timer: 2000, showConfirmButton: false, customClass:{popup:'rounded-3xl'} });
      });
    }, function() { showLoader(false); Swal.fire('Erro','Erro ao aplicar reajuste.','error'); });
  });
}

// ── Parâmetros Fiscais ────────────────────────────────────────────────────────
var _fiscalParamsCache = null;

function _fiscalCarregar() {
  // Carrega anos oficiais e parâmetros vigentes em paralelo
  GAS.rh.anosOficiais(function(anos) {
    var sel = document.getElementById('fiscalAnoSelect');
    if (!sel) return;
    sel.innerHTML = anos.map(function(a) {
      return '<option value="' + a.ano + '">' + a.ano + ' — ' + a.fonte + '</option>';
    }).join('');
  });
  GAS.rh.obterParamsFiscais(function(pf) {
    _fiscalParamsCache = pf;
    window._fiscalParamsCache = pf; // disponível para cálculos do simulador
    _fiscalRenderParams(pf);
    _fiscalRenderHistorico(pf.historico || []);
    var label = document.getElementById('fiscalFonteLabel');
    if (label) label.textContent = 'Vigente: ' + (pf.fonte || '—') + ' | Ano: ' + (pf.anoVigente || '—');
  });
}

function _fiscalRenderParams(pf) {
  var c = document.getElementById('fiscalParamsForm');
  if (!c) return;
  function campo(label, id, valor, pct) {
    var v = pct ? Math.round(valor * 10000) / 100 : valor;
    return '<div><label style="font-size:9px;font-weight:900;color:#94a3b8;text-transform:uppercase;display:block;margin-bottom:3px">'
      + label + (pct ? ' (%)' : ' (R$)') + '</label>'
      + '<input id="' + id + '" type="number" step="0.001" value="' + v + '" '
      + 'style="width:100%;padding:6px 10px;border:1.5px solid #e2e8f0;border-radius:10px;font-size:12px;outline:none">'
      + '</div>';
  }
  c.innerHTML = ''
    + '<div class="col-span-2 text-[9px] font-black text-slate-400 uppercase">INSS</div>'
    + campo('Teto INSS', 'fpInssT', pf.inss.teto, false)
    + campo('Alíquota FGTS', 'fpFgts', pf.fgts.aliquota, true)
    + '<div class="col-span-2 text-[9px] font-black text-slate-400 uppercase mt-2">Encargos Patronais</div>'
    + campo('Sem FGTS', 'fpEncSF', pf.encargos.patronalSemFGTS, true)
    + campo('Com FGTS', 'fpEncCF', pf.encargos.patronalComFGTS, true)
    + '<div class="col-span-2 text-[9px] font-black text-slate-400 uppercase mt-2">Multas Rescisórias</div>'
    + campo('Multa sem justa causa', 'fpMulSJ', pf.rescisao.multaSemJusta, true)
    + campo('Multa acordo (mútuo)', 'fpMulAc', pf.rescisao.multaAcordo, true)
    + '<div class="col-span-2 text-[9px] font-black text-slate-400 uppercase mt-2">Aviso Prévio</div>'
    + campo('Dias base', 'fpAvBase', pf.avisoPrevio.diasBase, false)
    + campo('Dias por ano', 'fpAvAno', pf.avisoPrevio.diasPorAno, false)
    + campo('Máximo de dias', 'fpAvMax', pf.avisoPrevio.maxDias, false);
}

function _fiscalSalvarParams() {
  var pct = function(id) { return parseFloat(document.getElementById(id)?.value) / 100; };
  var num = function(id) { return parseFloat(document.getElementById(id)?.value); };
  var campos = {
    inss:      { teto: num('fpInssT') },
    fgts:      { aliquota: pct('fpFgts') },
    encargos:  { patronalSemFGTS: pct('fpEncSF'), patronalComFGTS: pct('fpEncCF') },
    rescisao:  { multaSemJusta: pct('fpMulSJ'), multaAcordo: pct('fpMulAc') },
    avisoPrevio: { diasBase: num('fpAvBase'), diasPorAno: num('fpAvAno'), maxDias: num('fpAvMax') }
  };
  showLoader(true);
  GAS.rh.salvarParamsFiscais(campos, function(pf) {
    showLoader(false);
    _fiscalParamsCache = pf;
    window._fiscalParamsCache = pf;
    _fiscalRenderHistorico(pf.historico || []);
    Swal.fire({ title:'Parâmetros fiscais salvos!', icon:'success', timer:1800, showConfirmButton:false, customClass:{popup:'rounded-3xl'} });
  }, function() { showLoader(false); Swal.fire('Erro','Erro ao salvar.','error'); });
}

function _fiscalAplicarOficial() {
  var ano = parseInt(document.getElementById('fiscalAnoSelect')?.value);
  if (!ano) { Swal.fire('Atenção','Selecione um ano.','warning'); return; }
  Swal.fire({
    title: 'Aplicar tabela oficial ' + ano + '?',
    text: 'Os parâmetros INSS, IRRF, FGTS e encargos serão substituídos pelos valores oficiais publicados.',
    icon: 'question', showCancelButton: true,
    confirmButtonText: 'Aplicar', cancelButtonText: 'Cancelar',
    customClass: { popup: 'rounded-3xl' }
  }).then(function(r) {
    if (!r.isConfirmed) return;
    showLoader(true);
    GAS.rh.aplicarTabelaFiscalOficial(ano, function(pf) {
      showLoader(false);
      _fiscalParamsCache = pf;
      window._fiscalParamsCache = pf;
      _fiscalRenderParams(pf);
      _fiscalRenderHistorico(pf.historico || []);
      var label = document.getElementById('fiscalFonteLabel');
      if (label) label.textContent = 'Vigente: ' + (pf.fonte || '—') + ' | Ano: ' + (pf.anoVigente || '—');
      Swal.fire({ title:'Tabela ' + ano + ' aplicada!', icon:'success', timer:1800, showConfirmButton:false, customClass:{popup:'rounded-3xl'} });
    }, function() { showLoader(false); Swal.fire('Erro','Erro ao aplicar tabela.','error'); });
  });
}

function _fiscalRenderHistorico(historico) {
  var c = document.getElementById('fiscalHistoricoContainer');
  if (!c) return;
  if (!historico || historico.length === 0) { c.innerHTML = '<p style="color:#94a3b8">Nenhuma alteração registrada.</p>'; return; }
  c.innerHTML = historico.slice(0, 8).map(function(h) {
    var dt = h.dataEvento ? h.dataEvento.slice(0, 10) : '';
    return '<div style="padding:6px 0;border-bottom:1px solid #f1f5f9">'
      + '<span style="color:#64748b">' + dt + '</span>'
      + ' <strong style="color:#334155">' + (h.tipo || '') + '</strong>'
      + ' — ' + (h.descricao || '') + '</div>';
  }).join('');
}

// ── Histórico ─────────────────────────────────────────────────────────────────
var _TIPOS_EVENTO = ['admissao','promocao','mudancaSetor','alteracaoSalarial','afastamento','retorno','desligamento','outro'];

function _rhCarregarHistorico() {
  var sel = document.getElementById('rhHistColaborador');
  // Colaborador: apenas o próprio histórico, select bloqueado
  if (_rhMeuNivel === 'usuario' && _rhMeuIdColaborador) {
    if (sel) { sel.value = _rhMeuIdColaborador; sel.disabled = true; }
  }
  var id = sel ? sel.value : '';
  var c  = document.getElementById('rhHistoricoContainer');
  if (c) c.innerHTML = '<div class="p-8 text-center"><i class="fas fa-spinner animate-spin text-violet-300 text-xl"></i></div>';
  GAS.rh.obterHistorico(id, function(lista) {
    _rhHistCache = lista || [];
    _rhRenderHistorico();
  });
}

function _rhRenderHistorico() {
  var c = document.getElementById('rhHistoricoContainer');
  if (!c) return;

  // Filtro frontend (defesa em profundidade — proteção real é backend)
  var lista = _rhHistCache;
  if (_rhMeuNivel === 'usuario') {
    lista = lista.filter(function(h) {
      return ['admissao','afastamento','retorno','outro'].indexOf(h.tipo) !== -1;
    });
  } else if (_rhMeuNivel === 'gestor') {
    lista = lista.filter(function(h) { return h.tipo !== 'desligamento'; });
  }

  if (!lista.length) {
    c.innerHTML = '<div class="p-12 text-center text-slate-400 text-sm">Nenhum evento registrado.</div>';
    return;
  }
  var icones = { admissao:'fa-user-plus', promocao:'fa-arrow-up', mudancaSetor:'fa-arrows-alt-h',
    alteracaoSalarial:'fa-dollar-sign', afastamento:'fa-pause', retorno:'fa-play', desligamento:'fa-user-minus', outro:'fa-circle' };
  var cores = { admissao:'#10b981', promocao:'#6366f1', mudancaSetor:'#f59e0b',
    alteracaoSalarial:'#8b5cf6', afastamento:'#f97316', retorno:'#14b8a6', desligamento:'#ef4444', outro:'#94a3b8' };

  c.innerHTML = '<div class="space-y-3">' + lista.map(function(h) {
    var col = cores[h.tipo] || '#94a3b8';
    var ico = icones[h.tipo] || 'fa-circle';
    var nome = _rhNomeColaborador(h.idColaborador);
    return '<div style="display:flex;gap:12px;padding:12px;border:1px solid #e2e8f0;border-radius:12px;align-items:flex-start">'
      + '<div style="width:32px;height:32px;border-radius:50%;background:' + col + '20;display:flex;align-items:center;justify-content:center;flex-shrink:0">'
      + '<i class="fas ' + ico + '" style="color:' + col + ';font-size:11px"></i></div>'
      + '<div style="flex:1">'
      + '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:2px">'
      + '<span style="font-size:11px;font-weight:800;color:#1e293b">' + escaparHTML(nome) + '</span>'
      + '<span style="font-size:9px;color:#94a3b8">' + escaparHTML(h.dataEvento||'') + '</span>'
      + '</div>'
      + '<p style="font-size:11px;color:#475569">' + escaparHTML(h.descricao||'') + '</p>'
      + (h.registradoPor ? '<p style="font-size:9px;color:#94a3b8;margin-top:2px">Por: ' + escaparHTML(h.registradoPor) + '</p>' : '')
      + '</div>'
      + (temPermissao('rh','excluir') ? '<button onclick="_rhExcluirEvento(\'' + h.id + '\')" style="font-size:10px;color:#ef4444;background:none;border:none;cursor:pointer;flex-shrink:0"><i class="fas fa-times"></i></button>' : '')
      + '</div>';
  }).join('') + '</div>';
}

function _rhNomeColaborador(id) {
  var p = _rhCache.find(function(c){ return c.id===id; });
  return p ? p.nome : (id||'—');
}

function _rhAbrirModalEvento() {
  Swal.fire({
    title: 'Registrar Evento',
    width: 480,
    showCancelButton: true,
    confirmButtonText: 'Registrar',
    cancelButtonText: 'Cancelar',
    confirmButtonColor: '#7c3aed',
    customClass:{popup:'rounded-3xl'},
    html: '<div class="text-left space-y-3 px-2">'
      + '<div><label class="text-[10px] font-black text-slate-400 uppercase block mb-1">Colaborador *</label>'
      + '<select id="evColab" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm outline-none">'
      + '<option value="">Selecione...</option>'
      + _rhCache.map(function(p){ return '<option value="'+escaparHTML(p.id)+'">'+escaparHTML(p.nome)+'</option>'; }).join('')
      + '</select></div>'
      + '<div class="grid grid-cols-2 gap-3">'
      + '<div><label class="text-[10px] font-black text-slate-400 uppercase block mb-1">Tipo *</label>'
      + '<select id="evTipo" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm outline-none">'
      + _TIPOS_EVENTO.filter(function(t) {
          // Desligamento: visível apenas para RH
          return t !== 'desligamento' || _rhPodeRH();
        }).map(function(t){ return '<option value="'+t+'">'+t+'</option>'; }).join('')
      + '</select></div>'
      + '<div><label class="text-[10px] font-black text-slate-400 uppercase block mb-1">Data *</label>'
      + '<input type="date" id="evData" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm outline-none" value="'
      + new Date().toISOString().slice(0,10) + '"></div></div>'
      + '<div><label class="text-[10px] font-black text-slate-400 uppercase block mb-1">Descrição *</label>'
      + '<textarea id="evDesc" rows="2" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm outline-none resize-none" placeholder="Ex: Promoção para Analista Sênior..."></textarea></div></div>',
    preConfirm: function() {
      var colab = document.getElementById('evColab')?.value;
      var desc  = (document.getElementById('evDesc')?.value||'').trim();
      if (!colab) { Swal.showValidationMessage('Selecione o colaborador'); return false; }
      if (!desc)  { Swal.showValidationMessage('Descrição obrigatória'); return false; }
      return { idColaborador: colab,
               tipo: document.getElementById('evTipo')?.value,
               dataEvento: document.getElementById('evData')?.value,
               descricao: desc };
    }
  }).then(function(r) {
    if (!r.isConfirmed) return;
    showLoader(true);
    // Desligamento usa endpoint dedicado com cálculo automático e atualização de status
    var fn = (r.value.tipo === 'desligamento')
      ? GAS.rh.registrarDesligamento
      : GAS.rh.registrarEventoEstruturado;
    fn(r.value, function(res) {
      showLoader(false);
      if (r.value.tipo === 'desligamento' && res && res.rescisaoGerada) {
        Swal.fire({ title:'Desligamento registrado', icon:'success', timer:3000, showConfirmButton:false,
          text:'Cálculo rescisório gerado automaticamente e vinculado ao evento.',
          customClass:{popup:'rounded-3xl'} });
      }
      _rhCarregarHistorico();
      carregarRH(); // atualiza status do colaborador na lista
    }, function(e) { showLoader(false); Swal.fire('Erro', (e&&e.message)||'Erro ao registrar.','error'); });
  });
}

function _rhExcluirEvento(id) {
  Swal.fire({ title:'Excluir evento?', icon:'warning', showCancelButton:true,
    confirmButtonColor:'#ef4444', confirmButtonText:'Excluir', customClass:{popup:'rounded-3xl'}
  }).then(function(r) {
    if (!r.isConfirmed) return;
    showLoader(true);
    GAS.rh.excluirEvento(id, function() { showLoader(false); _rhCarregarHistorico(); });
  });
}

function _rhCarregarAvaliacoes() {
  var sel = document.getElementById('rhAvColaborador');
  var id  = sel ? sel.value : '';
  var c   = document.getElementById('rhAvaliacoesContainer');
  if (c) c.innerHTML = '<div class="p-8 text-center"><i class="fas fa-spinner animate-spin text-amber-300 text-xl"></i></div>';
  GAS.rh.obterAvaliacoes(id, function(lista) {
    _rhAvCache = lista || [];
    _rhRenderAvaliacoes();
  });
}

function _rhRenderAvaliacoes() {
  var c = document.getElementById('rhAvaliacoesContainer');
  if (!c) return;
  if (!_rhAvCache.length) {
    c.innerHTML = '<div class="p-12 text-center text-slate-400 text-sm">Nenhuma avaliação registrada.</div>';
    return;
  }
  c.innerHTML = '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px">'
    + _rhAvCache.map(function(a) {
        var estrelas = '';
        for (var i = 1; i <= 5; i++) estrelas += '<i class="fas fa-star" style="color:' + (i<=Math.round(a.nota||0)?'#f59e0b':'#e2e8f0') + ';font-size:11px"></i>';
        var nome = _rhNomeColaborador(a.idColaborador);
        return '<div style="border:1.5px solid #e2e8f0;border-radius:16px;padding:16px">'
          + '<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px">'
          + '<div><p style="font-weight:800;font-size:12px;color:#1e293b">' + escaparHTML(nome) + '</p>'
          + '<p style="font-size:10px;color:#94a3b8">' + escaparHTML(a.ciclo||'') + ' · ' + escaparHTML(a.criadoEm?.slice(0,10)||'') + '</p></div>'
          + '<div>' + estrelas + '</div></div>'
          + (a.observacao ? '<p style="font-size:11px;color:#475569;border-top:1px solid #f1f5f9;padding-top:8px;margin-top:4px">' + escaparHTML(a.observacao) + '</p>' : '')
          + (temPermissao('rh','excluir') ? '<button onclick="_rhExcluirAvaliacao(\'' + a.id + '\')" style="margin-top:8px;font-size:10px;color:#ef4444;background:none;border:none;cursor:pointer">Excluir</button>' : '')
          + '</div>';
      }).join('') + '</div>';
}

var _escCache            = [];
var _escTrocasCache      = [];
var _escEscalaEditandoId = null;
var _escViewMode         = 'lista';
var _escSubAbaAtual      = 'minhas';

var _ESC_CORES_SETOR = {
  'Recepção':'#14b8a6','Comunicação':'#6366f1','Cultura':'#ec4899',
  'TI':'#06b6d4','Financeiro':'#f59e0b','RH':'#8b5cf6','Administração':'#64748b'
};

function _escCorSetor(setor) {
  if (_ESC_CORES_SETOR[setor]) return _ESC_CORES_SETOR[setor];
  var cores = ['#14b8a6','#6366f1','#ec4899','#06b6d4','#f59e0b','#8b5cf6','#ef4444','#10b981'];
  var n = 0; for (var i = 0; i < (setor||'').length; i++) n += setor.charCodeAt(i);
  return cores[n % cores.length];
}

function _escStatusBadge(status) {
  var map = { rascunho:{bg:'#f1f5f9',color:'#475569',label:'Rascunho'}, publicada:{bg:'#d1fae5',color:'#065f46',label:'Publicada'},
              cancelada:{bg:'#fee2e2',color:'#991b1b',label:'Cancelada'}, arquivada:{bg:'#fef3c7',color:'#92400e',label:'Arquivada'} };
  var s = map[status] || {bg:'#f1f5f9',color:'#475569',label:status||'?'};
  return '<span style="font-size:8px;font-weight:900;padding:2px 8px;border-radius:99px;background:'+s.bg+';color:'+s.color+'">'+s.label+'</span>';
}

function _escStatusTurnoBadge(status) {

              trocado:{bg:'#eff6ff',color:'#1d4ed8',label:'Trocado'}, cancelado:{bg:'#fee2e2',color:'#991b1b',label:'Cancelado'} };

  return '<span style="font-size:8px;font-weight:900;padding:2px 8px;border-radius:99px;background:'+s.bg+';color:'+s.color+'">'+s.label+'</span>';
