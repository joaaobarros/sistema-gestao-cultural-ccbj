<!--
@file logic/mod_balcao_js.html
@type logic
@description Lógica de frontend do Balcão da Comunicação — pipeline editorial,
             demandas de comunicação, entregas, revisões e sobrecarga de equipe.
@responsibility Estado, renderização e chamadas GAS.tarefas.listarComunicacao para #aba-balcao.
@dependencies GAS.tarefas, GAS.admin, showLoader, escaparHTML, temPermissao, AppState
-->
<script>
(function() {
'use strict';

// ── Estado local ─────────────────────────────────────────────────────────────

var _bState = {
  processos:    [],
  sobrecarga:   null,
  modo:         'pipeline',   // pipeline | lista | sobrecarga
  funcaoFiltro: 'todos',
  buscaFiltro:  '',
  carregando:   false
};

// Colunas do pipeline editorial (status canônico → label + cor)
var _PIPELINE_COLS = [
  { status: 'solicitada',           label: 'Solicitada',          icon: 'fa-inbox',          cor: '#94a3b8', fundo: '#f8fafc' },
  { status: 'em_analise',           label: 'Em Análise',          icon: 'fa-search',          cor: '#6366f1', fundo: '#eef2ff' },
  { status: 'em_execucao',          label: 'Em Produção',         icon: 'fa-tools',           cor: '#0ea5e9', fundo: '#f0f9ff' },
  { status: 'aguardando_aprovacao', label: 'Aguard. Aprovação',   icon: 'fa-hourglass-half',  cor: '#8b5cf6', fundo: '#f5f3ff' },
  { status: 'concluida',            label: 'Concluída',           icon: 'fa-check-circle',    cor: '#10b981', fundo: '#f0fdf4' }
];

var _COR_PRIORIDADE = { critica:'#ef4444', alta:'#f59e0b', media:'#6366f1', baixa:'#94a3b8' };
var _LABEL_STATUS  = {
  solicitada:'Solicitada', em_analise:'Em Análise', aguardando_doc:'Aguard. Documento',
  em_execucao:'Em Produção', aguardando_aprovacao:'Aguard. Aprovação',
  concluida:'Concluída', cancelada:'Cancelada', bloqueada:'Bloqueada', backlog:'Backlog'
};
var _LABEL_FUNCAO  = { design:'Design', fotografia:'Foto/Ensaio', audiovisual:'Audiovisual',
                       redacao:'Redação/Texto', comunicacao:'Comunicação/Social' };
var _ICON_FUNCAO   = { design:'fa-palette', fotografia:'fa-camera', audiovisual:'fa-video',
                       redacao:'fa-pen', comunicacao:'fa-share-alt' };

// ── Helpers ───────────────────────────────────────────────────────────────────

function _esc(s)  { return escaparHTML ? escaparHTML(String(s || '')) : String(s || '').replace(/[<>&"]/g, '?'); }
function _ago(iso) {
  if (!iso) return '';
  var d = new Date(iso);
  if (isNaN(d)) return iso;
  var diff = Date.now() - d.getTime();
  var m = Math.floor(diff / 60000);
  if (m < 1) return 'agora';
  if (m < 60) return m + 'min atrás';
  var h = Math.floor(m / 60);
  if (h < 24) return h + 'h atrás';
  return Math.floor(h / 24) + 'd atrás';
}
function _prazoLabel(iso) {
  if (!iso) return '';
  var d = new Date(iso);
  var hoje = new Date(); hoje.setHours(0,0,0,0);
  var diff = Math.floor((d - hoje) / 86400000);
  if (diff < 0)  return '<span class="text-red-500 font-bold">Vencido há ' + Math.abs(diff) + 'd</span>';
  if (diff === 0) return '<span class="text-orange-500 font-bold">Hoje</span>';
  if (diff === 1) return '<span class="text-yellow-600 font-bold">Amanhã</span>';
  return '<span class="text-slate-500">' + diff + 'd restantes</span>';
}
function _iniciais(email) {
  if (!email) return '?';
  var nome = email.split('@')[0].replace(/[._]/g, ' ');
  var partes = nome.trim().split(' ');
  return (partes[0][0] + (partes[1] ? partes[1][0] : '')).toUpperCase();
}
function _corAvatar(email) {
  var cores = ['#6366f1','#0ea5e9','#10b981','#f59e0b','#ef4444','#8b5cf6','#ec4899','#14b8a6'];
  var sum = 0; for (var i = 0; i < email.length; i++) sum += email.charCodeAt(i);
  return cores[sum % cores.length];
}
function _avatar(email, titulo) {
  if (!email) return '';
  var cor = _corAvatar(email);
  return '<div class="avatar-chip" style="background:' + cor + '" title="' + _esc(titulo || email) + '">' + _iniciais(email) + '</div>';
}

// ── Filtro aplicado ────────────────────────────────────────────────────────────

function _processosVisiveis() {
  var busca  = (_bState.buscaFiltro || '').toLowerCase().trim();
  var funcao = _bState.funcaoFiltro;

  return _bState.processos.filter(function(p) {
    if (p.tipo !== 'processo_comunicacao') return false;
    if (busca && !(p.titulo || '').toLowerCase().includes(busca) &&
                 !((p.metadados && p.metadados.solicitante) || '').toLowerCase().includes(busca)) return false;
    if (funcao !== 'todos' && p.funcao !== funcao) return false;
    return true;
  });
}

// ── Renderização — Pipeline ────────────────────────────────────────────────────

function _renderPipeline(processos) {
  var agora = Date.now();
  var html = '<div class="balcao-pipeline">';

  _PIPELINE_COLS.forEach(function(col) {
    var items = processos.filter(function(p) { return p.status === col.status; });
    var badgeCor = items.length ? col.cor : '#94a3b8';

    html += '<div class="pipeline-col" style="border-top:3px solid ' + col.cor + '">';
    html += '<div class="pipeline-col-header" style="color:' + col.cor + '">';
    html += '<span><i class="fas ' + col.icon + ' mr-1"></i>' + col.label + '</span>';
    html += '<span class="pipeline-badge" style="background:' + badgeCor + ';color:#fff">' + items.length + '</span>';
    html += '</div>';

    if (!items.length) {
      html += '<div class="text-center text-slate-300 text-xs py-8"><i class="fas fa-inbox text-lg mb-2 block"></i>Vazia</div>';
    } else {
      items.forEach(function(p) {
        html += _renderCard(p, agora);
      });
    }

    html += '</div>';
  });

  html += '</div>';
  return html;
}

function _renderCard(p, agora) {
  var meta     = p.metadados || {};
  var atrasado = p.prazo && new Date(p.prazo).getTime() < agora && p.status !== 'concluida';
  var revisao  = (p.revisoesPendentes || 0) > 0;
  var slaViol  = p.slaViolado;

  var classes = 'processo-card';
  if (slaViol)  classes += ' sla-violado';
  else if (atrasado) classes += ' atrasado';
  if (revisao)  classes += ' revisao-pendente';

  var corPri = _COR_PRIORIDADE[p.prioridade] || '#94a3b8';

  var html = '<div class="' + classes + '" onclick="_balcao.abrirDetalhe(\'' + p.id + '\')">';

  // Cabeçalho do card
  html += '<div class="flex justify-between items-start gap-2 mb-2">';
  html += '<div class="flex-1 min-w-0">';
  html += '<div class="flex items-center gap-1.5 mb-0.5">';
  html += '<span class="w-2 h-2 rounded-full flex-shrink-0" style="background:' + corPri + '"></span>';
  if (meta.tipoProcesso && meta.tipoProcesso !== 'geral') {
    html += '<span class="text-[9px] uppercase font-bold text-slate-400">' + _esc(meta.tipoProcesso) + '</span>';
  }
  html += '</div>';
  html += '<div class="text-xs font-bold text-slate-800 leading-tight line-clamp-2">' + _esc(p.titulo) + '</div>';
  html += '</div>';

  // Badges de alerta
  html += '<div class="flex flex-col gap-0.5 flex-shrink-0">';
  if (slaViol)  html += '<span class="text-[8px] bg-red-100 text-red-600 px-1.5 py-0.5 rounded font-bold">SLA!</span>';
  if (revisao)  html += '<span class="text-[8px] bg-purple-100 text-purple-600 px-1.5 py-0.5 rounded font-bold">REV</span>';
  if (atrasado && !slaViol) html += '<span class="text-[8px] bg-yellow-100 text-yellow-700 px-1.5 py-0.5 rounded font-bold">ATR</span>';
  html += '</div></div>';

  // Solicitante + Prazo
  if (meta.solicitante) {
    html += '<div class="text-[9px] text-slate-400 mb-1.5">';
    html += '<i class="fas fa-user-circle mr-1"></i>Solicitado por: ' + _esc(meta.solicitante.split('@')[0]);
    html += '</div>';
  }

  // Subtarefas (entregas)
  var numEntregas = (p.subtarefas || []).length;
  if (numEntregas) {
    html += '<div class="text-[9px] text-slate-400 mb-2"><i class="fas fa-tasks mr-1"></i>' + numEntregas + ' entrega(s)</div>';
  }

  // Rodapé do card
  html += '<div class="flex justify-between items-center mt-2 pt-2 border-t border-slate-100">';
  html += '<div class="text-[9px]">' + (p.prazo ? _prazoLabel(p.prazo) : '<span class="text-slate-300">Sem prazo</span>') + '</div>';
  if (p.responsavel) {
    html += '<div class="flex items-center">' + _avatar(p.responsavel) + '</div>';
  }
  html += '</div>';

  html += '</div>';
  return html;
}

// ── Renderização — Lista ──────────────────────────────────────────────────────

function _renderLista(processos) {
  if (!processos.length) {
    return '<div class="text-center text-slate-400 text-sm py-16"><i class="fas fa-inbox text-3xl mb-3 block"></i>Nenhuma demanda encontrada.</div>';
  }
  var agora = Date.now();
  var html = '<div class="bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden">';
  html += '<table class="w-full text-xs">';
  html += '<thead class="bg-slate-50 border-b border-slate-100">';
  html += '<tr class="text-left">';
  html += '<th class="px-4 py-3 font-bold text-slate-500 uppercase text-[9px] tracking-wide">Título</th>';
  html += '<th class="px-4 py-3 font-bold text-slate-500 uppercase text-[9px] tracking-wide hidden sm:table-cell">Status</th>';
  html += '<th class="px-4 py-3 font-bold text-slate-500 uppercase text-[9px] tracking-wide hidden md:table-cell">Responsável</th>';
  html += '<th class="px-4 py-3 font-bold text-slate-500 uppercase text-[9px] tracking-wide hidden sm:table-cell">Prazo</th>';
  html += '<th class="px-4 py-3 font-bold text-slate-500 uppercase text-[9px] tracking-wide"></th>';
  html += '</tr></thead><tbody>';

  processos.forEach(function(p) {
    var meta    = p.metadados || {};
    var atrasado = p.prazo && new Date(p.prazo).getTime() < agora;
    var corPri  = _COR_PRIORIDADE[p.prioridade] || '#94a3b8';
    var col = _PIPELINE_COLS.find(function(c) { return c.status === p.status; }) || { cor:'#94a3b8', label: _LABEL_STATUS[p.status] || p.status };

    html += '<tr class="border-b border-slate-50 hover:bg-slate-50/50 cursor-pointer" onclick="_balcao.abrirDetalhe(\'' + p.id + '\')">';
    html += '<td class="px-4 py-3">';
    html += '<div class="flex items-center gap-2">';
    html += '<span class="w-2 h-2 rounded-full flex-shrink-0" style="background:' + corPri + '"></span>';
    html += '<div>';
    html += '<div class="font-semibold text-slate-800">' + _esc(p.titulo) + '</div>';
    if (meta.solicitante) html += '<div class="text-[9px] text-slate-400">' + _esc(meta.solicitante) + '</div>';
    html += '</div></div></td>';
    html += '<td class="px-4 py-3 hidden sm:table-cell"><span class="px-2 py-0.5 rounded-full text-[9px] font-bold text-white" style="background:' + col.cor + '">' + col.label + '</span></td>';
    html += '<td class="px-4 py-3 hidden md:table-cell">' + (p.responsavel ? _avatar(p.responsavel) + ' <span class="ml-2 text-slate-600">' + _esc(p.responsavel.split('@')[0]) + '</span>' : '<span class="text-slate-300">—</span>') + '</td>';
    html += '<td class="px-4 py-3 hidden sm:table-cell">' + (p.prazo ? _prazoLabel(p.prazo) : '<span class="text-slate-300">—</span>') + '</td>';
    html += '<td class="px-4 py-3"><button class="text-[9px] text-indigo-500 hover:text-indigo-700 font-bold">Ver</button></td>';
    html += '</tr>';
  });

  html += '</tbody></table></div>';
  return html;
}

// ── Renderização — Sobrecarga ─────────────────────────────────────────────────

function _renderSobrecarga() {
  if (!_bState.sobrecarga) {
    return '<div class="text-center text-slate-400 text-sm py-16"><i class="fas fa-spinner fa-spin text-3xl mb-3 block"></i>Calculando...</div>';
  }
  var s = _bState.sobrecarga;
  var MAX = Math.max.apply(null, (s.porResponsavel || []).map(function(r) { return r.total; }).concat([1]));

  var html = '<div class="grid grid-cols-1 lg:grid-cols-2 gap-4">';

  // Card de fila de aprovação
  if (s.filaAprovacao && s.filaAprovacao.length) {
    html += '<div class="bg-white rounded-3xl shadow-sm border border-purple-200 p-5">';
    html += '<h4 class="font-black text-slate-800 text-xs uppercase tracking-wide mb-3"><i class="fas fa-hourglass-half text-purple-400 mr-2"></i>Fila de Aprovação (' + s.filaAprovacao.length + ')</h4>';
    s.filaAprovacao.slice(0, 8).forEach(function(t) {
      html += '<div class="flex justify-between items-center py-2 border-b border-slate-50 last:border-0">';
      html += '<div class="text-xs text-slate-700 font-medium truncate flex-1">' + _esc(t.titulo) + '</div>';
      html += '<div class="text-[9px] text-slate-400 ml-2 flex-shrink-0">' + (t.responsavel ? _esc(t.responsavel.split('@')[0]) : '—') + '</div>';
      html += '</div>';
    });
    html += '</div>';
  }

  // Card de sobrecarregados
  html += '<div class="bg-white rounded-3xl shadow-sm border border-slate-200 p-5">';
  html += '<h4 class="font-black text-slate-800 text-xs uppercase tracking-wide mb-3"><i class="fas fa-fire text-red-400 mr-2"></i>Carga por Responsável</h4>';

  if (!s.porResponsavel || !s.porResponsavel.length) {
    html += '<div class="text-slate-400 text-xs text-center py-4">Nenhum dado disponível.</div>';
  } else {
    s.porResponsavel.slice(0, 12).forEach(function(r) {
      if (r.email === '__sem_responsavel__') return;
      var pct    = Math.min(100, Math.round((r.total / MAX) * 100));
      var classe = r.total >= 7 ? 'critico' : r.total >= 4 ? 'alto' : '';
      html += '<div class="mb-3">';
      html += '<div class="flex justify-between items-center mb-1">';
      html += '<div class="flex items-center gap-2">';
      html += _avatar(r.email);
      html += '<span class="text-xs font-semibold text-slate-700">' + _esc(r.email.split('@')[0]) + '</span>';
      if (r.atrasadas > 0) html += '<span class="text-[8px] bg-red-100 text-red-600 px-1.5 py-0.5 rounded font-bold">' + r.atrasadas + ' atr</span>';
      html += '</div>';
      html += '<span class="text-xs font-bold text-slate-600">' + r.total + '</span>';
      html += '</div>';
      html += '<div class="bg-slate-100 rounded-full h-1.5 overflow-hidden">';
      html += '<div class="sobrecarga-bar ' + classe + '" style="width:' + pct + '%"></div>';
      html += '</div>';
      html += '</div>';
    });
  }
  html += '</div>';

  // Card por função
  html += '<div class="bg-white rounded-3xl shadow-sm border border-slate-200 p-5">';
  html += '<h4 class="font-black text-slate-800 text-xs uppercase tracking-wide mb-3"><i class="fas fa-sitemap text-blue-400 mr-2"></i>Carga por Função</h4>';
  if (!s.porFuncao || !s.porFuncao.length) {
    html += '<div class="text-slate-400 text-xs text-center py-4">Nenhum dado disponível.</div>';
  } else {
    var maxFunc = Math.max.apply(null, s.porFuncao.map(function(f) { return f.total; }).concat([1]));
    s.porFuncao.slice(0, 8).forEach(function(f) {
      var label = _LABEL_FUNCAO[f.funcao] || f.funcao;
      var icon  = _ICON_FUNCAO[f.funcao] || 'fa-tasks';
      var pct   = Math.min(100, Math.round((f.total / maxFunc) * 100));
      html += '<div class="mb-3">';
      html += '<div class="flex justify-between items-center mb-1">';
      html += '<span class="text-xs font-semibold text-slate-700"><i class="fas ' + icon + ' mr-1.5 text-indigo-400"></i>' + _esc(label) + '</span>';
      html += '<span class="text-xs font-bold text-slate-600">' + f.total + (f.atrasadas ? ' <span class="text-red-500 text-[9px]">(+' + f.atrasadas + ' atr)</span>' : '') + '</span>';
      html += '</div>';
      html += '<div class="bg-slate-100 rounded-full h-1.5 overflow-hidden">';
      html += '<div class="sobrecarga-bar" style="width:' + pct + '%"></div>';
      html += '</div></div>';
    });
  }
  html += '</div>';

  // Tempo médio por status
  if (s.tempoMedioPorStatusH && Object.keys(s.tempoMedioPorStatusH).length) {
    html += '<div class="bg-white rounded-3xl shadow-sm border border-slate-200 p-5">';
    html += '<h4 class="font-black text-slate-800 text-xs uppercase tracking-wide mb-3"><i class="fas fa-clock text-amber-400 mr-2"></i>Tempo Médio por Status (horas)</h4>';
    Object.keys(s.tempoMedioPorStatusH).forEach(function(st) {
      var h = s.tempoMedioPorStatusH[st];
      var label = _LABEL_STATUS[st] || st;
      html += '<div class="flex justify-between items-center py-1.5 border-b border-slate-50 last:border-0">';
      html += '<span class="text-xs text-slate-600">' + _esc(label) + '</span>';
      html += '<span class="text-xs font-bold text-slate-800">' + h + 'h</span>';
      html += '</div>';
    });
    html += '</div>';
  }

  html += '</div>';
  return html;
}

// ── Detalhe do processo ────────────────────────────────────────────────────────

function _renderDetalhe(p) {
  var meta = p.metadados || {};
  var agora = Date.now();
  var col = _PIPELINE_COLS.find(function(c) { return c.status === p.status; }) || { cor:'#94a3b8', label: _LABEL_STATUS[p.status] || p.status };
  var corPri = _COR_PRIORIDADE[p.prioridade] || '#94a3b8';

  var html = '';

  // Header do modal
  html += '<div class="flex justify-between items-start mb-5">';
  html += '<div class="flex-1 min-w-0">';
  html += '<div class="flex items-center gap-2 mb-1 flex-wrap">';
  html += '<span class="px-2 py-0.5 rounded-full text-[10px] font-black text-white" style="background:' + col.cor + '">' + col.label + '</span>';
  html += '<span class="px-2 py-0.5 rounded-full text-[10px] font-black text-white" style="background:' + corPri + '">' + (p.prioridade || 'media').toUpperCase() + '</span>';
  if (p.slaViolado) html += '<span class="px-2 py-0.5 rounded-full text-[10px] font-black bg-red-100 text-red-600">SLA VIOLADO</span>';
  html += '</div>';
  html += '<h3 class="font-black text-slate-800 text-base leading-tight">' + _esc(p.titulo) + '</h3>';
  if (p.descricao) html += '<p class="text-xs text-slate-500 mt-1">' + _esc(p.descricao) + '</p>';
  html += '</div>';
  html += '<button onclick="_balcaoFecharModal()" class="text-slate-400 hover:text-slate-700 text-xl ml-3 flex-shrink-0">&times;</button>';
  html += '</div>';

  // Timeline de etapas
  html += '<div class="mb-5 bg-slate-50 rounded-2xl p-4">';
  html += '<div class="text-[9px] font-bold text-slate-500 uppercase tracking-wide mb-3">Pipeline de Produção</div>';
  html += '<div class="etapa-timeline">';
  var statusIdx = _PIPELINE_COLS.findIndex(function(c) { return c.status === p.status; });
  _PIPELINE_COLS.forEach(function(c, i) {
    var cls = i < statusIdx ? 'concluido' : i === statusIdx ? 'ativo' : '';
    var icon = i < statusIdx ? 'fa-check' : c.icon;
    html += '<div class="etapa-step ' + cls + '">';
    html += '<div class="etapa-dot"><i class="fas ' + icon + ' text-[9px]"></i></div>';
    html += '<div class="etapa-label">' + c.label + '</div>';
    html += '</div>';
  });
  html += '</div></div>';

  // Envolvidos
  html += '<div class="grid grid-cols-2 sm:grid-cols-3 gap-3 mb-5">';
  var envolvidos = [
    { label: 'Solicitante',  email: meta.solicitante || '' },
    { label: 'Responsável',  email: p.responsavel     || '' },
    { label: 'Criado por',   email: p.criadoPor       || '' }
  ].filter(function(e) { return e.email; });

  envolvidos.forEach(function(e) {
    html += '<div class="bg-slate-50 rounded-xl p-3 flex items-center gap-2">';
    html += _avatar(e.email);
    html += '<div><div class="text-[9px] text-slate-400 uppercase font-semibold">' + e.label + '</div>';
    html += '<div class="text-xs font-bold text-slate-700">' + _esc(e.email.split('@')[0]) + '</div></div>';
    html += '</div>';
  });
  html += '</div>';

  // Métricas
  html += '<div class="grid grid-cols-3 gap-3 mb-5">';
  html += '<div class="bg-slate-50 rounded-xl p-3 text-center"><div class="text-xs font-black text-slate-800">' + (p.prazo ? _prazoLabel(p.prazo) : '—') + '</div><div class="text-[9px] text-slate-400 mt-0.5">Prazo</div></div>';
  html += '<div class="bg-slate-50 rounded-xl p-3 text-center"><div class="text-xs font-black text-slate-800">' + (p.subtarefas || []).length + '</div><div class="text-[9px] text-slate-400 mt-0.5">Entregas</div></div>';
  html += '<div class="bg-slate-50 rounded-xl p-3 text-center"><div class="text-xs font-black text-slate-800">' + (p.revisoesPendentes || 0) + '</div><div class="text-[9px] text-slate-400 mt-0.5">Revisões</div></div>';
  html += '</div>';

  // Entregas (subtarefas)
  if ((p.subtarefas || []).length) {
    html += '<div class="mb-5">';
    html += '<div class="text-[9px] font-bold text-slate-500 uppercase tracking-wide mb-2">Entregas</div>';
    html += '<div id="balcao-detalhe-entregas-' + p.id + '" class="space-y-1.5">';
    html += '<div class="text-xs text-slate-400"><i class="fas fa-spinner fa-spin mr-1"></i>Carregando entregas...</div>';
    html += '</div></div>';
    // Carrega entregas async
    setTimeout(function() { _balcao.carregarEntregas(p.id); }, 100);
  }

  // Revisões pendentes
  var revisoesPendentes = (p.comentarios || []).filter(function(c) {
    return c.tipo === 'revisao' && c.revisao && c.revisao.status === 'solicitada';
  });
  if (revisoesPendentes.length) {
    html += '<div class="mb-5">';
    html += '<div class="text-[9px] font-bold text-purple-600 uppercase tracking-wide mb-2"><i class="fas fa-sync-alt mr-1"></i>Revisões Pendentes</div>';
    revisoesPendentes.forEach(function(r) {
      html += '<div class="bg-purple-50 border border-purple-200 rounded-xl p-3 mb-2">';
      html += '<div class="text-xs font-bold text-purple-700 mb-1">' + _esc(r.autor.split('@')[0]) + ' solicitou uma revisão</div>';
      html += '<div class="text-xs text-slate-700 mb-2">' + _esc(r.texto) + '</div>';
      html += '<div class="flex gap-2">';
      html += '<button onclick="_balcao.responderRevisao(\'' + p.id + '\',\'' + r.id + '\',true)" class="text-[10px] bg-green-500 hover:bg-green-600 text-white px-3 py-1 rounded-lg font-bold">Aceitar</button>';
      html += '<button onclick="_balcao.responderRevisao(\'' + p.id + '\',\'' + r.id + '\',false)" class="text-[10px] bg-red-500 hover:bg-red-600 text-white px-3 py-1 rounded-lg font-bold">Rejeitar</button>';
      html += '</div></div>';
    });
    html += '</div>';
  }

  // Histórico
  if ((p.historico || []).length) {
    html += '<div class="mb-5">';
    html += '<div class="text-[9px] font-bold text-slate-500 uppercase tracking-wide mb-2">Histórico</div>';
    html += '<div class="space-y-1.5 max-h-40 overflow-y-auto">';
    var hist = (p.historico || []).slice().reverse();
    hist.forEach(function(h) {
      html += '<div class="flex items-start gap-2 py-1.5 border-b border-slate-50 last:border-0">';
      html += _avatar(h.ator);
      html += '<div class="flex-1">';
      html += '<span class="text-xs text-slate-700">' + _esc(h.comentario || (h.campo + ': ' + h.de + ' → ' + h.para)) + '</span>';
      html += '<span class="text-[9px] text-slate-400 ml-2">' + _ago(h.data) + '</span>';
      html += '</div></div>';
    });
    html += '</div></div>';
  }

  // Comentários
  html += '<div class="mb-4">';
  html += '<div class="text-[9px] font-bold text-slate-500 uppercase tracking-wide mb-2">Comentários</div>';
  var coments = (p.comentarios || []).filter(function(c) { return c.tipo !== 'revisao'; });
  if (coments.length) {
    html += '<div class="space-y-1.5 mb-3 max-h-32 overflow-y-auto">';
    coments.forEach(function(c) {
      html += '<div class="flex items-start gap-2 bg-slate-50 rounded-xl p-2">';
      html += _avatar(c.autor);
      html += '<div class="flex-1"><div class="text-xs text-slate-700">' + _esc(c.texto) + '</div>';
      html += '<div class="text-[9px] text-slate-400">' + _ago(c.data) + '</div></div>';
      html += '</div>';
    });
    html += '</div>';
  }
  html += '<div class="flex gap-2">';
  html += '<input id="balcao-novo-comentario-' + p.id + '" type="text" placeholder="Adicionar comentário..." class="flex-1 px-3 py-2 text-xs border border-slate-200 rounded-xl focus:outline-none focus:border-indigo-400">';
  html += '<button onclick="_balcao.comentar(\'' + p.id + '\')" class="text-[10px] bg-indigo-500 hover:bg-indigo-600 text-white px-3 py-2 rounded-xl font-bold">Enviar</button>';
  html += '</div></div>';

  // Ações
  html += '<div class="flex flex-wrap gap-2 pt-4 border-t border-slate-100">';
  // Botões de mudança de status FSM
  var proximosStatus = {
    solicitada:           ['em_analise', 'cancelada'],
    em_analise:           ['em_execucao', 'cancelada'],
    em_execucao:          ['aguardando_aprovacao', 'concluida', 'cancelada'],
    aguardando_aprovacao: ['concluida', 'em_execucao'],
    bloqueada:            ['em_analise']
  };
  var proximos = proximosStatus[p.status] || [];
  var labelsAcao = { em_analise:'Iniciar Análise', em_execucao:'Iniciar Produção',
                     aguardando_aprovacao:'Enviar para Aprovação', concluida:'Concluir', cancelada:'Cancelar' };
  var coresAcao  = { concluida:'bg-green-500 hover:bg-green-600', cancelada:'bg-red-500 hover:bg-red-600' };
  proximos.forEach(function(st) {
    var cor = coresAcao[st] || 'bg-indigo-500 hover:bg-indigo-600';
    html += '<button onclick="_balcao.mudarStatus(\'' + p.id + '\',\'' + st + '\')" class="text-[10px] ' + cor + ' text-white px-3 py-2 rounded-xl font-bold">' + (labelsAcao[st] || st) + '</button>';
  });
  html += '<button onclick="_balcao.solicitarRevisao(\'' + p.id + '\')" class="text-[10px] bg-purple-500 hover:bg-purple-600 text-white px-3 py-2 rounded-xl font-bold"><i class="fas fa-sync-alt mr-1"></i>Solicitar Revisão</button>';
  html += '</div>';

  return html;
}

// ── API pública do Balcão ──────────────────────────────────────────────────────

window._balcao = {

  carregar: function() {
    if (_bState.carregando) return;
    _bState.carregando = true;
    GAS.tarefas.listarComunicacao(false, function(lista) {
      _bState.processos = lista || [];
      _bState.carregando = false;
      _balcao.renderizar();
      _balcao.atualizarMetricas();
    }, function(e) {
      _bState.carregando = false;
      console.error('[Balcão] Erro ao carregar:', e);
    });
  },

  carregarSobrecarga: function() {
    GAS.tarefas.sobrecarga(function(data) {
      _bState.sobrecarga = data;
      _balcao.renderizar();
    }, function(e) {
      console.warn('[Balcão] Sem permissão para sobrecarga ou erro:', e);
    });
  },

  atualizar: function() {
    _bState.carregando = false;
    _bState.sobrecarga = null;
    _balcao.carregar();
    if (_bState.modo === 'sobrecarga') _balcao.carregarSobrecarga();
  },

  renderizar: function() {
    var el = document.getElementById('balcao-conteudo');
    if (!el) return;
    _bState.buscaFiltro = (document.getElementById('balcaoBusca') || {}).value || '';
    var processos = _processosVisiveis();

    if (_bState.modo === 'pipeline') {
      el.innerHTML = _renderPipeline(processos);
    } else if (_bState.modo === 'lista') {
      el.innerHTML = _renderLista(processos);
    } else {
      el.innerHTML = _renderSobrecarga();
    }
  },

  atualizarMetricas: function() {
    var agora = Date.now();
    var processos = _bState.processos.filter(function(p) { return p.tipo === 'processo_comunicacao'; });
    var total      = processos.length;
    var andamento  = processos.filter(function(p) { return p.status === 'em_execucao'; }).length;
    var revisao    = processos.filter(function(p) { return (p.revisoesPendentes || 0) > 0; }).length;
    var atrasadas  = processos.filter(function(p) {
      return p.prazo && new Date(p.prazo).getTime() < agora && p.status !== 'concluida';
    }).length;
    var concluidas = processos.filter(function(p) { return p.status === 'concluida'; }).length;

    var set = function(id, v) { var el = document.getElementById(id); if (el) el.textContent = v; };
    set('bm-total', total); set('bm-andamento', andamento); set('bm-revisao', revisao);
    set('bm-atrasadas', atrasadas); set('bm-concluidas', concluidas);
  },

  setModo: function(btn) {
    document.querySelectorAll('.balcao-modo-btn').forEach(function(b) { b.classList.remove('ativo'); });
    btn.classList.add('ativo');
    _bState.modo = btn.dataset.modo;
    if (_bState.modo === 'sobrecarga' && !_bState.sobrecarga) _balcao.carregarSobrecarga();
    _balcao.renderizar();
  },

  filtrarFuncao: function(btn) {
    document.querySelectorAll('.balcao-func-btn').forEach(function(b) { b.classList.remove('ativo'); });
    btn.classList.add('ativo');
    _bState.funcaoFiltro = btn.dataset.func;
    _balcao.renderizar();
  },

  nova: function() {
    document.getElementById('balcao-form-overlay').classList.remove('hidden');
    document.body.style.overflow = 'hidden';
    setTimeout(function() { var t = document.getElementById('bForm-titulo'); if (t) t.focus(); }, 60);
  },

  salvarNova: function() {
    var titulo = (document.getElementById('bForm-titulo') || {}).value || '';
    if (!titulo.trim()) { alert('Informe o título da demanda.'); return; }

    var entregas = [];
    document.querySelectorAll('.bform-entrega:checked').forEach(function(cb) { entregas.push(cb.value); });

    // Captura id de reserva pendente (caso venha da integração Reservas→Comunicação)
    var idReservaPendente = window.__rcPendingReservaId || '';
    if (idReservaPendente) { window.__rcPendingReservaId = ''; }

    var dados = {
      titulo:       titulo.trim(),
      prioridade:   (document.getElementById('bForm-prioridade') || {}).value || 'media',
      prazo:        (document.getElementById('bForm-prazo')      || {}).value || '',
      responsavel:  (document.getElementById('bForm-responsavel') || {}).value || '',
      descricao:    (document.getElementById('bForm-descricao')  || {}).value || '',
      observacoes:  (document.getElementById('bForm-obs')        || {}).value || '',
      entregas:     entregas,
      origem:       idReservaPendente ? 'reserva' : 'manual',
      idReserva:    idReservaPendente
    };

    var btn = document.querySelector('#balcao-form-overlay .bg-orange-500');
    if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-1"></i>Criando...'; }

    GAS.tarefas.criarProcessoComunicacao(dados, function(res) {
      _balcaoFecharForm();
      _balcao.atualizar();
    }, function(e) {
      if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fas fa-save mr-1"></i>Criar Demanda'; }
      alert('Erro ao criar demanda: ' + (e || 'Tente novamente.'));
    });
  },

  abrirDetalhe: function(id) {
    var p = _bState.processos.find(function(t) { return t.id === id; });
    if (!p) return;
    var overlay = document.getElementById('balcao-modal-overlay');
    var body    = document.getElementById('balcao-modal-body');
    if (!overlay || !body) return;
    body.innerHTML = _renderDetalhe(p);
    overlay.classList.remove('hidden');
    document.body.style.overflow = 'hidden';
  },

  carregarEntregas: function(idProcesso) {
    var el = document.getElementById('balcao-detalhe-entregas-' + idProcesso);
    if (!el) return;
    GAS.tarefas.listarComFiltros({ tarefaPai: idProcesso, tipo: 'entrega_comunicacao' }, function(entregas) {
      if (!entregas || !entregas.length) {
        el.innerHTML = '<div class="text-xs text-slate-400">Nenhuma entrega cadastrada.</div>';
        return;
      }
      var html = '';
      entregas.forEach(function(e) {
        var col = _PIPELINE_COLS.find(function(c) { return c.status === e.status; }) || { cor:'#94a3b8', label: _LABEL_STATUS[e.status] || e.status };
        var meta = e.metadados || {};
        var funcao = e.funcao || '';
        var icon  = _ICON_FUNCAO[funcao] || 'fa-tasks';
        html += '<div class="flex items-center justify-between bg-slate-50 rounded-xl px-3 py-2">';
        html += '<div class="flex items-center gap-2">';
        html += '<i class="fas ' + icon + ' text-[11px] text-indigo-400"></i>';
        html += '<span class="text-xs font-semibold text-slate-700">' + _esc(meta.tipoEntrega || e.etapa || '—') + '</span>';
        html += '</div>';
        html += '<div class="flex items-center gap-2">';
        if (e.responsavel) html += _avatar(e.responsavel);
        html += '<span class="px-2 py-0.5 rounded-full text-[9px] font-bold text-white" style="background:' + col.cor + '">' + col.label + '</span>';
        html += '</div></div>';
      });
      el.innerHTML = html;
    }, function() {
      el.innerHTML = '<div class="text-xs text-red-400">Erro ao carregar entregas.</div>';
    });
  },

  mudarStatus: function(id, novoStatus) {
    var motivo = '';
    if (novoStatus === 'cancelada') {
      motivo = prompt('Motivo do cancelamento:') || '';
      if (motivo === null) return;
    }
    GAS.tarefas.mudarStatus(id, novoStatus, motivo, function() {
      var p = _bState.processos.find(function(t) { return t.id === id; });
      if (p) p.status = novoStatus;
      _balcaoFecharModal();
      _balcao.renderizar();
      _balcao.atualizarMetricas();
    }, function(e) { alert('Erro: ' + (e || 'Tente novamente.')); });
  },

  comentar: function(id) {
    var input = document.getElementById('balcao-novo-comentario-' + id);
    if (!input || !input.value.trim()) return;
    var texto = input.value.trim();
    input.value = '';
    GAS.tarefas.comentar(id, texto, function() {
      _balcao.atualizar();
      setTimeout(function() { _balcao.abrirDetalhe(id); }, 600);
    }, function(e) { alert('Erro ao comentar: ' + (e || '')); });
  },

  solicitarRevisao: function(id) {
    var texto = prompt('Descreva a revisão solicitada:');
    if (!texto || !texto.trim()) return;
    GAS.tarefas.registrarRevisao(id, texto.trim(), function() {
      _balcao.atualizar();
      setTimeout(function() { _balcao.abrirDetalhe(id); }, 600);
    }, function(e) { alert('Erro: ' + (e || '')); });
  },

  responderRevisao: function(id, revisaoId, aceita) {
    var resp = prompt(aceita ? 'Mensagem de aceite (opcional):' : 'Motivo da rejeição:');
    if (resp === null) return;
    GAS.tarefas.responderRevisao(id, revisaoId, resp || (aceita ? 'Aceito.' : 'Rejeitado.'), aceita, function() {
      _balcao.atualizar();
      setTimeout(function() { _balcao.abrirDetalhe(id); }, 600);
    }, function(e) { alert('Erro: ' + (e || '')); });
  }
};

// ── Autocomplete de usuários ──────────────────────────────────────────────────

var _bAutoTimer = null;

function _balcaoAutocompletar(input) {
  var lista = document.getElementById('bForm-responsavel-list');
  if (!lista) return;
  var q = input.value.toLowerCase().trim();
  if (!q || q.length < 2) { lista.classList.add('hidden'); return; }

  clearTimeout(_bAutoTimer);
  _bAutoTimer = setTimeout(function() {
    var usuarios = (window.AppState && AppState.usuarios) ? AppState.usuarios : [];
    var matches = usuarios.filter(function(u) {
      return (u.email || '').toLowerCase().indexOf(q) !== -1 ||
             (u.nome  || '').toLowerCase().indexOf(q) !== -1;
    }).slice(0, 8);

    if (!matches.length) { lista.classList.add('hidden'); return; }

    lista.innerHTML = matches.map(function(u) {
      var nome = u.nome || u.email.split('@')[0];
      return '<div class="flex items-center gap-2 px-3 py-2 hover:bg-indigo-50 cursor-pointer" onclick="_balcaoSelecionarUsuario(\'' + _esc(u.email) + '\')">' +
             '<div style="width:24px;height:24px;border-radius:50%;background:' + _corAvatar(u.email) + ';display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#fff;flex-shrink:0">' + _iniciais(u.email) + '</div>' +
             '<div><div class="text-xs font-semibold text-slate-700">' + _esc(nome) + '</div>' +
             '<div class="text-[10px] text-slate-400">' + _esc(u.email) + '</div></div>' +
             '</div>';
    }).join('');
    lista.classList.remove('hidden');
  }, 200);
}

function _balcaoSelecionarUsuario(email) {
  var input = document.getElementById('bForm-responsavel');
  var lista = document.getElementById('bForm-responsavel-list');
  if (input) input.value = email;
  if (lista) lista.classList.add('hidden');
}

// ── Fechar overlays ───────────────────────────────────────────────────────────

var _BALCAO_OVERLAYS = ['balcao-modal-overlay', 'balcao-form-overlay'];

function _fecharOverlayBalcao(id) {
  var el = document.getElementById(id);
  if (el) el.classList.add('hidden');
  var algumAberto = _BALCAO_OVERLAYS.some(function(oid) {
    var m = document.getElementById(oid);
    return m && !m.classList.contains('hidden');
  });
  if (!algumAberto) document.body.style.overflow = '';
}

function _balcaoFecharModal(event) {
  if (event && event.target !== document.getElementById('balcao-modal-overlay')) return;
  _fecharOverlayBalcao('balcao-modal-overlay');
}

function _balcaoFecharForm(event) {
  if (event && event.target !== document.getElementById('balcao-form-overlay')) return;
  _fecharOverlayBalcao('balcao-form-overlay');
}

// Expõe ao escopo global — necessário para onclick inline no HTML e no HTML gerado dinamicamente
window._balcaoFecharModal      = _balcaoFecharModal;
window._balcaoFecharForm       = _balcaoFecharForm;
window._balcaoAutocompletar    = _balcaoAutocompletar;
window._balcaoSelecionarUsuario = _balcaoSelecionarUsuario;

// ESC fecha o overlay mais ao topo (form > modal)
document.addEventListener('keydown', function(e) {
  if (e.key !== 'Escape') return;
  var form  = document.getElementById('balcao-form-overlay');
  var modal = document.getElementById('balcao-modal-overlay');
  if (form  && !form.classList.contains('hidden'))  { _fecharOverlayBalcao('balcao-form-overlay');  return; }
  if (modal && !modal.classList.contains('hidden')) { _fecharOverlayBalcao('balcao-modal-overlay'); }
});

// ── Inicialização quando a aba é aberta ───────────────────────────────────────

window._onShow_aba_balcao = function() {
  if (!_bState.processos.length && !_bState.carregando) {
    _balcao.carregar();
  }
};

if (typeof EventBus !== 'undefined') {
  EventBus.on('aba:aba-balcao:show', function() {
    window._onShow_aba_balcao();
  });
}

})(); // IIFE
</script>
