<!--
@file services/server_bridge_js.html
@layer frontend/services
@description Camada de serviço: encapsula todas as chamadas google.script.run em um objeto
             único (GAS) com namespaces por domínio.
             REGRA: todo código novo deve usar GAS.* em vez de google.script.run diretamente.
             Código legado pode continuar usando google.script.run diretamente até ser migrado.
@responsibility Centralizar chamadas backend; padronizar tratamento de erro; expor API tipada.
@dependencies mod_ui_componentes_js (_handleServerError) — deve ser carregado APÓS mod_ui_componentes_js.
-->
<script>

/**
 * ========================================
 * BLOCO: GAS — bridge de chamadas ao backend
 * ========================================
 * @description Objeto com namespaces por domínio (reservas, admin, rece, ia, contratos, sessao, etc.).
 *              Cada método encapsula google.script.run com tratamento de erro padrão.
 *              Uso: GAS.reservas.obter(onSuccess, onError)
 * @context Todo código novo deve usar GAS.* em vez de google.script.run diretamente.
 * @inputs onSuccess: callback; onError: callback opcional (padrão: _handleServerError).
 * @outputs Resultado assíncrono via callbacks.
 * @sideEffects Chamadas HTTP ao servidor GAS.
 */
const GAS = {

  _call: function(fnName, args, onSuccess, onError) {
    const fallbackError = typeof _handleServerError === 'function'
      ? _handleServerError
      : function(e) { console.error('[GAS]', fnName, e); };

    const runner = google.script.run
      .withSuccessHandler(onSuccess || function() {})
      .withFailureHandler(onError || fallbackError);

    runner[fnName].apply(runner, Array.isArray(args) ? args : (args !== undefined ? [args] : []));
  },

  _stub: function(cb) {
    if (typeof cb === 'function') cb({ ok: false, stub: true, msg: 'Funcionalidade em desenvolvimento' });
  },

  // Retorna o token de sessão ou o email como fallback.
  // Quando o usuário é identificado via obterEmailSessaoAtiva() (sem GSI), nenhum token é criado.
  // Passar o email diretamente garante que _resolverEmailReal() consiga validar a identidade.
  _sessao: function() {
    if (typeof AppState !== 'undefined' && AppState.usuario) {
      return AppState.usuario._sessao || AppState.usuario.email || '';
    }
    return '';
  },
