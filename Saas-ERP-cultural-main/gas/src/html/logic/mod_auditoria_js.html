<!--
@file logic/mod_auditoria_js.html
@type logic
@description Lógica de frontend do módulo de Auditoria — logs, filtros e exportação.
@dependencies GAS.admin, escaparHTML, temPermissao, AppState
-->
<script>
(function () {

  // ── Estado ───────────────────────────────────────────────────
  var _audState = {
    abaAtiva:   'trilha',
    todos:      [],        // todos os eventos carregados
    filtrados:  [],        // após aplicar filtros locais
    stats:      null,
    modulosAtivos: [],
    carregado:  false,
    carregandoAcessos: false,
    carregandoLogs:    false,
    logsCarregados:    false
  };

  var _audFiltros = {
    busca:     '',
    categoria: '',
    modulo:    '',
    de:        '',
    ate:       ''
  };

  // ── Navegação de sub-abas ────────────────────────────────────
  window.auditMostrarSubAba = function (aba) {
    _audState.abaAtiva = aba;
    ['trilha', 'logs', 'acessos'].forEach(function (a) {
      var subaba = document.getElementById('audit-subaba-' + a);
      var tab    = document.getElementById('audit-tab-' + a);
      if (subaba) subaba.classList.toggle('hidden', a !== aba);
      if (tab) {
        tab.classList.toggle('bg-slate-900', a === aba);
        tab.classList.toggle('text-white',   a === aba);
        tab.classList.toggle('bg-slate-200', a !== aba);
        tab.classList.toggle('text-slate-600', a !== aba);
      }
    });
    if (aba === 'acessos' && !_audState.carregandoAcessos) _audCarregarAcessos();
    if (aba === 'logs'    && !_audState.logsCarregados)    _audCarregarLogs(false);
  };

  // ── Carregamento principal ───────────────────────────────────
  window.auditCarregar = function () {
    var btn = document.getElementById('audit-btn-atualizar');
    if (btn) { btn.innerHTML = '<i class="fas fa-spinner animate-spin mr-1"></i> Carregando...'; btn.disabled = true; }

    GAS.admin.auditoriaV2({}, function (data) {
      if (btn) { btn.innerHTML = '<i class="fas fa-sync-alt mr-1"></i> Atualizar'; btn.disabled = false; }
      if (!data) return;

      _audState.todos         = data.eventos      || [];
      _audState.stats         = data.stats        || {};
      _audState.modulosAtivos = data.modulosAtivos || [];
      _audState.carregado     = true;

      _audAtualizarStats(data.stats);
      _audPopularFiltroModulo(data.modulosAtivos);
      _audAplicarFiltrosLocais();
    }, function (e) {
      if (btn) { btn.innerHTML = '<i class="fas fa-sync-alt mr-1"></i> Atualizar'; btn.disabled = false; }
      _audTimeline([]);
      _audMostrarErro('Sem acesso ou sistema sem eventos registrados ainda.');
    });
  };

  // ── Filtros ──────────────────────────────────────────────────
  window.auditAplicarFiltros = function () {
    _audFiltros.busca     = (document.getElementById('audit-f-busca')     || {}).value || '';
    _audFiltros.categoria = (document.getElementById('audit-f-categoria') || {}).value || '';
    _audFiltros.modulo    = (document.getElementById('audit-f-modulo')    || {}).value || '';
    _audFiltros.de        = (document.getElementById('audit-f-de')        || {}).value || '';
    _audFiltros.ate       = (document.getElementById('audit-f-ate')       || {}).value || '';
    _audAplicarFiltrosLocais();
  };

  window.auditLimparFiltros = function () {
    ['audit-f-busca','audit-f-categoria','audit-f-modulo','audit-f-de','audit-f-ate'].forEach(function (id) {
      var el = document.getElementById(id);
      if (el) el.value = '';
    });
    _audFiltros = { busca: '', categoria: '', modulo: '', de: '', ate: '' };
    _audAplicarFiltrosLocais();
  };

  function _audAplicarFiltrosLocais() {
    var lista = _audState.todos.filter(function (ev) {
      if (_audFiltros.categoria && ev.categoria !== _audFiltros.categoria) return false;
      if (_audFiltros.modulo    && ev.modulo    !== _audFiltros.modulo)    return false;
      if (_audFiltros.busca) {
        var q = _audFiltros.busca.toLowerCase();
        var txt = [ev.mensagem, ev.usuario, ev.entidadeId, ev.acao, ev.modulo, ev.tipo].join(' ').toLowerCase();
        if (txt.indexOf(q) === -1) return false;
      }
      if (_audFiltros.de) {
        if (ev.timestamp < _audFiltros.de) return false;
      }
      if (_audFiltros.ate) {
        if (ev.timestamp > (_audFiltros.ate + 'T23:59:59')) return false;
      }
      return true;
    });
    _audState.filtrados = lista;

    var lbl = document.getElementById('audit-filtro-label');
    if (lbl) {
      lbl.textContent = lista.length + ' de ' + _audState.todos.length + ' eventos';
    }

    _audTimeline(lista);
  }

  // ── Render: stats ────────────────────────────────────────────
  function _audAtualizarStats(stats) {
    var statsEl = document.getElementById('audit-stats');
    if (statsEl) statsEl.classList.remove('hidden');

    function _setText(id, val) {
      var el = document.getElementById(id);
      if (el) el.textContent = val !== undefined ? val : '—';
    }
    _setText('audit-stat-total',        stats && stats.total);
    _setText('audit-stat-criticos',     stats && stats.criticos);
    _setText('audit-stat-operacionais', stats && stats.operacionais);
    _setText('audit-stat-falhas',       stats && stats.falhas);
  }

  // ── Render: filtro módulo ────────────────────────────────────
  function _audPopularFiltroModulo(modulos) {
    var sel = document.getElementById('audit-f-modulo');
    if (!sel) return;
    var current = sel.value;
    sel.innerHTML = '<option value="">Todos</option>'
      + modulos.map(function (m) {
          return '<option value="' + _audEsc(m) + '"' + (m === current ? ' selected' : '') + '>'
            + _audEsc(_audModuloLabel(m)) + '</option>';
        }).join('');
  }

  // ── Render: timeline ─────────────────────────────────────────
  function _audTimeline(eventos) {
    var container = document.getElementById('audit-timeline');
    if (!container) return;

    if (!eventos.length) {
      container.innerHTML = _audVazio();
      return;
    }

    // Agrupar por dia
    var grupos = {};
    var ordem  = [];
    eventos.forEach(function (ev) {
      var dia = (ev.timestamp || '').slice(0, 10);
      if (!grupos[dia]) { grupos[dia] = []; ordem.push(dia); }
      grupos[dia].push(ev);
    });

    var html = '';
    ordem.forEach(function (dia) {
      var diaFmt = _audFormatarDia(dia);
      html += '<div class="mb-2">';
      html += '<div class="flex items-center gap-3 mb-3 sticky top-0 bg-white py-2 z-10">'
        + '<div class="h-px flex-1 bg-slate-100"></div>'
        + '<span class="text-[9px] font-black text-slate-400 uppercase tracking-widest px-2">' + diaFmt + '</span>'
        + '<div class="h-px flex-1 bg-slate-100"></div></div>';

      grupos[dia].forEach(function (ev) {
        html += _audEventoCard(ev);
      });
      html += '</div>';
    });

    container.innerHTML = html;
  }

  function _audEventoCard(ev) {
    var isCritico    = ev.categoria === 'CRITICO';
    var isFalha      = ev.resultado === 'falha' || ev.resultado === 'aviso';
    var corBorda     = isCritico ? 'border-l-red-500' : 'border-l-blue-400';
    var corCategoria = isCritico
      ? 'bg-red-100 text-red-700'
      : 'bg-blue-100 text-blue-700';
    var icone        = isFalha ? 'fa-xmark-circle text-red-400' : (isCritico ? 'fa-shield-exclamation text-red-500' : 'fa-circle-check text-blue-400');
    var hora         = _audFormatarHora(ev.timestamp);
    var temDiff      = ev.antes || ev.depois;

    var card = '<div class="flex gap-3 mb-2 group">'
      + '<div class="flex flex-col items-center">'
        + '<div class="w-8 h-8 rounded-xl flex items-center justify-center flex-shrink-0 ' + (isCritico ? 'bg-red-50' : 'bg-blue-50') + '">'
          + '<i class="fas ' + icone + ' text-xs"></i>'
        + '</div>'
        + '<div class="w-px flex-1 bg-slate-100 my-1"></div>'
      + '</div>'
      + '<div class="flex-1 pb-2">'
        + '<div class="bg-white border border-slate-100 border-l-4 ' + corBorda + ' rounded-xl p-3 hover:shadow-sm transition-shadow">'
          + '<div class="flex items-start justify-between gap-2 flex-wrap">'
            + '<div class="flex items-center gap-2 flex-wrap">'
              + '<span class="text-[9px] font-black px-2 py-0.5 rounded-full ' + corCategoria + ' uppercase">' + _audEsc(ev.categoria) + '</span>'
              + '<span class="text-[9px] font-bold text-slate-500 bg-slate-100 px-2 py-0.5 rounded-full">' + _audEsc(ev.modulo) + '</span>'
              + (ev.acao ? '<span class="text-[9px] font-semibold text-slate-400">' + _audEsc(ev.acao) + '</span>' : '')
            + '</div>'
            + '<span class="text-[9px] text-slate-400 font-medium whitespace-nowrap">' + hora + '</span>'
          + '</div>'
          + '<p class="text-xs font-semibold text-slate-700 mt-1.5">' + _audEsc(ev.mensagem || ev.tipo) + '</p>'
          + '<div class="flex items-center gap-3 mt-1 flex-wrap">'
            + (ev.usuario ? '<span class="text-[9px] text-slate-500"><i class="fas fa-user text-slate-300 mr-1"></i>' + _audEsc(ev.usuario) + '</span>' : '')
            + (ev.entidadeId ? '<span class="text-[9px] text-slate-400"><i class="fas fa-tag text-slate-200 mr-1"></i>' + _audEsc(ev.entidadeId) + '</span>' : '')
            + (ev.tipo !== ev.mensagem ? '<span class="text-[9px] text-slate-300 font-mono">' + _audEsc(ev.tipo) + '</span>' : '')
          + '</div>'
          + (temDiff ? _audDiffCard(ev) : '')
        + '</div>'
      + '</div>'
    + '</div>';
    return card;
  }

  function _audDiffCard(ev) {
    var html = '<div class="mt-2 grid grid-cols-2 gap-2">';
    if (ev.antes) {
      html += '<div class="bg-red-50 rounded-lg p-2">'
        + '<p class="text-[8px] font-black text-red-400 uppercase tracking-widest mb-1">Antes</p>'
        + '<pre class="text-[9px] text-red-700 overflow-auto max-h-16 font-mono">' + _audEsc(_audJsonStr(ev.antes)) + '</pre>'
      + '</div>';
    }
    if (ev.depois) {
      html += '<div class="bg-green-50 rounded-lg p-2">'
        + '<p class="text-[8px] font-black text-green-500 uppercase tracking-widest mb-1">Depois</p>'
        + '<pre class="text-[9px] text-green-700 overflow-auto max-h-16 font-mono">' + _audEsc(_audJsonStr(ev.depois)) + '</pre>'
      + '</div>';
    }
    return html + '</div>';
  }

  function _audVazio() {
    return '<div class="flex flex-col items-center justify-center py-16 text-center">'
      + '<i class="fas fa-shield-halved text-slate-100 text-5xl mb-4"></i>'
      + '<p class="text-slate-400 font-bold text-xs uppercase tracking-widest">Nenhum evento encontrado</p>'
      + '<p class="text-slate-300 text-[10px] mt-1">Ajuste os filtros ou aguarde eventos serem registrados</p>'
    + '</div>';
  }

  function _audMostrarErro(msg) {
    var el = document.getElementById('audit-timeline');
    if (el) el.innerHTML = '<div class="p-12 text-center">'
      + '<i class="fas fa-exclamation-triangle text-amber-200 text-3xl mb-3"></i>'
      + '<p class="text-slate-400 text-xs font-bold">' + _audEsc(msg) + '</p>'
    + '</div>';
  }

  // ── Logs do Sistema (aba Logs da planilha) ───────────────────
  var _audTodosLogs = [];

  // forcado=true: recarrega mesmo se já carregou antes (botão Atualizar)
  window._audCarregarLogs = function (forcado) {
    if (_audState.carregandoLogs) return;
    _audState.carregandoLogs = true;

    var tbody = document.getElementById('audit-tbody-logs');
    if (tbody) {
      tbody.innerHTML = '<tr><td colspan="6" class="p-12 text-center">'
        + '<i class="fas fa-spinner animate-spin text-slate-200 text-2xl mb-3 block"></i>'
        + '<p class="text-slate-300 text-xs font-bold uppercase">Carregando logs...</p>'
        + '</td></tr>';
    }

    var email = (typeof AppState !== 'undefined' && AppState.usuario) ? AppState.usuario.email || '' : '';
    GAS.admin.obterLogs(email, function (data) {
      _audState.carregandoLogs = false;
      _audState.logsCarregados = true;
      var lista = [];
      try { lista = typeof data === 'string' ? JSON.parse(data) : (Array.isArray(data) ? data : []); } catch(e) {}
      _audTodosLogs = lista;
      var buscaEl = document.getElementById('audit-busca-logs');
      var q = buscaEl ? buscaEl.value : '';
      _audRenderizarLogs(q ? _audTodosLogs.filter(function(r) {
        return JSON.stringify(r).toLowerCase().indexOf(q.toLowerCase()) !== -1;
      }) : _audTodosLogs);
    }, function (e) {
      _audState.carregandoLogs = false;
      var msg = (e && e.message) ? e.message : String(e || 'Sem acesso — requer perfil superadmin.');
      var tbody2 = document.getElementById('audit-tbody-logs');
      if (tbody2) tbody2.innerHTML = '<tr><td colspan="6" class="p-8 text-center text-slate-300 text-xs font-bold">'
        + '<i class="fas fa-lock text-slate-200 text-xl mb-2 block"></i>' + _audEsc(msg) + '</td></tr>';
      var cnt = document.getElementById('audit-logs-count');
      if (cnt) cnt.textContent = '';
    });
  };

  window.auditFiltrarLogs = function (v) {
    var q = (v || '').toLowerCase();
    if (!q) { _audRenderizarLogs(_audTodosLogs); return; }
    _audRenderizarLogs(_audTodosLogs.filter(function (r) {
      return JSON.stringify(r).toLowerCase().indexOf(q) !== -1;
    }));
  };

  function _audRenderizarLogs(lista) {
    var tbody = document.getElementById('audit-tbody-logs');
    if (!tbody) return;
    var cnt = document.getElementById('audit-logs-count');
    if (cnt) cnt.textContent = lista.length + ' de ' + _audTodosLogs.length + ' registros';

    if (!lista.length) {
      tbody.innerHTML = '<tr><td colspan="6" class="p-8 text-center text-slate-300 text-xs">Sem registros.</td></tr>';
      return;
    }

    // Colunas: [timestamp, usuario, acao, tipo, alvo, detalhes, dadosAntes, dadosDepois]
    var _acoesComAlerta = { 'USUARIO_EXCLUIDO': 1, 'ESPACO_EXCLUIDO': 1, 'CONTRATO_ARQUIVADO': 1, 'ITEM_EXCLUIDO': 1 };

    tbody.innerHTML = lista.map(function (r) {
      var ts      = r[0] || '';
      var usuario = r[1] || '';
      var acao    = r[2] || '';
      var tipo    = r[3] || '';
      var alvo    = r[4] || '';
      var det     = r[5] || '';
      var isAlerta = _acoesComAlerta[acao] || acao.indexOf('EXCLU') !== -1 || acao.indexOf('CANCEL') !== -1;
      var acoeCls = isAlerta
        ? 'text-[9px] font-black bg-red-100 text-red-700 px-2 py-0.5 rounded-full uppercase'
        : 'text-[9px] font-black bg-slate-100 text-slate-600 px-2 py-0.5 rounded-full uppercase';
      return '<tr class="hover:bg-slate-50 transition-colors">'
        + '<td class="p-3 text-[10px] text-slate-500 font-medium whitespace-nowrap">' + _audEsc(ts) + '</td>'
        + '<td class="p-3 text-[10px] text-slate-700 font-semibold truncate max-w-[160px]">' + _audEsc(usuario) + '</td>'
        + '<td class="p-3"><span class="' + acoeCls + '">' + _audEsc(acao) + '</span></td>'
        + '<td class="p-3 text-[10px] text-slate-500">' + _audEsc(tipo) + '</td>'
        + '<td class="p-3 text-[10px] text-slate-600 truncate max-w-[160px]">' + _audEsc(alvo) + '</td>'
        + '<td class="p-3 text-[10px] text-slate-500 truncate max-w-[240px]">' + _audEsc(det) + '</td>'
        + '</tr>';
    }).join('');
  }

  // ── Acessos ──────────────────────────────────────────────────
  var _audTodosAcessos = [];

  function _audCarregarAcessos() {
    _audState.carregandoAcessos = true;
    var email = (typeof AppState !== 'undefined' && AppState.usuario) ? AppState.usuario.email || '' : '';
    GAS.admin.obterLogAcessos(email, function (data) {
      _audTodosAcessos = Array.isArray(data) ? data : [];
      _audRenderizarAcessos(_audTodosAcessos);
    }, function () {
      document.getElementById('audit-tbody-acessos').innerHTML =
        '<tr><td colspan="3" class="p-8 text-center text-slate-300 text-xs">Sem acesso aos registros.</td></tr>';
    });
  }

  window.auditFiltrarAcessos = function (v) {
    var q = (v || '').toLowerCase();
    if (!q) { _audRenderizarAcessos(_audTodosAcessos); return; }
    _audRenderizarAcessos(_audTodosAcessos.filter(function (r) {
      return JSON.stringify(r).toLowerCase().indexOf(q) !== -1;
    }));
  };

  function _audRenderizarAcessos(lista) {
    var tbody = document.getElementById('audit-tbody-acessos');
    if (!tbody) return;
    if (!lista.length) {
      tbody.innerHTML = '<tr><td colspan="3" class="p-8 text-center text-slate-300 text-xs">Sem registros.</td></tr>';
      return;
    }
    tbody.innerHTML = lista.map(function (r) {
      var ts   = r[0] || r.timestamp || r.data || '';
      var user = r[1] || r.email    || r.usuario || '';
      var tipo = r[2] || r.acao     || r.tipo  || '';
      return '<tr class="hover:bg-slate-50 transition-colors">'
        + '<td class="p-4 text-xs text-slate-600 font-medium">' + _audEsc(_audFormatarTs(ts)) + '</td>'
        + '<td class="p-4 text-xs text-slate-700 font-semibold">' + _audEsc(user) + '</td>'
        + '<td class="p-4 text-center"><span class="text-[9px] font-black bg-slate-100 text-slate-600 px-2 py-0.5 rounded-full uppercase">' + _audEsc(tipo) + '</span></td>'
      + '</tr>';
    }).join('');
  }

  // ── Helpers ──────────────────────────────────────────────────
  function _audEsc(s) {
    return String(s || '').replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function _audFormatarTs(ts) {
    if (!ts) return '—';
    try {
      return new Date(ts).toLocaleString('pt-BR');
    } catch (e) { return String(ts); }
  }

  function _audFormatarDia(dia) {
    if (!dia) return '—';
    try {
      var d = new Date(dia + 'T12:00:00');
      return d.toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: 'long', year: 'numeric' });
    } catch (e) { return dia; }
  }

  function _audFormatarHora(ts) {
    if (!ts) return '—';
    try { return new Date(ts).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit', second: '2-digit' }); }
    catch (e) { return String(ts).slice(11, 19) || '—'; }
  }

  function _audJsonStr(val) {
    if (!val) return '';
    try { return typeof val === 'string' ? val : JSON.stringify(val, null, 2); }
    catch (e) { return String(val); }
  }

  function _audModuloLabel(m) {
    var mapa = {
      reservas: 'Reservas', agenda: 'Agenda', espacos: 'Espaços',
      permissoes: 'Permissões', auth: 'Auth', sistema: 'Sistema',
      rh: 'RH', financeiro: 'Financeiro', contratos: 'Contratos',
      tarefas: 'Tarefas', processos: 'Processos', chaves: 'Chaves',
      almoxarifado: 'Almoxarifado', balcao: 'Balcão', comunicacao: 'Comunicação',
      escuta: 'Escuta', acoes: 'Ações', governance: 'Governança',
      habilitacoes: 'Habilitações', estrategia: 'Estratégia'
    };
    return mapa[m] || m;
  }

  // ── Inicialização via EventBus ───────────────────────────────
  document.addEventListener('DOMContentLoaded', function () {
    if (typeof EventBus !== 'undefined') {
      EventBus.on('aba:aba-auditoria:show', function () {
        if (!_audState.carregado) auditCarregar();
      });
    }
  });

})();
</script>
