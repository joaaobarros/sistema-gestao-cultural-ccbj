<!--
@file logic/mod_configuracoes_js.html
@type logic
@description Lógica de frontend do módulo de Configurações — parâmetros do sistema.
@dependencies GAS.admin, escaparHTML, temPermissao, AppState
-->
<script>
(function () {

  var _CAMPOS_CONFIG = [
    'reservaHoraInicio','reservaHoraFim',
    'turnoManhaIni','turnoManhaTer',
    'turnoTardeIni','turnoTardeTer',
    'turnoNoiteIni','turnoNoiteTer'
  ];

  // ── Navegação por categoria ──────────────────────────────────
  window.cfgNav = function (cat) {
    ['espacos','recursos','setores','usuarios','sistema'].forEach(function (c) {
      var painel = document.getElementById('cfg-painel-' + c);
      var tab    = document.getElementById('cfg-tab-' + c);
      if (painel) painel.classList.toggle('hidden', c !== cat);
      if (tab) {
        tab.classList.toggle('bg-purple-600', c === cat);
        tab.classList.toggle('text-white',    c === cat);
        tab.classList.toggle('bg-slate-200',  c !== cat);
        tab.classList.toggle('text-slate-600',c !== cat);
      }
    });

    // Preencher config de sistema quando a aba for aberta
    if (cat === 'sistema' && typeof AppState !== 'undefined' && AppState.config) {
      _preencherForm(AppState.config);
    }
  };

  // ── Formulário de config global ──────────────────────────────
  function _preencherForm(cfg) {
    _CAMPOS_CONFIG.forEach(function (k) {
      var el = document.getElementById('cfg-' + k);
      if (el && cfg[k]) el.value = cfg[k];
    });
  }

  window.salvarConfigGlobal = window.cfgSalvarGlobal = function () {
    var cfg = {};
    _CAMPOS_CONFIG.forEach(function (k) {
      var el = document.getElementById('cfg-' + k);
      if (el && el.value) cfg[k] = el.value;
    });
    if (!Object.keys(cfg).length) {
      if (typeof Swal !== 'undefined') Swal.fire('Atenção', 'Preencha ao menos um campo antes de salvar.', 'warning');
      return;
    }

    // Confirmação antes de salvar configuração global
    if (typeof Swal !== 'undefined') {
      Swal.fire({
        title: 'Confirmar alteração',
        text: 'As configurações de horário afetam todos os usuários imediatamente.',
        icon: 'warning',
        showCancelButton: true,
        confirmButtonText: 'Salvar',
        cancelButtonText:  'Cancelar',
        confirmButtonColor: '#1e293b'
      }).then(function (result) {
        if (result.isConfirmed) _executarSalvarGlobal(cfg);
      });
    } else {
      _executarSalvarGlobal(cfg);
    }
  };

  function _executarSalvarGlobal(cfg) {
    if (typeof showLoader === 'function') showLoader(true);
    GAS.admin.salvarSistemaConfig(cfg, function (res) {
      if (typeof showLoader === 'function') showLoader(false);
      if (res && res.ok) {
        if (typeof AppState !== 'undefined' && AppState.config) {
          Object.assign(AppState.config, res.config || cfg);
        }
        if (typeof Swal !== 'undefined') {
          Swal.fire({ icon: 'success', title: 'Configurações salvas', timer: 1500, showConfirmButton: false });
        }
      } else {
        if (typeof Swal !== 'undefined') {
          Swal.fire('Erro', (res && res.msg) || 'Não foi possível salvar.', 'error');
        }
      }
    }, function (e) {
      if (typeof showLoader === 'function') showLoader(false);
      if (typeof Swal !== 'undefined') Swal.fire('Erro', String(e), 'error');
    });
  }

  // ── EventBus — preencher form ao exibir aba ──────────────────
  document.addEventListener('DOMContentLoaded', function () {
    if (typeof EventBus !== 'undefined') {
      EventBus.on('aba:aba-gestao-admin:show', function () {
        if (typeof AppState !== 'undefined' && AppState.config) {
          _preencherForm(AppState.config);
        }
      });
    }
  });

})();
</script>
