<script>
/**
 * @file mod_hab_diaria_js.html
 * @description Relatório de habilitação diária de espaços — frontend JS.
 *              Carregado sob demanda quando o modo 'habilitacoes' é ativado
 *              na Agenda Geral.
 * @responsibility Renderizar relatório de check-in operacional por data;
 *                 acionar o registro de habilitação via modal SweetAlert2.
 * @dependencies AppState (mapaSalas, usuario), GAS.habDiaria, EventBus
 */

// ─── Estado local ────────────────────────────────────────────────────────────
var _habDState = {
  data:      null, // "YYYY-MM-DD"
  itens:     [],
  carregado: false,
  carregando: false
};

// ─── Inicialização ────────────────────────────────────────────────────────────

EventBus.on('aba:aba-lista-reservas:show', function () {
  // Reset sutil: se já estava em modo habilitações, recarrega com data atual
  if (_habDState.carregado) _habDiariaDefinirData(_habDState.data);
});

// ─── API pública ─────────────────────────────────────────────────────────────

function habDiariaInicializar() {
  var hoje = _habDiariaHoje();
  _habDiariaDefinirData(hoje);
}

function habDiariaNavegar(deltaDias) {
  var d = new Date(_habDState.data + 'T00:00:00');
  d.setDate(d.getDate() + deltaDias);
  _habDiariaDefinirData(_habDiariaFmtISO(d));
}

function habDiariaIrHoje() {
  _habDiariaDefinirData(_habDiariaHoje());
}

function habDiariaDefinirDataInput(val) {
  if (val) _habDiariaDefinirData(val);
}

function habDiariaAtualizar() {
  _habDiariaCarregar();
}

// ─── Registro de habilitação ─────────────────────────────────────────────────

// Aceita o índice do item em _habDState.itens para evitar problemas de
// aspas ao passar strings via onclick inline.
function habDiariaHabilitar(idx) {
  var item = _habDState.itens[idx];
  if (!item) return;

  var salaNome  = (AppState.mapaSalas && AppState.mapaSalas[item.salaId]) || item.salaId;
  var horaAtual = _habDiariaFmtHora(new Date());

  Swal.fire({
    title: 'Habilitar Espaço',
    html:
      '<div class="text-left space-y-3">' +
      '<p class="text-sm text-slate-500"><i class="fas fa-map-marker-alt mr-1 text-purple-500"></i><strong>' + _escHTML(salaNome) + '</strong> — ' + _escHTML(item.evento) + '</p>' +
      '<p class="text-xs text-slate-400">Início agendado: <strong>' + _escHTML(item.horaInicio) + '</strong></p>' +
      '<div>' +
      '<label class="text-xs font-black text-slate-500 uppercase tracking-wide block mb-1">Hora de habilitação</label>' +
      '<input id="swalHoraHab" type="time" value="' + horaAtual + '" ' +
        'class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm outline-none focus:border-purple-500">' +
      '</div>' +
      '<div>' +
      '<label class="text-xs font-black text-slate-500 uppercase tracking-wide block mb-1">Observação (opcional)</label>' +
      '<textarea id="swalObsHab" rows="2" placeholder="Ex: limpeza atrasada, equipamento pendente..." ' +
        'class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm outline-none focus:border-purple-500 resize-none"></textarea>' +
      '</div>' +
      '</div>',
    showCancelButton: true,
    confirmButtonText: '<i class="fas fa-check-circle mr-1"></i>Confirmar',
    cancelButtonText:  'Cancelar',
    confirmButtonColor: '#7c3aed',
    focusConfirm: false,
    preConfirm: function () {
      var horaHab = document.getElementById('swalHoraHab').value;
      var obs     = document.getElementById('swalObsHab').value;
      if (!horaHab) { Swal.showValidationMessage('Informe a hora de habilitação.'); return false; }
      return { horaHab: horaHab, obs: obs };
    }
  }).then(function (result) {
    if (!result.isConfirmed) return;
    var dados = {
      reservaId:        item.reservaId,
      salaId:           item.salaId,
      data:             _habDiariaFmtBR(new Date(_habDState.data + 'T00:00:00')),
      horaEvento:       item.horaInicio,
      horaHabilitacao:  result.value.horaHab,
      observacao:       result.value.obs
    };
    showLoader('Registrando habilitação...');
    GAS.habDiaria.registrar(dados,
      function (res) {
        if (!res || !res.ok) {
          hideLoader();
          Swal.fire('Erro', (res && res.erro) || 'Falha ao registrar.', 'error');
          return;
        }
        // Conecta ao sistema de habilitação: atualiza status da reserva para HABILITADO
        GAS.reservas.habilitar(item.reservaId, AppState.usuario.email, result.value.obs || '',
          function () {
            hideLoader();
            var r = AppState.colecoes && AppState.colecoes.reservas &&
                    AppState.colecoes.reservas.find(function (x) { return x[0] === item.reservaId; });
            if (r) r[13] = 'HABILITADO';
            if (typeof indexarReservas === 'function') indexarReservas();
            Swal.mixin({ toast: true, position: 'top-end', showConfirmButton: false, timer: 2500, timerProgressBar: true })
              .fire({ icon: 'success', title: 'Espaço habilitado!' });
            _habDiariaCarregar();
          },
          function (err) {
            hideLoader();
            // Check-in registrado; apenas o status não foi atualizado
            Swal.fire('Aviso', 'Check-in registrado, mas não foi possível atualizar o status da reserva: ' + String(err), 'warning');
            _habDiariaCarregar();
          }
        );
      },
      function (err) {
        hideLoader();
        Swal.fire('Erro', String(err), 'error');
      }
    );
  });
}

// ─── Carregamento e renderização ─────────────────────────────────────────────

function _habDiariaDefinirData(dataISO) {
  _habDState.data = dataISO;
  var input = document.getElementById('habDDataInput');
  if (input) input.value = dataISO;
  _habDiariaCarregar();
}

function _habDiariaCarregar() {
  if (_habDState.carregando) return;
  _habDState.carregando = true;
  _habDiariaRenderLoading();

  GAS.habDiaria.relatorio(_habDState.data,
    function (res) {
      _habDState.carregando = false;
      if (res && res.ok) {
        _habDState.itens     = res.itens || [];
        _habDState.carregado = true;
        _habDiariaRenderizar();
      } else {
        _habDiariaRenderErro((res && res.erro) || 'Erro ao carregar relatório.');
      }
    },
    function (err) {
      _habDState.carregando = false;
      _habDiariaRenderErro(String(err));
    }
  );
}

function _habDiariaRenderLoading() {
  var el = document.getElementById('habDConteudo');
  if (!el) return;
  el.innerHTML =
    '<div class="p-16 text-center text-slate-300">' +
    '<i class="fas fa-spinner fa-spin text-3xl mb-3"></i><br>' +
    '<span class="text-sm font-bold">Carregando habilitações...</span>' +
    '</div>';
}

function _habDiariaRenderErro(msg) {
  var el = document.getElementById('habDConteudo');
  if (!el) return;
  el.innerHTML =
    '<div class="p-16 text-center text-red-300">' +
    '<i class="fas fa-exclamation-circle text-3xl mb-3"></i><br>' +
    '<span class="text-sm font-bold">' + _escHTML(msg) + '</span>' +
    '</div>';
}

function _habDiariaRenderizar() {
  var el = document.getElementById('habDConteudo');
  if (!el) return;

  var itens   = _habDState.itens;
  var total   = itens.length;
  var noPrazo = itens.filter(function (i) { return i.status === 'no_prazo'; }).length;
  var atrasad = itens.filter(function (i) { return i.status === 'atrasado'; }).length;
  var pendnt  = itens.filter(function (i) { return i.status === 'pendente'; }).length;

  var labelData = _habDiariaLabelData(_habDState.data);

  var html =
    // ── Cards de métricas ────────────────────────────────────────────────
    '<div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-4">' +
      _habDCard('total', 'Total', total, 'fa-calendar-check', 'slate') +
      _habDCard('no_prazo', 'No Prazo', noPrazo, 'fa-check-circle', 'emerald') +
      _habDCard('atrasado', 'Atrasados', atrasad, 'fa-clock', 'amber') +
      _habDCard('pendente', 'Pendentes', pendnt, 'fa-hourglass-half', 'slate') +
    '</div>';

  if (total === 0) {
    html +=
      '<div class="bg-white rounded-2xl border border-slate-200 p-16 text-center">' +
      '<i class="fas fa-calendar-times text-slate-200 text-4xl mb-3"></i><br>' +
      '<p class="text-slate-400 font-medium">Nenhum agendamento em ' + _escHTML(labelData) + '</p>' +
      '</div>';
  } else {
    // ── Tabela ───────────────────────────────────────────────────────────
    html +=
      '<div class="bg-white rounded-2xl border border-slate-200 overflow-hidden">' +
      '<div class="overflow-x-auto">' +
      '<table class="w-full min-w-[640px] text-left border-collapse">' +
      '<thead>' +
      '<tr class="bg-slate-50 border-b border-slate-100">' +
      '<th class="px-4 py-3 text-[10px] font-black text-slate-400 uppercase tracking-widest">Espaço</th>' +
      '<th class="px-4 py-3 text-[10px] font-black text-slate-400 uppercase tracking-widest">Evento</th>' +
      '<th class="px-4 py-3 text-[10px] font-black text-slate-400 uppercase tracking-widest text-center w-24">Início</th>' +
      '<th class="px-4 py-3 text-[10px] font-black text-slate-400 uppercase tracking-widest text-center w-28">Habilitado às</th>' +
      '<th class="px-4 py-3 text-[10px] font-black text-slate-400 uppercase tracking-widest text-center w-28">Pontualidade</th>' +
      '<th class="px-4 py-3 text-[10px] font-black text-slate-400 uppercase tracking-widest">Responsável</th>' +
      '<th class="px-4 py-3 text-[10px] font-black text-slate-400 uppercase tracking-widest w-32 text-right">Ação</th>' +
      '</tr>' +
      '</thead>' +
      '<tbody class="divide-y divide-slate-50">';

    itens.forEach(function (item, idx) {
      html += _habDiariaLinha(item, idx);
    });

    html += '</tbody></table></div></div>';
  }

  el.innerHTML = html;
}

function _habDCard(status, label, valor, icon, cor) {
  var corMap = {
    slate:   { bg: 'bg-slate-50',   text: 'text-slate-600',  num: 'text-slate-800', ic: 'text-slate-400' },
    emerald: { bg: 'bg-emerald-50', text: 'text-emerald-600', num: 'text-emerald-700', ic: 'text-emerald-400' },
    amber:   { bg: 'bg-amber-50',   text: 'text-amber-600',  num: 'text-amber-700',  ic: 'text-amber-400' },
    red:     { bg: 'bg-red-50',     text: 'text-red-600',    num: 'text-red-700',    ic: 'text-red-400' }
  };
  var c = corMap[cor] || corMap['slate'];
  return (
    '<div class="' + c.bg + ' rounded-2xl p-4 flex items-center gap-3">' +
    '<i class="fas ' + icon + ' text-xl ' + c.ic + '"></i>' +
    '<div>' +
    '<p class="text-2xl font-black ' + c.num + '">' + valor + '</p>' +
    '<p class="text-[10px] font-black uppercase tracking-wide ' + c.text + '">' + label + '</p>' +
    '</div>' +
    '</div>'
  );
}

function _habDiariaLinha(item, idx) {
  var salaNome = (AppState.mapaSalas && AppState.mapaSalas[item.salaId]) || item.salaId;
  var hab      = item.habilitacao;

  var podeHabilitar = typeof temPermissao === 'function'
    ? (temPermissao('reservas', 'editar') || !!(AppState.usuario && AppState.usuario.isHabilitador))
    : !!(AppState.usuario && AppState.usuario.isHabilitador);

  // Status pill
  var pillHtml = _habDiariaPill(item.status, item.atrasoMin);

  // Hora habilitação
  var horaHabHtml = hab
    ? '<span class="font-bold text-slate-700">' + _escHTML(hab.horaHabilitacao) + '</span>'
    : '<span class="text-slate-300">—</span>';

  // Responsável
  var respHtml = '';
  if (hab && hab.responsavelNome) {
    respHtml =
      '<span class="text-sm font-medium text-slate-600">' + _escHTML(hab.responsavelNome) + '</span>';
    if (hab.observacao) {
      respHtml +=
        '<br><span class="text-xs text-slate-400 italic">' + _escHTML(hab.observacao) + '</span>';
    }
  } else {
    respHtml = '<span class="text-slate-300 text-sm">—</span>';
  }

  // Botão de ação — só visível para habilitadores/admins; usa índice numérico no onclick
  // para evitar problemas de aspas ao passar strings em atributos HTML
  var btnHtml = '';
  if (podeHabilitar) {
    btnHtml = item.status === 'pendente'
      ? '<button onclick="habDiariaHabilitar(' + idx + ')" ' +
          'class="px-3 py-1.5 bg-purple-600 hover:bg-purple-700 text-white text-xs font-black rounded-xl uppercase transition-all">' +
          '<i class="fas fa-check mr-1"></i>Habilitar' +
          '</button>'
      : '<button onclick="habDiariaHabilitar(' + idx + ')" ' +
          'class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-500 text-xs font-bold rounded-xl uppercase transition-all">' +
          '<i class="fas fa-redo mr-1"></i>Re-habilitar' +
          '</button>';
  }

  return (
    '<tr class="hover:bg-slate-50/50 transition-colors">' +
    '<td class="px-4 py-3">' +
    '<span class="text-sm font-bold text-slate-800">' + _escHTML(salaNome) + '</span>' +
    '</td>' +
    '<td class="px-4 py-3">' +
    '<span class="text-sm text-slate-700">' + _escHTML(item.evento) + '</span>' +
    (item.setor ? '<br><span class="text-xs text-slate-400">' + _escHTML(item.setor) + '</span>' : '') +
    '</td>' +
    '<td class="px-4 py-3 text-center">' +
    '<span class="text-sm font-mono font-bold text-slate-700">' + _escHTML(item.horaInicio) + '</span>' +
    '<br><span class="text-[10px] text-slate-400">' + _escHTML(item.horaTermino) + '</span>' +
    '</td>' +
    '<td class="px-4 py-3 text-center">' + horaHabHtml + '</td>' +
    '<td class="px-4 py-3 text-center">' + pillHtml + '</td>' +
    '<td class="px-4 py-3">' + respHtml + '</td>' +
    '<td class="px-4 py-3 text-right">' + btnHtml + '</td>' +
    '</tr>'
  );
}

function _habDiariaPill(status, atrasoMin) {
  if (status === 'no_prazo') {
    var mins = Math.abs(atrasoMin || 0);
    var label = atrasoMin <= 0
      ? (mins === 0 ? 'No horário' : mins + 'min adiant.')
      : 'No prazo';
    return '<span class="inline-flex items-center gap-1 px-2 py-0.5 bg-emerald-100 text-emerald-700 text-xs font-black rounded-full">' +
           '<i class="fas fa-check-circle text-[9px]"></i>' + label + '</span>';
  }
  if (status === 'atrasado') {
    var label2 = (atrasoMin || 0) + 'min atraso';
    return '<span class="inline-flex items-center gap-1 px-2 py-0.5 bg-amber-100 text-amber-700 text-xs font-black rounded-full">' +
           '<i class="fas fa-clock text-[9px]"></i>' + label2 + '</span>';
  }
  // pendente
  return '<span class="inline-flex items-center gap-1 px-2 py-0.5 bg-slate-100 text-slate-500 text-xs font-black rounded-full">' +
         '<i class="fas fa-hourglass-half text-[9px]"></i>Pendente</span>';
}

// ─── Helpers de data ─────────────────────────────────────────────────────────

function _habDiariaHoje() {
  return _habDiariaFmtISO(new Date());
}

function _habDiariaFmtISO(d) {
  var y = d.getFullYear();
  var m = String(d.getMonth() + 1).padStart(2, '0');
  var dia = String(d.getDate()).padStart(2, '0');
  return y + '-' + m + '-' + dia;
}

function _habDiariaFmtBR(d) {
  return String(d.getDate()).padStart(2,'0') + '/' +
         String(d.getMonth()+1).padStart(2,'0') + '/' +
         d.getFullYear();
}

function _habDiariaFmtHora(d) {
  return String(d.getHours()).padStart(2,'0') + ':' +
         String(d.getMinutes()).padStart(2,'0');
}

function _habDiariaLabelData(dataISO) {
  var hoje   = _habDiariaHoje();
  var ontem  = _habDiariaFmtISO(new Date(Date.now() - 86400000));
  var amanha = _habDiariaFmtISO(new Date(Date.now() + 86400000));
  if (dataISO === hoje)   return 'Hoje';
  if (dataISO === ontem)  return 'Ontem';
  if (dataISO === amanha) return 'Amanhã';
  var d = new Date(dataISO + 'T00:00:00');
  var dias = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
  var meses = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
  return dias[d.getDay()] + ' ' + d.getDate() + ' de ' + meses[d.getMonth()];
}

function _escHTML(s) {
  if (typeof escaparHTML === 'function') return escaparHTML(String(s || ''));
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
