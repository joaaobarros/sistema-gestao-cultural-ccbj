@description Relatórios financeiros — consolidação de contratos, rubricas e pagamentos.

<section id="aba-rel-financeiros" class="tab-content hidden pb-20">

  <div class="bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden">

    <!-- HEADER -->
    <div class="p-5 border-b border-slate-100 bg-slate-50/50 flex flex-wrap justify-between items-center gap-3">
      <div>
        <h3 class="font-black text-slate-800 uppercase tracking-tighter text-sm">
          <i class="fas fa-file-invoice-dollar text-emerald-500 mr-2"></i>Relatórios Financeiros
        </h3>
        <p class="text-[10px] text-slate-400 font-medium">Consolidação de contratos, rubricas e execução orçamentária</p>
      </div>
    </div>

    <!-- CARDS RESUMO -->
    <div id="relFinKPIs" class="p-5 grid grid-cols-2 md:grid-cols-4 gap-4 border-b border-slate-100"></div>

    <!-- TABELA DE CONTRATOS COM EXECUÇÃO -->
    <div class="p-5">
      <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-3">
        <i class="fas fa-file-contract text-emerald-300 mr-1"></i>Execução por Contrato
      </p>
      <div id="relFinContratos" class="overflow-x-auto">
        <div class="p-8 text-center">
          <i class="fas fa-spinner animate-spin text-emerald-300 text-xl"></i>
        </div>
      </div>
    </div>

  </div>
