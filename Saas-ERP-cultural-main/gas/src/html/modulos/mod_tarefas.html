<!--
@file mod_tarefas.html
@type module
@description Centro Operacional de Tarefas — 5 visões (Lista, Kanban, Timeline,
             Calendário, Dashboard), delegação, comentários, histórico de status.
@depends GAS.tarefas, temPermissao, AppState, escaparHTML, showLoader, Swal
-->
<section id="aba-tarefas" class="tab-content hidden pb-20">

  <!-- ══ TOOLBAR ══════════════════════════════════════════════════════════════ -->
  <div class="bg-white rounded-3xl shadow-sm border border-slate-200 mb-4 overflow-hidden">

    <!-- Topo: título + ações -->
    <div class="px-5 pt-4 pb-3 border-b border-slate-100 flex flex-wrap justify-between items-center gap-3">
      <div>
        <h3 class="font-black text-slate-800 uppercase tracking-tighter text-sm">
          <i class="fas fa-layer-group text-indigo-400 mr-2"></i>Centro Operacional de Tarefas
        </h3>
        <p class="text-[10px] text-slate-400 font-medium mt-0.5">Rastreie, delegue e execute processos institucionais</p>
      </div>
      <div class="flex gap-2 items-center">
        <button onclick="_trkAtualizar()" title="Atualizar"
          class="text-slate-400 hover:text-indigo-500 transition-colors p-1.5 rounded-lg hover:bg-indigo-50">
          <i class="fas fa-sync-alt text-xs"></i>
        </button>
        <button onclick="abrirModalTarefa()" data-requer-permissao="tarefas:editar"
          class="bg-indigo-600 hover:bg-indigo-700 text-white text-[10px] font-black px-4 py-2 rounded-xl transition-all uppercase flex items-center gap-1.5">
          <i class="fas fa-plus text-[9px]"></i>Nova Tarefa
        </button>
      </div>
    </div>

    <!-- Seletor de vista -->
    <div class="px-5 py-2.5 flex gap-1 border-b border-slate-100 flex-wrap">
      <button onclick="_trkMudarVista('lista')"       id="trk-tab-lista"      class="trk-tab-btn trk-tab-ativo">
        <i class="fas fa-list text-[9px] mr-1.5"></i>Lista
      </button>
      <button onclick="_trkMudarVista('kanban')"      id="trk-tab-kanban"     class="trk-tab-btn">
        <i class="fas fa-columns text-[9px] mr-1.5"></i>Kanban
      </button>
      <button onclick="_trkMudarVista('timeline')"    id="trk-tab-timeline"   class="trk-tab-btn">
        <i class="fas fa-stream text-[9px] mr-1.5"></i>Timeline
      </button>
      <button onclick="_trkMudarVista('calendario')"  id="trk-tab-calendario" class="trk-tab-btn">
        <i class="fas fa-calendar-alt text-[9px] mr-1.5"></i>Calendário
      </button>
      <button onclick="_trkMudarVista('dashboard')"   id="trk-tab-dashboard"  class="trk-tab-btn">
        <i class="fas fa-chart-bar text-[9px] mr-1.5"></i>Dashboard
      </button>
    </div>

    <!-- Filtros -->
    <div class="px-5 py-3 flex flex-wrap gap-2 items-center">
      <div class="relative">
        <i class="fas fa-search absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-300 text-[10px]"></i>
        <input type="text" id="trkBusca" placeholder="Buscar tarefas..."
          oninput="_trkFiltrar()"
          style="padding:7px 10px 7px 26px;border:1.5px solid #e2e8f0;border-radius:10px;font-size:11px;outline:none;width:170px"
          onfocus="this.style.borderColor='#6366f1'" onblur="this.style.borderColor='#e2e8f0'">
      </div>
      <select id="trkFiltroStatus" onchange="_trkFiltrar()"
        style="padding:7px 10px;border:1.5px solid #e2e8f0;border-radius:10px;font-size:11px;outline:none;color:#475569">
        <option value="">Todos os status</option>
        <option value="backlog">Backlog</option>
        <option value="solicitada">Solicitada</option>
        <option value="em_analise">Em Análise</option>
        <option value="aguardando_doc">Aguard. Documento</option>
        <option value="em_execucao">Em Execução</option>
        <option value="aguardando_aprovacao">Aguard. Aprovação</option>
        <option value="concluida">Concluída</option>
        <option value="cancelada">Cancelada</option>
        <option value="bloqueada">Bloqueada</option>
      </select>
      <select id="trkFiltroPrioridade" onchange="_trkFiltrar()"
        style="padding:7px 10px;border:1.5px solid #e2e8f0;border-radius:10px;font-size:11px;outline:none;color:#475569">
        <option value="">Todas as prioridades</option>
        <option value="critica">Crítica</option>
        <option value="alta">Alta</option>
        <option value="media">Média</option>
        <option value="baixa">Baixa</option>
      </select>
      <select id="trkFiltroModulo" onchange="_trkFiltrar()"
        style="padding:7px 10px;border:1.5px solid #e2e8f0;border-radius:10px;font-size:11px;outline:none;color:#475569">
        <option value="">Todos os módulos</option>
        <option value="manual">Manual</option>
        <option value="reservas">Reservas</option>
        <option value="contratos">Contratos</option>
        <option value="chaves">Chaves</option>
        <option value="rh">RH</option>
        <option value="comunicacao">Comunicação</option>
        <option value="almoxarifado">Almoxarifado</option>
        <option value="financeiro">Financeiro</option>
        <option value="manutencao">Manutenção</option>
      </select>
      <button onclick="_trkRedefinirFiltros()" title="Redefinir filtros"
        style="padding:7px 10px;border:1.5px solid #e2e8f0;border-radius:10px;font-size:11px;color:#94a3b8;background:white;cursor:pointer">
        <i class="fas fa-times text-[10px]"></i>
      </button>
    </div>
  </div>

  <!-- ══ STATS BAR ═══════════════════════════════════════════════════════════ -->
  <div id="trkStatsBar" class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-4"></div>

  <!-- ══ VISÃO: LISTA ════════════════════════════════════════════════════════ -->
  <div id="trk-v-lista" class="bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden">
    <div id="trkListaContainer">
      <div class="p-10 text-center">
        <i class="fas fa-spinner animate-spin text-indigo-300 text-xl"></i>
        <p class="text-[11px] text-slate-400 mt-2">Carregando tarefas...</p>
      </div>
    </div>
  </div>

  <!-- ══ VISÃO: KANBAN ════════════════════════════════════════════════════════ -->
  <div id="trk-v-kanban" class="hidden">
    <div id="trkKanbanContainer" class="overflow-x-auto pb-4">
      <div class="p-10 text-center">
        <i class="fas fa-spinner animate-spin text-indigo-300 text-xl"></i>
      </div>
    </div>
  </div>

  <!-- ══ VISÃO: TIMELINE ══════════════════════════════════════════════════════ -->
  <div id="trk-v-timeline" class="hidden bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden">
    <div id="trkTimelineContainer" class="p-5"></div>
  </div>

  <!-- ══ VISÃO: CALENDÁRIO ═══════════════════════════════════════════════════ -->
  <div id="trk-v-calendario" class="hidden bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden">
    <div id="trkCalendarioContainer" class="p-5"></div>
  </div>

  <!-- ══ VISÃO: DASHBOARD ════════════════════════════════════════════════════ -->
  <div id="trk-v-dashboard" class="hidden">
    <div id="trkDashboardContainer">
      <div class="p-10 text-center">
        <i class="fas fa-spinner animate-spin text-indigo-300 text-xl"></i>
      </div>
    </div>
  </div>

</section>

<style>
.trk-tab-btn {
  padding: 6px 14px;
  border-radius: 8px;
  font-size: 10px;
  font-weight: 900;
  text-transform: uppercase;
  letter-spacing: .05em;
  border: 1.5px solid transparent;
  cursor: pointer;
  transition: all .15s;
  background: transparent;
  color: #94a3b8;
}
.trk-tab-btn:hover { background: #f1f5f9; color: #475569; }
.trk-tab-ativo { background: #eef2ff !important; color: #4f46e5 !important; border-color: #c7d2fe !important; }

.trk-card {
  background: white;
  border: 1.5px solid #e2e8f0;
  border-radius: 14px;
  padding: 12px;
  margin-bottom: 8px;
  cursor: grab;
  transition: box-shadow .15s, transform .1s;
  user-select: none;
}
.trk-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,.08); }
.trk-card.trk-drag-source { opacity: .4; transform: rotate(1deg); }

.trk-col-drop-active { background: #eef2ff !important; border-color: #6366f1 !important; }

.trk-stat-card {
  background: white;
  border: 1.5px solid #e2e8f0;
  border-radius: 18px;
  padding: 16px 20px;
}

.trk-bar {
  height: 8px;
  border-radius: 99px;
  background: #e2e8f0;
  overflow: hidden;
}
.trk-bar-fill {
  height: 100%;
  border-radius: 99px;
  transition: width .4s ease;
}
</style>
