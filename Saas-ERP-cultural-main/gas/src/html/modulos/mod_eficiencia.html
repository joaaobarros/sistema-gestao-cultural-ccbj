<!--
@file mod_eficiencia.html
@type module
@description Painel de eficiência operacional — métricas derivadas das reservas existentes.
@responsibility Estrutura HTML + JS da aba #aba-eficiencia.
@dependencies GAS.eficiencia, escaparHTML, temPermissao
-->
<section id="aba-eficiencia" class="tab-content hidden pb-20">

  <div class="bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden">

    <!-- HEADER -->
    <div class="p-5 border-b border-slate-100 bg-slate-50/50 flex flex-wrap justify-between items-center gap-3">
      <div>
        <h3 class="font-black text-slate-800 uppercase tracking-tighter text-sm">
          <i class="fas fa-gauge-high text-violet-500 mr-2"></i>Eficiência Operacional
        </h3>
        <p class="text-[10px] text-slate-400 font-medium">Indicadores de uso e ocupação dos espaços</p>
      </div>
      <button onclick="mostrarAba('aba-lista-reservas')"
        class="bg-violet-100 hover:bg-violet-200 text-violet-700 text-[10px] font-black px-4 py-2 rounded-xl transition-all uppercase flex items-center gap-1.5">
        <i class="fas fa-calendar-alt text-[9px]"></i>Ver Agenda
      </button>
    </div>

    <!-- CARDS KPI -->
    <div id="eficienciaKPIs" class="p-5 grid grid-cols-2 md:grid-cols-4 gap-4"></div>

    <!-- GRÁFICO SALAS + MENSAL -->
    <div class="px-5 pb-6 grid md:grid-cols-2 gap-5">

      <div style="background:#f8fafc;border:1.5px solid #e2e8f0;border-radius:16px;padding:16px">
        <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-3">
          <i class="fas fa-door-open text-violet-300 mr-1"></i>Uso por Espaço
        </p>
        <div id="eficienciaSalas"></div>
      </div>

      <div style="background:#f8fafc;border:1.5px solid #e2e8f0;border-radius:16px;padding:16px">
        <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-3">
          <i class="fas fa-calendar-alt text-violet-300 mr-1"></i>Agendamentos por Mês
        </p>
        <div id="eficienciaMensal"></div>
      </div>

    </div>

  </div>

</section>
