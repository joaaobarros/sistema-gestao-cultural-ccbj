function validarConflitoTempoReal() {

  const horaInicio = document.getElementById('horaInicio');
  const horaTermino = document.getElementById('horaTermino');
  const selectSala = document.getElementById('selectSala');
  const aviso = document.getElementById('avisoHorarioOcupado');

  if (!horaInicio?.value || !horaTermino?.value || !selectSala?.value) return;

  const datas = (typeof calendarInstance !== 'undefined' && calendarInstance?.selectedDates?.length)
    ? calendarInstance.selectedDates.map(d => flatpickr.formatDate(d, "d/m/Y"))
    : [];

  if (datas.length === 0) return;

  const dados = {
    horaInicio: horaInicio.value,
    horaTermino: horaTermino.value,
    sala: selectSala.value
  };

  const c = verificarConflitoFrontend(dados, datas, null);

  horaInicio.classList.remove('border-red-500');
  horaTermino.classList.remove('border-red-500');
  aviso.classList.add('hidden');
  aviso.innerHTML = '';

  const btnSubmit = document.querySelector('#formReserva button[type="submit"]');
  if (btnSubmit) btnSubmit.disabled = false;
  if (!c.conflito) return;

  if (c.tipo === 'INICIO') {
    horaInicio.classList.add('border-red-500');
    aviso.innerHTML = `⚠️ Conflito no início. Use após ${c.sugestao}`;
  } else if (c.tipo === 'FIM') {
    horaTermino.classList.add('border-red-500');
    aviso.innerHTML = `⚠️ Conflito no término. Termine antes de ${c.reserva[2]}`;
  } else {
    horaInicio.classList.add('border-red-500');
    horaTermino.classList.add('border-red-500');
    aviso.innerHTML = `⚠️ Período ocupado (${c.reserva[2]}–${c.reserva[3]})`;
  }

  aviso.classList.remove('hidden');
  if (btnSubmit) btnSubmit.disabled = c.conflito;
}

function obterHorariosLivresComIntervalo(sala, data) {

  const dataKey = normalizarDataKey(data);
  const salaKey = String(sala);

  const reservas =
    AppState.cacheReservasIndex?.[dataKey]?.[salaKey] || [];

  const normHora = h => {
    const [hh, mm] = String(h).split(':').map(Number);
    return hh * 60 + mm;
  };

  const toHora = m => {
    const h = String(Math.floor(m / 60)).padStart(2,'0');
    const min = String(m % 60).padStart(2,'0');
    return `${h}:${min}`;
  };

  const inicioDia = 8 * 60;
  const fimDia = 21 * 60 + 30;

  let ocupados = [];

  reservas.forEach(r => {
    if (String(r[4]) !== String(sala)) return;
    if ((r[13] || '').toUpperCase() === 'CANCELADO') return;

    ocupados.push({
      inicio: normHora(r[2]),
      fim: normHora(r[3])
    });
  });

  ocupados.sort((a,b)=>a.inicio-b.inicio);

  let livres = [];
  let cursor = inicioDia;

  ocupados.forEach(o => {
    if (cursor < o.inicio) {
      livres.push({inicio: cursor, fim: o.inicio});
    }
    cursor = Math.max(cursor, o.fim);
  });

  if (cursor < fimDia) {
    livres.push({inicio: cursor, fim: fimDia});
  }

  return livres.map(l => ({
    inicio: toHora(l.inicio),
    fim: toHora(l.fim)
  }));
}

function obterSalasDisponiveisPorData(data, horaInicio, horaTermino) {

  const salas = AppState.colecoes.salas || [];

  const normHora = h => {
    const p = String(h || '').split(':');
    return parseInt(p[0]) * 60 + parseInt(p[1]);
  };

  const inicio = normHora(horaInicio);
  const termino = normHora(horaTermino);

  const dataKey = normalizarDataKey(data);
  if (!dataKey) return [];

  return salas.filter(s => {

    const idSala = String(s[0]).trim();

    const reservasSala =
      AppState.cacheReservasIndex?.[dataKey]?.[idSala] || [];

    const conflito = reservasSala.some(r => {

      if ((r[13] || '').toUpperCase() === 'CANCELADO') return false;

      const ini = normHora(r[2]);
      const ter = normHora(r[3]);

      return inicio < ter && termino > ini;

    });

    return !conflito;

  }).map(s => ({
    id: s[0],
    nome: s[1]
  }));

}

function salvarPreferenciasUsuario(contexto) {

  try {

    const prefs = JSON.parse(localStorage.getItem('prefsReserva') || '{}');

    // 🔵 SALAS
    if (contexto.sala) {
      prefs.salas = prefs.salas || {};
      prefs.salas[contexto.sala] = (prefs.salas[contexto.sala] || 0) + 1;
    }

    // 🔵 FAIXA DE HORÁRIO
    if (contexto.horaInicio) {
      const hora = parseInt(contexto.horaInicio.split(':')[0]);
      let faixa = 'noite';

      if (hora < 12) faixa = 'manha';
      else if (hora < 18) faixa = 'tarde';

      prefs.faixas = prefs.faixas || {};
      prefs.faixas[faixa] = (prefs.faixas[faixa] || 0) + 1;
    }

    // 🟣 ITENS (fixos ou volantes)
    if (contexto.itensVolantes) {

      let itens = [];

      if (Array.isArray(contexto.itensVolantes)) {
        itens = contexto.itensVolantes;
      } else if (typeof contexto.itensVolantes === 'string') {
        itens = contexto.itensVolantes.split(',').map(i => i.trim());
      }

      prefs.itens = prefs.itens || {};

      itens.forEach(item => {
        if (!item) return;
        prefs.itens[item] = (prefs.itens[item] || 0) + 1;
      });
    }

    localStorage.setItem('prefsReserva', JSON.stringify(prefs));

  } catch(e) {}
}

function ordenarSugestoesPorPreferencia(sugestoes, contexto) {

  try {

    const prefs = JSON.parse(localStorage.getItem('prefsReserva') || '{}');

    return sugestoes.sort((a, b) => {

      let scoreA = 0;
      let scoreB = 0;

      // 🔵 SALA
      if (prefs.salas) {
        scoreA += prefs.salas[a.sala] || 0;
        scoreB += prefs.salas[b.sala] || 0;
      }

      // 🔵 FAIXA DE HORÁRIO
      const getFaixa = (h) => {
        const hora = parseInt(h.split(':')[0]);
        if (hora < 12) return 'manha';
        if (hora < 18) return 'tarde';
        return 'noite';
      };

      if (prefs.faixas) {
        scoreA += prefs.faixas[getFaixa(a.horaInicio)] || 0;
        scoreB += prefs.faixas[getFaixa(b.horaInicio)] || 0;
      }

      // 🟣 ITENS (PREFERÊNCIA CONTEXTUAL)
      if (prefs.itens && contexto?.itensVolantes) {

        let itensContexto = [];

        if (Array.isArray(contexto.itensVolantes)) {
          itensContexto = contexto.itensVolantes;
        } else if (typeof contexto.itensVolantes === 'string') {
          itensContexto = contexto.itensVolantes.split(',').map(i => i.trim());
        }

        itensContexto.forEach(item => {
          scoreA += prefs.itens[item] || 0;
          scoreB += prefs.itens[item] || 0;
        });
      }

      return scoreB - scoreA;

    });

  } catch(e) {
    return sugestoes;
  }
}


async function chamarIAComFallback(prompt) {
  return new Promise((resolve) => {
    google.script.run
      .withSuccessHandler(function(res) {
        if (res && res.ok) { resolve(res.texto || ''); }
        else { resolve(interpretarIntencaoLocal(prompt)); }
      })
      .withFailureHandler(function() {
        resolve(interpretarIntencaoLocal(prompt));
      })
      .chamarIA(prompt);
  });
}

function interpretarIntencaoLocal(texto) {

  texto = texto.toLowerCase();

  if (texto.includes('sugere') || texto.includes('opção')) {
    return 'SUGESTAO';
  }

  if (texto.includes('conflito') || texto.includes('disponível')) {
    return 'ANALISE';
  }

  return 'ANALISE';
}

  fixos.forEach(f => {
    sugestoes.push({

    });
  });

  itens.forEach(i => {

      nome.includes('som') ||

    ) {

      });
    }
  });

  return sugestoes;
}

async function chamarIAUnificada(contexto) {

  const prompt = `
Você é uma IA de análise de dados de agendamentos.

Gere:
1. Estrutura de relatório
2. Conteúdo melhorado
3. Insights (máx 5)

REGRAS:
- Não inventar dados
- Seja direto
- Linguagem profissional

ENTRADA:
${JSON.stringify(contexto)}

Responda SOMENTE JSON:

{
  "titulo": "...",
  "secoes": [
    { "titulo": "...", "conteudo": "..." }
  ],
  "insights": ["..."]
}
`;

  try {

    const resposta = await Promise.race([
      chamarIAComFallback(prompt),
      new Promise((_, reject) =>
        setTimeout(() => reject(new Error('Timeout IA')), 8000)
      )
    ]);

    return parseSeguroJSON(resposta);

  } catch (e) {

    console.warn('IA falhou:', e.message);
    return null;
  }
}

function parseSeguroJSON(resposta) {

  try {
    return JSON.parse(resposta);
  } catch {

    const match = resposta.match(/\{[\s\S]*\}/);
    if (match) {
      try {
        return JSON.parse(match[0]);
      } catch {}
    }

    return null;
  }
}

function sugerirCenarioInteligente(contexto) {

  const nome = (contexto.nome || '').toLowerCase();
  const setor = contexto.setor;
  const data = contexto.data;

  const salas = AppState.colecoes.salas || [];
  const horarios = gerarHorariosBase();

  const recHorario = calcularRecorrenciaHorario(nome);
  const prefUsuario = calcularPreferenciaUsuario(AppState.usuario.email);

  const cenarios = [];

  salas.forEach(sala => {

    const nomeSala = String(sala.nome || sala[1] || sala[0]).toLowerCase();

    if (!validarRegrasDuras(nomeSala, data, setor)) return;

    horarios.forEach(hora => {

      let score = 0;

      if (detectarTipoAcao(nome).some(e => nomeSala.includes(e))) {
        score += 5;
      }

      score += (recHorario[hora] || 0) * 1.5;
      score += (prefUsuario[hora] || 0) * 0.8;
      score += pesoHorario(hora);

      cenarios.push({
        salaId: sala.id || sala[0],
        salaNome: sala.nome || sala[1],
        hora,
        score
      });

    });

  });

  return cenarios.sort((a,b) => b.score - a.score).slice(0,5);
}

  // 🔴 sem data não faz nada
  if (!ctx.data) return;

  const el = getOrCreateAvisoPrevisao();
  el.innerHTML = '';

  // =========================================================
  // 🔴 NÍVEL 1 — USUÁRIO JÁ SABE O QUE QUER (NÃO INTERFERIR)
  // =========================================================
  if (ctx.sala && ctx.inicio && ctx.fim) {

    google.script.run
      .withSuccessHandler(renderizarPrevisaoInline)
      .withFailureHandler(err => console.warn(err))
      .analisarDisponibilidadeReal({
        sala: ctx.sala,
        horaInicio: ctx.inicio,
        horaTermino: ctx.fim,
        datas: [ctx.data]
      });

    return;
  }

  // =========================================================
  // 🟡 NÍVEL 2 — USUÁRIO EXPLORANDO (SUGESTÃO LEVE)
  // =========================================================
  if (ctx.nome && !ctx.sala) {
    try {
      let cenarios = sugerirCenarioInteligente(ctx);
      cenarios = filtrarCenariosSemConflito(cenarios, ctx);
      if (cenarios.length) {
        const top = cenarios.slice(0, 3);
        let html = `
          <div class="p-3 bg-indigo-50 border border-indigo-100 rounded-xl">
            <p class="text-[10px] font-black text-indigo-600 uppercase tracking-widest mb-2">
              <i class="fas fa-wand-magic-sparkles mr-1"></i>Sugestões para "${escaparHTML(ctx.nome.slice(0,30))}"
            </p>
            <div class="flex flex-wrap gap-2">`;
        top.forEach(c => {
          html += `<button type="button"
            onclick="selecionarSala('${escaparHTML(c.salaId)}'); aplicarSugestaoHorario('${c.hora}')"
            class="px-3 py-1.5 bg-white border border-indigo-200 hover:bg-indigo-600 hover:text-white text-indigo-700 text-[10px] font-black rounded-xl transition-all">
            ${escaparHTML(c.salaNome)} · ${c.hora}
          </button>`;
        });
        html += `</div></div>`;
        el.innerHTML = html;
      }
    } catch (e) { console.warn('Erro sugestão:', e); }
    return;
  }

  // =========================================================
  // 🔵 NÍVEL 3 — ESPAÇO ESCOLHIDO, MAS SEM HORÁRIO
  // =========================================================
  if (ctx.sala && !ctx.inicio) {

    try {

      const sugestao = sugerirHorarioPorRegras(ctx);

      if (sugestao) {
        el.innerHTML = `
          <div style="font-size:12px;color:#334155;">
            💡 ${sugestao}
          </div>
        `;
      }

    } catch (e) {
      console.warn(e);
    }

    return;
  }

  // =========================================================
  // 🟣 NÍVEL 4 — SÓ DATA (CONTEXTO GERAL)
  // =========================================================
  if (ctx.data && !ctx.nome && !ctx.sala) {

    const sugestao = sugerirPadraoDiaSemana(ctx.data);

    if (sugestao) {
      el.innerHTML = `
        <div style="font-size:12px;color:#64748b;">
          ℹ️ ${sugestao}
        </div>
      `;
    }

  }
}

function sugerirHorarioPorRegras(ctx) {

  const dia = new Date(ctx.data.split('/').reverse().join('-')).getDay();

  if (ctx.sala.toLowerCase() === 'teatro') {

    if (dia >= 1 && dia <= 3) return 'Prioridade: Escola (manhã/tarde)';
    if (dia >= 4 && dia <= 6) return 'Prioridade: Ação Cultural (noite)';

  }

  return null;
}

function sugerirPadraoDiaSemana(data) {

  const dia = new Date(data.split('/').reverse().join('-')).getDay();

  if (dia === 6 || dia === 0) {
    return 'Alta demanda — priorize horários antecipados';
  }

  return 'Dia regular — boa disponibilidade';
}

function atualizarTudoTempoReal() {
  try {
    if (typeof validarHorarios === 'function') validarHorarios();
    if (typeof atualizarDisponibilidadeItens === 'function') atualizarDisponibilidadeItens();

    const data = calendarInstance?.selectedDates?.[0];
    const inicio = document.getElementById('horaInicio')?.value;
    const termino = document.getElementById('horaTermino')?.value;

    if (data && inicio && termino) {
      const dataStr = flatpickr.formatDate(data, "d/m/Y");
      const salasDisp = obterSalasDisponiveisPorData(dataStr, inicio, termino);
      const salaAtual = document.getElementById('selectSala')?.value;
      const container = document.getElementById('salasDisponiveis');
      if (container) {
        const filtradas = salasDisp.filter(s => String(s.id) !== String(salaAtual));
        if (filtradas.length > 0) {
          container.innerHTML = filtradas.map(s =>
            `<button type="button" onclick="selecionarSala('${escaparHTML(s.id)}')"
              class="px-2 py-1 bg-purple-100 hover:bg-purple-600 hover:text-white text-purple-700 text-xs font-black rounded-xl mr-1 mb-1 transition-all">
              ${escaparHTML(s.nome)}
            </button>`
          ).join('');
        } else {
          container.innerHTML = '<span class="text-xs text-slate-400 italic">Nenhuma sala disponível neste horário</span>';
        }
      }
    }

    if (typeof mostrarHorariosDisponiveisUI === 'function') mostrarHorariosDisponiveisUI();
    if (typeof validarConflitoTempoReal === 'function') validarConflitoTempoReal();

  } catch (e) {
    console.warn('Erro em atualização tempo real:', e);
  }
}

function aplicarSugestaoCompleta(sugestao) {
  if (!sugestao) return;
  Swal.close();
  if (sugestao.salaId) {
    const sel = document.getElementById('selectSala');
    if (sel) {
      sel.value = sugestao.salaId;
      sel.dispatchEvent(new Event('change'));
    }
  }
  const horaIni = document.getElementById('horaInicio');
  const horaTer = document.getElementById('horaTermino');
  if (horaIni && sugestao.horaInicio) horaIni.value = sugestao.horaInicio;
  if (horaTer && sugestao.horaTermino) horaTer.value = sugestao.horaTermino;
  if (sugestao.data && calendarInstance) {
    const p = String(sugestao.data).split('/');
    if (p.length === 3) calendarInstance.setDate(new Date(p[2], p[1] - 1, p[0]), true);
  }
  if (typeof validarHorarios === 'function') validarHorarios();
  if (typeof atualizarTudoTempoReal === 'function') atualizarTudoTempoReal();
}

function reescreverDescricaoComIA() {
  const textarea = document.getElementById('codipDescricaoAcao');
  const setor    = document.getElementById('selectSetor')?.value || '';
  const texto    = (textarea?.value || '').trim();

  if (!texto || texto.length < 10) {
    Swal.fire('Atenção', 'Escreva ao menos uma frase na descrição antes de usar a IA.', 'warning');
    return;
  }

  const btn = document.getElementById('btnDescricaoIA');
  if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner animate-spin text-[9px]"></i> Processando...'; }

  google.script.run
    .withSuccessHandler(function(res) {
      if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fas fa-brain text-[9px]"></i>Reescrever com IA'; }
      if (!res || !res.ok) {
        Swal.fire('IA indisponível', res?.texto || 'Falha ao chamar a IA.', 'error');
        return;
      }
      const textoGerado = (res.texto || '').replace(/^["']|["']$/g, '').trim();
      const contador    = document.getElementById('codipDescricaoContador');
      Swal.fire({
        title: 'Sugestão da IA',
        html: `
          <p class="text-xs text-slate-500 mb-2 font-bold">${textoGerado.length} caracteres</p>
          <div class="p-3 bg-purple-50 rounded-xl text-left text-sm text-slate-700 leading-relaxed border border-purple-200">
            ${escaparHTML(textoGerado)}
          </div>`,
        showCancelButton: true,
        confirmButtonText: 'Usar este texto',
        cancelButtonText:  'Manter original',
        confirmButtonColor: '#7c3aed'
      }).then(function(result) {
        if (result.isConfirmed && textarea) {
          textarea.value = textoGerado;
          if (contador) contador.textContent = textoGerado.length + '/400';
        }
      });
    })
    .withFailureHandler(function(err) {
      if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fas fa-brain text-[9px]"></i>Reescrever com IA'; }
      Swal.fire('Erro', err.message, 'error');
    })
    .reescreverDescricaoAcaoIA(texto, setor);
}

function exportarCODIPCSV() {
  const lista = _codipCache;
  if (!lista.length) { Swal.fire('Sem dados', 'Nenhum registro para exportar.', 'info'); return; }
  const cab = ['ID Reserva','Nome Ação','Mês Ref','Tipo Ação','Eixo','Segmento I','Linguagem I',
    'Modalidade','Público Presencial','Público Virtual','Visualizações','PCD','Idosos',
    'Voluntários','Horas Mês','Horas Total','Setor','Responsável','Descrição da Ação'];
  const linhas = [cab.join(';')];
  lista.forEach(r => {
    linhas.push([r.idReserva,r.nomeAcao,r.mesRef,r.tipoAcao,r.eixo,r.segmento1,r.linguagem1,
      r.modalidade,r.pubPresencial,r.pubVirtual,r.visualizacoes,r.pcd,r.idosos,
      r.voluntarios,r.horasMes,r.horasTotal,r.setor,r.responsavel,r.descricaoAcao]
      .map(v => `"${String(v||'').replace(/"/g,'""')}"`).join(';'));
  });
  const blob = new Blob(['\uFEFF'+linhas.join('\n')], { type:'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `codip_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
}

function _fmtDataCtr(v) {
  if (!v) return '';
  try {
    const d = (v instanceof Date) ? v : new Date(v);
    if (isNaN(d.getTime())) return String(v);
    return String(d.getDate()).padStart(2,'0') + '/' +
           String(d.getMonth()+1).padStart(2,'0') + '/' + d.getFullYear();
  } catch(e) { return String(v||''); }
}

function _fmtMoeda(v) {
  const n = Number(v) || 0;
  // Formato brasileiro: R$ 1.234,56
  const partes = n.toFixed(2).split('.');
  partes[0] = partes[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  return 'R$\u00a0' + partes[0] + ',' + partes[1];
}

// Input monetário: converte "1.234,56" → 1234.56
function _parseMoeda(str) {
  if (!str) return 0;
  // Remove tudo exceto dígitos e vírgula/ponto
  const limpo = String(str).replace(/R\$|\s/g,'').trim();
  // Formato BR: pontos como milhar, vírgula como decimal
  const normalizado = limpo.replace(/\./g,'').replace(',','.');
  return parseFloat(normalizado) || 0;
}

// Aplica máscara monetária BR em tempo real
function _mascaraMoeda(el) {
  el.addEventListener('input', function() {
    var v = this.value.replace(/\D/g,'');
    if (!v) { this.value = ''; return; }
    v = (parseInt(v,10) / 100).toFixed(2);
    var partes = v.split('.');
    partes[0] = partes[0].replace(/\B(?=(\d{3})+(?!\d))/g,'.');
    this.value = partes[0] + ',' + partes[1];
  });
}

function _totalRubricas(idMeta) {
  return (_ctrCache.rubricas || [])
    .filter(function(r){ return r.idMeta === idMeta; })
    .reduce(function(s,r){ return s + (Number(r.valor)||0); }, 0);
}

function _totalContrato(idContrato) {
  return (_ctrCache.metas || [])
    .filter(function(m){ return m.idContrato === idContrato; })
    .reduce(function(s,m){ return s + _totalRubricas(m.id); }, 0);
}

function _pctContrato(idContrato) {
  const total = Number((_ctrCache.contratos||[]).find(function(c){ return c.id===idContrato; })?.valorTotal) || 0;
  if (!total) return null;
  const usado = _totalContrato(idContrato);
  return Math.min(100, Math.round(usado/total*100));
}

      text-transform:uppercase; letter-spacing:.07em; white-space:nowrap;
    }
    .ctr-collapse-btn {
      background:none; border:none; cursor:pointer; padding:4px 8px;
      border-radius:8px; transition:background .15s; color:#94a3b8;
      font-size:12px; display:flex; align-items:center; gap:4px;
    }
    .ctr-collapse-btn:hover { background:#f1f5f9; color:#6366f1; }
    .ctr-progress-bar {
      height:6px; background:#e2e8f0; border-radius:99px; overflow:hidden; margin-top:6px;
    }
    .ctr-progress-fill {
      height:100%; border-radius:99px;
      background:linear-gradient(90deg,#6366f1,#8b5cf6);
      transition:width .4s;
    }
    .ctr-financeiro-grid {
      display:grid; grid-template-columns:1fr 1fr; gap:12px;
    }
    @media(max-width:520px){
      .ctr-financeiro-grid { grid-template-columns:1fr; }
      .ctr-grid-meses { grid-template-columns:repeat(6,1fr) !important; }
    }
  `;
  document.head.appendChild(s);
})();

// ── TOGGLE COLLAPSE ───────────────────────────────────────────
function _ctrToggle(idContrato) {
  _ctrColapsados[idContrato] = !_ctrColapsados[idContrato];
  const corpo = document.getElementById('ctr-body-' + idContrato);
  const icon  = document.getElementById('ctr-icon-' + idContrato);
  if (!corpo) return;
  if (_ctrColapsados[idContrato]) {
    corpo.style.display = 'none';
    if (icon) icon.className = 'fas fa-chevron-down';
  } else {
    corpo.style.display = '';
    if (icon) icon.className = 'fas fa-chevron-up';
  }
}

// ── RENDERIZAR ÁRVORE ─────────────────────────────────────────
function renderizarContratos() {
  const container = document.getElementById('listaContratos');
  if (!container) return;

  if (!_ctrCache || !_ctrCache.contratos || !_ctrCache.contratos.length) {
    container.innerHTML = '<p class="text-[11px] text-slate-400 text-center py-8 italic">Nenhum contrato cadastrado.</p>';
    return;
  }

  const _NM = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];

  container.innerHTML = _ctrCache.contratos.map(function(ctr) {
    const totalCtr   = _totalContrato(ctr.id);
    const valorTotal = Number(ctr.valorTotal) || 0;
    const pct        = valorTotal > 0 ? Math.min(100, Math.round(totalCtr/valorTotal*100)) : null;
    const metas      = (_ctrCache.metas||[]).filter(function(m){ return m.idContrato===ctr.id; });
    const statusCor  = ctr.status === 'Ativo' ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-100 text-slate-500';
    const colapsado  = _ctrColapsados[ctr.id];

    const metasHtml = metas.length ? metas.map(function(meta) {
      const totalMeta = _totalRubricas(meta.id);
      const inds      = (_ctrCache.indicadores||[]).filter(function(i){ return i.idMeta===meta.id; });
      const rubs      = (_ctrCache.rubricas||[]).filter(function(r){ return r.idMeta===meta.id; });

      const rubsHtml = rubs.length
        ? rubs.map(function(r) {
            return `<div class="flex items-center justify-between gap-2 py-1 border-b border-slate-100 last:border-0">
              <span class="text-[11px] font-semibold text-slate-600 truncate"><i class="fas fa-tag text-indigo-300 text-[9px] mr-1"></i>${escaparHTML(r.nome)}</span>
              <div class="flex items-center gap-1.5 shrink-0">
                <span class="text-[11px] font-black text-emerald-600">${_fmtMoeda(r.valor)}</span>
                <button onclick="editarRubrica('${escaparHTML(r.id)}')"
                  class="w-5 h-5 flex items-center justify-center text-slate-300 hover:text-indigo-600 rounded transition-all text-[9px]">
                  <i class="fas fa-edit"></i></button>
                <button onclick="excluirRubricaUI('${escaparHTML(r.id)}')"
                  class="w-5 h-5 flex items-center justify-center text-slate-300 hover:text-red-500 rounded transition-all text-[9px]">
                  <i class="fas fa-trash"></i></button>
              </div>
            </div>`;
          }).join('')
        : '<p class="text-[10px] text-slate-300 italic py-1">Sem rubricas.</p>';

      const indsHtml = inds.length
        ? inds.map(function(ind) {
            return `<div class="flex items-center justify-between gap-2 py-1.5 border-b border-slate-100 last:border-0">
              <div class="flex items-center gap-2 min-w-0">
                <span class="text-[9px] font-black text-indigo-400 shrink-0">#${escaparHTML(ind.numero||'—')}</span>
                <span class="text-[11px] font-bold text-slate-700 truncate">${escaparHTML(ind.nome||ind.texto||'')}</span>
              </div>
              <div class="flex gap-1 shrink-0">
                <button onclick="editarIndicador('${escaparHTML(ind.id)}')"
                  class="w-6 h-6 flex items-center justify-center text-slate-300 hover:text-indigo-600 hover:bg-indigo-50 rounded-lg transition-all text-[10px]">
                  <i class="fas fa-edit"></i></button>
                <button onclick="excluirIndicadorUI('${escaparHTML(ind.id)}')"
                  class="w-6 h-6 flex items-center justify-center text-slate-300 hover:text-red-500 hover:bg-red-50 rounded-lg transition-all text-[10px]">
                  <i class="fas fa-trash"></i></button>
              </div>
            </div>`;
          }).join('')
        : '<p class="text-[10px] text-slate-300 italic py-1">Sem indicadores.</p>';

      return `
        <div class="ml-3 sm:ml-4 mt-2 border border-indigo-100 rounded-2xl overflow-hidden bg-white">
          <div class="flex items-start justify-between gap-2 p-3 bg-indigo-50/60">
            <div class="min-w-0 flex-1">
              <p class="text-[11px] font-black text-indigo-700 leading-tight">
                Meta ${escaparHTML(meta.numero||'')} — ${escaparHTML(meta.titulo)}
              </p>
              ${meta.descricao ? `<p class="text-[10px] text-slate-400 mt-0.5">${escaparHTML(meta.descricao)}</p>` : ''}
              ${totalMeta > 0 ? `<p class="text-[10px] font-black text-emerald-600 mt-1"><i class="fas fa-coins mr-1 text-[8px]"></i>${_fmtMoeda(totalMeta)} em rubricas</p>` : ''}
            </div>
            <div class="flex gap-1 shrink-0 flex-wrap justify-end">
              <button onclick="abrirModalIndicador('${escaparHTML(meta.id)}','${escaparHTML(ctr.id)}')"
                class="inline-flex items-center gap-1 px-2 py-1 bg-indigo-600 hover:bg-indigo-700 text-white text-[9px] font-black rounded-lg transition-all">
                <i class="fas fa-chart-line text-[8px]"></i>Indicador</button>
              <button onclick="abrirModalRubrica('${escaparHTML(meta.id)}')"
                class="inline-flex items-center gap-1 px-2 py-1 bg-emerald-600 hover:bg-emerald-700 text-white text-[9px] font-black rounded-lg transition-all">
                <i class="fas fa-tag text-[8px]"></i>Rubrica</button>
              <button onclick="editarMeta('${escaparHTML(meta.id)}')"
                class="w-7 h-7 flex items-center justify-center text-slate-400 hover:text-indigo-600 hover:bg-white rounded-lg transition-all text-[10px]">
                <i class="fas fa-edit"></i></button>
              <button onclick="excluirMetaUI('${escaparHTML(meta.id)}')"
                class="w-7 h-7 flex items-center justify-center text-slate-300 hover:text-red-500 hover:bg-white rounded-lg transition-all text-[10px]">
                <i class="fas fa-trash"></i></button>
            </div>
          </div>
          ${rubs.length || true ? `
          <div class="px-3 pt-2 pb-1">
            <p class="text-[9px] font-black text-slate-400 uppercase tracking-widest mb-1">Rubricas</p>
            ${rubsHtml}
          </div>` : ''}
          ${inds.length ? `
          <div class="px-3 pb-3 mt-1 border-t border-slate-100">
            <p class="text-[9px] font-black text-slate-400 uppercase tracking-widest mt-2 mb-1">Indicadores</p>
            ${indsHtml}
          </div>` : ''}

    }).join('')
    : '<p class="ml-4 mt-2 text-[10px] text-slate-300 italic">Sem metas cadastradas.</p>';

    return `
      <div class="border border-slate-200 rounded-2xl overflow-hidden mb-3 shadow-sm">

        <!-- CABEÇALHO DO CONTRATO -->
        <div class="flex items-start gap-3 p-4 bg-white">
          <div class="flex-1 min-w-0">
            <div class="flex flex-wrap items-center gap-2 mb-1">
              <p class="font-black text-slate-800 text-sm leading-tight">${escaparHTML(ctr.nome)}</p>
              <span class="text-[9px] font-black px-2 py-0.5 rounded-full ${statusCor} uppercase">${escaparHTML(ctr.status||'')}</span>
            </div>
            ${ctr.descricao ? `<p class="text-[11px] text-slate-500 mb-1">${escaparHTML(ctr.descricao)}</p>` : ''}

            <!-- Bloco financeiro -->
            <div class="flex flex-wrap gap-x-4 gap-y-0.5 mt-1">
              ${(ctr.vigIni||ctr.vigFim) ? `<span class="text-[10px] text-slate-400"><i class="fas fa-calendar-alt mr-1 text-indigo-300"></i>${_fmtDataCtr(ctr.vigIni)} – ${_fmtDataCtr(ctr.vigFim)}</span>` : ''}
              ${ctr.numero ? `<span class="text-[10px] text-slate-400"><i class="fas fa-hashtag mr-1 text-slate-300"></i>${escaparHTML(ctr.numero)}</span>` : ''}

            </div>

            ${valorTotal > 0 ? `
            <div class="mt-2">
              <div class="flex justify-between items-center mb-1">
                <span class="text-[10px] font-black text-slate-500">Orçamento total: <span class="text-slate-700">${_fmtMoeda(valorTotal)}</span></span>
                ${totalCtr > 0 ? `<span class="text-[10px] font-black ${pct >= 90 ? 'text-red-500' : pct >= 70 ? 'text-amber-500' : 'text-emerald-500'}">${pct}% alocado</span>` : ''}
              </div>
              ${pct !== null ? `<div class="ctr-progress-bar"><div class="ctr-progress-fill" style="width:${pct}%;background:${pct>=90?'linear-gradient(90deg,#ef4444,#f97316)':pct>=70?'linear-gradient(90deg,#f59e0b,#f97316)':'linear-gradient(90deg,#6366f1,#8b5cf6)'}"></div></div>` : ''}
              ${totalCtr > 0 ? `<p class="text-[10px] text-slate-400 mt-1">Rubricas cadastradas: <b class="text-emerald-600">${_fmtMoeda(totalCtr)}</b> · Saldo: <b class="${valorTotal-totalCtr < 0 ? 'text-red-500':'text-slate-600'}">${_fmtMoeda(valorTotal-totalCtr)}</b></p>` : ''}
            </div>` : (totalCtr > 0 ? `
            <div class="inline-flex items-center gap-1.5 mt-1.5 bg-gradient-to-r from-indigo-600 to-purple-600 text-white text-[10px] font-black px-3 py-1 rounded-full">
              <i class="fas fa-coins text-[9px]"></i>Total alocado: ${_fmtMoeda(totalCtr)}
            </div>` : '')}
          </div>

          <!-- Ações -->
          <div class="flex flex-col items-end gap-1.5 shrink-0">
            <div class="flex gap-1 flex-wrap justify-end">
              <button onclick="abrirModalMeta('${escaparHTML(ctr.id)}')"

                <i class="fas fa-plus text-[8px]"></i>Meta</button>
              <button onclick="editarContrato('${escaparHTML(ctr.id)}')"
                class="w-8 h-8 flex items-center justify-center text-slate-400 hover:text-indigo-600 hover:bg-indigo-50 rounded-lg transition-all">
                <i class="fas fa-edit text-xs"></i></button>
              <button onclick="excluirContratoUI('${escaparHTML(ctr.id)}')"
                class="w-8 h-8 flex items-center justify-center text-slate-300 hover:text-red-500 hover:bg-red-50 rounded-lg transition-all">

            <button class="ctr-collapse-btn" onclick="_ctrToggle('${escaparHTML(ctr.id)}')">

          style="${colapsado?'display:none':''}">
          ${metasHtml}
        </div>
      </div>`;
  }).join('');
}

// ── MODAL CONTRATO ────────────────────────────────────────────
function abrirModalContrato(dados) {
  dados = dados || {};
  const valorFmt = dados.valorTotal > 0
    ? (function(){
        var n = Number(dados.valorTotal).toFixed(2);
        var p = n.split('.');
        p[0] = p[0].replace(/\B(?=(\d{3})+(?!\d))/g,'.');
        return p[0]+','+p[1];
      })()
    : '';

  Swal.fire({
    title: dados.id ? 'Editar Contrato' : 'Novo Contrato',
    width: Math.min(660, window.innerWidth - 32),
    html: `
      <div class="text-left space-y-4">

        <!-- Identificação -->
        <div style="background:#f8fafc;border:1.5px solid #e2e8f0;border-radius:16px;padding:16px">
          <p style="font-size:10px;font-weight:900;color:#6366f1;text-transform:uppercase;letter-spacing:.07em;margin-bottom:12px">
            <i class="fas fa-file-contract mr-1"></i>Identificação
          </p>
          <div class="space-y-3">
            <div>
              <label class="ctr-label">Nome / Título do Contrato</label>
              <input id="ctrNome" class="ctr-input" value="${escaparHTML(dados.nome||'')}"
                placeholder="Ex.: Contrato de Gestão CCBJ 2025/2027">
            </div>
            <div class="ctr-financeiro-grid">
              <div>
                <label class="ctr-label">Número / Instrumento</label>
                <input id="ctrNumero" class="ctr-input" value="${escaparHTML(dados.numero||'')}"
                  placeholder="Ex.: 005/2025">
              </div>
              <div>
                <label class="ctr-label">Status</label>
                <select id="ctrStatus" class="ctr-input">
                  <option ${(dados.status||'Ativo')==='Ativo'?'selected':''}>Ativo</option>
                  <option ${dados.status==='Encerrado'?'selected':''}>Encerrado</option>
                  <option ${dados.status==='Suspenso'?'selected':''}>Suspenso</option>
                </select>
              </div>
            </div>
            <div>
              <label class="ctr-label">Objeto / Descrição</label>
              <textarea id="ctrDesc" class="ctr-input ctr-textarea"
                placeholder="Objetivo e escopo do contrato...">${escaparHTML(dados.descricao||'')}</textarea>
            </div>
          </div>
        </div>

        <!-- Vigência -->
        <div style="background:#f8fafc;border:1.5px solid #e2e8f0;border-radius:16px;padding:16px">
          <p style="font-size:10px;font-weight:900;color:#6366f1;text-transform:uppercase;letter-spacing:.07em;margin-bottom:12px">
            <i class="fas fa-calendar-alt mr-1"></i>Vigência
          </p>
          <div class="ctr-financeiro-grid">
            <div>
              <label class="ctr-label">Início</label>
              <input id="ctrIni" class="ctr-input" value="${escaparHTML(_fmtDataCtr(dados.vigIni))}"
                placeholder="01/01/2025">
            </div>
            <div>
              <label class="ctr-label">Fim</label>
              <input id="ctrFim" class="ctr-input" value="${escaparHTML(_fmtDataCtr(dados.vigFim))}"
                placeholder="31/12/2027">
            </div>
          </div>
        </div>

        <!-- Financeiro -->
        <div style="background:#f0fdf4;border:1.5px solid #bbf7d0;border-radius:16px;padding:16px">
          <p style="font-size:10px;font-weight:900;color:#059669;text-transform:uppercase;letter-spacing:.07em;margin-bottom:12px">
            <i class="fas fa-coins mr-1"></i>Financeiro
          </p>
          <div class="space-y-3">
            <div class="ctr-financeiro-grid">
              <div>
                <label class="ctr-label">Valor Total do Contrato</label>
                <div style="position:relative">
                  <span style="position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:12px;font-weight:800;color:#059669">R$</span>
                  <input id="ctrValorTotal" class="ctr-input ctr-input-moeda" style="padding-left:34px"
                    value="${valorFmt}" placeholder="0,00">
                </div>
              </div>
              <div>
                <label class="ctr-label">Fonte de Recurso</label>
                <input id="ctrFonte" class="ctr-input" value="${escaparHTML(dados.fonteRecurso||'')}"
                  placeholder="Ex.: SECULT-CE, Prefeitura...">
              </div>
            </div>
            <div class="ctr-financeiro-grid">
              <div>
                <label class="ctr-label">Contrapartida (R$)</label>
                <div style="position:relative">
                  <span style="position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:12px;font-weight:800;color:#6366f1">R$</span>
                  <input id="ctrContrapartida" class="ctr-input" style="padding-left:34px;color:#6366f1;font-weight:800;text-align:right"
                    value="${(function(){
                      if (!dados.contrapartida) return '';
                      var n=Number(dados.contrapartida).toFixed(2);
                      var p=n.split('.');
                      p[0]=p[0].replace(/\B(?=(\d{3})+(?!\d))/g,'.');
                      return p[0]+','+p[1];
                    })()}" placeholder="0,00">
                </div>
              </div>
              <div>
                <label class="ctr-label">Modalidade</label>
                <select id="ctrModalidade" class="ctr-input">
                  <option value="" ${!dados.modalidade?'selected':''}>Selecione...</option>
                  <option ${dados.modalidade==='Convênio'?'selected':''}>Convênio</option>
                  <option ${dados.modalidade==='Contrato de Gestão'?'selected':''}>Contrato de Gestão</option>
                  <option ${dados.modalidade==='Termo de Fomento'?'selected':''}>Termo de Fomento</option>
                  <option ${dados.modalidade==='Termo de Colaboração'?'selected':''}>Termo de Colaboração</option>
                  <option ${dados.modalidade==='OSC'?'selected':''}>OSC</option>
                  <option ${dados.modalidade==='Outro'?'selected':''}>Outro</option>
                </select>
              </div>
            </div>
            <div>
              <label class="ctr-label">Observações financeiras</label>
              <textarea id="ctrObsFinan" class="ctr-input" style="min-height:48px;resize:vertical"
                placeholder="Parcelas, cronograma financeiro...">${escaparHTML(dados.obsFinanceiro||'')}</textarea>
            </div>
          </div>
        </div>

      </div>`,
    showCancelButton: true,
    confirmButtonText: '<i class="fas fa-save mr-1"></i>Salvar',
    cancelButtonText: 'Cancelar',
    confirmButtonColor: '#6366f1',
    customClass: { popup:'rounded-3xl', confirmButton:'rounded-xl font-black text-sm', cancelButton:'rounded-xl font-bold text-sm' },
    didOpen: function() {
      ['ctrIni','ctrFim'].forEach(function(id) {
        var el = document.getElementById(id);
        if (el && !el._fp) el._fp = flatpickr(el, { dateFormat:'d/m/Y', locale:'pt', allowInput:true });
      });
      var elV = document.getElementById('ctrValorTotal');
      var elC = document.getElementById('ctrContrapartida');
      if (elV) _mascaraMoeda(elV);
      if (elC) _mascaraMoeda(elC);
    },
    preConfirm: function() {
      var nome = document.getElementById('ctrNome')?.value.trim();
      if (!nome) { Swal.showValidationMessage('Nome obrigatório.'); return false; }
      return {
        id:            dados.id||null,
        nome:          nome,
        numero:        document.getElementById('ctrNumero')?.value.trim(),
        descricao:     document.getElementById('ctrDesc')?.value.trim(),
        vigIni:        document.getElementById('ctrIni')?.value.trim(),
        vigFim:        document.getElementById('ctrFim')?.value.trim(),
        status:        document.getElementById('ctrStatus')?.value,
        valorTotal:    _parseMoeda(document.getElementById('ctrValorTotal')?.value),
        fonteRecurso:  document.getElementById('ctrFonte')?.value.trim(),
        contrapartida: _parseMoeda(document.getElementById('ctrContrapartida')?.value),
        modalidade:    document.getElementById('ctrModalidade')?.value,
        obsFinanceiro: document.getElementById('ctrObsFinan')?.value.trim()
      };
    }
  }).then(function(r) {
    if (!r.isConfirmed) return;
    showLoader(true);
    google.script.run
      .withSuccessHandler(function(){ showLoader(false); carregarDadosContratos(renderizarContratos); codipPopularContratos(); })
      .withFailureHandler(_handleServerError)
      .salvarContrato(r.value, AppState.usuario.email);
  });
}

function editarContrato(id) {
  const c = (_ctrCache.contratos||[]).find(function(x){ return x.id===id; });
  if (c) abrirModalContrato(c);
}

function excluirContratoUI(id) {
  const c = (_ctrCache.contratos||[]).find(function(x){ return x.id===id; })||{};
  Swal.fire({
    title: 'Excluir contrato?',
    html: `<p class="text-sm text-slate-600">O contrato <b>${escaparHTML(c.nome||'')}</b> será removido.<br><span class="text-[11px] text-slate-400">Metas e indicadores vinculados não serão removidos automaticamente.</span></p>`,
    icon: 'warning', showCancelButton:true, confirmButtonColor:'#ef4444',
    confirmButtonText:'<i class="fas fa-trash mr-1"></i>Excluir', cancelButtonText:'Cancelar',
    customClass:{ popup:'rounded-3xl', confirmButton:'rounded-xl font-black text-sm', cancelButton:'rounded-xl font-bold text-sm' }
  }).then(function(r){
    if (!r.isConfirmed) return;
    showLoader(true);
    google.script.run
      .withSuccessHandler(function(){ showLoader(false); carregarDadosContratos(renderizarContratos); })
      .withFailureHandler(_handleServerError)
      .excluirContrato(id, AppState.usuario.email);
  });
}

// ── MODAL META ────────────────────────────────────────────────

        ${ctr.nome ? `
        <div class="flex items-center gap-2 px-3 py-2 bg-indigo-50 border border-indigo-100 rounded-xl">
          <i class="fas fa-file-contract text-indigo-400 text-xs shrink-0"></i>

// ── MODAL RUBRICA ─────────────────────────────────────────────
function abrirModalRubrica(idMeta, dados) {
  dados = dados || {};

  const meta = (_ctrCache.metas||[]).find(function(m){
    return m.id === idMeta;
  }) || {};

  Swal.fire({
    title: dados.id ? 'Editar Rubrica' : 'Nova Rubrica',
    width: Math.min(500, window.innerWidth - 32),
    html: `
      <div class="text-left space-y-4">

        ${meta.titulo ? `
        <div class="flex items-center gap-2 px-3 py-2 bg-emerald-50 border border-emerald-100 rounded-xl">
          <i class="fas fa-bullseye text-emerald-400 text-xs shrink-0"></i>
          <span class="text-[10px] font-black text-emerald-500 uppercase tracking-wide shrink-0">Meta:</span>
          <span class="text-[11px] text-emerald-700 font-semibold truncate">
            Meta ${escaparHTML(meta.numero||'')} — ${escaparHTML(meta.titulo)}
          </span>
        </div>` : ''}

        <!-- NOME -->
        <div>
          <label class="ctr-label">Nome da Rubrica</label>
          <input id="rubNome" class="ctr-input"
            value="${escaparHTML(dados.nome||'')}"
            placeholder="Ex.: Cachê artistas, Locação de equipamentos...">
        </div>

        <!-- MEMÓRIA -->
        <div class="mt-2">
          <label class="text-xs font-bold text-slate-500 uppercase">
            Memória de cálculo
          </label>

          <div id="memoriaCalculoContainer" class="mt-2 space-y-2"></div>

          <button type="button"
            onclick="adicionarItemMemoria()"
            class="mt-2 text-xs bg-purple-600 hover:bg-purple-700 text-white px-3 py-2 rounded-xl font-bold">
            + Adicionar item
          </button>
        </div>

        <!-- VALOR AUTOMÁTICO -->
        <div>
          <label class="ctr-label">Valor calculado</label>
          <div class="flex items-center gap-2 mt-1">
            <span class="text-green-600 font-bold">R$</span>
            <input id="rubValor"
              class="ctr-input"
              style="background:#f1f5f9;font-weight:900"
              readonly>
          </div>
        </div>

        <!-- OBS -->
        <div>
          <label class="ctr-label">Observação
            <span class="font-normal normal-case text-slate-300">(opcional)</span>
          </label>
          <textarea id="rubObs" class="ctr-input"
            style="min-height:56px;resize:vertical"
            placeholder="Fonte, restrições de uso...">${escaparHTML(dados.obs||'')}</textarea>
        </div>

      </div>`,

    showCancelButton: true,
    confirmButtonText: '<i class="fas fa-save mr-1"></i>Salvar',
    cancelButtonText: 'Cancelar',
    confirmButtonColor: '#059669',
    customClass: {
      popup:'rounded-3xl',
      confirmButton:'rounded-xl font-black text-sm',
      cancelButton:'rounded-xl font-bold text-sm'
    },

    didOpen: function() {

      // 🔹 reset memória
      memoriaCalculo = [];

      // 🔹 edição → carregar memória do GAS
      if (dados.id) {

        carregarMemoriaRubrica(dados.id);

      } else {

        // nova → inicia com 1 linha
        memoriaCalculo = [{ descricao:'', qtd:1, valor:0 }];
        renderizarMemoria();

      }

    },

    preConfirm: function() {

      var nome = document.getElementById('rubNome')?.value.trim();

      if (!nome){
        Swal.showValidationMessage('Nome da rubrica obrigatório.');
        return false;
      }

      const total = memoriaCalculo.reduce(function(s,i){
        return s + (Number(i.qtd||0) * Number(i.valor||0));
      },0);

      if (total <= 0){
        Swal.showValidationMessage('Adicione itens na memória de cálculo.');
        return false;
      }

      return {
        id: dados.id || null,
        idMeta: idMeta,
        nome: nome,
        valor: total,
        memoriaCalculo: memoriaCalculo,
        obs: document.getElementById('rubObs')?.value.trim()
      };
    }

  }).then(function(r){

    if (!r.isConfirmed) return;

    showLoader(true);

    google.script.run
      .withSuccessHandler(function(){
        showLoader(false);
        carregarDadosContratos(renderizarContratos);
      })
      .withFailureHandler(_handleServerError)
      .salvarRubrica(r.value, AppState.usuario.email);

  });
}

let memoriaCalculo = [];

function adicionarItemMemoria() {
  memoriaCalculo.push({ descricao: '', qtd: 1, valor: 0 });
  renderizarMemoria();
}

function renderizarMemoria() {

  const el = document.getElementById('memoriaCalculoContainer');

  el.innerHTML = memoriaCalculo.map((m, i) => `
    <div class="grid grid-cols-3 gap-2">

      <input placeholder="Descrição"
        value="${m.descricao}"
        onchange="memoriaCalculo[${i}].descricao=this.value"
        class="border px-2 py-1 text-xs rounded">

      <input type="number"
        value="${m.qtd}"
        onchange="memoriaCalculo[${i}].qtd=this.value; atualizarTotalMemoria();"
        class="border px-2 py-1 text-xs rounded">

      <input type="number"
        value="${m.valor}"
        onchange="memoriaCalculo[${i}].valor=this.value; atualizarTotalMemoria();"
        class="border px-2 py-1 text-xs rounded">

    </div>
  `).join('');

  atualizarTotalMemoria();
}

function atualizarTotalMemoria() {

  const total = memoriaCalculo.reduce((s, i) => {
    return s + (Number(i.qtd) * Number(i.valor));
  }, 0);

  const input = document.getElementById('rubricaValor');
  if (input) input.value = total.toFixed(2);
}

function editarRubrica(id) {

  const r = (_ctrCache.rubricas || []).find(function(x){
    return x.id === id;
  });

  if (!r) return;

  abrirModalRubrica(r.idMeta, r);

  carregarMemoriaRubrica(id);

}

// ── MODAL INDICADOR ───────────────────────────────────────────
function abrirModalIndicador(idMeta, idContrato, dados) {
  dados = dados || {};
  const ctr = (_ctrCache.contratos||[]).find(function(c){ return c.id===idContrato; })||{};
  const _parseDt = function(v){
    try{ var d=(v instanceof Date)?v:new Date(v); return isNaN(d.getTime())?null:d; }catch(e){ return null; }
  };
  const vigIni    = _parseDt(ctr.vigIni);
  const vigFim    = _parseDt(ctr.vigFim);
  const anoInicio = vigIni?vigIni.getFullYear():new Date().getFullYear();
  const anoFim    = vigFim?vigFim.getFullYear():anoInicio;
  const _getVal   = function(ano,mes){
    if (!dados.meses) return 0;
    if (!Array.isArray(dados.meses)&&typeof dados.meses==='object') return (dados.meses[ano]||[])[mes]||0;
    if (Array.isArray(dados.meses)&&String(ano)===String(dados.ano||anoInicio)) return dados.meses[mes]||0;
    return 0;
  };
  const _NM = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  const metaVinc = (_ctrCache.metas||[]).find(function(m){ return m.id===idMeta; });

  var faixasHtml = '';
  for (var ano = anoInicio; ano <= anoFim; ano++) {
    var _ano = ano;
    var mesesHtml = _NM.map(function(nm,i){
      var ini=new Date(_ano,i,1), fim=new Date(_ano,i+1,0);
      var fora=(vigIni&&fim<vigIni)||(vigFim&&ini>vigFim);
      var val=_getVal(_ano,i);
      return '<div class="flex flex-col items-center gap-1">'
        +'<span style="font-size:9px;font-weight:700;color:'+(fora?'#cbd5e1':'#64748b')+'">'+ nm+'</span>'
        +'<input type="number" id="indM_'+_ano+'_'+i+'" value="'+val+'" min="0"'
        +(fora?' disabled':'')
        +' style="width:100%;text-align:center;font-size:11px;font-weight:700;border:1.5px solid '+(fora?'#f1f5f9':'#e2e8f0')+';border-radius:8px;padding:5px 2px;outline:none;background:'+(fora?'#f8fafc':'#fff')+';opacity:'+(fora?'.25':'1')+';pointer-events:'+(fora?'none':'auto')+'">'
        +'</div>';
    }).join('');
    faixasHtml += '<div style="margin-bottom:20px">'
      +'<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">'
      +'<span class="ctr-badge-ano">'+_ano+'</span>'
      +'<div style="flex:1;border-top:1.5px solid #e2e8f0"></div>'
      +'</div>'
      +'<div style="display:grid;grid-template-columns:repeat(12,1fr);gap:6px" class="ctr-grid-meses">'+mesesHtml+'</div>'
      +'</div>';
  }
  if (!faixasHtml) faixasHtml='<p style="font-size:11px;color:#94a3b8;font-style:italic;text-align:center;padding:16px">Verifique a vigência do contrato.</p>';

  Swal.fire({
    title: dados.id?'Editar Indicador':'Novo Indicador',
    width: Math.min(740, window.innerWidth - 32),
    html: `
      <div class="text-left space-y-4">
        ${metaVinc ? `
        <div class="flex items-center gap-2 px-3 py-2 bg-indigo-50 border border-indigo-100 rounded-xl">
          <i class="fas fa-bullseye text-indigo-400 text-xs shrink-0"></i>
          <span class="text-[10px] font-black text-indigo-500 uppercase tracking-wide shrink-0">Meta:</span>
          <span class="text-[11px] text-indigo-700 font-semibold truncate">Meta ${escaparHTML(metaVinc.numero||'')} — ${escaparHTML(metaVinc.titulo)}</span>
        </div>` : ''}
        <div style="display:grid;grid-template-columns:80px 1fr;gap:12px">
          <div>
            <label class="ctr-label">Nº</label>
            <input id="indNum" class="ctr-input" style="text-align:center"
              value="${escaparHTML(dados.numero||'')}" placeholder="01">
          </div>
          <div>
            <label class="ctr-label">Nome do Indicador</label>
            <input id="indNome" class="ctr-input"
              value="${escaparHTML(dados.nome||dados.texto||'')}"
              placeholder="Ex.: Nº de pessoas atendidas presencialmente">
          </div>
        </div>
        <div>
          <label class="ctr-label">Metodologia <span class="font-normal normal-case text-slate-300">(opcional)</span></label>
          <textarea id="indDesc" class="ctr-input" style="min-height:48px;resize:vertical"
            placeholder="Como este indicador é medido...">${escaparHTML(dados.descricao||'')}</textarea>
        </div>
        <div>
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
            <label class="ctr-label" style="margin-bottom:0">Metas mensais por ano</label>
            <span style="font-size:10px;color:#cbd5e1"><i class="fas fa-calendar-alt mr-1"></i>${_fmtDataCtr(ctr.vigIni)||'—'} a ${_fmtDataCtr(ctr.vigFim)||'—'}</span>
          </div>
          <div class="ctr-section" style="max-height:280px;overflow-y:auto;scrollbar-width:thin">
            ${faixasHtml}
          </div>
        </div>
      </div>`,
    showCancelButton:true, confirmButtonText:'<i class="fas fa-save mr-1"></i>Salvar',
    cancelButtonText:'Cancelar', confirmButtonColor:'#6366f1',
    customClass:{ popup:'rounded-3xl', confirmButton:'rounded-xl font-black text-sm', cancelButton:'rounded-xl font-bold text-sm' },
    preConfirm: function(){
      var nome=document.getElementById('indNome')?.value.trim();
      if (!nome){ Swal.showValidationMessage('Nome do indicador obrigatório.'); return false; }
      var mesesPorAno={};
      for (var a=anoInicio;a<=anoFim;a++){
        var _a=a;
        mesesPorAno[_a]=_NM.map(function(_,i){ return Number(document.getElementById('indM_'+_a+'_'+i)?.value)||0; });
      }
      return { id:dados.id||null, idMeta:idMeta, idContrato:idContrato,
        numero:document.getElementById('indNum')?.value.trim(),
        nome:nome, texto:nome,
        descricao:document.getElementById('indDesc')?.value.trim(),
        meses:mesesPorAno, ano:anoInicio };
    }
  }).then(function(r){
    if (!r.isConfirmed) return;
    showLoader(true);
    google.script.run
      .withSuccessHandler(function(){ showLoader(false); carregarDadosContratos(function(){ renderizarContratos(); codipPopularContratos(); }); })
      .withFailureHandler(_handleServerError)
      .salvarIndicador(r.value, AppState.usuario.email);
  });
}

// ── CODIP FORM ────────────────────────────────────────────────
function codipPopularContratos() {
  const sel=document.getElementById('codipSelectContrato');
  if (!sel) return;
  sel.innerHTML='<option value="">Selecione o contrato...</option>'
    +(_ctrCache.contratos||[]).map(function(c){ return '<option value="'+escaparHTML(c.id)+'">'+escaparHTML(c.nome)+'</option>'; }).join('');
  document.getElementById('codipSelectMeta')?.replaceChildren(Object.assign(document.createElement('option'),{value:'',textContent:'Selecione uma meta...'}));
  document.getElementById('codipSelectIndicador')?.replaceChildren(Object.assign(document.createElement('option'),{value:'',textContent:'Selecione um indicador...'}));
  document.getElementById('codipIndicadorPreview')?.classList.add('hidden');
}

function codipCarregarMetas(idContrato) {
  const sel=document.getElementById('codipSelectMeta'); if (!sel) return;
  const metas=(_ctrCache.metas||[]).filter(function(m){ return m.idContrato===idContrato; });
  sel.innerHTML='<option value="">Selecione a meta...</option>'
    +metas.map(function(m){ return '<option value="'+escaparHTML(m.id)+'">Meta '+escaparHTML(m.numero||'')+' — '+escaparHTML(m.titulo)+'</option>'; }).join('');
  document.getElementById('codipSelectIndicador')?.replaceChildren(Object.assign(document.createElement('option'),{value:'',textContent:'Selecione um indicador...'}));
  document.getElementById('codipIndicadorPreview')?.classList.add('hidden');
}

function codipCarregarIndicadores(idMeta) {
  const sel=document.getElementById('codipSelectIndicador'); if (!sel) return;
  const inds=(_ctrCache.indicadores||[]).filter(function(i){ return i.idMeta===idMeta; });
  sel.innerHTML='<option value="">Selecione o indicador...</option>'
    +inds.map(function(i){ return '<option value="'+escaparHTML(i.id)+'">'+escaparHTML((i.nome||i.texto||'').slice(0,80))+'</option>'; }).join('');
  sel.onchange=function(){ codipMostrarPreviewIndicador(this.value); };
  document.getElementById('codipIndicadorPreview')?.classList.add('hidden');
}

function codipMostrarPreviewIndicador(idInd) {
  const preview=document.getElementById('codipIndicadorPreview'); if (!preview) return;
  const ind=(_ctrCache.indicadores||[]).find(function(i){ return i.id===idInd; });
  if (!ind){ preview.classList.add('hidden'); return; }
  const _NM2=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  preview.classList.remove('hidden');
  document.getElementById('codipIndicadorMesesGrid').innerHTML=
    _NM2.map(function(nm,i){ return '<div class="text-center bg-indigo-50 rounded-lg p-1"><div class="text-[8px] text-slate-400 font-bold">'+nm+'</div><div class="text-[11px] font-black text-indigo-700">'+((ind.meses||[])[i]||0)+'</div></div>'; }).join('');
  document.getElementById('codipIndQ1').textContent    = ind.q1    || 0;
  document.getElementById('codipIndQ2').textContent    = ind.q2    || 0;
  document.getElementById('codipIndQ3').textContent    = ind.q3    || 0;
  document.getElementById('codipIndQ4').textContent    = ind.q4    || 0;
  document.getElementById('codipIndAnual').textContent = ind.anual || 0;
}
