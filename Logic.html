// ── NORMALIZAÇÃO PADRÃO DE DATA       ───────────────────────────────
function normalizarDataKey(data) {
  if (!data) return null;
  try {
    if (data instanceof Date) {
      // Usa ano/mês/dia local para evitar erro de fuso UTC
      const d = data;
      const ano = d.getFullYear();
      const mes = String(d.getMonth() + 1).padStart(2, '0');
      const dia = String(d.getDate()).padStart(2, '0');
      return `${ano}-${mes}-${dia}`;
    }
    const s = String(data).trim();
    // DD/MM/YYYY → YYYY-MM-DD
    if (/^\d{2}\/\d{2}\/\d{4}$/.test(s)) {
      return `${s.slice(6)}-${s.slice(3,5)}-${s.slice(0,2)}`;
    }
    // YYYY-MM-DD (já no formato correto)
    if (/^\d{4}-\d{2}-\d{2}/.test(s)) {
      return s.slice(0, 10);
    }
    // Fallback: tenta parsear como Date local
    const p = s.split(/[\/\-]/);
    if (p.length === 3) {
      // detecta DD/MM/YYYY vs YYYY/MM/DD
      if (p[0].length === 4) {
        return `${p[0]}-${p[1].padStart(2,'0')}-${p[2].padStart(2,'0')}`;
      } else {
        return `${p[2]}-${p[1].padStart(2,'0')}-${p[0].padStart(2,'0')}`;
      }
    }
  } catch(e) {
    console.warn('Erro ao normalizar data:', data, e);
  }
  return null;
}

// ── Horários ─────────────────────────────────────────────────────────────────
function validarHorarios() {
  const inputInicio  = document.getElementById('horaInicio');
  const inputTermino = document.getElementById('horaTermino');
  const inputTurno   = document.getElementById('inputTurnoCalculado');
  const hIni = inputInicio?.value;
  const hTer = inputTermino?.value;
  if (!hIni || !hTer) return;

  const toMin = h => { const [hh, mm] = h.split(':').map(Number); return hh * 60 + mm; };
  const ini = toMin(hIni), ter = toMin(hTer);
  const MIN = toMin('08:00'), MAX = toMin('21:30');

  if (ini < MIN) { Swal.fire('Horário Inválido', 'Início não pode ser antes das 08:00.', 'warning'); inputInicio.value = ''; inputTurno.value = ''; return; }
  if (ini >= MAX) { Swal.fire('Horário Inválido', 'Início deve ser anterior a 21:30.', 'warning'); inputInicio.value = ''; inputTurno.value = ''; return; }
  if (ter > MAX)  { Swal.fire('Horário Inválido', 'Término não pode ultrapassar 21:30.', 'warning'); inputTermino.value = ''; inputTurno.value = ''; return; }
  if (ter <= ini) { Swal.fire('Horário Inválido', 'Término deve ser posterior ao início.', 'warning'); inputTermino.value = ''; inputTurno.value = ''; return; }

  const horaIni = parseInt(hIni.split(':')[0], 10);
  const horaFim = parseInt(hTer.split(':')[0], 10);
  let turno;
  if      (horaIni < 12  && horaFim <= 12) turno = 'MANHÃ';
  else if (horaIni >= 12 && horaFim <= 18) turno = 'TARDE';
  else if (horaIni >= 18)                  turno = 'NOITE';
  else if (horaIni < 12  && horaFim <= 18) turno = 'MANHÃ/TARDE';
  else if (horaIni >= 12 && horaFim > 18)  turno = 'TARDE/NOITE';
  else                                      turno = 'MULTITURNO';
  inputTurno.value = turno;
}

function adicionar1Hora(horario) {
  if (!horario) return '';
  const p = String(horario).split(':');
  return String((parseInt(p[0], 10) + 1) % 24).padStart(2, '0') + ':' + p[1];
}

function obterHorariosOcupadosFrontend(sala, data, idIgnorar) {
  const index = AppState.cacheReservasIndex || {};
  const normData = d => {
    try {
      if (d instanceof Date) { const x = new Date(d); x.setHours(0,0,0,0); return x.getTime(); }
      const s = String(d||'').trim();
      if (s.includes('/')) { const p = s.split('/'); if (p.length===3) { const x=new Date(p[2],p[1]-1,p[0]); x.setHours(0,0,0,0); return x.getTime(); } }
      if (s.includes('-')) { const x=new Date(s); x.setHours(0,0,0,0); return x.getTime(); }
    } catch(e) {} return null;
  };
  const normHora = h => { const p=String(h||'').split(':'); return parseInt(p[0])*60+parseInt(p[1]); };
  const dataBusca = normData(data);
  if (!dataBusca) return [];
  const salaKey = String(sala).trim();

  // ⚠️ converter timestamp → YYYY-MM-DD (igual ao índice)
  const dataKeyObj = new Date(dataBusca);
  const dataKey = dataKeyObj.toISOString().slice(0, 10);

  const lista = (index[dataKey] && index[dataKey][salaKey]) || [];

  const ocupados = [];

  lista.forEach(r => {

    if (idIgnorar && String(r[0]).trim() === String(idIgnorar).trim()) return;

    ocupados.push({
      inicio: normHora(r[2]),
      fim: normHora(r[3])
    });

  });

  return ocupados;
}



function obterSalasDisponiveisBackend(dados, data, callback) {

  const salas = AppState.colecoes.salas || [];
  const resultado = [];

  let processadas = 0;

  if (!salas.length) {
    callback([]);
    return;
  }

  salas.forEach(s => {

    const payload = {
      sala: s[0],
      horaInicio: dados.horaInicio,
      horaTermino: dados.horaTermino,
      datas: [data]
    };

    google.script.run
      .withSuccessHandler(function(res) {

        if (!res.conflito) {
          resultado.push({
            id: s[0],
            nome: s[1]
          });
        }

        processadas++;

        if (processadas === salas.length) {
          callback(resultado);
        }

      })
      .withFailureHandler(function() {
        processadas++;
        if (processadas === salas.length) {
          callback(resultado);
        }
      })
      .analisarDisponibilidadeReal(payload);

  });
}



function atualizarDisponibilidadeItens() {
  const selVolantes = document.getElementById('selectVolantes');
  const avisoDisp   = document.getElementById('avisoDisponibilidade');
  if (!selVolantes) return;

  const datasSel = (typeof calendarInstance !== 'undefined' && calendarInstance?.selectedDates) || [];
  const data     = datasSel[0] || null;
  const inicio   = document.getElementById('horaInicio')?.value;
  const termino  = document.getElementById('horaTermino')?.value;

  if (!data || !inicio || !termino) {
    if (avisoDisp) avisoDisp.classList.remove('hidden');
    popularSelectVolantesComEstoque();
    return;
  }

  if (avisoDisp) avisoDisp.classList.add('hidden');
  selVolantes.innerHTML = '<option value="">Calculando disponibilidade...</option>';
  selVolantes.disabled  = true;

  // Formata a data como string DD/MM/YYYY para evitar o TypeError no servidor
  const dataFormatada = flatpickr.formatDate(data, "d/m/Y");
  const idSalaAtual = document.getElementById('selectSala')?.value || null;

  const timeoutId = setTimeout(() => {
    if (selVolantes.disabled) {
      selVolantes.disabled = false;
      popularSelectVolantesComEstoque();
    }
  }, 10000);

  google.script.run
    .withSuccessHandler(function(disponibilidade) {
      clearTimeout(timeoutId);
      selVolantes.disabled = false;

      const itens = (typeof AppState !== 'undefined' ? AppState.colecoes.itens : []) || [];
      const nomesVistos   = new Set();
      const itensParaExibir = [];

      itens.filter(i => Number(i?.[3]) > 0).forEach(i => {
        const nome = String(i?.[1] || '').trim();
        if (!nome || nomesVistos.has(nome)) return;
        nomesVistos.add(nome);
        const total     = Number(i?.[3] || 0);
        const disponivel = Math.max(0, disponibilidade[nome] ?? total);
        itensParaExibir.push({ nome, total, disponivel: Math.max(0, disponivel), bloqueado: disponivel <= 0 });
      });

      itensParaExibir.sort((a, b) => {
        if (a.bloqueado && !b.bloqueado) return 1;
        if (!a.bloqueado && b.bloqueado) return -1;
        return a.nome.localeCompare(b.nome);
      });

      selVolantes.innerHTML =
        '<option value="">Selecionar item...</option>' +
        itensParaExibir.map(i => `
          <option value="${escaparHTML(i.nome)}" data-max="${i.disponivel}" ${i.bloqueado ? 'disabled' : ''}>
            ${escaparHTML(i.nome)} — ${i.bloqueado
              ? `🔴 Indisponível neste horário (total: ${i.total})`
              : `✅ Livre: ${i.disponivel} / ${i.total}`}
          </option>
        `).join('');

      if (typeof atualizarMaxQuantidade === 'function') atualizarMaxQuantidade();
      if (typeof atualizarAvisosCarrinho === 'function') atualizarAvisosCarrinho(disponibilidade);
    })
    .withFailureHandler(function() {
      clearTimeout(timeoutId);
      selVolantes.disabled = false;
      popularSelectVolantesComEstoque();
    })
    .obterDisponibilidadeItensPorHorario(dataFormatada, inicio, termino, idSalaAtual);
}

function obterItensFixosDaSala(idSala) {
  const itens = (typeof AppState !== 'undefined' ? AppState.colecoes.itens : []) || [];
  return itens.map(item => {
    let mapa = {};
    try {
      const raw = String(item[4] || '{}').trim();
      if (raw.startsWith('{') && raw.endsWith('}')) mapa = JSON.parse(raw);
    } catch(e) {}
    const nomeSala = (typeof AppState !== 'undefined' && AppState.mapaSalas?.[idSala]) || idSala;
    const qtd = Number(mapa[idSala] || mapa[nomeSala] || 0);
    return { nome: item[1], qtd };
  }).filter(i => i.qtd > 0);
}

function verificarConflitoFrontend(dados, datas, idIgnorar) {

  const normHora = h => {
    const p = String(h || '').split(':');
    return parseInt(p[0]) * 60 + parseInt(p[1]);
  };

  const toHora = m => {
    const h = String(Math.floor(m / 60)).padStart(2,'0');
    const min = String(m % 60).padStart(2,'0');
    return `${h}:${min}`;
  };

  const inicio  = normHora(dados.horaInicio);
  const termino = normHora(dados.horaTermino);
  const salaKey = String(dados.sala || '').trim();

  for (const dataStr of datas) {

    const dataKey = normalizarDataKey(dataStr);
    if (!dataKey) continue;

    const reservas =
      (AppState.cacheReservasIndex?.[dataKey]?.[salaKey]) || [];

    for (const r of reservas) {

      if ((r[13] || '').toUpperCase() === 'CANCELADO') continue;
      if (idIgnorar && String(r[0]).trim() === String(idIgnorar).trim()) continue;

      const ini = normHora(r[2]);
      const ter = normHora(r[3]);

      const conflito = inicio < ter && termino > ini;

      if (conflito) {

        let tipo = 'TOTAL';
        let sugestao = '';

        if (inicio >= ini && inicio < ter && termino > ter) {
          tipo = 'INICIO';
          sugestao = toHora(ter);
        }
        else if (termino > ini && termino <= ter && inicio < ini) {
          tipo = 'FIM';
          sugestao = toHora(ini);
        }
        else {
          tipo = 'TOTAL';
          sugestao = `${toHora(ini)}–${toHora(ter)}`;
        }

        return {
          conflito: true,
          tipo,
          data: dataStr,
          reserva: r,
          sugestao
        };
      }
    }
  }

  return { conflito: false };
}

function sugerirProximoHorarioLivre(sala, data, horarioAtual) {
  const horariosBase = [
  "08:00","08:30",
  "09:00","09:30",
  "10:00","10:30",
  "11:00","11:30",
  "12:00","12:30",
  "13:00","13:30",
  "14:00","14:30",
  "15:00","15:30",
  "16:00","16:30",
  "17:00","17:30",
  "18:00","18:30",
  "19:00","19:30",
  "20:00","20:30"
];
  const ocupados = obterHorariosOcupadosFrontend(sala, data);
  const norm = h => { const p=h.split(':'); return parseInt(p[0])*60+parseInt(p[1]); };
  const atual = norm(horarioAtual);
  const livres = horariosBase.filter(h => { const i=norm(h); return !ocupados.some(o=>i<o.fim && (i+60)>o.inicio); });
  return livres.find(h => norm(h) > atual) || livres[0] || null;
}

function exportarAgendaCSV() {
  const reservas = AppState.colecoes.reservas || [];
  if (!reservas.length) { Swal.fire('Sem dados', 'Nenhuma reserva para exportar.', 'info'); return; }

  const cab = ['ID','Data','Início','Término','Sala','Turno','Ação','Tipo','Responsável','Setor','Co-resp','Release','Itens','Status','Solicitação','Lote'];
  const linhas = [cab.join(';')];

  reservas.forEach(r => {
    const sala = (AppState.mapaSalas && AppState.mapaSalas[r[4]]) || r[4];
    const linha = [...r];
    linha[4] = sala;
    linhas.push(linha.map(v => `"${String(v||'').replace(/"/g,'""')}"`).join(';'));
  });

  const blob = new Blob(["\uFEFF" + linhas.join('\n')], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `agenda_geral_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

  lista.innerHTML = itensFixosSelecionados.map((item, index) => `
    <li class="flex justify-between items-center bg-slate-50 p-2 rounded-xl border border-slate-100 group transition-all hover:bg-white hover:shadow-sm">
      <span class="text-[11px] font-bold text-slate-700 truncate">

        ${escaparHTML(item.nome)}
        <span class="text-[9px] text-slate-400">(fixo)</span>

      <button type="button"

function removerItemFixoCarrinho(index) {
  itensFixosSelecionados.splice(index, 1);
  renderizarCarrinhoFixos();
}

// ── Almoxarifado ──────────────────────────────────────────────────────────────
function adicionarItemVolante() {

  const select   = document.getElementById('selectVolantes');
  const qtdInput = document.getElementById('qtdVolante');

  if (!select || !qtdInput) return;

  let itemNome = select.value;
  const quantidade = parseInt(qtdInput.value) || 1;

  // 🔴 NORMALIZAÇÃO REAL (corrige IA e DOM)
  if (typeof itemNome === 'object') {
    itemNome = itemNome.nome || itemNome.label || '';
  }

  itemNome = String(itemNome || '').trim();

  if (!itemNome) {
    Swal.fire('Atenção', 'Selecione um item antes de adicionar.', 'warning');
    return;
  }

  if (quantidade < 1) {
    Swal.fire('Atenção', 'A quantidade deve ser maior que zero.', 'warning');
    return;
  }

  const indexExistente = itensSelecionados.findIndex(i => i.nome === itemNome);

  if (indexExistente > -1) {
    itensSelecionados[indexExistente].qtd += quantidade;
  } else {
    itensSelecionados.push({
      nome: itemNome,
      qtd: quantidade
    });
  }

  if (typeof renderizarCarrinhoItens === 'function') {
    renderizarCarrinhoItens();
  }

  qtdInput.value = 1;
  select.value   = '';
}

  const nomeAcaoEl = document.getElementById('inputNomeAcao');

    .withSuccessHandler(function(res) {

      link.download = res.nome;

      Swal.fire({ icon: 'success', title: 'Download iniciado' });

    .gerarDocumentoDownload(conteudo);

        }

      } catch(e) {
        console.warn('Erro sugestão de horário:', e);
      }

      // 🛡️ SUGESTÃO DE SALAS (segura)
      try {

        if (typeof obterSalasDisponiveisBackend === 'function') {

          const payloadSala = {
            sala: selectSala?.value,
            horaInicio: horaInicio?.value,
            horaTermino: document.getElementById('horaTermino')?.value
          };

          obterSalasDisponiveisBackend(payloadSala, datas[0], function(salasLivres) {

            const sugestoesSalas = (salasLivres && salasLivres.length)
              ? salasLivres.map(s => `
                  <button onclick="typeof trocarSalaSugestao === 'function' && trocarSalaSugestao('${s.id}')"
                    class="px-2 py-1 bg-blue-100 hover:bg-blue-200 rounded text-xs font-bold mr-1 mb-1">
                    ${typeof escaparHTML === 'function' ? escaparHTML(s.nome) : s.nome}
                  </button>
                `).join('')
              : '<span class="text-xs text-slate-400">Nenhuma sala disponível neste horário</span>';

            Swal.fire({
              icon: 'error',
              title: 'Conflito na agenda',
              html: `
                <p class="text-sm">${mensagem}</p>
                <hr class="my-2">
                <p class="text-xs font-bold text-slate-600">Outras salas disponíveis:</p>
                <div class="mt-1">${sugestoesSalas}</div>
                ${sugestaoHorarioHTML}
              `
            });

          });

        } else {

          // fallback se função não existir
          Swal.fire({
            icon: 'error',
            title: 'Conflito de horário',
            html: `<p>${mensagem}</p>`
          });

        }

      } catch(e) {

        console.error('Erro ao buscar salas:', e);

        Swal.fire({
          icon: 'error',
          title: 'Conflito de horário',
          html: `<p>${mensagem}</p>`
        });

      }

      return;
    }

    // ✅ SEM CONFLITO
    Swal.fire({
      icon: 'success',
      title: 'Disponível',
      text: 'Horário livre e válido.'
    });

  })
  .withFailureHandler(function(err) {

    showLoader(false);

    Swal.fire({
      icon: 'error',
      title: 'Erro',
      text: err?.message || 'Falha ao verificar disponibilidade.'
    });

    if (btnSubmit) btnSubmit.disabled = false;

  })
  .analisarDisponibilidadeReal(payload);
}

/**
 * 🧠 ORQUESTRADOR DA IA
 * Decide comportamento: SUGESTÃO vs ANÁLISE
 */
function processarIntencaoIA(contexto, callback) {

  const datasSel = calendarInstance?.selectedDates || [];
  const datas = datasSel.map(d => flatpickr.formatDate(d, "d/m/Y"));

  const sala        = contexto?.sala;
  const horaInicio  = contexto?.horaInicio;
  const horaTermino = contexto?.horaTermino;

  // 🔴 VALIDAÇÃO FORTE (EVITA ANÁLISE FALSA)
  if (!sala || !horaInicio || !horaTermino || datas.length === 0) {

    callback({
      tipo: 'INCOMPLETO',
      dados: {
        faltando: {
          sala: !sala,
          horaInicio: !horaInicio,
          horaTermino: !horaTermino,
          data: datas.length === 0
        }
      }
    });

    return;
  }

  const payload = {
    sala: sala,
    horaInicio: horaInicio,
    horaTermino: horaTermino,
    datas: datas
  };

  google.script.run
    .withSuccessHandler(function(res) {

      // 🔴 PROTEÇÃO EXTRA
      if (!res || typeof res !== 'object') {
        callback({
          tipo: 'ERRO',
          erro: 'Resposta inválida do backend'
        });
        return;
      }

      // 🔴 CONFLITO REAL
      if (res.conflito && res.conflitosDetalhados?.length) {

        callback({
          tipo: 'CONFLITO_REAL',
          dados: res
        });
        return;
      }

      // 🟡 SUGESTÕES DISPONÍVEIS
      if (Array.isArray(res.sugestoes) && res.sugestoes.length > 0) {

        callback({
          tipo: 'SUGESTAO',
          dados: res
        });
        return;
      }

      // ✅ DISPONÍVEL (SEM CONFLITO)
      callback({
        tipo: 'DISPONIVEL',
        dados: res
      });

    })
    .withFailureHandler(function(err) {

      console.error('Erro ao analisar disponibilidade:', err);

      callback({
        tipo: 'ERRO',
        erro: err?.message || 'Erro desconhecido'
      });
    })
    .analisarDisponibilidadeReal(payload);
}

/**
 * 🧠 INFERIR INTENÇÃO AUTOMATICAMENTE
 */
function inferirModoIA(contexto) {

  const texto = String(contexto?.mensagem || '').toLowerCase();

  // 🔵 1. TEXTO DO USUÁRIO

  if (texto) {

    // intenção de sugestão
    if (
      texto.includes('sugere') ||
      texto.includes('sugerir') ||
      texto.includes('opção') ||
      texto.includes('opcoes') ||
      texto.includes('opções') ||
      texto.includes('melhor horário') ||
      texto.includes('quando dá')
    ) {
      return 'SUGESTAO';
    }

    // intenção de análise
    if (
      texto.includes('conflito') ||
      texto.includes('disponível') ||
      texto.includes('disponivel') ||
      texto.includes('verifica') ||
      texto.includes('status') ||
      texto.includes('como está')
    ) {
      return 'ANALISE';
    }

    // 🔴 IMPORTANTE: mesmo que diga "agendar"
    // IA NÃO EXECUTA → apenas analisa
    if (
      texto.includes('agendar') ||
      texto.includes('marcar') ||
      texto.includes('reservar') ||
      texto.includes('confirmar')
    ) {
      return 'ANALISE';
    }
  }

  // 🟡 2. ESTADO DO SISTEMA

  const temSala   = !!contexto?.sala;
  const temInicio = !!contexto?.horaInicio;
  const temFim    = !!contexto?.horaTermino;

  const datasSel = calendarInstance?.selectedDates || [];

  // dados incompletos → análise
  if (!temSala || !temInicio || !temFim || datasSel.length === 0) {
    return 'ANALISE';
  }

  // dados completos → sugestão (não execução!)
  return 'SUGESTAO';
}

/**
 * 🧠 IA FINAL — ORQUESTRA TUDO
 * - Decide comportamento
 * - Consulta backend
 * - APENAS analisa ou sugere (NUNCA preenche automaticamente)
 */
function executarIAReserva(contexto) {

  // 🟣 ANÁLISE COM GRÁFICO (chat ou gerar análise)
  if (contexto?.tipo === 'ANALISE') {

    Swal.fire({
      icon: 'info',
      title: 'Análise inteligente',
      html: `<p class="text-sm">${contexto.textoAnalise || 'Análise gerada com base nos dados do sistema.'}</p>`
    });

    if (contexto.grafico && typeof renderizarGraficoIA === 'function') {
      setTimeout(() => renderizarGraficoIA(contexto.grafico), 300);
    }

    return;
  }

  processarIntencaoIA(contexto, function(resultado) {

    if (!resultado) return;

    const modo = inferirModoIA(contexto);

    // 🔴 DADOS INCOMPLETOS
    if (resultado.tipo === 'INCOMPLETO') {

      Swal.fire({
        icon: 'info',
        title: 'Dados insuficientes',
        text: 'Informe sala, data e horário para análise precisa.'
      });

      return;
    }

    // 🔴 ERRO
    if (resultado.tipo === 'ERRO') {

      console.error(resultado.erro);

      Swal.fire({
        icon: 'error',
        title: 'Erro na análise',
        text: resultado.erro || 'Não foi possível processar a solicitação.'
      });

      return;
    }

    // 🟣 GRAFICO DIRETO (futuro / backend)
    if (resultado.tipo === 'GRAFICO') {

      if (typeof renderizarGraficoIA === 'function') {
        renderizarGraficoIA(resultado.dados);
      }

      Swal.fire({
        icon: 'info',
        title: 'Gráfico gerado',
        text: 'Visualização criada com base nos dados.'
      });

      return;
    }

    // 🔴 CONFLITO
    if (resultado.tipo === 'CONFLITO_REAL') {

      const conflitos = resultado.dados.conflitosDetalhados || [];
      let sugestoes = resultado.dados.sugestoes || [];
      sugestoes = ordenarSugestoesPorPreferencia(sugestoes, contexto);

      let html = `<p class="text-sm">Conflitos encontrados:</p>`;

      conflitos.forEach(c => {
        html += `
          <div class="text-xs mt-2">
            <b>${c.data}</b> → ${c.inicio}–${c.fim}<br>
            <span class="text-slate-500">${c.nome}</span>
          </div>
        `;
      });

      // 🟡 BUFFER
      if (conflitos.some(c => c.tipo === 'BUFFER')) {
        html += `<p class="text-xs text-amber-600 mt-2">Intervalo mínimo de 5min entre reservas (limpeza do espaço)</p>`;
      }

      // 🔵 SUGESTÕES CLICÁVEIS
      if (sugestoes.length) {

        html += `<hr class="my-2"><p class="text-xs font-bold">Clique em uma sugestão:</p>`;

        html += sugestoes.map(s => {

          const payload = encodeURIComponent(JSON.stringify(s));

          return `
            <div 
              onclick="aplicarSugestaoCompleta(JSON.parse(decodeURIComponent('${payload}')))"
              class="cursor-pointer text-xs mt-2 p-3 bg-amber-50 hover:bg-amber-100 border border-amber-200 rounded-lg transition-all"
            >
              <b>${s.data}</b> ${s.horaInicio}–${s.horaTermino}
            </div>
          `;

        }).join('');
      }

      Swal.fire({
        icon: 'warning',
        title: 'Conflito na agenda',
        html: html
      });

      return;
    }

    // 🟡 SUGESTÃO
    if (resultado.tipo === 'SUGESTAO') {

      let sugestoes = resultado.dados.sugestoes || [];
      sugestoes = ordenarSugestoesPorPreferencia(sugestoes, contexto);

      if (!sugestoes.length) return;

      const itensSugeridos = sugerirItensParaReserva(contexto);

      let html = `<p class="text-sm font-semibold">Clique em uma opção para aplicar automaticamente:</p>`;

      html += sugestoes.map(s => {

        const payload = encodeURIComponent(JSON.stringify(s));

        return `
          <div 
            onclick="aplicarSugestaoCompleta(JSON.parse(decodeURIComponent('${payload}')))"
            class="cursor-pointer text-xs mt-2 p-3 bg-green-50 hover:bg-green-100 border border-green-200 rounded-lg transition-all"
          >
            <b>${s.data}</b> ${s.horaInicio}–${s.horaTermino}
          </div>
        `;

      }).join('');

      // 🔵 ITENS SUGERIDOS
      if (itensSugeridos.length) {

        html += `<hr class="my-2"><p class="text-xs font-bold">Sugestão de itens:</p>`;

        html += itensSugeridos.map(i => `
          <div class="text-xs mt-1">
            ${i.qtd}x ${i.nome} ${i.tipo === 'fixo' ? '(fixo)' : ''}
          </div>
        `).join('');
      }

      Swal.fire({
        icon: 'info',
        title: 'Sugestões disponíveis',
        html: html
      });

      return;
    }

    // ✅ DISPONÍVEL
    if (resultado.tipo === 'DISPONIVEL') {

      const itensSugeridos = sugerirItensParaReserva(contexto);

      let html = `<p>Horário livre e válido.</p>`;

      if (itensSugeridos.length) {
        html += `<hr class="my-2"><p class="text-xs font-bold">Sugestão de itens:</p>`;
        html += itensSugeridos.map(i => `
          <div class="text-xs mt-1">
            ${i.qtd}x ${i.nome} ${i.tipo === 'fixo' ? '(fixo)' : ''}
          </div>
        `).join('');
      }

      html += `<p class="text-xs text-slate-500 mt-2">Você pode prosseguir com o agendamento.</p>`;

      Swal.fire({
        icon: 'success',
        title: 'Disponível',
        html: html
      });

      return;
    }

  });
}

/**
 * 🧠 APLICA SUGESTÃO COMPLETA (PADRÃO FINAL)
 */
function aplicarSugestaoIA(data, horaInicio, horaTermino) {
  const horaIni = document.getElementById('horaInicio');
  const horaTer = document.getElementById('horaTermino');
  if (horaIni) horaIni.value = horaInicio;
  if (horaTer) horaTer.value = horaTermino;
  if (calendarInstance && data) {
    const p = String(data).split('/');
    if (p.length === 3) calendarInstance.setDate(new Date(p[2], p[1] - 1, p[0]), true);
  }
  if (typeof validarHorarios === 'function') validarHorarios();
  if (typeof atualizarTudoTempoReal === 'function') atualizarTudoTempoReal();
  Swal.close();
}

function obterNomeSala(idSala) {
  if (typeof AppState !== 'undefined' && AppState.mapaSalas) {
    return AppState.mapaSalas[idSala] || idSala;

}

function indexarReservas() {
  const reservas = AppState.colecoes.reservas || [];
  if (!window.AppState || !AppState.colecoes) return;

  const index = {};

  reservas.forEach(r => {
    // Inclui CANCELADO no índice para que verificarConflitoFrontend possa ignorá-los
    // mas mantém apenas CONFIRMADO para evitar falsos bloqueios
    if ((r[13] || '').toUpperCase() === 'CANCELADO') return;

    const data = normalizarDataKey(r[1]);
    const sala = String(r[4] || '').trim();

    if (!data || !sala) return;

    if (!index[data]) index[data] = {};
    if (!index[data][sala]) index[data][sala] = [];

    index[data][sala].push(r);
  });

  AppState.cacheReservasIndex = index;

  // Salva cache local atualizado
  try {
    localStorage.setItem('cacheReservas', JSON.stringify(AppState.colecoes.reservas));
    localStorage.setItem('cacheReservas_ts', Date.now());
  } catch(e) {}

// Atualiza badge do dia
  const hojeKey = new Date().toISOString().slice(0, 10);
  const totalHoje = Object.values(index[hojeKey] || {}).flat().length;
  const badge = document.getElementById('badgeHoje');
  if (badge) {
    badge.textContent = totalHoje + ' hoje';
    totalHoje > 0 ? badge.classList.remove('hidden') : badge.classList.add('hidden');
  }

}

/**

 */
function configurarInterfacePorPermissao() {
  const isAdmin      = AppState.usuario.isAdmin;
  const isSuperadmin = AppState.usuario.isSuperadmin;

  const btnGestao    = document.getElementById('btn-aba-gestao');
  const btnAuditoria = document.getElementById('btn-aba-auditoria');
  const modSistema   = document.getElementById('modulo-sistema');

  if (isAdmin || isSuperadmin) {
    if (btnGestao)    btnGestao.classList.remove('hidden');
    if (btnAuditoria) btnAuditoria.classList.remove('hidden');
    if (modSistema)   modSistema.classList.remove('hidden');
  } else {
    if (modSistema)   modSistema.classList.add('hidden');
  }

  // Bloqueia abas "em breve" para não-superadmin (clique não navega)
  document.querySelectorAll('.em-breve-badge').forEach(function(badge) {
    const btn = badge.closest('button');
    if (!btn) return;
    if (!isSuperadmin) {
      btn.style.display = 'none';
    }
  });

  if (!isAdmin && !isSuperadmin) {
    const abaAtual = document.querySelector('.tab-content:not(.hidden)')?.id;
    if (abaAtual === 'aba-gestao-admin' || abaAtual === 'aba-auditoria') {
      mostrarAba('aba-lista-reservas');
    }

// ── Listener delegado para ações do painel admin ──────────────────────
  // Substitui todos os onclick inline com strings dinâmicas.
  // Um único listener no body captura cliques em qualquer botão data-acao, evitando quebras por aspas em nomes de salas, itens, setores e usuários.
document.addEventListener('DOMContentLoaded', function() {

  document.body.addEventListener('click', function(e) {

    const btn = e.target.closest('[data-acao]');
    if (!btn) return;

    var acao = btn.dataset.acao;
    var id   = btn.dataset.id || null;

    var acoes = {

      'editar-espaco': function() {
        abrirModalConfig('espaco', id, btn.dataset.nome, btn.dataset.capacidade, btn.dataset.email || '');
      },

      'excluir-espaco': function() {
        dispararExclusao(id, 'espaco');
      },

      'editar-item': function() {
        abrirModalConfig('item', id, btn.dataset.nome, btn.dataset.qtd, btn.dataset.categoria);
      },

      'excluir-item': function() {
        dispararExclusao(id, 'item');
      },

      'editar-setor': function() {
        abrirModalConfig('setor', id, btn.dataset.nome);
      },

      'excluir-setor': function() {
        dispararExclusao(id, 'setor');
      },

      'editar-usuario': function() {
        abrirModalConfig('usuario', id, btn.dataset.email, btn.dataset.nivel);
      },

      'excluir-usuario': function() {
        dispararExclusao(id, 'usuario');
      },

      'habilitar-reserva': function() {
        habilitarReserva(id);
      },

      'editar-reserva': function() {
        prepararEdicao(id);
      },

      'cancelar-reserva': function() {
        confirmarCancelamento(id, btn.dataset.nome);
      },

      'excluir-reserva': function() {
        excluirDefinitivo(id, 'reserva');
      },

      'editar-rece': function() {
        prepararEdicaoRece(id);
      },

      'cancelar-rece': function() {
        confirmarCancelamentoRece(id, btn.dataset.nome);
      },

      'excluir-rece': function() {
        excluirReceDefinitivo(id);
      },

      'rollback-seletivo': function() {

        if (!AppState.usuario.isSuperadmin) {
          Swal.fire('Acesso Negado', 'Apenas Superadmins podem desfazer ações.', 'error');
          return;
        }

        var timestamp = btn.dataset.timestamp;

        Swal.fire({
          title: 'Desfazer esta ação?',
          text: 'Esta operação reverterá a alteração selecionada. Não pode ser desfeita.',
          icon: 'warning',
          showCancelButton: true,
          confirmButtonColor: '#f59e0b',
          confirmButtonText: 'Sim, desfazer!',
          cancelButtonText: 'Cancelar'
        }).then(function(result) {

          if (!result.isConfirmed) return;

          showLoader(true);

          google.script.run
            .withSuccessHandler(function() {
              showLoader(false);

              Swal.fire({
                title: 'Desfeito!',
                text: 'Ação revertida com sucesso.',
                icon: 'success',
                timer: 2500,
                showConfirmButton: false
              });

              carregarAuditoria();
              carregarReservas();
              if (AppState.colecoes.reservasRece) carregarReservasRece();

            })
            .withFailureHandler(function(err) {
              showLoader(false);
              Swal.fire('Erro no Rollback', err.message, 'error');
            })
            .rollbackAcaoPorTimestamp(AppState.usuario.email, timestamp);

        });

      }

    };

    if (acoes[acao]) {
      acoes[acao]();
    }

  });

});



function sincronizarAbaAtual() {
  if (typeof showLoader === "function") showLoader(true);
  const btnSync = document.querySelector('.fa-sync-alt')?.parentElement;
  if (btnSync) btnSync.classList.add('animate-spin');

  google.script.run
    .withSuccessHandler(function(dados) {
      AppState.colecoes.salas          = dados.salas || [];
      AppState.colecoes.itens          = dados.listaItens || [];
      AppState.colecoes.setores        = dados.setores || [];
      AppState.colecoes.administradores = dados.administradores || [];

      if (typeof renderizarEspacosAdmin === "function") renderizarEspacosAdmin();
      if (typeof renderizarItensAdmin   === "function") renderizarItensAdmin();
      if (typeof renderizarSetoresAdmin === "function") renderizarSetoresAdmin();
      if (typeof renderizarAdmins       === "function") renderizarAdmins();
      if (typeof popularSelectsIniciais === "function") popularSelectsIniciais();
      if (typeof renderizarReservas     === "function") renderizarReservas();

      if (typeof showLoader === "function") showLoader(false);
      if (btnSync) btnSync.classList.remove('animate-spin');

      Swal.mixin({ toast: true, position: 'top-end', showConfirmButton: false, timer: 2000, timerProgressBar: true })
        .fire({ icon: 'success', title: 'Dados sincronizados com a planilha' });
    })
    .withFailureHandler(function(err) {

      if (btnSync) btnSync.classList.remove('animate-spin');

/**
 * POPULAR SELECTS INICIAIS
 * Preenche os dropdowns de Sala, Setor e Itens Volantes no carregamento.
 */
function popularSelectsIniciais() {
  const selSala = document.getElementById('selectSala');
  const selSetor = document.getElementById('selectSetor');
  const selFiltroSetor = document.getElementById('filtroSetor');
  const selFiltroSala = document.getElementById('filtroSala');
  const selVolantes = document.getElementById('selectVolantes');

  // ===== SALAS (FORMULÁRIO) =====
  if (selSala) {
    const salas = AppState.colecoes.salas || [];
    selSala.innerHTML =
      '<option value="">Selecione um local...</option>' +
      salas.map(s => {
        const id = s[0] ?? '';
        const nome = s[1] ?? 'Sem nome';
        const cap = s[2] ?? '-';
        return `<option value="${escaparHTML(id)}">${escaparHTML(nome)} (Cap: ${cap})</option>`;
      }).join('') +
      '<option value="EXTERNO" style="font-weight:900;color:#0891b2">📍 Externo (fora do CCBJ)</option>';
  }

  // ===== SETORES =====
  const setores = AppState.colecoes.setores || [];
  const optionsSetor = setores
    .filter(s => s && String(s).trim() !== '')
    .map(setor => `<option value="${escaparHTML(setor)}">${escaparHTML(setor)}</option>`)
    .join('');

  if (selSetor) selSetor.innerHTML = '<option value="">Selecione o setor...</option>' + optionsSetor;
  if (selFiltroSetor) selFiltroSetor.innerHTML = '<option value="">TODOS OS SETORES</option>' + optionsSetor;

  // ===== FILTRO SALA (USA ID COMO VALUE, NOME COMO LABEL) =====
  // Isso garante que a comparação com r[4] (que é ID) funcione corretamente
  if (selFiltroSala) {
    const salas = AppState.colecoes.salas || [];
    selFiltroSala.innerHTML =
      '<option value="">TODAS AS SALAS</option>' +
      salas.map(s => {
        const id = String(s[0] || '').trim();
        const nome = String(s[1] || '').trim();
        return `<option value="${escaparHTML(id)}">${escaparHTML(nome)}</option>`;
      }).join('');
  }

  // ===== ITENS VOLANTES =====
  // Será atualizado dinamicamente com disponibilidade por horário
  // Por enquanto popula com estoque total como fallback
  if (selVolantes) {
    const itens = AppState.colecoes.itens || [];
    const itensValidos = itens.filter(i => Number(i?.[3]) > 0);
    const nomesVistos = new Set();
    const itensUnicos = [];

    itensValidos.forEach(i => {
      const nome = String(i?.[1] || '').trim();
      if (!nome || nomesVistos.has(nome)) return;
      nomesVistos.add(nome);
      itensUnicos.push({ nome, qtd: Number(i?.[3] || 0) });
    });

    selVolantes.innerHTML =
      '<option value="">Selecionar item...</option>' +
      itensUnicos.map(i =>
        `<option value="${escaparHTML(i.nome)}">${escaparHTML(i.nome)} (Disp: ${i.qtd})</option>`
      ).join('');
  }

  if (typeof configurarCalendario === "function") configurarCalendario(false);

  // Popula filtros do dashboard
  const dashSala = document.getElementById('dashFiltroSala');
  const dashSetor = document.getElementById('dashFiltroSetor');
  if (dashSala) {
    dashSala.innerHTML = '<option value="">Todos os espaços</option>' +
      (AppState.colecoes.salas || []).map(s =>
        `<option value="${escaparHTML(String(s[0]))}">${escaparHTML(String(s[1]))}</option>`
      ).join('');
  }
  if (dashSetor) {
    dashSetor.innerHTML = '<option value="">Todos os setores</option>' +
      (AppState.colecoes.setores || []).filter(Boolean).map(s =>
        `<option value="${escaparHTML(s)}">${escaparHTML(s)}</option>`
      ).join('');
  }

  const agendaSala = document.getElementById('agendaGoogleSala');

  if (agendaSala) {
    agendaSala.innerHTML =
      '<option value="">Todas as salas</option>' +
      (AppState.colecoes.salas || []).map(s =>
        `<option value="${escaparHTML(String(s[0]))}">${escaparHTML(String(s[1]))}</option>`
      ).join('');

    if (agendaSala.options.length > 1) {
      agendaSala.value = agendaSala.options[1].value;
    }

    if (document.getElementById('viewAgendaGoogle') &&
        !document.getElementById('viewAgendaGoogle').classList.contains('hidden')) {
      window._agendaGoogleSemana = 0;
      renderizarModoAgendaGoogle();
    }

  }

  // ===== AGENDA RECE =====
  const agendaReceSalaEl = document.getElementById('agendaReceSala');

  if (agendaReceSalaEl) {
    agendaReceSalaEl.innerHTML =
      '<option value="">Todas as salas</option>' +
      (AppState.colecoes.salas || []).map(s =>
        `<option value="${escaparHTML(String(s[1]))}">${escaparHTML(String(s[1]))}</option>`
      ).join('');
  }
}

/**
 * CONFIGURAR CALENDÁRIO (FLATPICKR)
 * @param {boolean} modoLote Ativa ou desativa a seleção múltipla.
 */
function configurarCalendario(modoLote) {
  if (calendarInstance) calendarInstance.destroy();

  calendarInstance = flatpickr("#inputData", {
    mode: modoLote ? "multiple" : "single",
    dateFormat: "d/m/Y",
    locale: "pt",
    minDate: "today",
    disableMobile: "true",
    inline: false,
    onChange: function(selectedDates, dateStr) {

      console.log("Datas selecionadas:", dateStr);

      // Auto-preenche data término RECE com a última data selecionada
      if (selectedDates.length > 0) {
        const ultimaData = selectedDates[selectedDates.length - 1];
        const diaF  = String(ultimaData.getDate()).padStart(2,'0');
        const mesF  = String(ultimaData.getMonth()+1).padStart(2,'0');
        const anoF  = ultimaData.getFullYear();
        const dataFormatada = `${diaF}/${mesF}/${anoF}`;
        const receDataTermino = document.getElementById('receDataTermino');
        if (receDataTermino && (!receDataTermino.value || AppState.modoLote)) {
          receDataTermino.value = dataFormatada;
        }
      }

      const inputInicio = document.getElementById('horaInicio');
      const inputTermino = document.getElementById('horaTermino');

      // ── BLOQUEIO DE HORÁRIO PARA HOJE ─────────────────────────────
      if (selectedDates.length > 0) {

        const hoje = new Date();
        hoje.setHours(0, 0, 0, 0);

        const dataSel = new Date(selectedDates[0]);
        dataSel.setHours(0, 0, 0, 0);

        if (dataSel.getTime() === hoje.getTime()) {

          const agora = new Date();
          const horaMin = agora.getHours();
          const minMin = agora.getMinutes() >= 30 ? 0 : 30;
          const horaFinal = agora.getMinutes() >= 30 ? horaMin + 1 : horaMin;

          const minStr = String(minMin).padStart(2, '0');
          const horaStr = String(Math.max(8, horaFinal)).padStart(2, '0');

          const minHoje = `${horaStr}:${minStr}`;

          if (inputInicio) inputInicio.min = minHoje;
          if (inputTermino) inputTermino.min = minHoje;

        } else {

          if (inputInicio) inputInicio.min = "08:00";
          if (inputTermino) inputTermino.min = "08:00";

        }
      }

      // ── ATUALIZAÇÃO CENTRAL (CÉREBRO DO SISTEMA) ───────────────────
      atualizarTudoTempoReal();

      // ── SUGESTÕES (apenas se houver data) ──────────────────────────
      if (selectedDates.length > 0 && typeof atualizarSugestoes === 'function') {
        atualizarSugestoes();
      }

      // ── UI AUXILIAR ────────────────────────────────────────────────
      renderizarPreviewDatas();
      atualizarContadorLote();

    }
  });
// Flatpickr para data término RECE (sincronizado, somente leitura via JS)
  const receTermino = document.getElementById('receDataTermino');
  if (receTermino) {
    receTermino.removeAttribute('readonly');
    if (!receTermino._fp) {
      receTermino._fp = flatpickr(receTermino, {
        dateFormat: "d/m/Y",
        locale: "pt",
        minDate: "today",
        disableMobile: true
      });
    }
  }
}

/**
 * RENDERIZAR CARRINHO DE ITENS
 * Atualiza a lista visual (ul) no formulário.
 */
function renderizarCarrinhoItens() {
  const lista = document.getElementById('carrinhoVolantes');
  if (!lista) return;

  if (itensSelecionados.length === 0) {
    lista.innerHTML = '<p class="text-[10px] text-slate-500 text-center py-2">Nenhum item selecionado.</p>';
    return;
  }

  lista.innerHTML = itensSelecionados.map((item, index) => `
    <li class="flex justify-between items-center bg-slate-50 p-2 rounded-xl border border-slate-100 group transition-all hover:bg-white hover:shadow-sm">
      <div class="flex flex-col overflow-hidden">
        <span class="text-[11px] font-bold text-slate-700 truncate">
          <b class="text-purple-600 mr-1">${escaparHTML(String(item.qtd))}x</b>
          ${escaparHTML(item.nome)}
        </span>
      </div>
      <button type="button"
        onclick="removerItemCarrinho(${Number(index)})"
        class="ml-2 p-2 text-red-400 hover:text-red-600 hover:bg-red-50 rounded-lg opacity-0 group-hover:opacity-100 transition-all"
        title="Remover da lista">
        <i class="fas fa-trash-alt text-xs"></i>
      </button>
    </li>
  `).join('');
}

function removerItemCarrinho(index) {
  if (index < 0 || index >= itensSelecionados.length) return;
  itensSelecionados.splice(index, 1);
  renderizarCarrinhoItens();
}


function adicionarItemFixoCarrinho(nome, maxQtd) {
  const inputId = 'qtd_fixo_' + nome.replace(/\s/g, '_');
  const input = document.getElementById(inputId);
  const qtd = parseInt(input?.value) || 1;

  if (qtd < 1 || qtd > maxQtd) {
    Swal.fire('Atenção', `Quantidade inválida. Máximo disponível: ${maxQtd}`, 'warning');
    return;
  }

  const existente = itensFixosSelecionados.findIndex(i => i.nome === nome);
  if (existente > -1) {
    itensFixosSelecionados[existente].qtd = qtd;
  } else {
    itensFixosSelecionados.push({ nome, qtd });
  }

  renderizarCarrinhoFixos();
}

          const diffMs = dataEvento.getTime() - inicioSemanaAtual.getTime();

              alvo.style.boxShadow  = '';

function _parseDataMs(raw) {
  try {
    var d = null;
    if (raw instanceof Date) { d = new Date(raw); }
    else {
      var str = String(raw || '').trim();
      if (str.includes('/')) { var p = str.split('/'); if (p.length===3) d = new Date(p[2],p[1]-1,p[0]); }
      else if (str.includes('-')) { d = new Date(str); }
    }
    if (d) { d.setHours(0,0,0,0); return d.getTime(); }
  } catch(e) {}
  return null;
}

/**
 * RENDERIZAR RESERVAS
 * Aplica os filtros do AppState e gera o HTML das linhas da tabela.
 */
function renderizarReservas() {

  if (!AppState.colecoes.reservas?.length) {
    console.warn("⚠️ Nenhuma reserva ainda");
    return;
  }

  const corpoTabela = document.getElementById('corpoTabela');

  const termoBusca = (document.getElementById('filtroBusca')?.value || '').toLowerCase().trim();
  const setor = document.getElementById('filtroSetor')?.value || '';
  const status = document.getElementById('filtroStatus')?.value || '';
  const turno = document.getElementById('filtroTurno')?.value || '';
  const salaId = document.getElementById('filtroSala')?.value || '';
  const apenasMinhas = document.getElementById('filtroMinhas')?.checked;
    
  const hoje = new Date();
  hoje.setHours(0, 0, 0, 0);
  const hojeMs = hoje.getTime(); // ← declarado UMA VEZ aqui

  let filtrados = (AppState.colecoes.reservas || []).filter(r => {

    const nomeAcao    = (r[6] || "").toString().toLowerCase();
    const idReserva   = (r[0] || "").toString().toLowerCase();
    const responsavel = (r[8] || "").toString().toLowerCase();
    const nomeSala    = (AppState.mapaSalas?.[r[4]] || r[4] || '').toString().toLowerCase().trim();

    const matchSala = !salaId || String(r[4]).trim() === String(salaId).trim();

    const matchBusca =
      !termoBusca ||
      nomeAcao.includes(termoBusca) ||
      idReserva.includes(termoBusca) ||
      responsavel.includes(termoBusca) ||
      nomeSala.includes(termoBusca);

    const matchSetor  = !setor  || r[9] === setor;
    const matchStatus = !status || r[13] === status;
    const matchTurno  = !turno  || r[5] === turno;
    const matchUsuario =
      !apenasMinhas ||
      String(r[8]).trim().toLowerCase() === String(AppState.usuario.email).trim().toLowerCase();
    

    let data = null;
    try {
      const raw = r[1];
      if (raw instanceof Date) {
        data = new Date(raw);
      } else {
        const str = String(raw || '').trim();
        if (str.includes('/')) {
          const p = str.split('/');
          if (p.length === 3) data = new Date(p[2], p[1] - 1, p[0]);
        } else if (str.includes('-')) {
          data = new Date(str);
        }
      }
      if (data) data.setHours(0, 0, 0, 0);
    } catch(e) { data = null; }

    let matchPeriodo = true;
    if (data) {
      const inicio = AppState.filtros?.dataInicio;
      const fim    = AppState.filtros?.dataFim;
      if (inicio && fim)       matchPeriodo = data >= inicio && data <= fim;
      else if (inicio && !fim) matchPeriodo = data >= inicio;
      else if (!inicio && fim) matchPeriodo = data <= fim;
      else                     matchPeriodo = true;
    }

    return matchBusca && matchSetor && matchStatus && matchTurno && matchPeriodo && matchSala && matchUsuario;
  });

  // ── Ordenação composta: data → hora início → hora término ──────────────
  const parseDataMs = (r) => {
    try {
      const raw = r[1];
      if (raw instanceof Date) { const d = new Date(raw); d.setHours(0,0,0,0); return d.getTime(); }
      const str = String(raw || '').trim();
      if (str.includes('/')) {
        const p = str.split('/');
        if (p.length === 3) { const d = new Date(p[2], p[1]-1, p[0]); d.setHours(0,0,0,0); return d.getTime(); }
      } else if (str.includes('-')) {
        const d = new Date(str); d.setHours(0,0,0,0); return d.getTime();
      }
    } catch(e) {}
    return 0;
  };

  const parseHoraMin = (h) => {
    if (!h) return 0;
    const str = String(h).trim();
    if (!str.includes(':')) return 0;
    const p = str.split(':');
    return parseInt(p[0], 10) * 60 + parseInt(p[1], 10);
  };

  // Separa passado e futuro/hoje para garantir que hoje em diante venha primeiro
  const hoje0 = new Date(); hoje0.setHours(0,0,0,0);
  const hojeMs2 = hoje0.getTime();

  const futuras   = filtrados.filter(r => parseDataMs(r) >= hojeMs2);
  const passadas  = filtrados.filter(r => parseDataMs(r) <  hojeMs2);

  const ordenar = arr => arr.sort((a, b) => {
    const dA = parseDataMs(a),     dB = parseDataMs(b);
    if (dA !== dB) return dA - dB;
    const iA = parseHoraMin(a[2]), iB = parseHoraMin(b[2]);
    if (iA !== iB) return iA - iB;
    return parseHoraMin(a[3]) - parseHoraMin(b[3]);
  });

  filtrados = [...ordenar(futuras), ...ordenar(passadas)];

  const contadorElement = document.getElementById('contadorResultados');
  if (contadorElement) contadorElement.innerText = filtrados.length + " Registros Encontrados";

  if (filtrados.length === 0) {
    corpoTabela.innerHTML = '';
    document.getElementById('semResultados')?.classList.remove('hidden');
    return;
  }
  document.getElementById('semResultados')?.classList.add('hidden');

  let separadorInserido = false;
  const linhas = [];

  filtrados.forEach(r => {
    const dataReservaMs = _parseDataMs(r[1]);
    if (!separadorInserido && dataReservaMs && dataReservaMs >= hojeMs) {
      separadorInserido = true;
      linhas.push('<tr><td colspan="5" class="px-4 py-2 bg-purple-50 border-y border-purple-100"><span class="text-[9px] font-black text-purple-500 uppercase tracking-widest"><i class="fas fa-circle-dot mr-1"></i>A partir de hoje</span></td></tr>');
    }
    linhas.push(_gerarLinhaReserva(r));
  });

  corpoTabela.innerHTML = linhas.join('');
}

  google.script.run

      }

      return;

      // 🔵 ADMIN (NÃO DONO) → JUSTIFICATIVA OBRIGATÓRIA

      }

      }

function aplicarAtalhoPeriodo() {

  const valor = document.getElementById('filtroIntervalo').value;

  const hoje = new Date();
  hoje.setHours(0,0,0,0);

  let inicio = null;
  let fim = null;

  if (valor === 'hoje') {
    inicio = new Date(hoje);

    fim = new Date(hoje);
    fim.setHours(23, 59, 59, 999); // 🔥 ESSENCIAL
  }

  else if (valor === 'apartir') {
    inicio = hoje;
    fim = null;
  }

  else if (valor === '7') {
    inicio = hoje;
    fim = new Date(hoje);
    fim.setDate(hoje.getDate() + 7);
  }

  else if (valor === '30') {
    inicio = hoje;
    fim = new Date(hoje);
    fim.setDate(hoje.getDate() + 30);
  }

  else {
    inicio = null;
    fim = null;
  }

  AppState.filtros.dataInicio = inicio;
  AppState.filtros.dataFim = fim;

  renderizarReservas();
}

// ── Utilitário de debounce ────────────────────────────────────────────────
// Atrasa a execução de fn até que o usuário pare de digitar/interagir
// por `espera` milissegundos. Evita renderizações desnecessárias a cada tecla.
function debounce(fn, espera) {
  let timer;
  return function(...args) {
    clearTimeout(timer);
    timer = setTimeout(() => fn.apply(this, args), espera);
  };
}

const renderizarReservasDebounced = debounce(renderizarReservas, 220);

function executarRollback() {
  if (!AppState.usuario.isSuperadmin) {
    Swal.fire('Acesso Negado', 'Apenas Superadmins podem desfazer ações.', 'error');
    return;
  }

  Swal.fire({
    title: 'Desfazer última ação?',
    text: 'Reverterá a última alteração registrada no sistema. Esta operação não pode ser desfeita.',
    icon: 'warning',
    showCancelButton: true,
    confirmButtonColor: '#f59e0b',
    confirmButtonText: 'Sim, desfazer!',
    cancelButtonText: 'Cancelar'
  }).then((result) => {
    if (!result.isConfirmed) return;

    showLoader(true);

    // Reutiliza rollbackAcaoPorIndice com índice 0 (= última ação)
    google.script.run
      .withSuccessHandler(function() {
        showLoader(false);
        Swal.fire({
          title: 'Desfeito!',

    title: `Excluir ${escaparHTML(tipo.toUpperCase())}?`,
    text: 'Esta ação não pode ser desfeita.',
    icon: 'warning',
    showCancelButton: true,
    confirmButtonColor: '#ef4444',
    confirmButtonText: 'Sim, excluir!',
    cancelButtonText: 'Cancelar'
  }).then((result) => {
    if (result.isConfirmed) {
      showLoader(true);
      google.script.run
        .withSuccessHandler(function(novosDados) {
          AppState.colecoes.salas = novosDados.salas || [];
          AppState.colecoes.itens = novosDados.listaItens || [];
          AppState.colecoes.setores = novosDados.setores || [];
          AppState.colecoes.administradores = novosDados.administradores || [];
          if (typeof popularSelectsIniciais === 'function') popularSelectsIniciais();
          if (typeof renderizarEspacosAdmin === 'function') renderizarEspacosAdmin();
          if (typeof renderizarItensAdmin === 'function') renderizarItensAdmin();
          if (typeof renderizarSetoresAdmin === 'function') renderizarSetoresAdmin();
          if (typeof renderizarAdmins === 'function') renderizarAdmins();
          showLoader(false);
          Swal.fire('Excluído!', 'Registro removido.', 'success');
        })
        .withFailureHandler(function(err) {
          showLoader(false);
          Swal.fire('Erro no Servidor', err.message, 'error');
        })
        .removerRegistroGenerico(id, tipo, AppState.usuario.email);  // ← email passado
    }
  });
}


// FUNÇÃO PARA EXPANDIR / RECOLHER CARDS
function toggleCard(idConteudo, botao) {
  const conteudo = document.getElementById(idConteudo);
  const icone = botao.querySelector('i');
  
  if (conteudo.style.display === "none") {
    conteudo.style.display = "block";
    icone.className = "fas fa-chevron-up";
  } else {
    conteudo.style.display = "none";
    icone.className = "fas fa-chevron-down";
  }
}

// FUNÇÃO DE FILTRO RÁPIDO (Funciona para todos os cards)
function filtrarLista(idContainer, termo) {
  const busca = termo.toLowerCase().trim();
  const container = document.getElementById(idContainer);
  const itens = container.querySelectorAll('.item-renderizado');

  itens.forEach(item => {
    const texto = item.innerText.toLowerCase();
    item.style.display = texto.includes(busca) ? "flex" : "none";
  });
}

function filtrarItensAdmin(termo) {
  const busca = termo.toLowerCase().trim();
  const itensRaw = AppState.colecoes.itens || [];
  
  // Filtra ignorando o cabeçalho
  const filtrados = itensRaw.filter(item => {
    const id = String(item[0]).toUpperCase();
    const nome = String(item[1]).toLowerCase();
    const categoria = String(item[2]).toLowerCase();
    
    if (id === "ID ITEM" || id === "") return false;
    
    return nome.includes(busca) || categoria.includes(busca);
  });

  // Chama a renderização passando apenas o que sobrou no filtro
  renderizarItensAdmin(filtrados);
}

/**
 * ABRIR MODAL DE CONFIGURAÇÃO (Expandido para Admins e Setores)
 */
function abrirModalConfig(tipo, id = null, nome = '', valor1 = '', valor2 = '') {
  const modal = document.getElementById('modalConfig');
  const title = document.getElementById('modalConfigTitle');

  const camposEspaco = document.getElementById('camposEspaco');
  const camposItem = document.getElementById('camposItem');
  const camposUsuario = document.getElementById('camposUsuario');
  const camposSetor = document.getElementById('camposSetor');

  document.getElementById('formConfig').reset();
  document.getElementById('configId').value = id || '';
  document.getElementById('configTipo').value = tipo;

  const nomeLimpo = nome.replace(/\\'/g, "'");

  [camposEspaco, camposItem, camposUsuario, camposSetor].forEach(el => el?.classList.add('hidden'));

  if (tipo === 'espaco') {
    title.innerText = id ? 'EDITAR ESPAÇO' : 'NOVO ESPAÇO';
    camposEspaco.classList.remove('hidden');
    if (id) {
      document.getElementById('configNomeEspaco').value = nomeLimpo;
      document.getElementById('configCapacidade').value = valor1;
      let _donos = [];
      try { _donos = JSON.parse(valor2); if (!Array.isArray(_donos)) throw 0; }
      catch(e) { _donos = (valor2 && String(valor2).includes('@')) ? [{ email: valor2, dias: [1,2,3,4,5,6,0], setor: '' }] : []; }
      window._donosEspaco = _donos;
      renderizarContainerDonos();
      if (typeof atualizarVisualizacaoPatrimonio === 'function') atualizarVisualizacaoPatrimonio(id);
    } else {
      window._donosEspaco = [];
      renderizarContainerDonos();
      const container = document.getElementById('container-itens-fixos');
      if (container) container.innerHTML = '<p class="text-[10px] text-slate-400 text-center py-4 italic">Salve o espaço primeiro para gerenciar itens fixos.</p>';
    }
  }
  else if (tipo === 'item') {
    title.innerText = id ? 'EDITAR ITEM' : 'NOVO ITEM NO ALMOXARIFADO';
    camposItem.classList.remove('hidden');
    if (id) {
      document.getElementById('configNomeItem').value = nomeLimpo;
      document.getElementById('configQtd').value = valor1;
      document.getElementById('configTipoItem').value = valor2;
    }
  }
  else if (tipo === 'usuario') {
    title.innerText = id ? 'EDITAR ADMINISTRADOR' : 'NOVO ADMINISTRADOR';
    camposUsuario.classList.remove('hidden');
    if (id) {
      // id é o próprio email, valor1 é o nível de acesso
      document.getElementById('configEmailAdmin').value = id;
      document.getElementById('configNivelAdmin').value = valor1;
      document.getElementById('configEmailAdmin').readOnly = true;
    } else {
      document.getElementById('configEmailAdmin').readOnly = false;
    }
  }
  else if (tipo === 'setor') {
    title.innerText = id ? 'EDITAR SETOR' : 'NOVO SETOR INSTITUCIONAL';
    camposSetor.classList.remove('hidden');
    if (id) {
      document.getElementById('configNomeSetor').value = nomeLimpo;
    }
  }

  modal.classList.remove('hidden');
}

/**
 * CARREGAR AUDITORIA (LOGS)
 * Busca os logs no servidor e renderiza apenas para Superadmins.
 */
function carregarAuditoria() {
  if (!AppState.usuario.isAdmin) return;

  const corpo = document.getElementById('tabelaLogs');
  if (corpo) {
    corpo.innerHTML = `
      <tr>
        <td colspan="8" class="p-16 text-center">
          <i class="fas fa-spinner animate-spin text-purple-400 text-2xl"></i>
          <p class="text-slate-400 text-xs mt-3 font-bold uppercase tracking-widest">Carregando auditoria...</p>
        </td>
      </tr>`;
  }

  google.script.run
    .withSuccessHandler(function(jsonLogs) {
      const logs = JSON.parse(jsonLogs);
      renderizarLogs(logs);
    })
    .withFailureHandler(function(err) {
      Swal.fire('Erro', err.message, 'error');
    })
    .obterLogs(AppState.usuario.email);
}

function renderizarLogs(logs) {
  const corpo = document.getElementById('tabelaLogs');
  if (!corpo) return;

  if (!logs || logs.length === 0) {
    corpo.innerHTML = `
      <tr>
        <td colspan="8" class="p-20 text-center">
          <i class="fas fa-shield-halved text-slate-100 text-5xl mb-4"></i>
          <p class="text-slate-300 font-bold text-xs uppercase tracking-widest">Nenhum registro encontrado.</p>
        </td>
      </tr>`;
    return;
  }

  const coresAcao = {
    'CRIAÇÃO': 'bg-green-100 text-green-700',
    'EDIÇÃO': 'bg-blue-100 text-blue-700',
    'EXCLUSÃO': 'bg-red-100 text-red-600',
    'EXCLUSÃO DEFINITIVA': 'bg-red-200 text-red-800',
    'CANCELAMENTO': 'bg-amber-100 text-amber-700',
    'ROLLBACK': 'bg-purple-100 text-purple-700'
  };

  // Ações reversíveis
  const reversíveis = ['CRIAÇÃO', 'EDIÇÃO', 'EXCLUSÃO', 'EXCLUSÃO DEFINITIVA', 'AGENDAMENTO'];

  corpo.innerHTML = logs.map((log, indice) => {
    const corAcao = coresAcao[log[2]] || 'bg-slate-100 text-slate-600';
    const antes  = log[6] ? `<span class="text-red-400 line-through text-[9px]">${escaparHTML(log[6])}</span>` : '<span class="text-slate-300 text-[9px]">—</span>';
    const depois = log[7] ? `<span class="text-green-600 text-[9px]">${escaparHTML(log[7])}</span>`           : '<span class="text-slate-300 text-[9px]">—</span>';
    const acaoUpper = String(log[2] || '').toUpperCase();
    const ehReversivel = AppState.usuario.isSuperadmin && reversíveis.some(r => acaoUpper.includes(r));

    // Timestamp da linha usado como identificador imutável para rollback
    const timestampLog = escaparHTML(String(log[0] || ''));

    return `
    <tr class="text-[11px] hover:bg-slate-50 transition-colors">
      <td class="p-4 text-slate-500 font-medium whitespace-nowrap">${timestampLog}</td>
      <td class="p-4 font-bold text-slate-700">${escaparHTML(log[1] ? log[1].split('@')[0] : '—')}</td>
      <td class="p-4 text-center">
        <span class="px-2 py-0.5 rounded ${corAcao} font-black text-[9px] uppercase whitespace-nowrap">${escaparHTML(log[2])}</span>
      </td>
      <td class="p-4 text-slate-600 font-medium">${escaparHTML(AppState.mapaSalas?.[log[4]] || log[4])}</td>
      <td class="p-4 text-slate-500 max-w-[150px] truncate" title="${escaparHTML(log[5])}">${escaparHTML(log[5])}</td>
      <td class="p-4 max-w-[150px] truncate" title="${escaparHTML(log[6] || '')}">${antes}</td>
      <td class="p-4 max-w-[150px] truncate" title="${escaparHTML(log[7] || '')}">${depois}</td>
      <td class="p-4 text-center">
        ${ehReversivel ? `
          <button
            data-acao="rollback-seletivo"
            data-timestamp="${timestampLog}"
            aria-label="Desfazer ação de ${escaparHTML(log[2])} em ${timestampLog}"
            class="px-2 py-1 bg-amber-100 hover:bg-amber-500 text-amber-700 hover:text-white text-[9px] font-black rounded-lg transition-all uppercase">
            <i class="fas fa-undo mr-1" aria-hidden="true"></i>Desfazer
          </button>
        ` : ''}
      </td>
    </tr>`;
  }).join('');
}

/**
 * PREPARAR EDIÇÃO DE RESERVA
 * Localiza os dados no AppState e preenche o formulário de reserva.
 */
function prepararEdicao(id) {
  const reserva = AppState.colecoes.reservas.find(r => r[0] === id);
  if (!reserva) return;

  AppState.editandoId = id;
  resetarFormulario();

  document.getElementById('inputReservaId').value = reserva[0];
  document.getElementById('horaInicio').value = reserva[2];
  document.getElementById('horaTermino').value = reserva[3];
  document.getElementById('inputTurnoCalculado').value = reserva[5];
  document.getElementById('inputNomeAcao').value = reserva[6];
  document.getElementById('inputOutroResponsavel').value = reserva[10];
  // CODIP totais automáticos
  ['codipPubPresencial','codipPubVirtual','codipVisualizacoes',
   'codipHorasAntes','codipHorasMes','codipHorasTotal'].forEach(function(id){
    var el = document.getElementById(id);
    if (el) el.addEventListener('input', _codipAtualizarTotais);
  });
  document.getElementById('inputRelease').value = reserva[11];

  const selSala = document.getElementById('selectSala');
  if (selSala) selSala.value = reserva[4];

  const selSetor = document.getElementById('selectSetor');
  if (selSetor) selSetor.value = reserva[9];

  if (calendarInstance && reserva[1]) {
    const partes = String(reserva[1]).split('/');
    if (partes.length === 3) {
      const dataObj = new Date(partes[2], partes[1] - 1, partes[0]);
      calendarInstance.setDate(dataObj, true);
    }
  }

  // Processa itens usando ' | ' como separador (mesmo que salvarAgendamento)
  itensSelecionados = [];
  if (reserva[12] && reserva[12] !== "Nenhum") {
    itensSelecionados = reserva[12].split(' | ').map(str => {
      const partes = str.trim().split('x ');
      return {
        qtd: partes[0] ? partes[0].trim() : '1',
        nome: partes[1] ? partes[1].trim() : str.trim()
      };
    }).filter(i => i.nome);
  }
  renderizarCarrinhoItens();

  const btn = document.querySelector('#formReserva button[type="submit"]');
  btn.innerHTML = '<i class="fas fa-save"></i> Atualizar Dados da Reserva';
  btn.classList.replace('bg-purple-600', 'bg-blue-600');

  mostrarAba('aba-nova-reserva');
}

/**
 * FILTRAR LOGS EM TEMPO REAL
 */
function filtrarLogs(valor) {
  const busca = valor.toLowerCase().trim();
  const linhas = document.querySelectorAll('#tabelaLogs tr');

  linhas.forEach(linha => {
    // Busca em todas as células da linha, incluindo o atributo title
    // que contém o texto completo das colunas truncadas (antes/depois)
    const textoCelulas = Array.from(linha.querySelectorAll('td')).map(td => {
      const title = td.getAttribute('title') || '';
      const texto = td.innerText || '';
      return (texto + ' ' + title).toLowerCase();
    }).join(' ');

    linha.style.display = textoCelulas.includes(busca) ? '' : 'none';
  });
}


/**
 * ENVIA OS DADOS DE CONFIGURAÇÃO PARA O SERVIDOR
 * Suporta: Espaços, Itens, Usuários e Setores.
 */
function salvarConfiguracao() {
  const btnSalvar = document.querySelector('#formConfig button[type="submit"]');
  const tipoElement = document.getElementById('configTipo');
  if (!tipoElement?.value) { Swal.fire('Erro', 'Tipo não identificado.', 'error'); return; }

  const tipo = tipoElement.value.trim().toLowerCase();
  const id = document.getElementById('configId')?.value || null;

  let dados = {
    tipo: tipo,
    id: id,
    emailAtual: AppState.usuario.email   // ← email injetado aqui
  };

  if (tipo === 'espaco') {
    dados.nome = document.getElementById('configNomeEspaco')?.value.trim();
    dados.capacidade = document.getElementById('configCapacidade')?.value || 0;
    const _df = (window._donosEspaco || []).filter(d => d.email && String(d.email).includes('@'));
    dados.emailEspaco = _df.length ? JSON.stringify(_df) : '';
  } else if (tipo === 'item') {
    dados.nome = document.getElementById('configNomeItem')?.value.trim();
    dados.qtd = document.getElementById('configQtd')?.value || 0;
    dados.categoria = document.getElementById('configTipoItem')?.value || 'Outros';
  } else if (tipo === 'usuario') {
    dados.email = document.getElementById('configEmailAdmin')?.value.trim();
    dados.nivel = document.getElementById('configNivelAdmin')?.value;
    dados.nome = dados.email;
  } else if (tipo === 'setor') {
    dados.nome = document.getElementById('configNomeSetor')?.value.trim();
  }

  if ((tipo === 'usuario' && !dados.email) || (tipo !== 'usuario' && !dados.nome)) {
    Swal.fire('Aviso', 'Preencha os campos obrigatórios.', 'warning');
    return;
  }

  if (btnSalvar?.disabled) return;
  if (btnSalvar) { btnSalvar.disabled = true; btnSalvar.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> SALVANDO...'; }

  google.script.run
    .withSuccessHandler(function(novosDados) {
      if (btnSalvar) { btnSalvar.disabled = false; btnSalvar.innerHTML = 'SALVAR ALTERAÇÕES'; }
      fecharModalConfig();
      AppState.colecoes.salas = novosDados.salas || [];
      AppState.colecoes.itens = novosDados.listaItens || [];
      AppState.colecoes.administradores = novosDados.administradores || [];
      AppState.colecoes.setores = novosDados.setores || [];
      AppState.mapaSalas = novosDados.mapaSalas || {};
      setTimeout(() => {
        if (typeof renderizarEspacosAdmin === 'function') renderizarEspacosAdmin();
        if (typeof renderizarItensAdmin === 'function') renderizarItensAdmin();
        if (typeof renderizarAdmins === 'function') renderizarAdmins();
        if (typeof renderizarSetoresAdmin === 'function') renderizarSetoresAdmin();
        if (typeof popularSelectsIniciais === 'function') popularSelectsIniciais();
        if (typeof renderizarReservas === 'function') renderizarReservas();
      }, 100);
      Swal.fire({ title: 'Sucesso!', text: 'Dados atualizados.', icon: 'success', timer: 2000, showConfirmButton: false, toast: true, position: 'top-end' });
    })
    .withFailureHandler(function(err) {
      if (btnSalvar) { btnSalvar.disabled = false; btnSalvar.innerHTML = 'SALVAR ALTERAÇÕES'; }
      Swal.fire('Erro ao Salvar', err.message, 'error');
    })
    .processarSalvarConfig(dados);
}


function atualizarVisualizacaoPatrimonio(idSala) {

  // Feedback visual de carregamento
  container.innerHTML = `
    <div class="flex flex-col items-center justify-center py-8">
      <div class="w-6 h-6 border-2 border-purple-500 border-t-transparent rounded-full animate-spin mb-2"></div>
      <p class="text-[10px] text-slate-400 font-medium">Sincronizando patrimônio...</p>
    </div>
  `;

  google.script.run
    .withSuccessHandler(function(todosItens) {
      // Verifica se há dados além do cabeçalho
      if (!todosItens || todosItens.length === 0) {
        container.innerHTML = '<p class="text-[10px] text-slate-400 text-center py-8">Nenhum item disponível no almoxarifado.</p>';
        return;
      }

      container.innerHTML = todosItens.map(item => {
        const idItem = String(item[0]);
        const nomeItem = String(item[1]).replace(/'/g, "\\'");
        const categoria = item[2] || "Geral";
        const qtdDisponivelAlmoxarifado = Number(item[3] || 0);
        
        // Lógica de Localização Distribuída (JSON)
        let mapaLocalizacao = {};
        try {
          // Garante que o conteúdo da coluna E seja tratado como string antes do parse
          const rawLocalizacao = String(item[4] || "{}").trim();
          mapaLocalizacao = JSON.parse(rawLocalizacao.startsWith('{') ? rawLocalizacao : "{}");
        } catch(e) { 
          mapaLocalizacao = {}; 
        }
        
        const qtdNestaSala = Number(mapaLocalizacao[idSala] || 0);
        const temEstoque = qtdDisponivelAlmoxarifado > 0;

        return `
          <div class="p-3 bg-white rounded-2xl mb-2 border border-slate-100 hover:shadow-sm transition-all">
            <div class="flex justify-between items-start mb-2">
              <div class="flex flex-col overflow-hidden">

                <span class="text-[9px] text-slate-400 uppercase tracking-wider">${escaparHTML(categoria)}</span>
              </div>
              <div class="text-right shrink-0 ml-2">
                <span class="block text-[10px] font-black text-purple-600">

              </span>

              <span class="block text-[9px] ${temEstoque ? 'text-slate-400' : 'text-red-400'} font-medium">
                ${temEstoque 
                  ? `Disponível: ${Number(qtdDisponivelAlmoxarifado)}` 
                  : 'Esgotado'}

              </div>
            </div>
            
            <div class="flex items-center gap-2 mt-2">
              <input type="number" 
              id="input_qtd_${escaparHTML(idItem)}" 
              min="1" 
              max="${temEstoque ? Number(qtdDisponivelAlmoxarifado) : 1}" 
              value="1"
              class="w-12 p-1 text-center text-xs bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-purple-400 outline-none font-bold text-slate-600">
              
              <button type="button" 
                onclick="executarMobilizacaoEstoque(&quot;${escaparHTML(idItem)}&quot;, &quot;${escaparHTML(idSala)}&quot;, 'fixar')"
                ${!temEstoque ? 'disabled' : ''}
                class="flex-1 text-[9px] font-black py-2 rounded-lg transition-all shadow-sm uppercase tracking-tighter ${
                  !temEstoque 
                  ? 'bg-slate-100 text-slate-400 cursor-not-allowed' 
                  : 'bg-purple-600 text-white hover:bg-purple-700 active:scale-95'
                }">
                ${temEstoque ? 'Fixar Unit.' : 'Sem Estoque'}
              </button>
              
              ${qtdNestaSala > 0 ? `
                <button type="button" 
                  onclick="executarMobilizacaoEstoque(&quot;${escaparHTML(idItem)}&quot;, &quot;${escaparHTML(idSala)}&quot;, 'liberar')"

    })
    .withFailureHandler(function(err) {
       container.innerHTML = `<p class="text-[10px] text-red-400 text-center py-4 px-2">Erro ao sincronizar: ${escaparHTML(err.message)}</p>`;
    })
    .obterDadosParaConfig('Itens');
}

/**
 * Nova função de mobilização que lida com quantidades
 */
function executarMobilizacaoEstoque(idItem, idSala, acao) {
  const inputElement = document.getElementById(`input_qtd_${escaparHTML(idItem)}`);
  if (!inputElement) return;
  const qtdMover = parseInt(inputElement.value) || 0;
  if (qtdMover <= 0) { Swal.fire({ icon: 'warning', title: 'Quantidade Inválida', text: 'Valor maior que zero.', confirmButtonColor: '#9333ea' }); return; }
  if (typeof showLoader === 'function') showLoader(true);
  google.script.run
    .withSuccessHandler(function() {
      inputElement.value = 1;
      if (typeof inicializarApp === 'function') inicializarApp();
      if (typeof atualizarVisualizacaoPatrimonio === 'function') atualizarVisualizacaoPatrimonio(idSala);
      if (typeof showLoader === 'function') showLoader(false);
      Swal.mixin({ toast: true, position: 'top-end', showConfirmButton: false, timer: 2500, timerProgressBar: true })
        .fire({ icon: 'success', title: acao === 'fixar' ? 'Item alocado' : 'Item liberado' });

  }).obterDisponibilidadeItensPorHorario(data, inicio, termino);

function gerarHorariosDisponiveis(sala, data) {

  const horariosBase = [
    "08:00","09:00","10:00","11:00",
    "12:00","13:00","14:00","15:00",
    "16:00","17:00","18:00","19:00",
    "20:00"
  ];

  const ocupados = obterHorariosOcupadosFrontend(sala, data);

  const normalizar = (h) => {
    const p = h.split(':');
    return parseInt(p[0]) * 60 + parseInt(p[1]);
  };

  return horariosBase.filter(h => {

    const inicio = normalizar(h);
    const fim = inicio + 60; // bloco de 1h

    const conflito = ocupados.some(o =>
      inicio < o.fim && fim > o.inicio
    );

    return !conflito;
  });
}

function renderizarTabelaRece() {
  const corpo = document.getElementById('corpoTabelaRece');
  if (!corpo) return;

  // Dados ainda não carregados — aguarda sem quebrar
  if (!AppState.colecoes.reservasRece) {
    corpo.innerHTML = `
      <tr>
        <td colspan="10" class="p-10 text-center">
          <i class="fas fa-spinner animate-spin text-yellow-500 text-xl"></i>
          <p class="text-slate-400 text-xs mt-2 font-bold uppercase tracking-widest">Carregando...</p>
        </td>
      </tr>`;
    return;
  }

  const busca = (document.getElementById('receBusca')?.value || '').toLowerCase().trim();
  const filtroInicio = document.getElementById('receFiltroInicio')?.value;
  const filtroFim = document.getElementById('receFiltroFim')?.value;

  let dados = AppState.colecoes.reservasRece || [];

  dados = dados.filter(r => {
    const texto = [r[1], r[7], r[8], r[12]].join(' ').toLowerCase();
    if (busca && !texto.includes(busca)) return false;

    if (filtroInicio || filtroFim) {
      // r[2] = Data Início no formato DD/MM/YYYY
      const partes = String(r[2] || '').split('/');
      if (partes.length === 3) {
        const dataEvento = new Date(partes[2], partes[1]-1, partes[0]);
        if (filtroInicio && dataEvento < new Date(filtroInicio)) return false;
        if (filtroFim   && dataEvento > new Date(filtroFim + 'T23:59:59')) return false;
      }
    }
    return true;
  });

   // ── Ordenação composta RECE: data início → hora início → hora término ──
  const parseDataRece = (str) => {
    if (!str) return 0;
    const s = String(str).trim();
    if (s.includes('/')) {
      const p = s.split('/');
      if (p.length === 3) { const d = new Date(p[2], p[1]-1, p[0]); d.setHours(0,0,0,0); return d.getTime(); }
    }
    if (s.includes('-')) { const d = new Date(s); d.setHours(0,0,0,0); return d.getTime(); }
    return 0;
  };
  const parseHoraRece = (h) => {
    if (!h) return 0;
    const p = String(h).trim().split(':');
    if (p.length < 2) return 0;
    return parseInt(p[0], 10) * 60 + parseInt(p[1], 10);
  };

  const hojeRece = new Date(); hojeRece.setHours(0,0,0,0);
  const hojeMsRece = hojeRece.getTime();

  const futurasRece  = dados.filter(r => parseDataRece(r[2]) >= hojeMsRece);
  const passadasRece = dados.filter(r => parseDataRece(r[2]) <  hojeMsRece);

  const ordenarRece = arr => arr.sort((a, b) => {
    const dA = parseDataRece(a[2]), dB = parseDataRece(b[2]);
    if (dA !== dB) return dA - dB;
    const iA = parseHoraRece(a[4]),  iB = parseHoraRece(b[4]);
    if (iA !== iB) return iA - iB;
    return parseHoraRece(a[5]) - parseHoraRece(b[5]);
  });

  dados = [...ordenarRece(futurasRece), ...ordenarRece(passadasRece)];
  // ── fim ordenação ──────────────────────────────────────────────────────

  const contador = document.getElementById('receContador');

  if (contador) contador.innerText = `${dados.length} registro(s)`;

  if (dados.length === 0) {
    corpo.innerHTML = '';
    document.getElementById('semResultadosRece')?.classList.remove('hidden');
    return;
  }
  document.getElementById('semResultadosRece')?.classList.add('hidden');

  const isCancelado = r => r[17] === 'CANCELADO';

  corpo.innerHTML = (dados || []).map(r => `
  <tr class="hover:bg-slate-50 transition-colors ${isCancelado(r) ? 'opacity-50 grayscale' : ''}">
    
    <td class="p-4">
      <div class="font-bold text-slate-800 uppercase leading-tight">
        ${escaparHTML(r[1] || '')}
      </div>
      <div class="text-[9px] text-slate-400 mt-0.5">
        ${escaparHTML(r[18] || '')}
      </div>
    </td>

    <td class="p-4 whitespace-nowrap">
      <div class="font-semibold text-slate-700">
        ${escaparHTML(r[2] || '')}
      </div>
      <div class="text-[9px] text-slate-400">
        até ${escaparHTML(r[3] || '')}
      </div>
    </td>

    <td class="p-4 whitespace-nowrap text-slate-600">
      ${escaparHTML(r[4] || '')} – ${escaparHTML(r[5] || '')}
    </td>

    <td class="p-4 text-purple-600 font-bold text-[11px]">
      ${escaparHTML(r[6] || '—')}
    </td>

    <td class="p-4 text-slate-600">
      ${escaparHTML(r[7] || '—')}
    </td>

    <td class="p-4 text-slate-600">
      ${escaparHTML(r[12] || '—')}
    </td>

    <td class="p-4">
      ${r[20] && String(r[20]).trim() ? `
        <a href="${escaparHTML(String(r[20]))}" target="_blank" rel="noopener" title="Ver imagem">
          <img src="${escaparHTML(String(r[20]))}"
            alt="capa"
            class="w-14 h-14 rounded-xl object-cover cursor-pointer border border-slate-100 hover:scale-105 hover:shadow-md transition-transform"
            onerror="this.closest('a').outerHTML='<span class=\\'text-slate-300 text-[10px]\\'>Sem imagem</span>'">
        </a>
      ` : '<span class="text-slate-300 text-xs">—</span>'}
    </td>

    <td class="p-4">
      <span class="px-2 py-1 rounded-full text-[9px] font-black ${
        r[14] === 'Gratuito' ? 'bg-green-100 text-green-700' :
        r[14] === 'Pago' ? 'bg-red-100 text-red-700' :
        'bg-slate-100 text-slate-600'
      }">
        ${escaparHTML(r[14] || '—')}
      </span>
    </td>

    <td class="p-4 text-center">
      <span class="px-2 py-1 rounded-full text-[9px] font-black ${
        isCancelado(r) ? 'bg-red-100 text-red-600' : 'bg-green-100 text-green-600'
      }">
        ${escaparHTML(r[17] || '')}
      </span>
    </td>

    <td class="p-4 text-right">
      <div class="flex justify-end gap-2">
        
        ${(AppState.usuario.isAdmin || AppState.usuario.isSuperadmin || AppState.usuario.isComunicacao || AppState.usuario.email === r[18]) ? `

        ${(!isCancelado(r) && (AppState.usuario.isAdmin || AppState.usuario.isSuperadmin || AppState.usuario.email === r[18])) ? `
          <button

`).join('');

function prepararEdicaoRece(id) {
  if (!AppState.colecoes.reservasRece || !AppState.colecoes.reservasRece.length) {

  }

  resetarFormulario();
  AppState.editandoReceId = r[0];

  // mantém ID para ignorar conflito com ele mesmo
