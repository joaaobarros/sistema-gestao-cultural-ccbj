<!--
@file Index.html
@type layout
@description Template raiz do webapp. Compõe o HTML final via include() do GAS,
             define estilos globais e declara a ordem de carregamento dos módulos JS.
@responsibility Estrutura da página, includes de fragmentos HTML, ordem de scripts.
@dependencies Todos os fragmentos em html/layout/, html/modulos/, html/modais/, html/logic/

ORDEM DE CARREGAMENTO DOS SCRIPTS (obrigatória):
  ── CORE ──────────────────────────────────────────────────────
  1. core/app_state_js        — AppState singleton + variáveis de estado do formulário
                                DEVE ser o primeiro script carregado.

  ── SERVICES ──────────────────────────────────────────────────
  2. services/server_bridge_js — GAS object: bridge tipado para google.script.run
                                  Namespaces: reservas, espacos, usuarios, contratos,
                                  equipes, tarefas, processos, almoxarifado, balcao,
                                  eficiencia, contratacoes, permissoes, financeiro (alias)

  ── AUTH ──────────────────────────────────────────────────────
  3. core/auth_identity_js     — captura identidade real ("Execute as: Me"); define Auth.
                                 Deve vir antes de bootstrap_js.

  ── MODULES (sem DOM, sem backend) ───────────────────────────
  4. modules/disponibilidade_module_js — conflito frontend, horários, normalização de datas
  4. modules/itens_module_js           — lookup itens fixos e nomes de sala

  ── UI HELPERS ────────────────────────────────────────────────
  5. mod_ui_componentes_js     — escaparHTML, showLoader, helpers de cor
  6. ui/navegacao_ui_js        — toggleSidebar, mostrarAba, toggleModulo
                                  Dispatch genérico: window._onShow_aba_xxx
  7. ui/permissoes_ui_js       — configurarInterfacePorPermissao

  ── DOMÍNIO / FEATURES ────────────────────────────────────────
  8. mod_ui_estado_js          — validação horários, carrinho, salvarAgendamento, IA, inicializarApp
  9. mod_reservas_js           — calendário, render de reservas, lote, CODIP, diagrama
  10. mod_admin_js             — painéis admin, RECE, dashboard, manual
  11. mod_contratos_js         — CRUD de contratos, metas, rubricas, indicadores
  12. mod_favoritos_js         — drag-and-drop de favoritos na sidebar
  13. mod_permissoes_v2_js     — temPermissao(), carregarPermissoes(), aplicarPermissoesUI() [v2 unificado]
  14. bootstrap_js             — DOMContentLoaded, event listeners (SEMPRE POR ÚLTIMO)

MÓDULOS INLINE (incluídos fora da tag logic/):
  - PainelSolicitacoes, GestaoContratos — módulos de feature com JS próprio,
    carregados após o bootstrap para não bloquear a inicialização principal.
  - modal_manual — modal de ajuda carregado por último para não interferir no boot.

MÓDULOS HTML (incluídos no <main>, cada um com JS próprio inline):
  - mod_tarefas, mod_processos         — CRUD pessoal (GAS.tarefas, GAS.processos)
  - mod_almoxarifado                   — estoque + movimentações (GAS.almoxarifado)
  - mod_balcao                         — atendimentos ao público (GAS.balcao)
  - mod_rh                             — funcionários / Depto. Pessoal (GAS.equipes)
  - mod_eficiencia                     — métricas derivadas das reservas (GAS.eficiencia)
  - mod_contratacoes                   — CRUD contratações PF/PJ (GAS.contratacoes)
  - mod_relatorios_financeiros         — consolidação financeira cruzada (GAS.contratos + GAS.contratacoes)
  - mod_escuta                         — escuta institucional contínua, pulse, alertas NR-1 (GAS.escuta)
  Todos auto-registram: window._onShow_aba_xxx para carregamento lazy.
-->
