

<style>

<section id="aba-balcao" class="tab-content hidden pb-20">

  <div class="bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden">

    <!-- HEADER -->
    <div class="p-5 border-b border-slate-100 bg-slate-50/50 flex justify-between items-center">
      <div>
        <h3 class="font-black text-slate-800 uppercase text-sm">
          <i class="fas fa-bullhorn text-orange-400 mr-2"></i>Central de Comunicação
        </h3>
        <p class="text-[10px] text-slate-400">Produção, campanhas e publicização</p>
      </div>

      <button onclick="abrirModalAtendimento()"
        class="bg-orange-500 hover:bg-orange-600 text-white text-[10px] font-black px-4 py-2 rounded-xl">
        <i class="fas fa-plus mr-1"></i>Novo Processo
      </button>
    </div>

    <!-- FILTROS -->
    <div class="p-4 flex gap-3 flex-wrap border-b">

      <input id="balcaoBusca" placeholder="Buscar..."
        class="border rounded-lg px-3 py-2 text-xs w-60">

      <select id="balcaoFiltroStatus"
        class="border rounded-lg px-3 py-2 text-xs">
        <option value="">Todos</option>
        <option>Solicitado</option>
        <option>Em andamento</option>
        <option>Concluído</option>
      </select>

      <button onclick="mudarModoFila('lista')" data-modo="lista" class="modo-btn">☰</button>
      <button onclick="mudarModoFila('kanban')" data-modo="kanban" class="modo-btn">▦</button>
      <button onclick="mudarModoFila('cards')" data-modo="cards" class="modo-btn">◫</button>
      <button onclick="mudarModoFila('carga')" data-modo="carga" class="modo-btn">👥</button>
      <button onclick="mudarModoFila('timeline')" data-modo="timeline" class="modo-btn">⏱</button>

    </div>

    <!-- CONTADORES -->
    <div id="balcaoContadores" class="flex gap-2 p-3 text-xs"></div>

    <!-- CONTEÚDO PRINCIPAL -->
    <div id="balcaoContainer"></div>

  </div>

  <div class="mt-6 bg-white border border-slate-200 rounded-2xl p-4">

    <div class="text-[10px] uppercase tracking-wider text-slate-400 mb-2 font-black">
      Fila da equipe
    </div>

    <div class="text-xs font-semibold text-slate-700 mb-3">
      Design
    </div>

    <div id="fila-funcao"></div>

  </div>

</section>

<script>

var _balcaoCache = [];

var ENTREGAS_PADRAO = [
  'design',
  'diagramacao',
  'foto',
  'ensaio_fotografico',
  'video',
  'edicao_video',
  'stories',
  'materia',
  'divulgacao'
];

// ==========================
// CARREGAR
// ==========================
function carregarBalcao() {
  GAS.comunicacaoProcessos.listar(function(lista){
    _balcaoCache = lista || [];
    _balcaoFiltrar();
    _balcaoRenderizarContadores();
  });
}

// ==========================
// FILTRAR
// ==========================
function _balcaoFiltrar(){

  var q = (document.getElementById('balcaoBusca').value || '').toLowerCase();
  var st = document.getElementById('balcaoFiltroStatus').value;

  var filtrados = _balcaoCache.filter(function(a){

    var matchBusca =
      (a.titulo || a.assunto || '').toLowerCase().includes(q) ||
      (a.descricao || '').toLowerCase().includes(q);

    var matchStatus = !st || a.status === st;

    return matchBusca && matchStatus;
  });

  renderizarBalcao(filtrados);
}

// ==========================
// CONTADORES
// ==========================
function _balcaoRenderizarContadores(){

  var c = document.getElementById('balcaoContadores');

  var map = {};

  _balcaoCache.forEach(function(a){
    var s = a.status || 'Sem status';
    map[s] = (map[s]||0)+1;
  });

  c.innerHTML = Object.keys(map).map(function(s){
    return `<div class="px-3 py-1 bg-slate-100 rounded">${s}: ${map[s]}</div>`;
  }).join('');
}

// ==========================
// RENDER
// ==========================
function renderizarBalcao(lista){

  lista = lista || _balcaoCache;

  var c = document.getElementById('balcaoContainer');

  function esc(s){
    return String(s||'')
      .replace(/&/g,'&amp;')
      .replace(/</g,'&lt;')
      .replace(/>/g,'&gt;');
  }

  if (!lista.length) {
    c.innerHTML = `
      <div class="p-12 text-center">
        <i class="fas fa-bullhorn text-slate-200 text-4xl mb-3"></i>
        <p class="text-slate-400 font-bold text-sm">Nenhum processo encontrado</p>
      </div>
    `;
    return;
  }

  c.innerHTML = `
    <div class="overflow-x-auto">
      <table class="w-full text-sm">

        <thead>
          <tr class="text-[10px] uppercase tracking-wider text-slate-400 border-b">
            <th class="p-3 text-left">Tipo</th>
            <th class="p-3 text-left">Processo</th>
            <th class="p-3 text-left">Status</th>
            <th class="p-3 text-left">Prazo</th>
            <th class="p-3 text-left">Responsável</th>
            <th class="p-3 text-right"></th>
          </tr>
        </thead>

        <tbody>
          ${lista.map(a => {

            const id = a.id || '';
            const status = (a.status || '').toLowerCase().trim();

            const statusClass =
              status === 'concluído' ? 'bg-emerald-100 text-emerald-700' :
              status === 'em andamento' ? 'bg-amber-100 text-amber-700' :
              'bg-slate-100 text-slate-600';

            return `
              <tr class="border-b hover:bg-slate-50 transition cursor-pointer"
                  onclick="_balcaoToggle('${id}')">

                <!-- TIPO -->
                <td class="p-3">
                  <span class="text-[10px] font-bold text-slate-500 uppercase">
                    ${esc(a.tipo || '-')}
                  </span>
                </td>

                <!-- TÍTULO + DESCRIÇÃO -->
                <td class="p-3">
                  <div class="font-semibold text-slate-800 leading-tight">
                    ${esc(a.titulo || a.assunto || '-')}
                  </div>
                  ${
                    a.descricao
                      ? `<div class="text-[11px] text-slate-400 mt-0.5 truncate">
                          ${esc(a.descricao)}
                        </div>`
                      : ''
                  }
                </td>

                <!-- STATUS -->
                <td class="p-3">
                  <span class="px-2 py-1 rounded-full text-[10px] font-black ${statusClass}">
                    ${esc(a.status || '-')}
                  </span>
                </td>

                <!-- PRAZO -->
                <td class="p-3 text-[11px] text-slate-500">
                  ${esc(a.prazo || '-')}
                </td>

                <!-- RESPONSÁVEL -->
                <td class="p-3 text-[11px] text-slate-600">
                  ${esc(a.responsavel || '-')}
                </td>

                <!-- AÇÕES -->
                <td class="p-3 text-right">
                  <div class="flex justify-end gap-1">

                    <button
                      onclick="event.stopPropagation(); editarAtendimento('${id}')"
                      class="w-7 h-7 flex items-center justify-center rounded-md bg-slate-100 text-slate-500 hover:bg-indigo-600 hover:text-white transition">
                      <i class="fas fa-edit text-[10px]"></i>
                    </button>

                    <button
                      onclick="event.stopPropagation(); excluirAtendimento('${id}')"
                      class="w-7 h-7 flex items-center justify-center rounded-md bg-slate-100 text-slate-400 hover:bg-red-600 hover:text-white transition">
                      <i class="fas fa-trash text-[10px]"></i>
                    </button>

                    <button
                      onclick="event.stopPropagation(); abrirSolicitacaoRevisao('${id}')"
                      class="w-7 h-7 flex items-center justify-center rounded-md bg-amber-100 text-amber-600 hover:bg-amber-500 hover:text-white transition"
                      title="Solicitar alteração">
                      <i class="fas fa-pen text-[10px]"></i>
                    </button>

                  </div>
                </td>

              </tr>

              <tr id="balcao-detail-${id}" class="hidden bg-slate-50">
                <td colspan="6" class="p-4">
                  <div id="balcao-detail-content-${id}"></div>
                </td>
              </tr>
            `;
          }).join('')}
        </tbody>

      </table>
    </div>
  `;
}

function _balcaoToggle(id){

  var row = document.getElementById('balcao-detail-' + id);

  if (!row) return;

  var aberto = !row.classList.contains('hidden');

  if (aberto) {
    row.classList.add('hidden');
    return;
  }

  row.classList.remove('hidden');

  _renderDetalheProcesso(id);

}

function _renderDetalheProcesso(id){

  var proc = _balcaoCache.find(a => a.id === id);
  var el = document.getElementById('balcao-detail-content-' + id);

  if (!proc || !el) return;

  el.innerHTML = `
    <div class="grid md:grid-cols-2 gap-4">

      <!-- INFO -->
      <div class="bg-white border rounded-xl p-4">
        <div class="text-[10px] uppercase text-slate-400 mb-1">Descrição</div>
        <div class="text-sm text-slate-700">${proc.descricao || '-'}</div>

        <div class="mt-3 text-[10px] uppercase text-slate-400">Origem</div>
        <div class="text-sm">${proc.origem || '-'}</div>
      </div>

      <!-- AÇÕES -->
      <div class="bg-white border rounded-xl p-4 flex flex-col gap-2">

        <button 
          onclick="abrirSolicitacaoRevisao('${proc.id}')"
          class="text-xs font-bold px-3 py-2 rounded-lg bg-amber-100 text-amber-700 hover:bg-amber-500 hover:text-white">
          Solicitar alteração
        </button>

      </div>

    </div>

    <!-- ENTREGAS -->
    <div class="mt-4">
      <div class="text-[10px] uppercase text-slate-400 mb-2">Entregas</div>
      <div id="entregas-${id}"></div>
    </div>

    <!-- REVISÃO -->
    <div class="mt-4">
      <div class="text-[10px] uppercase text-slate-400 mb-2">Revisão</div>
      <div id="revisao-${id}"></div>
    </div>
  `;

  _renderEntregas(id);
  _renderRevisao(proc);

}

function _renderEntregas(id){

  GAS.entregas.listarPorProcesso(id, function(lista){

    var el = document.getElementById('entregas-' + id);
    if (!el) return;

    function esc(s){
      return String(s||'')
        .replace(/&/g,'&amp;')
        .replace(/</g,'&lt;')
        .replace(/>/g,'&gt;');
    }

    if (!lista || !lista.length) {
      el.innerHTML = '<div class="text-xs text-slate-400">Sem entregas</div>';
      return;
    }

    el.innerHTML = lista.map(function(e){

      const idEntrega = e['ID Entrega'] || '';
      const tipo = e['Tipo'] || '-';
      const link = e['Link Entrega'] || '';

      return `
        <div class="flex items-center gap-2 mb-2">

          <div class="flex-1 text-sm">
            ${esc(tipo)}
          </div>

          <input
            id="linkEntrega_${idEntrega}"
            value="${esc(link)}"
            placeholder="Link"
            class="border px-2 py-1 text-xs rounded w-40"
          >

          <button
            onclick="concluirEntrega('${idEntrega}')"
            class="text-xs px-2 py-1 rounded bg-emerald-100 text-emerald-700 hover:bg-emerald-600 hover:text-white transition">
            Concluir
          </button>

        </div>
      `;

    }).join('');

  });

}

function _renderRevisao(proc){

  var el = document.getElementById('revisao-' + proc.id);

  if (!proc.revisaoStatus || proc.revisaoStatus !== 'Pendente') {
    el.innerHTML = '<div class="text-xs text-slate-400">Sem solicitações</div>';
    return;
  }

  el.innerHTML = `
    <div class="bg-amber-50 border border-amber-200 rounded-lg p-3">

      <div class="text-xs text-slate-600 mb-2">
        ${proc.revisaoSolicitacao || ''}
      </div>

      <div class="flex gap-2">

        <button
          onclick="_responderRevisao('${proc.id}','Aprovado')"
          class="text-xs px-3 py-1 bg-emerald-100 text-emerald-700 rounded">
          Aprovar
        </button>

        <button
          onclick="_responderRevisao('${proc.id}','Rejeitado')"
          class="text-xs px-3 py-1 bg-red-100 text-red-700 rounded">
          Rejeitar
        </button>

      </div>

    </div>
  `;
}

function _responderRevisao(id, status){

  Swal.fire({
    title: 'Resposta',
    input: 'textarea',
    inputPlaceholder: 'Comentário...',
    showCancelButton: true
  }).then(function(r){

    if (!r.value) return;

    GAS.revisao.responder(
      id,
      status,
      r.value,
      function(){
        carregarBalcao();
      }
    );

  });

}

function _sugerirEntregasPorTipo(tipo){

  var mapa = {

    'Design / Diagramação': [
      'design',
      'diagramacao'
    ],

    'Fotografia': [
      'foto',
      'ensaio_fotografico'
    ],

    'Audiovisual': [
      'video',
      'edicao_video'
    ],

    'Cobertura': [
      'foto',
      'video',
      'stories'
    ],

    'Redes Sociais': [
      'design',
      'stories',
      'divulgacao'
    ],

    'Matéria / Jornalismo': [
      'materia',
      'foto'
    ],

    'Campanha': [
      'design',
      'video',
      'materia',
      'divulgacao'
    ],

    'Publicação RECE': [
      'design',
      'materia',
      'divulgacao'
    ]

  };

  return mapa[tipo] || [];
}

function abrirModalAtendimento(atual){

  atual = atual || {};

  Swal.fire({

    title: atual.id ? 'Editar Processo' : 'Novo Processo',

    width: 720,

    html: `

      <div style="display:flex;flex-direction:column;gap:10px;text-align:left">

        <!-- LINHA 1 -->
        <div style="display:flex;gap:8px">
          <input id="balcSolicitante" class="swal2-input" style="flex:1"
            placeholder="Responsável"
            value="${atual.responsavel||''}">
          
          <select id="balcStatus" class="swal2-input" style="max-width:160px">
            <option ${atual.status==='Solicitado'?'selected':''}>Solicitado</option>
            <option ${atual.status==='Em andamento'?'selected':''}>Em andamento</option>
            <option ${atual.status==='Concluído'?'selected':''}>Concluído</option>
          </select>
        </div>

        <!-- LINHA 2 -->
        <input id="balcAssunto" class="swal2-input"
          placeholder="Título do processo"
          value="${atual.titulo||atual.assunto||''}">

        <!-- LINHA 3 -->
        <textarea id="balcObs" class="swal2-textarea"
          placeholder="Descrição detalhada da demanda">${atual.descricao||''}</textarea>

        <!-- LINHA 4 -->
        <div style="display:flex;gap:8px">

          <select id="balcCanal" class="swal2-input" style="flex:1">
            <option value="grafico" ${atual.tipo==='grafico'?'selected':''}>Design gráfico</option>
            <option value="foto" ${atual.tipo==='foto'?'selected':''}>Fotografia</option>
            <option value="video" ${atual.tipo==='video'?'selected':''}>Audiovisual</option>
            <option value="rece" ${atual.tipo==='rece'?'selected':''}>Publicação RECE</option>
          </select>

          <input id="balcPrazo" type="date" class="swal2-input" style="max-width:160px"
            value="${atual.prazo||''}">
        </div>

        <!-- ENTREGAS -->
        <div style="margin-top:6px">

          <div style="font-size:11px;color:#64748b;margin-bottom:4px">
            Entregas necessárias
          </div>

          <div style="display:flex;gap:6px;flex-wrap:wrap">

            ${ENTREGAS_PADRAO.map(e => `
              <label style="font-size:11px;display:flex;align-items:center;gap:4px">
                <input type="checkbox" class="balcEntrega" value="${e}"
                  ${(atual.entregas||[]).includes(e)?'checked':''}>
                ${_labelEntrega(e)}
              </label>
            `).join('')}

          </div>

        </div>

      </div>
    `,

    confirmButtonText: 'Salvar',
    confirmButtonColor: '#4f46e5',

    preConfirm: function(){

      var entregas = Array.from(
        document.querySelectorAll('#swal2-html-container input[type=checkbox]:checked')
      ).map(e => e.value);

      var titulo = document.getElementById('balcAssunto').value;

      if (!titulo) {
        Swal.showValidationMessage('Título obrigatório');
        return false;
      }

      return {

        id: atual.id || null,

        titulo: titulo,
        descricao: document.getElementById('balcObs').value,

        tipo: document.getElementById('balcCanal').value,
        status: document.getElementById('balcStatus').value,
        responsavel: document.getElementById('balcSolicitante').value,

        prazo: document.getElementById('balcPrazo').value,

        entregas: entregas,

        origem: 'manual'

      };
    }

  }).then(function(r){

    if (!r.value) return;

    if (r.value.id) {

      GAS.comunicacaoProcessos.atualizar(
        r.value.id,
        r.value,
        carregarBalcao
      );

    } else {

      GAS.comunicacaoProcessos.criar(
        r.value,
        carregarBalcao
      );

    }

  });
}

// ==========================
// EDITAR
// ==========================
function editarAtendimento(id){
  var atual = _balcaoCache.find(a => a.id === id);
  abrirModalAtendimento(atual);
}

// ==========================
// EXCLUIR
// ==========================
function excluirAtendimento(id){
  GAS.comunicacaoProcessos.excluir(id, carregarBalcao);
}

// ==========================
window._onShow_aba_balcao = function(){
  carregarBalcao();
  renderFilaFuncao('design');
};

// ==========================
document.getElementById('balcaoBusca').addEventListener('input', _balcaoFiltrar);
document.getElementById('balcaoFiltroStatus').addEventListener('change', _balcaoFiltrar);


// ==========================
// CONCLUIR ENTREGA
// ==========================
function concluirEntrega(idEntrega) {

  var input = document.getElementById('linkEntrega_' + idEntrega);
  var link = input ? input.value.trim() : '';

  if (!link) {
    alert('Adicione o link do material antes de concluir.');
    return;
  }

  GAS.entregas.atualizar(idEntrega, {
    status: 'Entregue',
    link: link
  }, function() {

    alert('Entrega concluída!');
    
    // recarregar UI
    _renderDetalheProcesso(idProcesso);

  }, function(err) {
    alert('Erro ao atualizar entrega: ' + err);
  });
}


// ==========================
// MODIFICAÇÃO DA SOLICITAÇÃO
// ==========================
function solicitarAlteracaoProcesso(idProcesso, texto, email) {

  var aba = _abaProcessos();
  var dados = aba.getDataRange().getValues();
  var headers = dados[0];

  var map = {};
  headers.forEach(function(h, i){ map[h] = i; });

  for (var i = 1; i < dados.length; i++) {

    if (dados[i][0] === idProcesso) {

      dados[i][map['Revisao Status']] = 'Pendente';
      dados[i][map['Revisao Solicitacao']] = texto;
      dados[i][map['Revisao Solicitante']] = email;
      dados[i][map['Revisao Data']] = new Date().toISOString();

      aba.getRange(i + 1, 1, 1, dados[i].length).setValues([dados[i]]);

      // cria tarefa para comunicação
      criarTarefaPlanilha({
        titulo: 'Revisão solicitada: ' + (dados[i][map['Título']] || ''),
        tipo: 'comunicacao',
        subtipo: 'revisao_pendente',
        origem: 'comunicacao',
        idOrigem: idProcesso,
        responsavel: 'comunicacao@ccbj.org'
      });

      return { ok: true };
    }
  }

  return { ok: false };
}

function responderRevisaoProcesso(idProcesso, status, resposta) {

  var aba = _abaProcessos();
  var dados = aba.getDataRange().getValues();
  var headers = dados[0];

  var map = {};
  headers.forEach(function(h, i){ map[h] = i; });

  for (var i = 1; i < dados.length; i++) {

    if (dados[i][0] === idProcesso) {

      dados[i][map['Revisao Status']] = status;
      dados[i][map['Revisao Resposta']] = resposta;

      aba.getRange(i + 1, 1, 1, dados[i].length).setValues([dados[i]]);

      // notifica solicitante
      criarTarefaPlanilha({
        titulo: 'Revisão ' + status + ': ' + (dados[i][map['Título']] || ''),
        tipo: 'comunicacao',
        subtipo: 'revisao_resposta',
        origem: 'comunicacao',
        idOrigem: idProcesso,
        responsavel: dados[i][map['Revisao Solicitante']]
      });

      return { ok: true };
    }
  }

  return { ok: false };
}

function _labelEntrega(k){

  var mapa = {
    design: 'Peça gráfica',
    diagramacao: 'Diagramação',
    foto: 'Fotografia',
    ensaio_fotografico: 'Ensaio fotográfico',
    video: 'Captação de vídeo',
    edicao_video: 'Edição de vídeo',
    stories: 'Cobertura (stories)',
    materia: 'Matéria / texto',
    divulgacao: 'Publicação / divulgação'
  };

  return mapa[k] || k;
}

function renderFilaFuncao(funcao) {

  GAS.tarefas.listarPorFuncao(funcao, function(lista){

    var el = document.getElementById('fila-funcao');
    if (!el) return;

    if (!lista || !lista.length){
      el.innerHTML = '<div class="text-xs text-slate-400">Sem tarefas</div>';
      return;
    }

    var modo = typeof _modoFila !== 'undefined' ? _modoFila : 'lista';

    // =========================
    // ORDENAÇÃO (ordem → prioridade → prazo)
    // =========================
    lista.sort(function(a, b){
      var ordemA = a.ordem || 0;
      var ordemB = b.ordem || 0;
      if (ordemA !== ordemB) return ordemA - ordemB;

      var p = { 'Alta':3, 'Média':2, 'Baixa':1 };
      var pa = p[a.prioridade] || 0;
      var pb = p[b.prioridade] || 0;
      if (pb !== pa) return pb - pa;

      var da = _parseData(a.prazo);
      var db = _parseData(b.prazo);
      if (da && db) return da - db;
      if (da) return -1;
      if (db) return 1;

      return 0;
    });

    // =========================
    // CARGA POR PESSOA
    // =========================
    var carga = {};
    lista.forEach(function(t){
      (t.executores || []).forEach(function(e){
        carga[e] = (carga[e] || 0) + 1;
      });
    });

    // =========================
    // HELPERS
    // =========================
    function isAtrasado(t){
      if (!t.prazo) return false;
      try {
        return new Date(t.prazo) < new Date() &&
          String(t.status || '').toLowerCase() !== 'concluído';
      } catch(e){ return false; }
    }

    function statusClass(status){
      status = (status || '').toLowerCase();
      return status === 'concluído' ? 'bg-emerald-100 text-emerald-700' :
             status === 'em andamento' ? 'bg-amber-100 text-amber-700' :
             'bg-slate-100 text-slate-600';
    }

    function prioridadeClass(p){
      return p === 'Alta' ? 'bg-red-100 text-red-700' :
             p === 'Média' ? 'bg-amber-100 text-amber-700' :
             'bg-slate-100 text-slate-600';
    }

    function executoresHtml(t){
      return (t.executores && t.executores.length)
        ? t.executores.map(function(e){
            return `<span class="px-2 py-1 bg-slate-100 rounded text-[10px]">
              ${e.split('@')[0]} (${carga[e] || 0})
            </span>`;
          }).join('')
        : '<span class="text-[10px] text-slate-400">Sem responsável</span>';
    }

    function entregasHtml(t){
      return (t.entregas && t.entregas.length)
        ? t.entregas.map(function(e){
            var statusE = (e['Status'] || '').toLowerCase();
            var idEntrega = e['ID Entrega'];

            var classe =
              statusE === 'entregue' ? 'bg-emerald-100 text-emerald-700 line-through' :
              statusE === 'em andamento' ? 'bg-amber-100 text-amber-700' :
              'bg-slate-100 text-slate-500';

            if (e['Prazo']) {
              try {
                var atraso = new Date(e['Prazo']) < new Date() && statusE !== 'entregue';
                if (atraso) classe = 'bg-red-100 text-red-700';
              } catch(e){}
            }

            return `
              <span onclick="concluirEntregaFila('${idEntrega}')"
                class="px-2 py-1 rounded text-[10px] cursor-pointer hover:opacity-80 transition ${classe}">
                ${e['Tipo'] || '-'}
              </span>
            `;
          }).join('')
        : '<span class="text-[10px] text-slate-400">Sem entregas</span>';
    }

    function cardHtml(t){
      var atrasado = isAtrasado(t);

      return `
        <div class="kanban-item p-3 border rounded mb-2 bg-white shadow-sm text-xs cursor-move
          ${atrasado ? 'border-red-300 bg-red-50' : ''}"
          draggable="true"
          data-id="${t.id}"
          ondragstart="onDragStartKanban(event)">

          <div class="font-semibold text-sm text-slate-800">
            ${t.titulo || '-'}
          </div>

          <div class="mt-1 mb-2 flex gap-2 flex-wrap">
            <span class="px-2 py-1 rounded-full text-[10px] font-bold ${statusClass(t.status)}">
              ${t.status || '-'}
            </span>
            <span class="px-2 py-1 rounded-full text-[10px] font-bold ${prioridadeClass(t.prioridade)}">
              ${t.prioridade || '-'}
            </span>
            ${t.prazo ? `<span class="text-[10px] text-slate-400">até ${t.prazo}</span>` : ''}
          </div>

          <div class="flex flex-wrap gap-1 mb-2">
            ${executoresHtml(t)}
          </div>

          <div class="flex flex-wrap gap-1 mb-3">
            ${entregasHtml(t)}
          </div>

          <div class="flex gap-2">
            <button onclick="responderFuncao('${t.id}')"
              class="text-xs px-2 py-1 bg-amber-100 text-amber-700 rounded">
              Responder
            </button>
            <button onclick="atribuirTarefa('${t.id}', '${t.funcao}')"
              class="text-xs px-2 py-1 bg-indigo-100 text-indigo-700 rounded">
              Atribuir
            </button>
          </div>

        </div>
      `;
    }

    // =========================
    // MODO: KANBAN (colunas por status + gargalo)
    // =========================
    if (modo === 'kanban') {

      var colunas = {
        'Solicitado': [],
        'Em andamento': [],
        'Concluído': []
      };

      lista.forEach(function(t){
        var s = t.status || 'Solicitado';
        if (!colunas[s]) colunas[s] = [];
        colunas[s].push(t);
      });

      el.innerHTML = `
        <div class="grid grid-cols-3 gap-3">
          ${Object.keys(colunas).map(function(status){

            var total = colunas[status].length;
            var limite = 5;

            var alerta =
              total > limite ? 'text-red-600' :
              total > limite * 0.7 ? 'text-amber-600' :
              'text-slate-500';

            return `
              <div class="kanban-col bg-slate-50 p-2 rounded-lg min-h-[300px]"
                data-status="${status}"
                ondragover="onDragOverKanban(event)"
                ondrop="onDropKanban(event, '${status}')">

                <div class="text-[10px] font-bold mb-2 ${alerta}">
                  ${status} (${total})
                </div>

                <div class="kanban-list space-y-2">
                  ${colunas[status].map(cardHtml).join('')}
                </div>

              </div>
            `;
          }).join('')}
        </div>
      `;
      return;
    }

    // =========================
    // MODO: CARDS
    // =========================
    if (modo === 'cards') {
      el.innerHTML = `
        <div class="grid grid-cols-2 gap-3">
          ${lista.map(cardHtml).join('')}
        </div>
      `;
      return;
    }

    // =========================
    // MODO: LISTA
    // =========================
    el.innerHTML = `
      <div class="space-y-2">
        ${lista.map(cardHtml).join('')}
      </div>
    `;

  });
}

var _dragEl = null;
var _placeholder = null;

function onDragStartKanban(e){
  _dragEl = e.target;

  setTimeout(function(){
    _dragEl.classList.add('opacity-50');
  }, 0);

  _placeholder = document.createElement('div');
  _placeholder.className = 'h-8 border-2 border-dashed border-indigo-300 rounded';
}

function onDragOverKanban(e){
  e.preventDefault();

  var container = e.currentTarget.querySelector('.kanban-list');
  var after = getDragAfterElement(container, e.clientY);

  if (!after){
    container.appendChild(_placeholder);
  } else {
    container.insertBefore(_placeholder, after);
  }
}

function onDropKanban(e, novoStatus){

  e.preventDefault();
  if (!_dragEl) return;

  var lista = e.currentTarget.querySelector('.kanban-list');

  if (_placeholder && lista){
    lista.insertBefore(_dragEl, _placeholder);
  }

  _dragEl.classList.remove('opacity-50');

  // capturar nova ordem global
  var ordens = {};

  document.querySelectorAll('.kanban-col').forEach(function(col){
    var status = col.getAttribute('data-status');

    col.querySelectorAll('.kanban-item').forEach(function(el, index){
      var id = el.getAttribute('data-id');
      ordens[id] = { ordem: index, status: status };
    });
  });

  GAS._call('salvarOrdemKanban', [ordens], function(){
    renderFilaFuncaoAtual();
  });

  _placeholder.remove();
  _dragEl = null;
}

function getDragAfterElement(container, y){
  const els = [...container.querySelectorAll('.kanban-item:not(.opacity-50)')];

  return els.reduce((closest, child) => {
    const box = child.getBoundingClientRect();
    const offset = y - box.top - box.height / 2;

    if (offset < 0 && offset > closest.offset) {
      return { offset: offset, element: child };
    } else {
      return closest;
    }
  }, { offset: Number.NEGATIVE_INFINITY }).element;
}

function concluirEntregaFila(idEntrega){

  Swal.fire({
    title: 'Concluir entrega?',
    text: 'Deseja marcar como entregue?',
    icon: 'question',
    showCancelButton: true,
    confirmButtonText: 'Sim, concluir',
    cancelButtonText: 'Cancelar'
  }).then(function(r){

    if (!r.isConfirmed) return;

    GAS.entregas.atualizar(idEntrega, {
      status: 'Entregue'
    }, function(){

      renderFilaFuncaoAtual();

    });

  });

}

function renderFilaFuncaoAtual(){
  renderFilaFuncao('design');
}

var _modoFila = 'lista';

function mudarModoFila(modo){

  _modoFila = modo;

  // salva preferência
  try {
    localStorage.setItem('modoFila', modo);
  } catch(e){}

  // estado visual
  try {
    document.querySelectorAll('.modo-btn').forEach(function(btn){
      btn.classList.remove('ativo');
    });
    var btnAtivo = document.querySelector(`[data-modo="${modo}"]`);
    if (btnAtivo) btnAtivo.classList.add('ativo');
  } catch(e){}

  renderFilaFuncaoAtual();
}

function renderKanban(lista, el){

  var colunas = {
    'Solicitado': [],
    'Em andamento': [],
    'Concluído': []
  };

  lista.forEach(function(t){
    colunas[t.status || 'Solicitado'].push(t);
  });

  el.innerHTML = `
    <div class="grid grid-cols-3 gap-3">

      ${Object.keys(colunas).map(function(status){

        return `
          <div class="bg-slate-50 p-2 rounded-lg">

            <div class="text-[10px] font-bold text-slate-500 mb-2">
              ${status}
            </div>

            ${colunas[status].map(function(t){
              return `
                <div class="bg-white p-2 rounded mb-2 shadow-sm text-xs">
                  ${t.titulo}
                </div>
              `;
            }).join('')}

          </div>
        `;

      }).join('')}

    </div>
  `;
}

function renderCards(lista, el){

  el.innerHTML = `
    <div class="grid grid-cols-2 gap-3">

      ${lista.map(function(t){

        return `
          <div class="p-4 bg-white rounded-xl border">

            <div class="font-bold text-sm mb-1">
              ${t.titulo}
            </div>

            <div class="text-[11px] text-slate-400 mb-2">
              ${t.status} • ${t.prioridade}
            </div>

            <div class="text-[10px] text-slate-500">
              ${t.prazo || 'Sem prazo'}
            </div>

          </div>
        `;

      }).join('')}

    </div>
  `;
}

function renderCarga(lista, el){

  var carga = {};

  lista.forEach(function(t){
    (t.executores || []).forEach(function(e){
      carga[e] = (carga[e] || 0) + 1;
    });
  });

  el.innerHTML = `
    <div class="space-y-2">

      ${Object.keys(carga).map(function(p){

        var total = carga[p];

        return `
          <div class="flex items-center gap-2">

            <div class="w-32 text-xs">
              ${p.split('@')[0]}
            </div>

            <div class="flex-1 bg-slate-100 rounded h-3">
              <div class="bg-indigo-500 h-3 rounded" style="width:${total * 20}px"></div>
            </div>

            <div class="text-xs">
              ${total}
            </div>

          </div>
        `;
      }).join('')}

    </div>
  `;
}

function renderTimeline(lista, el){

  lista.sort(function(a,b){
    return new Date(a.prazo) - new Date(b.prazo);
  });

  el.innerHTML = `
    <div class="space-y-2">

      ${lista.map(function(t){

        var atraso = false;

        if (t.prazo){
          atraso = new Date(t.prazo) < new Date();
        }

        return `
          <div class="flex items-center gap-3 text-xs">

            <div class="w-20 text-slate-400">
              ${t.prazo || '-'}
            </div>

            <div class="flex-1 ${atraso ? 'text-red-600 font-bold' : ''}">
              ${t.titulo}
            </div>

          </div>
        `;
      }).join('')}

    </div>
  `;
}

var _dragTaskId = null;

function dragKanban(ev, id){
  _dragTaskId = id;
}

function dropKanban(ev, novoStatus){

  if (!_dragTaskId) return;

  GAS.tarefas.listar(function(lista){

    var tarefa = lista.find(function(t){ return t.id === _dragTaskId; });
    if (!tarefa) return;

    tarefa.status = novoStatus;

    GAS.tarefas.salvar(tarefa, function(){

      _dragTaskId = null;
      renderFilaFuncaoAtual();

    });

  });
}

document.addEventListener('DOMContentLoaded', function(){

  try {
    var salvo = localStorage.getItem('modoFila');
    if (salvo) _modoFila = salvo;
  } catch(e){}

  mudarModoFila(_modoFila || 'lista');
});



</script>
