<!--
@file mod_balcao.html
@type module
@description Central de Comunicação — processos de produção, fila por função, Kanban, entregas e revisões.
@responsibility Estrutura HTML + JS da aba #aba-balcao.
@dependencies GAS.comunicacaoProcessos, GAS.entregas, GAS.revisao, GAS.tarefas,
              showLoader, escaparHTML, temPermissao
-->

<style>
  .modo-btn {
    font-size:10px;
    padding:6px 10px;
    border-radius:8px;
    background:#f1f5f9;
    color:#64748b;
    transition:all .15s ease;
    border:none;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    gap:4px;
  }
  .modo-btn:hover { background:#6366f1; color:#fff; }
  .modo-btn.ativo  { background:#1e293b; color:#fff; }

  .kanban-item {
    transition:all .15s ease;
    user-select:none;
  }
  .kanban-item:hover {
    transform:translateY(-1px);
    box-shadow:0 4px 12px rgba(0,0,0,.08);
  }
  .kanban-col { transition:background .2s; border-radius:14px; }
  .kanban-col.drag-over {
    outline:2px dashed #a5b4fc;
    background:#eef2ff !important;
  }

  .balcao-func-btn {
    padding:5px 12px;
    border-radius:8px;
    font-size:10px;
    font-weight:700;
    border:1.5px solid #e2e8f0;
    background:#fff;
    color:#64748b;
    cursor:pointer;
    transition:all .15s;
    white-space:nowrap;
  }
  .balcao-func-btn.ativo { background:#1e293b; color:#fff; border-color:#1e293b; }
  .balcao-func-btn:hover:not(.ativo) { border-color:#6366f1; color:#6366f1; }
</style>

<section id="aba-balcao" class="tab-content hidden pb-20">

  <!-- CARD PRINCIPAL: lista de processos -->
  <div class="bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden">

    <!-- HEADER -->
    <div class="p-5 border-b border-slate-100 bg-slate-50/50 flex flex-wrap justify-between items-center gap-3">
      <div>
        <h3 class="font-black text-slate-800 uppercase text-sm">
          <i class="fas fa-bullhorn text-orange-400 mr-2"></i>Central de Comunicação
        </h3>
        <p class="text-[10px] text-slate-400">Produção, campanhas e publicização</p>
      </div>
      <button onclick="abrirModalAtendimento()"
        class="bg-orange-500 hover:bg-orange-600 text-white text-[10px] font-black px-4 py-2 rounded-xl transition-all uppercase flex items-center gap-1.5">
        <i class="fas fa-plus text-[9px]"></i>Novo Processo
      </button>
    </div>

    <!-- FILTROS -->
    <div class="p-4 flex gap-3 flex-wrap border-b border-slate-100 items-center">
      <div class="relative">
        <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-slate-300 text-xs"></i>
        <input id="balcaoBusca" placeholder="Buscar processo..."
          style="padding:8px 12px 8px 30px;border:1.5px solid #e2e8f0;border-radius:10px;font-size:12px;outline:none;width:200px;transition:border-color .15s"
          onfocus="this.style.borderColor='#f97316'" onblur="this.style.borderColor='#e2e8f0'">
      </div>
      <select id="balcaoFiltroStatus"
        style="padding:8px 12px;border:1.5px solid #e2e8f0;border-radius:10px;font-size:12px;outline:none;color:#475569">
        <option value="">Todos os status</option>
        <option>Solicitado</option>
        <option>Em andamento</option>
        <option>Concluído</option>
      </select>
    </div>

    <!-- CONTADORES -->
    <div id="balcaoContadores" class="flex gap-2 p-3 flex-wrap border-b border-slate-50"></div>

    <!-- CONTEÚDO PRINCIPAL -->
    <div id="balcaoContainer">
      <div class="p-10 text-center">
        <i class="fas fa-spinner animate-spin text-orange-300 text-xl"></i>
        <p class="text-[11px] text-slate-400 mt-2">Carregando...</p>
      </div>
    </div>

  </div>

  <!-- FILA DA EQUIPE -->
  <div class="mt-6 bg-white border border-slate-200 rounded-3xl p-5">

    <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
      <div>
        <div class="text-[10px] uppercase tracking-wider text-slate-400 font-black mb-0.5">Fila da equipe</div>
        <div id="balcaoFuncaoLabel" class="text-xs font-black text-slate-700">Design</div>
      </div>
      <div class="flex items-center gap-3 flex-wrap">
        <!-- Seletor de função -->
        <div id="balcaoFuncaoSelector" class="flex gap-1 flex-wrap"></div>
        <!-- Modos de visualização -->
        <div class="flex gap-1">
          <button onclick="mudarModoFila('lista')"     data-modo="lista"     class="modo-btn ativo" title="Lista"><i class="fas fa-list text-[10px]"></i></button>
          <button onclick="mudarModoFila('kanban')"    data-modo="kanban"    class="modo-btn" title="Kanban"><i class="fas fa-columns text-[10px]"></i></button>
          <button onclick="mudarModoFila('cards')"     data-modo="cards"     class="modo-btn" title="Cards"><i class="fas fa-th-large text-[10px]"></i></button>
          <button onclick="mudarModoFila('carga')"     data-modo="carga"     class="modo-btn" title="Carga por pessoa"><i class="fas fa-users text-[10px]"></i></button>
          <button onclick="mudarModoFila('timeline')"  data-modo="timeline"  class="modo-btn" title="Timeline"><i class="fas fa-stream text-[10px]"></i></button>
        </div>
      </div>
    </div>

    <div id="fila-funcao"></div>

  </div>

</section>

<script>
// ══════════════════════════════════════════════════════
// ESTADO
// ══════════════════════════════════════════════════════
var _balcaoCache       = [];
var _balcaoFuncaoAtual = 'design';
var _modoFila          = 'lista';

var _FUNCOES_BALCAO = [
  { key:'design',       label:'Design'       },
  { key:'foto',         label:'Foto'         },
  { key:'video',        label:'Vídeo'        },
  { key:'materia',      label:'Texto'        },
  { key:'comunicacao',  label:'Geral'        }
];

var ENTREGAS_PADRAO = [
  'design','diagramacao','foto','ensaio_fotografico',
  'video','edicao_video','stories','materia','divulgacao'
];

// ══════════════════════════════════════════════════════
// HELPERS
// ══════════════════════════════════════════════════════
function _labelEntrega(k){
  var m = { design:'Peça gráfica', diagramacao:'Diagramação', foto:'Fotografia',
            ensaio_fotografico:'Ensaio fotográfico', video:'Captação de vídeo',
            edicao_video:'Edição de vídeo', stories:'Cobertura (stories)',
            materia:'Matéria / texto', divulgacao:'Publicação / divulgação' };
  return m[k] || k;
}

function _isAtrasadoBalcao(prazo, status){
  if (!prazo) return false;
  return new Date(prazo) < new Date() && (status||'').toLowerCase() !== 'concluído';
}

// ══════════════════════════════════════════════════════
// CARREGAR
// ══════════════════════════════════════════════════════
function carregarBalcao(){
  GAS.comunicacaoProcessos.listar(function(lista){
    _balcaoCache = lista || [];
    _balcaoFiltrar();
    _balcaoRenderizarContadores();
  }, function(e){
    document.getElementById('balcaoContainer').innerHTML =
      '<div class="p-10 text-center text-red-400 text-sm"><i class="fas fa-exclamation-triangle mr-2"></i>Erro ao carregar processos.</div>';
  });
}

// ══════════════════════════════════════════════════════
// FILTRAR
// ══════════════════════════════════════════════════════
function _balcaoFiltrar(){
  var q  = (document.getElementById('balcaoBusca').value||'').toLowerCase();
  var st = document.getElementById('balcaoFiltroStatus').value;
  var filtrados = _balcaoCache.filter(function(a){
    var matchBusca  = (a.titulo||a.assunto||'').toLowerCase().includes(q) ||
                      (a.descricao||'').toLowerCase().includes(q);
    var matchStatus = !st || a.status === st;
    return matchBusca && matchStatus;
  });
  renderizarBalcao(filtrados);
}

// ══════════════════════════════════════════════════════
// CONTADORES — com badge de atraso
// ══════════════════════════════════════════════════════
function _balcaoRenderizarContadores(){
  var c = document.getElementById('balcaoContadores');
  if (!c) return;
  var map = {}, atrasados = 0;
  _balcaoCache.forEach(function(a){
    var s = a.status||'Sem status';
    map[s] = (map[s]||0)+1;
    if (_isAtrasadoBalcao(a.prazo, a.status)) atrasados++;
  });
  var html = Object.keys(map).map(function(s){
    var cls = s.toLowerCase()==='concluído' ? 'bg-emerald-100 text-emerald-700'
            : s.toLowerCase()==='em andamento' ? 'bg-amber-100 text-amber-700'
            : 'bg-slate-100 text-slate-600';
    return '<div class="px-3 py-1 rounded-lg text-[11px] font-bold '+cls+'">'+escaparHTML(s)+': '+map[s]+'</div>';
  }).join('');
  if (atrasados){
    html += '<div class="px-3 py-1 bg-red-100 text-red-700 rounded-lg text-[11px] font-black">'
          + '<i class="fas fa-exclamation-triangle mr-1"></i>'
          + atrasados+' atrasado'+(atrasados>1?'s':'')+'</div>';
  }
  c.innerHTML = html;
}

// ══════════════════════════════════════════════════════
// RENDER — tabela de processos
// ══════════════════════════════════════════════════════
function renderizarBalcao(lista){
  lista = lista || _balcaoCache;
  var c = document.getElementById('balcaoContainer');
  if (!c) return;

  if (!lista.length){
    c.innerHTML = '<div class="p-12 text-center">'
      + '<i class="fas fa-bullhorn text-slate-200 text-4xl mb-3"></i>'
      + '<p class="text-slate-400 font-bold text-sm">Nenhum processo encontrado</p>'
      + (temPermissao('balcao','editar')
          ? '<button onclick="abrirModalAtendimento()" class="mt-4 bg-orange-500 text-white text-xs font-black px-4 py-2 rounded-xl">+ Novo Processo</button>'
          : '')
      + '</div>';
    return;
  }

  c.innerHTML = '<div class="overflow-x-auto"><table class="w-full text-sm">'
    + '<thead><tr class="text-[10px] uppercase tracking-wider text-slate-400 border-b bg-slate-50/50">'
    + '<th class="p-3 text-left">Tipo</th>'
    + '<th class="p-3 text-left">Processo</th>'
    + '<th class="p-3 text-left">Status</th>'
    + '<th class="p-3 text-left">Prazo</th>'
    + '<th class="p-3 text-left">Responsável</th>'
    + '<th class="p-3 text-right"></th>'
    + '</tr></thead><tbody>'
    + lista.map(function(a){
        var id       = a.id||'';
        var status   = (a.status||'').toLowerCase().trim();
        var atrasado = _isAtrasadoBalcao(a.prazo, a.status);
        var stCls    = status==='concluído'     ? 'bg-emerald-100 text-emerald-700'
                     : status==='em andamento'  ? 'bg-amber-100 text-amber-700'
                     : 'bg-slate-100 text-slate-600';
        return '<tr class="border-b hover:bg-slate-50 transition cursor-pointer'+(atrasado?' bg-red-50/30':'')+'" onclick="_balcaoToggle(\''+escaparHTML(id)+'\')">'
          + '<td class="p-3"><span class="text-[10px] font-bold text-slate-500 uppercase">'+escaparHTML(a.tipo||'-')+'</span></td>'
          + '<td class="p-3">'
          +   '<div class="font-semibold text-slate-800 leading-tight flex items-center gap-1.5">'
          +   (atrasado?'<i class="fas fa-circle text-red-400" style="font-size:6px"></i>':'')
          +   escaparHTML(a.titulo||a.assunto||'-')+'</div>'
          +   (a.descricao?'<div class="text-[11px] text-slate-400 mt-0.5 truncate max-w-xs">'+escaparHTML(a.descricao)+'</div>':'')
          + '</td>'
          + '<td class="p-3"><span class="px-2 py-1 rounded-full text-[10px] font-black '+stCls+'">'+escaparHTML(a.status||'-')+'</span></td>'
          + '<td class="p-3 text-[11px] '+(atrasado?'text-red-500 font-bold':'text-slate-500')+'">'+escaparHTML(a.prazo||'-')+'</td>'
          + '<td class="p-3 text-[11px] text-slate-600">'+escaparHTML(a.responsavel||'-')+'</td>'
          + '<td class="p-3 text-right"><div class="flex justify-end gap-1">'
          + '<button onclick="event.stopPropagation();editarAtendimento(\''+escaparHTML(id)+'\')" class="w-7 h-7 flex items-center justify-center rounded-md bg-slate-100 text-slate-500 hover:bg-indigo-600 hover:text-white transition" title="Editar"><i class="fas fa-edit text-[10px]"></i></button>'
          + '<button onclick="event.stopPropagation();excluirAtendimento(\''+escaparHTML(id)+'\')" class="w-7 h-7 flex items-center justify-center rounded-md bg-slate-100 text-slate-400 hover:bg-red-600 hover:text-white transition" title="Excluir"><i class="fas fa-trash text-[10px]"></i></button>'
          + '<button onclick="event.stopPropagation();abrirSolicitacaoRevisao(\''+escaparHTML(id)+'\')" class="w-7 h-7 flex items-center justify-center rounded-md bg-amber-100 text-amber-600 hover:bg-amber-500 hover:text-white transition" title="Solicitar revisão"><i class="fas fa-pen text-[10px]"></i></button>'
          + '</div></td>'
          + '</tr>'
          + '<tr id="balcao-detail-'+escaparHTML(id)+'" class="hidden bg-slate-50/50">'
          +   '<td colspan="6" class="p-4"><div id="balcao-detail-content-'+escaparHTML(id)+'"></div></td>'
          + '</tr>';
      }).join('')
    + '</tbody></table></div>';
}

// ══════════════════════════════════════════════════════
// TOGGLE DETALHE DO PROCESSO
// ══════════════════════════════════════════════════════
function _balcaoToggle(id){
  var row = document.getElementById('balcao-detail-'+id);
  if (!row) return;
  var aberto = !row.classList.contains('hidden');
  if (aberto){ row.classList.add('hidden'); return; }
  row.classList.remove('hidden');
  _renderDetalheProcesso(id);
}

function _renderDetalheProcesso(id){
  var proc = _balcaoCache.find(function(a){ return a.id===id; });
  var el   = document.getElementById('balcao-detail-content-'+id);
  if (!proc||!el) return;

  el.innerHTML =
    '<div class="grid md:grid-cols-2 gap-4">'
    + '<div class="bg-white border border-slate-200 rounded-xl p-4">'
    +   '<div class="text-[10px] uppercase text-slate-400 mb-1 font-black">Descrição</div>'
    +   '<div class="text-sm text-slate-700">'+escaparHTML(proc.descricao||'-')+'</div>'
    +   '<div class="mt-3 text-[10px] uppercase text-slate-400 font-black">Origem</div>'
    +   '<div class="text-sm text-slate-600">'+escaparHTML(proc.origem||'-')+'</div>'
    + '</div>'
    + '<div class="bg-white border border-slate-200 rounded-xl p-4 flex flex-col gap-2">'
    +   '<button onclick="abrirSolicitacaoRevisao(\''+escaparHTML(id)+'\')" '
    +     'class="text-xs font-bold px-3 py-2 rounded-lg bg-amber-100 text-amber-700 hover:bg-amber-500 hover:text-white transition">'
    +     '<i class="fas fa-pen mr-1"></i>Solicitar revisão</button>'
    + '</div>'
    + '</div>'
    + '<div class="mt-4">'
    +   '<div class="text-[10px] uppercase text-slate-400 mb-2 font-black">Entregas</div>'
    +   '<div id="entregas-'+escaparHTML(id)+'"><i class="fas fa-spinner animate-spin text-slate-300 text-xs"></i></div>'
    + '</div>'
    + '<div class="mt-4">'
    +   '<div class="text-[10px] uppercase text-slate-400 mb-2 font-black">Revisão</div>'
    +   '<div id="revisao-'+escaparHTML(id)+'"></div>'
    + '</div>';

  _renderEntregas(id);
  _renderRevisao(proc);
}

// ══════════════════════════════════════════════════════
// RENDER ENTREGAS
// ══════════════════════════════════════════════════════
function _renderEntregas(id){
  GAS.entregas.listarPorProcesso(id, function(lista){
    var el = document.getElementById('entregas-'+id);
    if (!el) return;
    if (!lista||!lista.length){
      el.innerHTML = '<div class="text-xs text-slate-400 italic">Sem entregas registradas.</div>';
      return;
    }
    el.innerHTML = lista.map(function(e){
      var idE    = e['ID Entrega']||'';
      var tipo   = e['Tipo']||'-';
      var link   = e['Link Entrega']||'';
      var entregue = (e['Status']||'').toLowerCase()==='entregue';
      return '<div class="flex items-center gap-2 mb-2 p-2 rounded-lg '+(entregue?'bg-emerald-50 border border-emerald-100':'bg-slate-50 border border-slate-100')+'">'
        + '<span class="flex-1 text-xs font-semibold text-slate-700">'+escaparHTML(tipo)+'</span>'
        + (entregue
            ? '<span class="text-[10px] text-emerald-600 font-black"><i class="fas fa-check mr-1"></i>Entregue</span>'
            : '<input id="linkEntrega_'+escaparHTML(idE)+'" value="'+escaparHTML(link)+'" placeholder="Cole o link aqui" '
            + 'style="border:1.5px solid #e2e8f0;border-radius:8px;padding:4px 10px;font-size:11px;outline:none;width:180px"'
            + ' onfocus="this.style.borderColor=\'#6366f1\'" onblur="this.style.borderColor=\'#e2e8f0\'">'
            + '<button onclick="concluirEntrega(\''+escaparHTML(idE)+'\')" '
            + 'class="text-xs px-2 py-1 rounded-lg bg-emerald-100 text-emerald-700 hover:bg-emerald-600 hover:text-white transition font-bold whitespace-nowrap">'
            + 'Concluir</button>')
        + '</div>';
    }).join('');
  });
}

// ══════════════════════════════════════════════════════
// RENDER REVISÃO
// ══════════════════════════════════════════════════════
function _renderRevisao(proc){
  var el = document.getElementById('revisao-'+proc.id);
  if (!el) return;
  if (!proc.revisaoStatus||proc.revisaoStatus!=='Pendente'){
    el.innerHTML = '<div class="text-xs text-slate-400 italic">Sem solicitações de revisão.</div>';
    return;
  }
  el.innerHTML =
    '<div class="bg-amber-50 border border-amber-200 rounded-xl p-3">'
    + '<div class="flex items-start gap-2 mb-3">'
    +   '<i class="fas fa-pen text-amber-500 text-xs mt-0.5 flex-shrink-0"></i>'
    +   '<div><p class="text-[10px] font-black text-amber-700 uppercase mb-1">Solicitação de revisão</p>'
    +   '<p class="text-xs text-slate-700">'+escaparHTML(proc.revisaoSolicitacao||'')+'</p>'
    +   (proc.revisaoSolicitante?'<p class="text-[10px] text-slate-400 mt-1">Por: '+escaparHTML(proc.revisaoSolicitante)+'</p>':'')
    +   '</div>'
    + '</div>'
    + '<div class="flex gap-2">'
    +   '<button onclick="_responderRevisao(\''+escaparHTML(proc.id)+'\',\'Aprovado\')" '
    +     'class="text-xs px-3 py-1.5 bg-emerald-100 text-emerald-700 rounded-lg hover:bg-emerald-600 hover:text-white transition font-bold">'
    +     '<i class="fas fa-check mr-1"></i>Aprovar</button>'
    +   '<button onclick="_responderRevisao(\''+escaparHTML(proc.id)+'\',\'Rejeitado\')" '
    +     'class="text-xs px-3 py-1.5 bg-red-100 text-red-700 rounded-lg hover:bg-red-600 hover:text-white transition font-bold">'
    +     '<i class="fas fa-times mr-1"></i>Rejeitar</button>'
    + '</div>'
    + '</div>';
}

function _responderRevisao(id, status){
  Swal.fire({
    title: status==='Aprovado' ? 'Aprovar revisão' : 'Rejeitar revisão',
    input:'textarea', inputLabel:'Comentário (opcional)',
    inputPlaceholder:'Descreva a resposta...',
    showCancelButton:true,
    confirmButtonText: status==='Aprovado'
      ? '<i class="fas fa-check mr-1"></i>Aprovar'
      : '<i class="fas fa-times mr-1"></i>Rejeitar',
    confirmButtonColor: status==='Aprovado'?'#059669':'#ef4444',
    cancelButtonText:'Cancelar',
    customClass:{ popup:'rounded-3xl', confirmButton:'rounded-xl font-black text-sm', cancelButton:'rounded-xl font-bold text-sm' }
  }).then(function(r){
    if (!r.isConfirmed) return;
    showLoader(true);
    GAS.revisao.responder(id, status, r.value||'', function(){
      showLoader(false); carregarBalcao();
    }, function(e){ showLoader(false); Swal.fire('Erro', String(e), 'error'); });
  });
}

// ══════════════════════════════════════════════════════
// SOLICITAR REVISÃO
// ══════════════════════════════════════════════════════
function abrirSolicitacaoRevisao(id){
  Swal.fire({
    title:'Solicitar revisão',
    input:'textarea', inputLabel:'Descreva a alteração necessária',
    inputPlaceholder:'Ex: Preciso alterar a data do evento na arte...',
    inputAttributes:{ rows:4 },
    showCancelButton:true,
    confirmButtonText:'<i class="fas fa-paper-plane mr-1"></i>Enviar',
    cancelButtonText:'Cancelar',
    confirmButtonColor:'#f59e0b',
    customClass:{ popup:'rounded-3xl', confirmButton:'rounded-xl font-black text-sm', cancelButton:'rounded-xl font-bold text-sm' },
    preConfirm:function(val){
      if (!val||!val.trim()){ Swal.showValidationMessage('Descreva a solicitação'); return false; }
      return val.trim();
    }
  }).then(function(r){
    if (!r.isConfirmed) return;
    showLoader(true);
    GAS.revisao.solicitar(id, r.value, '', function(){
      showLoader(false);
      Swal.fire({ icon:'success', title:'Solicitação enviada', timer:1800,
        showConfirmButton:false, customClass:{ popup:'rounded-3xl' } });
      carregarBalcao();
    }, function(e){ showLoader(false); Swal.fire('Erro', String(e), 'error'); });
  });
}

// ══════════════════════════════════════════════════════
// MODAL NOVO/EDITAR PROCESSO
// ══════════════════════════════════════════════════════
var _balcTipoEntregas = {
  grafico:   ['design','diagramacao'],
  foto:      ['foto','ensaio_fotografico'],
  video:     ['video','edicao_video'],
  rece:      ['design','materia','divulgacao'],
  cobertura: ['foto','video','stories'],
  campanha:  ['design','video','materia','divulgacao']
};

function _balcSugerirEntregas(tipo){
  var sugestoes = _balcTipoEntregas[tipo]||[];
  document.querySelectorAll('#swal2-html-container input.balcEntrega').forEach(function(cb){
    if (sugestoes.includes(cb.value)){
      cb.checked = true;
      var lbl = cb.closest('label');

    }
  });
}

function concluirEntrega(idEntrega){
  var input = document.getElementById('linkEntrega_'+idEntrega);
  var link  = input ? input.value.trim() : '';

  if (!link){
    Swal.fire({ icon:'warning', title:'Link obrigatório',
      text:'Adicione o link do material antes de concluir.',
      timer:2200, showConfirmButton:false, customClass:{ popup:'rounded-3xl' } });
    return;
  }

  showLoader(true);
  GAS.entregas.atualizar(idEntrega, { status:'Entregue', link:link }, function(){
    showLoader(false);
    // identificar o idProcesso pelo container pai no DOM
    var detail = input ? input.closest('[id^="balcao-detail-content-"]') : null;
    var pid    = detail ? detail.id.replace('balcao-detail-content-','') : null;
    if (pid) _renderEntregas(pid);
    else carregarBalcao();
  }, function(err){ showLoader(false); Swal.fire('Erro', String(err), 'error'); });
}

function _selecionarFuncaoFila(funcao, label){

// ══════════════════════════════════════════════════════
// FILA DA FUNÇÃO — renderização multi-modo
// ══════════════════════════════════════════════════════
function renderFilaFuncao(funcao){
  var el = document.getElementById('fila-funcao');
  if (el) el.innerHTML = '<div class="py-6 text-center"><i class="fas fa-spinner animate-spin text-slate-300 text-lg"></i></div>';

  GAS.tarefas.listarPorFuncao(funcao, function(lista){
    if (!el) return;
    if (!lista||!lista.length){
      el.innerHTML = '<div class="py-10 text-center">'
        + '<i class="fas fa-inbox text-slate-200 text-2xl mb-2"></i>'
        + '<p class="text-xs text-slate-400 font-medium">Nenhuma tarefa na fila.</p>'
        + '</div>';
      return;
    }

    // Ordenação: ordem Kanban → prioridade → prazo
    lista.sort(function(a,b){
      var oa=a.ordem||0, ob=b.ordem||0;
      if (oa!==ob) return oa-ob;
      var p={'Alta':3,'Média':2,'Baixa':1};
      var pa=p[a.prioridade]||0, pb=p[b.prioridade]||0;
      if (pb!==pa) return pb-pa;
      var da=a.prazo?new Date(a.prazo):null, db=b.prazo?new Date(b.prazo):null;
      if (da&&db) return da-db; return da?-1:db?1:0;
    });

    // Carga por pessoa
    var carga = {};
    lista.forEach(function(t){
      (t.executores||[]).forEach(function(e){ carga[e]=(carga[e]||0)+1; });
    });

    // ── HELPERS DE RENDERIZAÇÃO ─────────────────────
    function _stPill(status){
      var s=(status||'').toLowerCase();
      var cls=s==='concluído'?'background:#d1fae5;color:#065f46'
              :s==='em andamento'?'background:#fef3c7;color:#92400e'
              :'background:#eff6ff;color:#1d4ed8';
      return '<span style="font-size:9px;font-weight:900;padding:2px 8px;border-radius:99px;'+cls+'">'+escaparHTML(status||'-')+'</span>';
    }

    function _prioPill(p){
      var cls=p==='Alta'?'background:#fee2e2;color:#991b1b'
             :p==='Média'?'background:#fef3c7;color:#92400e'
             :'background:#f1f5f9;color:#64748b';
      return '<span style="font-size:9px;font-weight:900;padding:2px 8px;border-radius:99px;'+cls+'">'+escaparHTML(p||'—')+'</span>';
    }

    function _execHtml(t){
      return (t.executores&&t.executores.length)
        ? t.executores.map(function(e){
            var n=carga[e]||0, cor=n>5?'#ef4444':n>3?'#f59e0b':'#6366f1';
            return '<span style="font-size:9px;padding:2px 8px;border-radius:99px;background:#f1f5f9;color:'+cor+';font-weight:700">'+escaparHTML(e.split('@')[0])+'('+n+')</span>';
          }).join('')
        : '<span style="font-size:9px;color:#94a3b8;font-style:italic">Sem responsável</span>';
    }

    function _entHtml(t){
      return (t.entregas&&t.entregas.length)
        ? t.entregas.map(function(e){
            var s=(e['Status']||'').toLowerCase();
            var idE=e['ID Entrega']||'';
            var atrE=e['Prazo']&&new Date(e['Prazo'])<new Date()&&s!=='entregue';
            var cls=s==='entregue'?'background:#d1fae5;color:#065f46;text-decoration:line-through'
                   :atrE?'background:#fee2e2;color:#991b1b'
                   :s==='em andamento'?'background:#fef3c7;color:#92400e'
                   :'background:#f1f5f9;color:#64748b';
            return '<span onclick="concluirEntregaFila(\''+escaparHTML(idE)+'\')" style="font-size:9px;font-weight:700;padding:2px 8px;border-radius:99px;cursor:pointer;'+cls+'">'+escaparHTML(e['Tipo']||'-')+'</span>';
          }).join('')
        : '<span style="font-size:9px;color:#94a3b8;font-style:italic">Sem entregas</span>';
    }

    function _cardHtml(t){
      var atrasado=_isAtrasadoBalcao(t.prazo,t.status);
      return '<div class="kanban-item p-3 border rounded-xl mb-2 bg-white shadow-sm cursor-move'
        +(atrasado?' border-red-200 bg-red-50/40':' border-slate-200')+'"'
        +' draggable="true" data-id="'+escaparHTML(t.id||'')+'" ondragstart="onDragStartKanban(event)">'
        +'<div class="font-semibold text-slate-800 text-xs mb-2 flex items-center gap-1.5">'
        +(atrasado?'<i class="fas fa-exclamation-circle text-red-400" style="font-size:9px;flex-shrink:0"></i>':'')
        +escaparHTML(t.titulo||'-')+'</div>'
        +'<div style="display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px">'
        +_stPill(t.status)+_prioPill(t.prioridade)
        +(t.prazo?'<span style="font-size:9px;color:#94a3b8">até '+escaparHTML(t.prazo)+'</span>':'')
        +'</div>'
        +'<div style="display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px">'+_execHtml(t)+'</div>'
        +'<div style="display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px">'+_entHtml(t)+'</div>'
        +'<div style="display:flex;gap:6px">'
        +'<button onclick="responderFuncao(\''+escaparHTML(t.id||'')+'\''+')" style="font-size:10px;padding:4px 10px;border-radius:8px;background:#fef3c7;color:#92400e;border:none;cursor:pointer;font-weight:700"><i class="fas fa-comment" style="margin-right:4px;font-size:9px"></i>Responder</button>'
        +'<button onclick="atribuirTarefa(\''+escaparHTML(t.id||'')+'\',\''+escaparHTML(t.funcao||'')+'\''+')" style="font-size:10px;padding:4px 10px;border-radius:8px;background:#eff6ff;color:#1d4ed8;border:none;cursor:pointer;font-weight:700"><i class="fas fa-user-check" style="margin-right:4px;font-size:9px"></i>Atribuir</button>'
        +'</div></div>';
    }

    // ── MODO KANBAN ─────────────────────────────────
    if (_modoFila==='kanban'){
      var cols={'Solicitado':[],'Em andamento':[],'Concluído':[]};
      lista.forEach(function(t){ var s=t.status||'Solicitado'; if(!cols[s])cols[s]=[]; cols[s].push(t); });
      var colDef={
        'Solicitado':  { bg:'background:#eff6ff', border:'border:1.5px solid #dbeafe', txt:'color:#1d4ed8' },
        'Em andamento':{ bg:'background:#fffbeb', border:'border:1.5px solid #fde68a', txt:'color:#92400e' },
        'Concluído':   { bg:'background:#f0fdf4', border:'border:1.5px solid #bbf7d0', txt:'color:#065f46' }
      };
      el.innerHTML = '<div class="grid grid-cols-3 gap-3">'
        + Object.keys(cols).map(function(status){
            var def=colDef[status]||{bg:'background:#f8fafc',border:'border:1.5px solid #e2e8f0',txt:'color:#475569'};
            var n=cols[status].length, over=n>5;
            return '<div class="kanban-col p-3 min-h-64" style="'+def.bg+';'+def.border+';border-radius:14px" data-status="'+escaparHTML(status)+'" ondragover="onDragOverKanban(event)" ondrop="onDropKanban(event,\''+escaparHTML(status)+'\')">'
              +'<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">'
              +'<span style="font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.06em;'+def.txt+'">'+escaparHTML(status)+'</span>'
              +'<span style="font-size:9px;font-weight:900;padding:1px 8px;border-radius:99px;'+(over?'background:#fee2e2;color:#991b1b':'background:rgba(0,0,0,.06);color:#64748b')+'">'+n+'</span>'
              +'</div>'
              +'<div class="kanban-list space-y-2">'+cols[status].map(_cardHtml).join('')+'</div>'
              +'</div>';
          }).join('')
        + '</div>';
      return;
    }

    // ── MODO CARDS ──────────────────────────────────
    if (_modoFila==='cards'){
      el.innerHTML = '<div class="grid grid-cols-2 gap-3">'+lista.map(_cardHtml).join('')+'</div>';
      return;
    }

    // ── MODO CARGA ──────────────────────────────────
    if (_modoFila==='carga'){
      if (!Object.keys(carga).length){
        el.innerHTML = '<div class="py-8 text-center text-xs text-slate-400 italic">Nenhuma tarefa atribuída.</div>';
        return;
      }
      var maxN=Math.max.apply(null, Object.values(carga).concat([1]));
      el.innerHTML = '<div class="space-y-3 p-2">'
        + Object.keys(carga).sort(function(a,b){ return carga[b]-carga[a]; }).map(function(p){
            var n=carga[p], pct=Math.round(n/maxN*100);
            var cor=n>5?'#ef4444':n>3?'#f59e0b':'#6366f1';
            var label=n>5?' — sobrecarregado':n>3?' — atenção':'';
            return '<div style="display:flex;align-items:center;gap:12px">'
              +'<div style="width:120px;font-size:11px;font-weight:700;color:#334155;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="'+escaparHTML(p)+'">'+escaparHTML(p.split('@')[0])+'</div>'
              +'<div style="flex:1;background:#f1f5f9;border-radius:99px;height:8px;overflow:hidden">'
              +'<div style="width:'+pct+'%;height:100%;background:'+cor+';border-radius:99px;transition:width .4s ease"></div>'
              +'</div>'
              +'<div style="font-size:11px;font-weight:900;color:'+cor+';width:24px;text-align:right">'+n+'</div>'
              +(label?'<div style="font-size:9px;color:'+cor+';white-space:nowrap">'+label+'</div>':'')
              +'</div>';
          }).join('')
        +'</div>';
      return;
    }

    // ── MODO TIMELINE ────────────────────────────────
    if (_modoFila==='timeline'){
      var comPrazo=lista.filter(function(t){ return !!t.prazo; });
      var semPrazo=lista.filter(function(t){ return !t.prazo; });
      comPrazo.sort(function(a,b){ return new Date(a.prazo)-new Date(b.prazo); });
      var hoje=new Date(); hoje.setHours(0,0,0,0);
      el.innerHTML = '<div class="space-y-1 p-1">'
        + comPrazo.map(function(t){
            var d=new Date(t.prazo); d.setHours(0,0,0,0);
            var diff=Math.round((d-hoje)/(864e5));
            var atrasado=diff<0&&(t.status||'').toLowerCase()!=='concluído';
            var eHoje=diff===0;
            var icon=atrasado?'<i class="fas fa-exclamation-circle" style="color:#ef4444;font-size:11px"></i>'
                   :eHoje?'<i class="fas fa-dot-circle" style="color:#f59e0b;font-size:11px"></i>'
                   :'<i class="fas fa-circle" style="color:#a5b4fc;font-size:8px"></i>';
            var rowBg=atrasado?'background:#fff5f5;border-left:3px solid #ef4444'
                     :eHoje?'background:#fffbeb;border-left:3px solid #f59e0b'
                     :'background:#f8fafc;border-left:3px solid #e2e8f0';
            var prazoFmt=atrasado?'<span style="color:#ef4444;font-weight:900">'+escaparHTML(t.prazo)+' ('+Math.abs(diff)+'d atraso)</span>'
                        :eHoje?'<span style="color:#f59e0b;font-weight:900">Hoje</span>'
                        :'<span style="color:#64748b">'+escaparHTML(t.prazo)+' (+'+diff+'d)</span>';
            return '<div style="'+rowBg+';padding:8px 12px;border-radius:6px;display:flex;align-items:center;gap:10px;margin-bottom:4px">'
              +'<div style="flex-shrink:0">'+icon+'</div>'
              +'<div style="flex:1;min-width:0"><span style="font-size:12px;font-weight:600;color:'+(atrasado?'#991b1b':'#1e293b')+';display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+escaparHTML(t.titulo||'-')+'</span></div>'
              +'<div style="font-size:10px;flex-shrink:0">'+prazoFmt+'</div>'
              +'</div>';
          }).join('')
        +(semPrazo.length?'<div style="padding:8px 12px;color:#94a3b8;font-size:10px;font-style:italic">'+semPrazo.length+' tarefa(s) sem prazo definido.</div>':'')
        +'</div>';
      return;
    }

    // ── MODO LISTA (padrão) ──────────────────────────
    el.innerHTML = '<div class="space-y-2">'+lista.map(_cardHtml).join('')+'</div>';

  }, function(){
    var el2=document.getElementById('fila-funcao');
    if (el2) el2.innerHTML='<div class="py-6 text-center text-red-400 text-xs"><i class="fas fa-exclamation-triangle mr-1"></i>Erro ao carregar fila.</div>';
  });
}

// ══════════════════════════════════════════════════════
// DRAG AND DROP KANBAN
// ══════════════════════════════════════════════════════
var _dragEl      = null;
var _placeholder = null;

function onDragStartKanban(e){
  _dragEl = e.currentTarget;
  setTimeout(function(){ if (_dragEl) _dragEl.classList.add('opacity-50'); }, 0);
  _placeholder = document.createElement('div');
  _placeholder.className = 'h-10 border-2 border-dashed border-indigo-300 rounded-xl';
}

function onDragOverKanban(e){
  e.preventDefault();
  document.querySelectorAll('.kanban-col').forEach(function(c){ c.classList.remove('drag-over'); });
  var col = e.currentTarget;
  col.classList.add('drag-over');
  var container = col.querySelector('.kanban-list');
  if (!container) return;
  var after = getDragAfterElement(container, e.clientY);
  if (!after) container.appendChild(_placeholder);
  else container.insertBefore(_placeholder, after);
}

function onDropKanban(e, novoStatus){
  e.preventDefault();
  if (!_dragEl) return;
  document.querySelectorAll('.kanban-col').forEach(function(c){ c.classList.remove('drag-over'); });
  var lista = e.currentTarget.querySelector('.kanban-list');
  if (_placeholder && lista) lista.insertBefore(_dragEl, _placeholder);
  _dragEl.classList.remove('opacity-50');
  if (_placeholder && _placeholder.parentNode) _placeholder.remove();

  var ordens = {};
  document.querySelectorAll('.kanban-col').forEach(function(col){
    var s = col.getAttribute('data-status');
    col.querySelectorAll('.kanban-item').forEach(function(item, idx){
      var id = item.getAttribute('data-id');
      if (id) ordens[id] = { ordem:idx, status:s };
    });
  });

  GAS._call('salvarOrdemKanban', [ordens], function(){
    // UI já reflete a nova ordem
  }, function(err){
    console.error('Erro ao salvar ordem Kanban:', err);
    Swal.fire({ icon:'error', title:'Erro ao salvar ordem',
      text:'A ordem não foi persistida. Recarregue a fila.',
      timer:3000, showConfirmButton:false, customClass:{ popup:'rounded-3xl' } });
    renderFilaFuncaoAtual();
  });

  _dragEl = null;
}

function getDragAfterElement(container, y){
  var els = Array.from(container.querySelectorAll('.kanban-item:not(.opacity-50)'));
  return els.reduce(function(closest, child){
    var box    = child.getBoundingClientRect();
    var offset = y - box.top - box.height/2;
    if (offset < 0 && offset > closest.offset) return { offset:offset, element:child };
    return closest;
  }, { offset:Number.NEGATIVE_INFINITY }).element;
}

// ══════════════════════════════════════════════════════
// CONCLUIR ENTREGA — pelo chip na fila
// ══════════════════════════════════════════════════════
function concluirEntregaFila(idEntrega){
  Swal.fire({
    title:'Concluir entrega',
    html:'<div class="text-left" style="padding:0 4px">'
      + '<label style="display:block;font-size:10px;font-weight:900;color:#94a3b8;text-transform:uppercase;letter-spacing:.07em;margin-bottom:6px">Link do material *</label>'
      + '<input id="linkEntregaFila" style="width:100%;padding:9px 13px;font-size:12px;border:1.5px solid #e2e8f0;border-radius:12px;outline:none;box-sizing:border-box" placeholder="https://drive.google.com/...">'
      + '</div>',
    showCancelButton:true,
    confirmButtonText:'<i class="fas fa-check mr-1"></i>Concluir',
    cancelButtonText:'Cancelar',
    confirmButtonColor:'#059669',
    customClass:{ popup:'rounded-3xl', confirmButton:'rounded-xl font-black text-sm', cancelButton:'rounded-xl font-bold text-sm' },
    preConfirm:function(){
      var link=(document.getElementById('linkEntregaFila').value||'').trim();
      if (!link){ Swal.showValidationMessage('Informe o link do material'); return false; }
      return link;
    }
  }).then(function(r){
    if (!r.isConfirmed) return;
    showLoader(true);
    GAS.entregas.atualizar(idEntrega, { status:'Entregue', link:r.value }, function(){
      showLoader(false); renderFilaFuncaoAtual();
    }, function(e){ showLoader(false); Swal.fire('Erro', String(e), 'error'); });
  });
}

// ══════════════════════════════════════════════════════
// MODO E NAVEGAÇÃO
// ══════════════════════════════════════════════════════
function renderFilaFuncaoAtual(){
  renderFilaFuncao(_balcaoFuncaoAtual);
}

function mudarModoFila(modo){
  _modoFila = modo;
  try { localStorage.setItem('modoFila', modo); } catch(e){}
  document.querySelectorAll('.modo-btn').forEach(function(btn){ btn.classList.remove('ativo'); });
  var btnAtivo = document.querySelector('[data-modo="'+modo+'"]');
  if (btnAtivo) btnAtivo.classList.add('ativo');
  renderFilaFuncaoAtual();
}

// Restaura modo salvo sem disparar GAS call prematura
document.addEventListener('DOMContentLoaded', function(){
  try {
    var salvo = localStorage.getItem('modoFila');
    if (salvo){
      _modoFila = salvo;
      document.querySelectorAll('.modo-btn').forEach(function(btn){ btn.classList.remove('ativo'); });
      var btnAtivo = document.querySelector('[data-modo="'+_modoFila+'"]');
      if (btnAtivo) btnAtivo.classList.add('ativo');
    }
  } catch(e){}
});
