      <section id="aba-codip" class="tab-content animate-fadeIn hidden pb-20">

        <div class="bg-white rounded-3xl shadow-sm border border-slate-200 p-5 mb-5">

              <label class="text-[10px] font-black text-slate-400 uppercase mb-1 block">Mês Ref.</label>
              <input type="text" id="codipFiltroMes" placeholder="04/2026"

            </div>
            <div class="flex-1 min-w-[160px]">
              <label class="text-[10px] font-black text-slate-400 uppercase mb-1 block">Tipo de Ação</label>
              <input type="text" id="codipFiltroTipo" placeholder="Curso/Oficina, Apresentação..."

            </div>
            <div class="flex-1 min-w-[140px]">
              <label class="text-[10px] font-black text-slate-400 uppercase mb-1 block">Setor</label>
              <input type="text" id="codipFiltroSetor" placeholder="NArTE, Escola..."
                class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm outline-none focus:border-indigo-500">
            </div>
            <div class="flex-1 min-w-[160px]">
              <label class="text-[10px] font-black text-slate-400 uppercase mb-1 block">Contrato</label>
              <select id="codipFiltroCtr" class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm outline-none focus:border-indigo-500">

            <div class="flex gap-2 shrink-0">
              <button onclick="renderizarTabelaCODIP()"

                <i class="fas fa-filter mr-1"></i>Filtrar

              <button onclick="exportarCODIPCSV()"
                class="px-4 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-black rounded-xl uppercase transition-all">
                <i class="fas fa-file-csv mr-1"></i>CSV
              </button>
            </div>
            <span id="codipContador" class="text-[10px] font-black text-slate-400 self-center ml-auto"></span>
          </div>
        </div>

        <!-- KPIs da aba -->
        <div id="codipAbaKpis" class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-5"></div>

        <div class="bg-white rounded-3xl shadow-xl border border-slate-200 overflow-hidden">
          <div class="overflow-x-auto">
            <table class="w-full min-w-[900px] text-left border-collapse text-xs">
              <thead>
                <tr class="bg-indigo-50 border-b border-indigo-100">
                  <th class="p-3 text-[9px] font-black text-indigo-700 uppercase tracking-widest min-w-[160px]">Ação</th>
                  <th class="p-3 text-[9px] font-black text-indigo-700 uppercase tracking-widest w-24">Mês Ref.</th>
                  <th class="p-3 text-[9px] font-black text-indigo-700 uppercase tracking-widest w-32">Tipo</th>
                  <th class="p-3 text-[9px] font-black text-indigo-700 uppercase tracking-widest w-24">Setor</th>
                  <th class="p-3 text-[9px] font-black text-indigo-700 uppercase tracking-widest text-center w-20">Presencial</th>
                  <th class="p-3 text-[9px] font-black text-indigo-700 uppercase tracking-widest text-center w-20">Virtual</th>
                  <th class="p-3 text-[9px] font-black text-indigo-700 uppercase tracking-widest text-center w-16">PCD</th>
                  <th class="p-3 text-[9px] font-black text-indigo-700 uppercase tracking-widest text-center w-20">Horas/Mês</th>
                  <th class="p-3 text-[9px] font-black text-indigo-700 uppercase tracking-widest w-32">Linguagem</th>
                  <th class="p-3 text-[9px] font-black text-indigo-700 uppercase tracking-widest w-36">Contrato / Meta</th>
                  <th class="p-3 text-[9px] font-black text-indigo-700 uppercase tracking-widest w-20">Evidências</th>

              <tbody id="corpoCODIP" class="divide-y divide-slate-50"></tbody>
            </table>
          </div>
          <div id="semResultadosCODIP" class="hidden p-16 text-center">
            <i class="fas fa-chart-pie text-slate-200 text-3xl mb-3"></i>
            <p class="text-slate-400 font-bold text-sm">Nenhum relatório CODIP encontrado.</p>
          </div>
        </div>
