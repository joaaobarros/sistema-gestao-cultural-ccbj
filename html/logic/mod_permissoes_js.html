<!--
@file logic/mod_permissoes_js.html
@layer frontend/logic
@description Sistema de permissões modulares no frontend.
             Carrega permissões do backend e expõe temPermissao(modulo, acao).
             Fallback automático para permissões baseadas em perfil (isAdmin/isSuperadmin).
@dependencies core/app_state_js (AppState), services/server_bridge_js (GAS.permissoes)
-->
<script>

/**
 * ========================================
 * BLOCO: Helper de permissão
 * ========================================
 * @description Verifica se o usuário atual pode realizar uma ação em um módulo.
 *              Prioridade: superadmin → permissões fine-grained (se carregadas) → fallback por perfil.
 * @param modulo  string — nome do módulo (ex: 'contratos', 'almoxarifado')
 * @param acao    string — 'visualizar' | 'editar' | 'excluir'
 * @returns boolean
 */
function temPermissao_v1(modulo, acao) {
  if (!AppState || !AppState.usuario) return false;
  if (AppState.usuario.isSuperadmin) return true;

  var perms = AppState.usuario.permissoes;
  if (perms && perms[modulo]) {
    return !!perms[modulo][acao];
  }

  // Fallback baseado nos flags existentes
  if (AppState.usuario.isAdmin) {
    return acao !== 'excluir' || modulo !== 'rh';
  }
  return acao === 'visualizar';
}

/**
 * ========================================
 * BLOCO: Carregamento de permissões
 * ========================================
 * @description Busca permissões do backend e armazena em AppState.usuario.permissoes.
 *              Chamado no boot; falha silenciosa — fallback ativo via temPermissao().
 */
function carregarPermissoes_v1(cb) {
  if (!GAS || !GAS.permissoes) {
    if (typeof cb === 'function') cb();
    return;
  }
  GAS.permissoes.obter(function(data) {
    if (data && AppState && AppState.usuario) {
      AppState.usuario.permissoes = (data && data.modulos) ? data.modulos : null;
      AppState.usuario.perfil     = (data && data.perfil)  ? data.perfil  : 'visitante';
    }
    if (typeof cb === 'function') cb();
  }, function() {
    // Falha silenciosa: temPermissao() usa o fallback
    if (typeof cb === 'function') cb();
  });
}

carregarPermissoes_v1

/**
 * ========================================
 * BLOCO: Aplicar permissões a elementos de UI
 * ========================================
 * @description Oculta elementos marcados com data-requer-permissao="modulo:acao".
 *              Chamado após carregarPermissoes().
 */
function aplicarPermissoesUI() {
  document.querySelectorAll('[data-requer-permissao]').forEach(function(el) {
    var val = el.getAttribute('data-requer-permissao') || '';
    var partes = val.split(':');
    var modulo = partes[0];
    var acao   = partes[1] || 'visualizar';
    if (!temPermissao(modulo, acao)) {
      el.style.display = 'none';
    }
  });
}

// Carrega permissões após todos os scripts e depois de o AppState estar pronto
document.addEventListener('DOMContentLoaded', function() {

  var _tentativas = 0;

  function _tentarCarregar() {
    if (AppState && AppState.usuario && AppState.usuario.email) {

      carregarPermissoes(function() {
        aplicarPermissoesUI();

        document.dispatchEvent(new Event('permissoes:ready'));
      });

    } else if (_tentativas < 30) {
      _tentativas++;
      setTimeout(_tentarCarregar, 300);
    }
  }

  _tentarCarregar();

});

</script>
