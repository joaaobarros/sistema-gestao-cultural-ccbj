<!--
@file core/auth_identity_js.html
@layer frontend/auth
@description Helper de identidade NÃO-BLOQUEANTE.

  O boot do sistema NÃO depende deste arquivo.
  A identidade primária vem de obterDadosIniciais() via google.script.run,
  que resolve Session.getActiveUser() corretamente mesmo em "Execute as: Me"
  porque google.script.run propaga o contexto OAuth do chamante.

  Este módulo resolve Auth.email em paralelo (assíncrono) para que módulos
  que usem Auth.quandoPronto() recebam o email quando disponível.

  Fontes em ordem de prioridade:
    1. window.__EMAIL_INICIAL__ injetado pelo doGet (quando disponível)
    2. google.script.run.obterEmailSessaoAtiva() — fallback assíncrono
-->
<script>
  window.__EMAIL_INICIAL__  = '<?= emailInicial ?>';
  window.__APP_URL__        = '<?= appUrl ?>';
</script>
<script>

// ═══════════════════════════════════════════════════════════════
// AUTH — helper não-bloqueante de identidade
// ═══════════════════════════════════════════════════════════════

const Auth = {
  email:      '',
  pronto:     false,
  _callbacks: [],

  _definirEmail: function(email) {
    if (this.pronto) return;
    this.email  = email;
    this.pronto = true;
    // Só sobrescreve AppState se ainda não foi preenchido pelo inicializarApp()
    if (typeof AppState !== 'undefined' && AppState.usuario && !AppState.usuario.email) {
      AppState.usuario.email = email;
    }
    var cbs = this._callbacks.slice();
    this._callbacks = [];
    cbs.forEach(function(cb) { try { cb(email); } catch(e) {} });
  },

  quandoPronto: function(cb) {
    if (this.pronto) cb(this.email);
    else this._callbacks.push(cb);
  }
};

// Resolução assíncrona em background — não bloqueia o boot
document.addEventListener('DOMContentLoaded', function() {
  var raw = window.__EMAIL_INICIAL__;
  if (raw && raw.indexOf('@') >= 0) {
    Auth._definirEmail(String(raw).toLowerCase().trim());
    return;
  }

  // Fallback: servidor resolve Session.getActiveUser() via google.script.run
  google.script.run
    .withSuccessHandler(function(r) {
      if (r && r.ok && r.email && r.email.indexOf('@') >= 0) {
        Auth._definirEmail(r.email);
      }
    })
    .withFailureHandler(function() {})
    .obterEmailSessaoAtiva();
});

</script>
