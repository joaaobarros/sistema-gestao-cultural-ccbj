<!--
@file mod_favoritos_js.html
@type logic
@description Gerenciamento de favoritos (atalhos rápidos) na sidebar via drag-and-drop.
@responsibility Manter, persistir e renderizar a lista de abas favoritadas pelo usuário.
@dependencies google.script.run.salvarPreferenciasUsuario, mostrarAba (mod_ui_estado_js)
-->
<script>
/**
 * ========================================
 * BLOCO: Estado local de favoritos e drag
 * ========================================
 * @description Variáveis de controle para arrastar itens de menu e reordenar favoritos
 * @context Inicializado em iniciarPreferencias() após carregamento das preferências do usuário
 */
let dragItem   = null;
let dragOrigem = null;
let dragIndex  = null;
let favoritos  = [];

/**
 * ========================================
 * BLOCO: Persistência de favoritos
 * ========================================
 * @description Salva a lista de favoritos no backend (planilha PreferenciasUsuarios)
 * @context Chamado após qualquer alteração na lista (adicionar, remover, reordenar)
 * @sideEffects Chama google.script.run.salvarPreferenciasUsuario
 */
function salvarFavoritos() {
  google.script.run
    .withFailureHandler(err => console.error('Erro ao salvar favoritos:', err))
    .salvarPreferenciasUsuario('favoritos', favoritos);
}

/**
 * ========================================
 * BLOCO: Drag-and-drop — arrastar do menu
 * ========================================
 * @description Captura o início do arraste de um item de menu para a área de favoritos
 * @context Ativado pelo atributo draggable nos botões da sidebar com data-aba
 */
function iniciarDrag(e) {
  const el = e.currentTarget;
  dragOrigem = 'menu';
  dragItem = {
    aba:  el.dataset.aba,
    nome: el.querySelector('span')?.innerText.trim() || '',
    icon: el.querySelector('i')?.className || ''
  };
  e.dataTransfer.setData('text/plain', dragItem.aba);
}

/**
 * ========================================
 * BLOCO: Drag-and-drop — reordenar favoritos
 * ========================================
 * @description Permite reordenar favoritos já existentes arrastando-os entre si
 * @context Ativado pelos elementos renderizados em renderizarFavoritos()
 */
function iniciarDragFavorito(e, index) {
  dragOrigem = 'favorito';
  dragIndex  = index;
  e.dataTransfer.setData('text/plain', index);
}

function onDragOverItem(e, index) {
  e.preventDefault();
}

function onDropReorder(e, index) {
  e.preventDefault();
  if (dragOrigem !== 'favorito' || dragIndex === null) return;
  const item = favoritos.splice(dragIndex, 1)[0];
  favoritos.splice(index, 0, item);
  dragIndex  = null;
  dragOrigem = null;
  salvarFavoritos();
  renderizarFavoritos();
}

function onDropFavoritos(e) {
  e.preventDefault();
  if (!dragItem || dragOrigem !== 'menu') return;
  if (favoritos.some(f => f.aba === dragItem.aba)) return;
  favoritos.push(dragItem);
  dragItem   = null;
  dragOrigem = null;
  salvarFavoritos();
  renderizarFavoritos();
}

function onDragOverFavoritos(e) {
  e.preventDefault();
}

/**
 * ========================================
 * BLOCO: Inicialização e gerenciamento
 * ========================================
 * @description Carrega as preferências do backend e gerencia adição/remoção
 * @context iniciarPreferencias é chamado no bootstrap após carregarPreferenciasUsuario
 */
function iniciarPreferencias(preferencias) {
  favoritos = preferencias?.favoritos || [];
  renderizarFavoritos();
}

function resetarFavoritos() {
  favoritos = [];
  salvarFavoritos();
  renderizarFavoritos();
}

function removerFavorito(index) {
  favoritos.splice(index, 1);
  salvarFavoritos();
  renderizarFavoritos();
}

/**
 * ========================================
 * BLOCO: Renderização dos favoritos
 * ========================================
 * @description Gera o HTML da lista de favoritos no container da sidebar
 * @context Chamado após qualquer mudança na lista ou no carregamento inicial
 * @inputs Array `favoritos` (estado local)
 * @outputs HTML injetado em #favoritosContainer
 * @sideEffects Modifica o DOM de #favoritosContainer
 */
function renderizarFavoritos() {
  const container = document.getElementById('favoritosContainer');
  if (!container) return;

  if (!favoritos.length) {
    container.innerHTML = `
      <div class="text-[9px] text-slate-600 italic px-2 py-1">
        Arraste abas para cá
      </div>
    `;
    return;
  }

  container.innerHTML = favoritos.map((f, index) => `
    <div
      class="flex items-center justify-between group bg-white/5 rounded-lg"
      draggable="true"
      ondragstart="iniciarDragFavorito(event, ${index})"
      ondragover="onDragOverItem(event, ${index})"
      ondrop="onDropReorder(event, ${index})"
    >
      <button data-aba="${f.aba}"
        onclick="mostrarAba('${f.aba}')"
        class="nav-item w-full bg-transparent">
        <i class="${f.icon} w-5 text-center text-xs"></i>
        <span class="text-xs font-semibold">${f.nome}</span>
      </button>
      <button onclick="removerFavorito(${index})"
        class="opacity-0 group-hover:opacity-100 px-2 text-slate-400 hover:text-red-400 transition">
        <i class="fas fa-times text-[10px]"></i>
      </button>
    </div>
  `).join('');
}
</script>
