function renderizarModoAgendaRece() {
  const container = document.getElementById('agendaReceContainer');
  if (!container) return;

  window._agendaReceSemana = window._agendaReceSemana || 0;
  const hoje = new Date(); hoje.setHours(0,0,0,0);
  const dow = hoje.getDay() === 0 ? 6 : hoje.getDay() - 1;
  const inicioSemana = new Date(hoje);
  inicioSemana.setDate(hoje.getDate() - dow + window._agendaReceSemana * 7);

  const dias = Array.from({length: 7}, (_, i) => {
    const d = new Date(inicioSemana); d.setDate(inicioSemana.getDate() + i); return d;
  });

  const nomeDias = ['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];
  const meses    = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];

  const d0 = dias[0], d6 = dias[6];
  if (document.getElementById('agendaReceSemanaLabel'))
    document.getElementById('agendaReceSemanaLabel').textContent =
      `${d0.getDate()} ${meses[d0.getMonth()]} a ${d6.getDate()} ${meses[d6.getMonth()]} ${d6.getFullYear()}`;

  const normData = d => { const x = new Date(d); x.setHours(0,0,0,0); return x.getTime(); };
  const normHora = h => { if (!h) return 0; const p = String(h).split(':'); return parseInt(p[0])*60+parseInt(p[1]); };
  const fmtHoraMin = m => `${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;

  const fimSemana = new Date(dias[6]); fimSemana.setHours(23,59,59,999);
  if (!AppState.colecoes.reservasRece) {
    container.innerHTML = '<div class="p-16 text-center text-slate-300"><i class="fas fa-spinner animate-spin text-3xl mb-3"></i><br><span class="text-sm font-bold">Carregando...</span></div>';
    google.script.run
      .withSuccessHandler(function(rece) {
        AppState.colecoes.reservasRece = rece || [];
        renderizarModoAgendaRece();
      })
      .withFailureHandler(function() { container.innerHTML = '<div class="p-10 text-center text-red-400">Erro ao carregar eventos.</div>'; })
      .obterReservasRece();
    return;
  }

  const filtroSalaAgenda = document.getElementById('agendaReceSala')?.value || '';
  const reservas = (AppState.colecoes.reservasRece || []).filter(r => {
    if (String(r[17]).toUpperCase() === 'CANCELADO') return false;
    if (filtroSalaAgenda && String(r[6]).trim() !== filtroSalaAgenda) return false;
    const p = String(r[2]||'').split('/');
    if (p.length !== 3) return false;
    const d = new Date(p[2], p[1]-1, p[0]); d.setHours(0,0,0,0);
    return d >= inicioSemana && d <= fimSemana;
  });

  // INDEXAÇÃO LEVE POR DATA
  const reservasPorData = {};

  reservas.forEach(r => {
    const p = String(r[2] || '').split('/');
    if (p.length !== 3) return;

    const key = `${p[2]}-${p[1]}-${p[0]}`; // YYYY-MM-DD

    if (!reservasPorData[key]) reservasPorData[key] = [];
    reservasPorData[key].push(r);
  });

  const INICIO_MIN = 480, FIM_MIN = 1290, TOTAL_MIN = 810;
  const PX_POR_HORA = 64;
  const TOTAL_PX = (TOTAL_MIN / 60) * PX_POR_HORA;
  const horasMarkers = Array.from({length:14}, (_,i) => 8+i);
  const colStyle = '';

  let html = `<div class="bg-white rounded-2xl border border-slate-200 overflow-hidden flex flex-col h-full">
    <div class="grid border-b border-slate-100" style="${colStyle}">
      <div class="p-2 border-r border-slate-100"></div>
      ${dias.map((d,i) => {
        const ehHoje = normData(d) === normData(new Date());
        return `<div class="p-2 text-center border-l border-slate-100 ${ehHoje ? 'bg-yellow-50' : ''}">
          <div class="text-[10px] font-bold ${ehHoje ? 'text-yellow-600' : 'text-slate-400'} uppercase">${nomeDias[i]}</div>
          <div class="text-sm font-black mt-0.5 ${ehHoje ? 'w-7 h-7 bg-yellow-500 text-white rounded-full flex items-center justify-center mx-auto' : 'text-slate-700'}">${d.getDate()}</div>
        </div>`;
      }).join('')}
    </div>
    <div class="overflow-y-auto" style="max-height:calc(100vh - 420px);">
      <div class="grid relative" style="${colStyle}; height:${TOTAL_PX + 24}px;">
        <div class="border-r border-slate-100 relative">
          ${horasMarkers.map(h => {
            const top = ((h*60-INICIO_MIN)/TOTAL_MIN)*TOTAL_PX;
            return `<div class="absolute right-1 text-[9px] text-slate-300 font-bold" style="top:${top-7}px">${String(h).padStart(2,'0')}h</div>`;
          }).join('')}
        </div>
        ${dias.map((d,di) => {
          const dKey = normData(d);
          const ehHoje = dKey === normData(new Date());
          const ehPassado = d < new Date(normData(new Date()));

          const linhasHora = horasMarkers.map(h => {
            const top = ((h*60-INICIO_MIN)/TOTAL_MIN)*TOTAL_PX;
            return `<div class="absolute left-0 right-0 border-t border-slate-100 pointer-events-none" style="top:${top}px"></div>`;
          }).join('');

          const agora = new Date();
          let nowMarker = '';
          if (ehHoje) {
            const nowMin = agora.getHours()*60+agora.getMinutes();
            if (nowMin>=INICIO_MIN && nowMin<=FIM_MIN) {
              const top = ((nowMin-INICIO_MIN)/TOTAL_MIN)*TOTAL_PX;
              nowMarker = `<div class="absolute left-0 right-0 z-10 pointer-events-none" style="top:${top}px">
                <div class="border-t-2 border-yellow-400 relative"><div class="w-2 h-2 bg-yellow-400 rounded-full absolute -top-1 -left-1"></div></div>
              </div>`;
            }
          }

          const dataKey = new Date(dKey).toISOString().slice(0, 10);
          const resDodia = reservasPorData[dataKey] || [];

          const resBlocks = resDodia.map(r => {
          const ini = normHora(r[4]), ter = normHora(r[5]);
          const top = Math.max(0, ((ini - INICIO_MIN) / TOTAL_MIN) * TOTAL_PX);
          const height = Math.max(18, ((ter - ini) / TOTAL_MIN) * TOTAL_PX);

          const podeEditar =
            AppState.usuario.isAdmin ||
            AppState.usuario.isSuperadmin ||
            AppState.usuario.isComunicacao ||
            AppState.usuario.email === r[18];

          const imagem = (r[20] && String(r[20]).trim())
          ? `<img src="${escaparHTML(String(r[20]))}" class="w-full h-8 object-cover rounded mt-0.5 opacity-80" onerror="this.remove()">`
          : '';

          return `
            <div class="absolute left-1 right-1 border-l-2 border-yellow-400 bg-yellow-50 rounded-r-lg overflow-hidden z-5 shadow-sm ${podeEditar ? 'cursor-pointer hover:brightness-95' : 'cursor-default'} transition-all"
              style="top:${top}px;height:${height}px;"
              onclick="event.stopPropagation();abrirDetalheRece('${escaparHTML(r[0])}')"
              title="${escaparHTML(r[1] || '')} — ${fmtHoraMin(ini)} às ${fmtHoraMin(ter)}">

              <div class="p-1">
                <p class="text-[9px] font-black text-slate-700 leading-tight truncate">
                  ${escaparHTML(r[1] || '')}
                </p>

                ${height > 28 ? `
                  <p class="text-[8px] text-slate-500">
                    ${fmtHoraMin(ini)}–${fmtHoraMin(ter)}
                  </p>
                ` : ''}

                ${imagem}
              </div>
            </div>
          `;
        }).join('');

          return `<div class="relative border-l border-slate-100 ${ehPassado?'bg-slate-50/50':ehHoje?'bg-yellow-50/20':''}" style="height:${TOTAL_PX+24}px;">
            ${linhasHora}${nowMarker}${resBlocks}
          </div>`;
        }).join('')}
      </div>
    </div>
  </div>`;

  container.innerHTML = '<div class="p-10 text-center text-slate-300 font-bold">Carregando agenda...</div>';

  requestAnimationFrame(() => {
    container.innerHTML = html;
  });
}

function validarConflitoTempoReal() {

  const horaInicio = document.getElementById('horaInicio');
  const horaTermino = document.getElementById('horaTermino');
  const selectSala = document.getElementById('selectSala');
  const aviso = document.getElementById('avisoHorarioOcupado');

  if (!horaInicio?.value || !horaTermino?.value || !selectSala?.value) return;

  const datas = (typeof calendarInstance !== 'undefined' && calendarInstance?.selectedDates?.length)
    ? calendarInstance.selectedDates.map(d => flatpickr.formatDate(d, "d/m/Y"))
    : [];

  if (datas.length === 0) return;

  const dados = {
    horaInicio: horaInicio.value,
    horaTermino: horaTermino.value,
    sala: selectSala.value
  };

  const c = verificarConflitoFrontend(dados, datas, null);

  horaInicio.classList.remove('border-red-500');
  horaTermino.classList.remove('border-red-500');
  aviso.classList.add('hidden');
  aviso.innerHTML = '';

  const btnSubmit = document.querySelector('#formReserva button[type="submit"]');
  if (btnSubmit) btnSubmit.disabled = false;
  if (!c.conflito) return;

  if (c.tipo === 'INICIO') {
    horaInicio.classList.add('border-red-500');
    aviso.innerHTML = `⚠️ Conflito no início. Use após ${c.sugestao}`;
  } else if (c.tipo === 'FIM') {
    horaTermino.classList.add('border-red-500');
    aviso.innerHTML = `⚠️ Conflito no término. Termine antes de ${c.reserva[2]}`;
  } else {
    horaInicio.classList.add('border-red-500');
    horaTermino.classList.add('border-red-500');
    aviso.innerHTML = `⚠️ Período ocupado (${c.reserva[2]}–${c.reserva[3]})`;
  }

  aviso.classList.remove('hidden');
  if (btnSubmit) btnSubmit.disabled = c.conflito;
}

function obterHorariosLivresComIntervalo(sala, data) {

  const dataKey = normalizarDataKey(data);
  const salaKey = String(sala);

  const reservas =
    AppState.cacheReservasIndex?.[dataKey]?.[salaKey] || [];

  const normHora = h => {
    const [hh, mm] = String(h).split(':').map(Number);
    return hh * 60 + mm;
  };

  const toHora = m => {
    const h = String(Math.floor(m / 60)).padStart(2,'0');
    const min = String(m % 60).padStart(2,'0');
    return `${h}:${min}`;
  };

  const inicioDia = 8 * 60;
  const fimDia = 21 * 60 + 30;

  let ocupados = [];

  reservas.forEach(r => {
    if (String(r[4]) !== String(sala)) return;
    if ((r[13] || '').toUpperCase() === 'CANCELADO') return;

    ocupados.push({
      inicio: normHora(r[2]),
      fim: normHora(r[3])
    });
  });

  ocupados.sort((a,b)=>a.inicio-b.inicio);

  let livres = [];
  let cursor = inicioDia;

  ocupados.forEach(o => {
    if (cursor < o.inicio) {
      livres.push({inicio: cursor, fim: o.inicio});
    }
    cursor = Math.max(cursor, o.fim);
  });

  if (cursor < fimDia) {
    livres.push({inicio: cursor, fim: fimDia});
  }

  return livres.map(l => ({
    inicio: toHora(l.inicio),
    fim: toHora(l.fim)
  }));
}

function obterSalasDisponiveisPorData(data, horaInicio, horaTermino) {

  const salas = AppState.colecoes.salas || [];

  const normHora = h => {
    const p = String(h || '').split(':');
    return parseInt(p[0]) * 60 + parseInt(p[1]);
  };

  const inicio = normHora(horaInicio);
  const termino = normHora(horaTermino);

  const dataKey = normalizarDataKey(data);
  if (!dataKey) return [];

  return salas.filter(s => {

    const idSala = String(s[0]).trim();

    const reservasSala =
      AppState.cacheReservasIndex?.[dataKey]?.[idSala] || [];

    const conflito = reservasSala.some(r => {

      if ((r[13] || '').toUpperCase() === 'CANCELADO') return false;

      const ini = normHora(r[2]);
      const ter = normHora(r[3]);

      return inicio < ter && termino > ini;

    });

    return !conflito;

  }).map(s => ({
    id: s[0],
    nome: s[1]
  }));

}

function salvarPreferenciasUsuario(contexto) {

  try {

    const prefs = JSON.parse(localStorage.getItem('prefsReserva') || '{}');

    // 🔵 SALAS
    if (contexto.sala) {
      prefs.salas = prefs.salas || {};
      prefs.salas[contexto.sala] = (prefs.salas[contexto.sala] || 0) + 1;
    }

    // 🔵 FAIXA DE HORÁRIO
    if (contexto.horaInicio) {
      const hora = parseInt(contexto.horaInicio.split(':')[0]);
      let faixa = 'noite';

      if (hora < 12) faixa = 'manha';
      else if (hora < 18) faixa = 'tarde';

      prefs.faixas = prefs.faixas || {};
      prefs.faixas[faixa] = (prefs.faixas[faixa] || 0) + 1;
    }

    // 🟣 ITENS (fixos ou volantes)
    if (contexto.itensVolantes) {

      let itens = [];

      if (Array.isArray(contexto.itensVolantes)) {
        itens = contexto.itensVolantes;
      } else if (typeof contexto.itensVolantes === 'string') {
        itens = contexto.itensVolantes.split(',').map(i => i.trim());
      }

      prefs.itens = prefs.itens || {};

      itens.forEach(item => {
        if (!item) return;
        prefs.itens[item] = (prefs.itens[item] || 0) + 1;
      });
    }

    localStorage.setItem('prefsReserva', JSON.stringify(prefs));

  } catch(e) {}
}

function ordenarSugestoesPorPreferencia(sugestoes, contexto) {

  try {

    const prefs = JSON.parse(localStorage.getItem('prefsReserva') || '{}');

    return sugestoes.sort((a, b) => {

      let scoreA = 0;
      let scoreB = 0;

      // 🔵 SALA
      if (prefs.salas) {
        scoreA += prefs.salas[a.sala] || 0;
        scoreB += prefs.salas[b.sala] || 0;
      }

      // 🔵 FAIXA DE HORÁRIO
      const getFaixa = (h) => {
        const hora = parseInt(h.split(':')[0]);
        if (hora < 12) return 'manha';
        if (hora < 18) return 'tarde';
        return 'noite';
      };

      if (prefs.faixas) {
        scoreA += prefs.faixas[getFaixa(a.horaInicio)] || 0;
        scoreB += prefs.faixas[getFaixa(b.horaInicio)] || 0;
      }

      // 🟣 ITENS (PREFERÊNCIA CONTEXTUAL)
      if (prefs.itens && contexto?.itensVolantes) {

        let itensContexto = [];

        if (Array.isArray(contexto.itensVolantes)) {
          itensContexto = contexto.itensVolantes;
        } else if (typeof contexto.itensVolantes === 'string') {
          itensContexto = contexto.itensVolantes.split(',').map(i => i.trim());
        }

        itensContexto.forEach(item => {
          scoreA += prefs.itens[item] || 0;
          scoreB += prefs.itens[item] || 0;
        });
      }

      return scoreB - scoreA;

    });

  } catch(e) {
    return sugestoes;
  }
}


async function chamarIAComFallback(prompt) {
  return new Promise((resolve) => {
    google.script.run
      .withSuccessHandler(function(res) {
        if (res && res.ok) { resolve(res.texto || ''); }
        else { resolve(interpretarIntencaoLocal(prompt)); }
      })
      .withFailureHandler(function() {
        resolve(interpretarIntencaoLocal(prompt));
      })
      .chamarIA(prompt);
  });
}

function interpretarIntencaoLocal(texto) {

  texto = texto.toLowerCase();

  if (texto.includes('sugere') || texto.includes('opção')) {
    return 'SUGESTAO';
  }

  if (texto.includes('conflito') || texto.includes('disponível')) {
    return 'ANALISE';
  }

  return 'ANALISE';
}

function sugerirItensParaReserva(contexto) {
  const itens = AppState.colecoes.itens || [];
  const sala = contexto?.sala;

  if (!sala || !itens.length) return [];

  const fixos = obterItensFixosDaSala(sala) || [];
  const sugestoes = [];

  fixos.forEach(f => {
    sugestoes.push({
      nome: f.nome,
      qtd: f.qtd,
      tipo: 'fixo'
    });
  });

  itens.forEach(i => {
    const nome = String(i?.[1] || '').toLowerCase();
    if (!nome) return;

    if (
      nome.includes('projetor') ||
      nome.includes('som') ||
      nome.includes('microfone') ||
      nome.includes('cadeira') ||
      nome.includes('mesa')
    ) {
      sugestoes.push({
        nome: i[1],
        qtd: 1,
        tipo: 'volante'
      });
    }
  });

  return sugestoes;
}

async function chamarIAUnificada(contexto) {

  const prompt = `
Você é uma IA de análise de dados de agendamentos.

Gere:
1. Estrutura de relatório
2. Conteúdo melhorado
3. Insights (máx 5)

REGRAS:
- Não inventar dados
- Seja direto
- Linguagem profissional

ENTRADA:
${JSON.stringify(contexto)}

Responda SOMENTE JSON:

{
  "titulo": "...",
  "secoes": [
    { "titulo": "...", "conteudo": "..." }
  ],
  "insights": ["..."]
}
`;

  try {

    const resposta = await Promise.race([
      chamarIAComFallback(prompt),
      new Promise((_, reject) =>
        setTimeout(() => reject(new Error('Timeout IA')), 8000)
      )
    ]);

    return parseSeguroJSON(resposta);

  } catch (e) {

    console.warn('IA falhou:', e.message);
    return null;
  }
}

function parseSeguroJSON(resposta) {

  try {
    return JSON.parse(resposta);
  } catch {

    const match = resposta.match(/\{[\s\S]*\}/);
    if (match) {
      try {
        return JSON.parse(match[0]);
      } catch {}
    }

    return null;
  }
}

function sugerirCenarioInteligente(contexto) {

  const nome = (contexto.nome || '').toLowerCase();
  const setor = contexto.setor;
  const data = contexto.data;

  const salas = AppState.colecoes.salas || [];
  const horarios = gerarHorariosBase();

  const recHorario = calcularRecorrenciaHorario(nome);
  const prefUsuario = calcularPreferenciaUsuario(AppState.usuario.email);

  const cenarios = [];

  salas.forEach(sala => {

    const nomeSala = String(sala.nome || sala[1] || sala[0]).toLowerCase();

    if (!validarRegrasDuras(nomeSala, data, setor)) return;

    horarios.forEach(hora => {

      let score = 0;

      if (detectarTipoAcao(nome).some(e => nomeSala.includes(e))) {
        score += 5;
      }

      score += (recHorario[hora] || 0) * 1.5;
      score += (prefUsuario[hora] || 0) * 0.8;
      score += pesoHorario(hora);

      cenarios.push({
        salaId: sala.id || sala[0],
        salaNome: sala.nome || sala[1],
        hora,
        score
      });

    });

  });

  return cenarios.sort((a,b) => b.score - a.score).slice(0,5);
}

          html += `<button type="button"
            onclick="selecionarSala('${escaparHTML(c.salaId)}'); aplicarSugestaoHorario('${c.hora}')"
            class="px-3 py-1.5 bg-white border border-indigo-200 hover:bg-indigo-600 hover:text-white text-indigo-700 text-[10px] font-black rounded-xl transition-all">
            ${escaparHTML(c.salaNome)} · ${c.hora}
          </button>`;
        });
        html += `</div></div>`;
        el.innerHTML = html;
      }
    } catch (e) { console.warn('Erro sugestão:', e); }
    return;
  }

  // =========================================================
  // 🔵 NÍVEL 3 — ESPAÇO ESCOLHIDO, MAS SEM HORÁRIO
  // =========================================================
  if (ctx.sala && !ctx.inicio) {

    try {

      const sugestao = sugerirHorarioPorRegras(ctx);

      if (sugestao) {
        el.innerHTML = `
          <div style="font-size:12px;color:#334155;">
            💡 ${sugestao}
          </div>
        `;
      }

    } catch (e) {
      console.warn(e);
    }

    return;
  }

  // =========================================================
  // 🟣 NÍVEL 4 — SÓ DATA (CONTEXTO GERAL)
  // =========================================================
  if (ctx.data && !ctx.nome && !ctx.sala) {

    const sugestao = sugerirPadraoDiaSemana(ctx.data);

    if (sugestao) {
      el.innerHTML = `
        <div style="font-size:12px;color:#64748b;">
          ℹ️ ${sugestao}
        </div>
      `;
    }

  }
}

function sugerirHorarioPorRegras(ctx) {

  const dia = new Date(ctx.data.split('/').reverse().join('-')).getDay();

  if (ctx.sala.toLowerCase() === 'teatro') {

    if (dia >= 1 && dia <= 3) return 'Prioridade: Escola (manhã/tarde)';
    if (dia >= 4 && dia <= 6) return 'Prioridade: Ação Cultural (noite)';

  }

  return null;
}

function sugerirPadraoDiaSemana(data) {

  const dia = new Date(data.split('/').reverse().join('-')).getDay();

  if (dia === 6 || dia === 0) {
    return 'Alta demanda — priorize horários antecipados';
  }

  return 'Dia regular — boa disponibilidade';
}

function mostrarSugestaoSimples(texto) {

  const el = getOrCreateAvisoPrevisao();

  el.innerHTML = `
    <div style="font-size:12px;color:#334155;">
      💡 ${texto}
    </div>
  `;
}


function editarRece(idReserva) {

  modoEdicao = "RECE";

  carregarReservaParaFormulario(idReserva);
  alternarModoRece(true);

  aplicarRestricaoEdicaoRece();

}

function aplicarRestricaoEdicaoRece() {

  const bloquear = [
    'selectSala',
    'horaInicio',
    'horaTermino',
    'selectSetor'
  ];

  bloquear.forEach(id => {
    const el = document.getElementById(id);
    if (el) {
      el.disabled = true;
      el.classList.add('opacity-50', 'cursor-not-allowed');
    }
  });

}

function atualizarTudoTempoReal() {
  try {
    if (typeof validarHorarios === 'function') validarHorarios();
    if (typeof atualizarDisponibilidadeItens === 'function') atualizarDisponibilidadeItens();

    const data = calendarInstance?.selectedDates?.[0];
    const inicio = document.getElementById('horaInicio')?.value;
    const termino = document.getElementById('horaTermino')?.value;

    if (data && inicio && termino) {
      const dataStr = flatpickr.formatDate(data, "d/m/Y");
      const salasDisp = obterSalasDisponiveisPorData(dataStr, inicio, termino);
      const salaAtual = document.getElementById('selectSala')?.value;
      const container = document.getElementById('salasDisponiveis');
      if (container) {
        const filtradas = salasDisp.filter(s => String(s.id) !== String(salaAtual));
        if (filtradas.length > 0) {
          container.innerHTML = filtradas.map(s =>
            `<button type="button" onclick="selecionarSala('${escaparHTML(s.id)}')"
              class="px-2 py-1 bg-purple-100 hover:bg-purple-600 hover:text-white text-purple-700 text-xs font-black rounded-xl mr-1 mb-1 transition-all">
              ${escaparHTML(s.nome)}
            </button>`
          ).join('');
        } else {
          container.innerHTML = '<span class="text-xs text-slate-400 italic">Nenhuma sala disponível neste horário</span>';
        }
      }
    }

    if (typeof mostrarHorariosDisponiveisUI === 'function') mostrarHorariosDisponiveisUI();
    if (typeof validarConflitoTempoReal === 'function') validarConflitoTempoReal();

  } catch (e) {
    console.warn('Erro em atualização tempo real:', e);
  }
}

function consultarConflitoIA(dados) {
  return new Promise(function(resolve, reject) {
    google.script.run
      .withSuccessHandler(function(res) {
        resolve({
          temConflito: res.conflito || false,
          solicitado: res.solicitado || null,
          reservaExistente: res.existente || null
        });
      })
      .withFailureHandler(reject)
      .verificarConflitoEspaco(
        dados.sala,
        dados.data,
        dados.horaInicio,
        dados.horaTermino,
        null
      );
  });
}

function aplicarSugestaoCompleta(sugestao) {
  if (!sugestao) return;
  Swal.close();
  if (sugestao.salaId) {
    const sel = document.getElementById('selectSala');
    if (sel) {
      sel.value = sugestao.salaId;
      sel.dispatchEvent(new Event('change'));
    }
  }
  const horaIni = document.getElementById('horaInicio');
  const horaTer = document.getElementById('horaTermino');
  if (horaIni && sugestao.horaInicio) horaIni.value = sugestao.horaInicio;
  if (horaTer && sugestao.horaTermino) horaTer.value = sugestao.horaTermino;
  if (sugestao.data && calendarInstance) {
    const p = String(sugestao.data).split('/');
    if (p.length === 3) calendarInstance.setDate(new Date(p[2], p[1] - 1, p[0]), true);
  }
  if (typeof validarHorarios === 'function') validarHorarios();
  if (typeof atualizarTudoTempoReal === 'function') atualizarTudoTempoReal();
}

function alternarModoCodip(ativo) {
  const bloco = document.getElementById('blocoCodip');
  if (!bloco) return;
  bloco.classList.toggle('hidden', !ativo);
  if (ativo && !_ctrCache.contratos.length) {
    carregarDadosContratos(codipPopularContratos);
  }
}

function _codipColetarPayload() {

  const ativo = document.getElementById('checkCodip')?.checked;

  if (!ativo) return {};

  return {
    codipDescricaoAcao: document.getElementById('codipDescricaoAcao')?.value.trim() || '',
    codipPublico: document.getElementById('codipPublico')?.value || '',
    codipPublicoReal: document.getElementById('codipPublicoReal')?.value || '',
    codipObs: document.getElementById('codipObs')?.value || '',
    codipIdContrato: document.getElementById('codipSelectContrato')?.value  || '',
    codipIdMeta: document.getElementById('codipSelectMeta')?.value  || '',
    codipIdIndicador: document.getElementById('codipSelectIndicador')?.value  || '',
  };

}

function carregarMetricasCODIP() {

  google.script.run
    .withSuccessHandler(function(res) {

      document.getElementById('codipTotalEstimado').innerText = res.totalEstimado;
      document.getElementById('codipTotalReal').innerText = res.totalReal;
      document.getElementById('codipTotalRegistros').innerText = res.totalRegistros;
      document.getElementById('codipTaxa').innerText = res.taxaPresenca + '%';

    })
    .withFailureHandler(_handleServerError)
    .obterMetricasCODIP();
}

function reescreverDescricaoComIA() {
  const textarea = document.getElementById('codipDescricaoAcao');
  const setor    = document.getElementById('selectSetor')?.value || '';
  const texto    = (textarea?.value || '').trim();

  if (!texto || texto.length < 10) {
    Swal.fire('Atenção', 'Escreva ao menos uma frase na descrição antes de usar a IA.', 'warning');
    return;
  }

  const btn = document.getElementById('btnDescricaoIA');
  if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner animate-spin text-[9px]"></i> Processando...'; }

  google.script.run
    .withSuccessHandler(function(res) {
      if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fas fa-brain text-[9px]"></i>Reescrever com IA'; }
      if (!res || !res.ok) {
        Swal.fire('IA indisponível', res?.texto || 'Falha ao chamar a IA.', 'error');
        return;
      }
      const textoGerado = (res.texto || '').replace(/^["']|["']$/g, '').trim();
      const contador    = document.getElementById('codipDescricaoContador');
      Swal.fire({
        title: 'Sugestão da IA',
        html: `
          <p class="text-xs text-slate-500 mb-2 font-bold">${textoGerado.length} caracteres</p>
          <div class="p-3 bg-purple-50 rounded-xl text-left text-sm text-slate-700 leading-relaxed border border-purple-200">
            ${escaparHTML(textoGerado)}
          </div>`,
        showCancelButton: true,
        confirmButtonText: 'Usar este texto',
        cancelButtonText:  'Manter original',
        confirmButtonColor: '#7c3aed'
      }).then(function(result) {
        if (result.isConfirmed && textarea) {
          textarea.value = textoGerado;
          if (contador) contador.textContent = textoGerado.length + '/400';
        }
      });
    })
    .withFailureHandler(function(err) {
      if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fas fa-brain text-[9px]"></i>Reescrever com IA'; }
      Swal.fire('Erro', err.message, 'error');
    })
    .reescreverDescricaoAcaoIA(texto, setor);
}

// ── CODIP Tab ────────────────────────────────────────────────────────────────
var _codipCache = [];

function carregarAbaCODIP() {
  const corpo = document.getElementById('corpoCODIP');
  if (!corpo) return;
  corpo.innerHTML = `<tr><td colspan="10" class="p-10 text-center"><i class="fas fa-spinner animate-spin text-indigo-400 text-xl"></i></td></tr>`;

  if (!_ctrCache.contratos.length) {
    carregarDadosContratos(() => carregarAbaCODIP());
    return;
  }

  google.script.run
    .withSuccessHandler(function(dados) {
      _codipCache = dados || [];
      // Popular filtro de contrato
      const selCtr = document.getElementById('codipFiltroCtr');
      if (selCtr && _ctrCache.contratos.length) {
        selCtr.innerHTML = '<option value="">Todos os contratos</option>'
          + _ctrCache.contratos.map(c => `<option value="${escaparHTML(c.id)}">${escaparHTML(c.nome)}</option>`).join('');
      }
      renderizarTabelaCODIP();
    })
    .withFailureHandler(function(err) {
      Swal.fire('Erro', err.message, 'error');
    })
    .obterRelatoriosCODIP();
}

function renderizarTabelaCODIP() {
  const corpo   = document.getElementById('corpoCODIP');
  const semRes  = document.getElementById('semResultadosCODIP');
  const counter = document.getElementById('codipContador');
  const kpisEl  = document.getElementById('codipAbaKpis');
  if (!corpo) return;

  const filtroMes   = (document.getElementById('codipFiltroMes')?.value   || '').toLowerCase().trim();
  const filtroTipo  = (document.getElementById('codipFiltroTipo')?.value  || '').toLowerCase().trim();
  const filtroSetor = (document.getElementById('codipFiltroSetor')?.value || '').toLowerCase().trim();
  const filtroCtr   = (document.getElementById('codipFiltroCtr')?.value   || '').trim();

  const lista = _codipCache.filter(r =>
    (!filtroMes   || String(r.mesRef    ||'').toLowerCase().includes(filtroMes))  &&
    (!filtroTipo  || String(r.tipoAcao  ||'').toLowerCase().includes(filtroTipo)) &&
    (!filtroSetor || String(r.setor     ||'').toLowerCase().includes(filtroSetor))&&
    (!filtroCtr   || String(r.idContrato||'') === filtroCtr)
  );

  if (counter) counter.textContent = lista.length + ' registro(s)';

  // KPIs
  if (kpisEl) {
    const totPres = lista.reduce((a,r) => a+(Number(r.pubPresencial)||0), 0);
    const totVirt = lista.reduce((a,r) => a+(Number(r.pubVirtual)   ||0), 0);
    const totPCD  = lista.reduce((a,r) => a+(Number(r.pcd)          ||0), 0);
    const totHm   = lista.reduce((a,r) => a+(Number(r.horasMes)     ||0), 0);
    const _k = (v,l,cor,ic) => `
      <div class="bg-white border border-indigo-100 rounded-2xl p-4 flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl flex items-center justify-center shrink-0" style="background:${cor}18">
          <i class="fas ${ic}" style="color:${cor}"></i>
        </div>
        <div>
          <div class="text-xl font-black text-slate-800">${typeof v === 'number' ? v.toLocaleString('pt-BR') : v}</div>
          <div class="text-[9px] font-black text-slate-400 uppercase tracking-wide">${l}</div>
        </div>
      </div>`;
    kpisEl.innerHTML =
      _k(lista.length, 'Registros',          '#6366f1','fa-file-lines') +
      _k(totPres,      'Público Presencial',  '#7c3aed','fa-users') +
      _k(totVirt,      'Audiência Virtual',   '#0891b2','fa-wifi') +
      _k(totPCD,       'PCDs',                '#dc2626','fa-universal-access') +
      _k(Math.round(totHm)+'h', 'Horas no Mês','#059669','fa-clock');
  }

  if (!lista.length) { corpo.innerHTML=''; semRes?.classList.remove('hidden'); return; }
  semRes?.classList.add('hidden');

  corpo.innerHTML = lista.map(r => {
    const linkEv = r.linkEvidencias
      ? `<a href="${escaparHTML(r.linkEvidencias)}" target="_blank" class="text-indigo-500 hover:text-indigo-700 font-black text-[9px]"><i class="fas fa-link mr-1"></i>Ver</a>`
      : '<span class="text-slate-300 text-[9px]">—</span>';
    const ctrBadge = r.nomeContrato
      ? `<span class="inline-block bg-indigo-100 text-indigo-700 text-[8px] font-black px-1.5 py-0.5 rounded-full truncate max-w-[120px]" title="${escaparHTML(r.nomeContrato)}">${escaparHTML(r.nomeContrato.slice(0,25)+(r.nomeContrato.length>25?'…':''))}</span>`
      : '<span class="text-slate-300 text-[9px]">—</span>';
    const metaBadge = r.nomeMeta
      ? `<span class="text-[9px] text-indigo-600 font-bold">${escaparHTML(r.nomeMeta.slice(0,30)+(r.nomeMeta.length>30?'…':''))}</span>`
      : '';
    return `<tr class="hover:bg-slate-50 transition-colors">
      <td class="p-3">
        <p class="font-bold text-slate-800 text-xs leading-tight">${escaparHTML(String(r.nomeAcao||'—'))}</p>
        <p class="text-[9px] text-slate-400 mt-0.5">${escaparHTML(String(r.idReserva||''))}</p>
      </td>
      <td class="p-3 text-slate-600 text-xs whitespace-nowrap">${escaparHTML(String(r.mesRef||'—'))}</td>
      <td class="p-3"><span class="bg-indigo-100 text-indigo-700 text-[9px] font-black px-2 py-0.5 rounded-full">${escaparHTML(String(r.tipoAcao||'—'))}</span></td>
      <td class="p-3 text-slate-600 text-xs">${escaparHTML(String(r.setor||'—'))}</td>
      <td class="p-3 text-center font-bold text-slate-700 text-xs">${escaparHTML(String(r.pubPresencial||0))}</td>
      <td class="p-3 text-center font-bold text-slate-700 text-xs">${escaparHTML(String(r.pubVirtual||0))}</td>
      <td class="p-3 text-center font-bold text-red-600 text-xs">${escaparHTML(String(r.pcd||0))}</td>
      <td class="p-3 text-center font-bold text-purple-700 text-xs">${escaparHTML(String(r.horasMes||0))}h</td>
      <td class="p-3">${ctrBadge}${metaBadge ? '<br>'+metaBadge : ''}</td>
      <td class="p-3">${linkEv}</td>
    </tr>`;
  }).join('');
}

function exportarCODIPCSV() {
  const lista = _codipCache;
  if (!lista.length) { Swal.fire('Sem dados', 'Nenhum registro para exportar.', 'info'); return; }
  const cab = ['ID Reserva','Nome Ação','Mês Ref','Tipo Ação','Eixo','Segmento I','Linguagem I',
    'Modalidade','Público Presencial','Público Virtual','Visualizações','PCD','Idosos',
    'Voluntários','Horas Mês','Horas Total','Setor','Responsável','Descrição da Ação'];
  const linhas = [cab.join(';')];
  lista.forEach(r => {
    linhas.push([r.idReserva,r.nomeAcao,r.mesRef,r.tipoAcao,r.eixo,r.segmento1,r.linguagem1,
      r.modalidade,r.pubPresencial,r.pubVirtual,r.visualizacoes,r.pcd,r.idosos,
      r.voluntarios,r.horasMes,r.horasTotal,r.setor,r.responsavel,r.descricaoAcao]
      .map(v => `"${String(v||'').replace(/"/g,'""')}"`).join(';'));
  });
  const blob = new Blob(['\uFEFF'+linhas.join('\n')], { type:'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `codip_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
}
