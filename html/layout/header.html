    <header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-4 md:px-8 shrink-0 sticky top-0 z-40">
      <div class="flex items-center gap-3">
        <button onclick="toggleSidebar()" class="md:hidden p-2 text-slate-600 hover:bg-slate-100 rounded-lg transition-colors">
          <i class="fas fa-bars text-xl"></i>
        </button>
        <div class="flex flex-col md:flex-row md:items-center gap-1 md:gap-4">
          <h2 id="tituloAba" class="text-sm md:text-lg font-bold text-slate-800 uppercase tracking-tight leading-none">Agenda Geral</h2>
          <span id="contadorResultados" class="bg-purple-100 text-purple-700 text-[9px] md:text-[10px] font-black px-2 py-0.5 md:py-1 rounded-md w-fit">Sincronizando...</span>

          <i class="fas fa-circle-question text-sm"></i>
        </button>
        <button onclick="sincronizarAbaAtual()" class="w-8 h-8 flex items-center justify-center rounded-full text-slate-400 hover:text-purple-600 hover:bg-purple-50 transition-all" title="Atualizar Dados">
